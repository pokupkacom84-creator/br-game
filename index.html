<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#517da2">
<title>Telegram</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#fff;--bg-2:#f4f4f5;--text:#000;--text-2:#707579;--border:#e4e4e5;--accent:#3390ec;--accent-2:#2481d7;--bubble-out:#eeffde;--bubble-in:#fff;--chat-bg:#e6ebee;--header-bg:#517da2;--header-text:#fff;--unread-bg:#3390ec;--unread-text:#fff;--nav-bg:#fff;--time-out:#62a03f}
body.dark{--bg:#17212b;--bg-2:#0e1621;--text:#fff;--text-2:#7f91a4;--border:#101921;--accent:#5288c1;--accent-2:#6da0d6;--bubble-out:#2b5278;--bubble-in:#182533;--chat-bg:#0e1621;--header-bg:#17212b;--unread-bg:#5288c1;--nav-bg:#17212b;--time-out:#7aab5a}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;transition:background .2s,color .2s;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text;font-family:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;outline:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);z-index:1}
.screen.active{display:flex;z-index:2}
.hidden{display:none!important}
.auth-container{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;gap:12px;max-width:400px;margin:0 auto;width:100%}
.auth-logo{margin-bottom:8px}
.auth-title{font-size:28px;font-weight:600;margin-bottom:4px}
.auth-subtitle{color:var(--text-2);font-size:14px;margin-bottom:24px}
.auth-form{width:100%;display:flex;flex-direction:column;gap:10px}
.auth-form input{width:100%;padding:14px 16px;border:1.5px solid var(--border);border-radius:10px;background:var(--bg-2);color:var(--text);font-size:16px;outline:none;transition:border-color .15s}
.auth-form input:focus{border-color:var(--accent)}
.btn-primary{width:100%;padding:14px;border-radius:10px;background:var(--accent);color:#fff;font-size:16px;font-weight:500;transition:background .15s}
.btn-primary:active{background:var(--accent-2)}
.btn-primary:disabled{opacity:.6}
.btn-link{color:var(--accent);font-size:14px;padding:10px}
.avatar-upload{position:relative;width:120px;height:120px;margin-bottom:16px;cursor:pointer}
.avatar-preview{width:100%;height:100%;border-radius:50%;background:var(--bg-2);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:var(--text-2);overflow:hidden}
.avatar-camera{position:absolute;bottom:0;right:0;width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff}
.onb-title{font-size:22px;font-weight:600;margin-bottom:16px}
.onb-input{width:100%;padding:14px 16px;border:1.5px solid var(--border);border-radius:10px;background:var(--bg-2);color:var(--text);font-size:16px;outline:none;margin-bottom:10px}
.onb-input:focus{border-color:var(--accent)}
.main-body{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}
.tab-content{display:none;flex-direction:column;flex:1;overflow:hidden;position:relative}
.tab-content.active{display:flex}
.header{display:flex;align-items:center;padding:12px 16px;background:var(--header-bg);color:var(--header-text);min-height:56px;gap:12px;padding-top:calc(12px + env(safe-area-inset-top))}
.header-title{font-size:18px;font-weight:600;flex:1}
.header-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--header-text);flex-shrink:0}
.header-btn:active{background:rgba(255,255,255,.12)}
.list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.list::-webkit-scrollbar{display:none}
.chat-item{display:flex;align-items:center;padding:10px 16px;gap:12px;cursor:pointer;transition:background .1s}
.chat-item:active{background:var(--bg-2)}
.avatar{width:54px;height:54px;border-radius:50%;background:var(--accent);background-size:cover;background-position:center;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:500;overflow:hidden}
.chat-item-info{flex:1;min-width:0}
.chat-item-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.chat-item-name{font-size:16px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item-time{font-size:12px;color:var(--text-2);flex-shrink:0}
.chat-item-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:3px}
.chat-item-msg{font-size:14px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.chat-item-unread{min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--unread-bg);color:var(--unread-text);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.fab{position:absolute;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:10}
.fab:active{background:var(--accent-2)}
.bottom-nav{display:flex;background:var(--nav-bg);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;color:var(--text-2);font-size:11px;transition:color .15s;cursor:pointer}
.nav-item.active{color:var(--accent)}
.search-bar{padding:8px 16px;background:var(--bg)}
.search-bar input{width:100%;padding:10px 14px;border-radius:10px;border:none;background:var(--bg-2);color:var(--text);font-size:15px;outline:none}
.chat-header{display:flex;align-items:center;padding:8px 8px 8px 4px;background:var(--header-bg);color:var(--header-text);gap:6px;min-height:56px;padding-top:calc(8px + env(safe-area-inset-top))}
.chat-header .avatar{width:42px;height:42px;font-size:16px}
.chat-header-info{flex:1;min-width:0}
.chat-header-name{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-header-status{font-size:13px;opacity:.85}
.messages{flex:1;overflow-y:auto;padding:10px 10px 6px;background:var(--chat-bg);display:flex;flex-direction:column;gap:3px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.messages::-webkit-scrollbar{display:none}
.msg{max-width:82%;padding:7px 11px;border-radius:16px;font-size:15px;line-height:1.35;animation:msgIn .18s ease-out;position:relative}
@keyframes msgIn{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.msg.out{align-self:flex-end;background:var(--bubble-out);border-bottom-right-radius:5px}
.msg.in{align-self:flex-start;background:var(--bubble-in);border-bottom-left-radius:5px}
.msg-text{word-wrap:break-word;overflow-wrap:break-word;word-break:break-word;white-space:pre-wrap}
.msg-time{float:right;margin:5px -2px -2px 8px;font-size:11px;opacity:.7;white-space:nowrap;display:inline-flex;align-items:center;gap:3px;color:var(--text-2)}
.msg.out .msg-time{color:var(--time-out)}
.msg-check{display:inline-flex;align-items:center}
.msg-check svg{width:14px;height:10px}
.msg-date{align-self:center;background:rgba(0,0,0,.18);color:#fff;padding:4px 12px;border-radius:12px;font-size:12px;margin:8px 0;font-weight:500}
.chat-input-bar{display:flex;align-items:flex-end;gap:8px;padding:8px 10px;background:var(--bg);border-top:1px solid var(--border);padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.chat-input-bar input{flex:1;padding:11px 14px;border-radius:20px;border:none;background:var(--bg-2);color:var(--text);font-size:16px;outline:none}
#send-btn{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#send-btn:active{background:var(--accent-2)}
.settings-body{flex:1;overflow-y:auto;padding:8px 0}
.settings-profile{display:flex;align-items:center;gap:14px;padding:16px;cursor:pointer}
.settings-profile:active{background:var(--bg-2)}
.settings-profile .avatar{width:64px;height:64px;font-size:24px}
.settings-info{flex:1;min-width:0}
.settings-name{font-size:18px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.settings-username{font-size:14px;color:var(--text-2);margin-top:2px}
.settings-item{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;border-top:1px solid var(--border);font-size:15px}
.settings-item:active{background:var(--bg-2)}
.settings-item svg{width:22px;height:22px;color:var(--text-2);flex-shrink:0}
.settings-item span{flex:1}
.settings-item.danger{color:#e53935}
.settings-item.danger svg{color:#e53935}
.toggle{width:42px;height:24px;border-radius:12px;background:var(--border);position:relative;transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on::after{transform:translateX(18px)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,.85);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9999;max-width:80%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{padding:40px 20px;text-align:center;color:var(--text-2);font-size:14px}
</style>
</head>
<body>

<script>
const firebaseConfig = {
  apiKey: "API_KEY",
  authDomain: "game-cd07d.firebaseapp.com",
  databaseURL: "https://game-cd07d-default-rtdb.firebaseio.com",
  projectId: "game-cd07d",
  storageBucket: "game-cd07d.appspot.com",
  messagingSenderId: "SENDER_ID",
  appId: "APP_ID"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const storage = firebase.storage();
const TS = firebase.database.ServerValue.TIMESTAMP;

let currentUser = null;
let currentUserData = null;
let currentChatId = null;
let currentChatUser = null;
let unsubUserChats = null;
let unsubChatMeta = null;
let unsubMessages = null;
let unsubChatUser = null;
let unsubSelfDoc = null;
let onbAvatarFile = null;
let typingTimer = null;
let chatsData = {};
let userChatsMap = {};
let searchQuery = '';
const userCache = {};
const chatUnsubs = {};

function $(id){ return document.getElementById(id); }
function showScreen(id){
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  $(id).classList.add('active');
}
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function initials(name){
  if(!name) return '?';
  const p = name.trim().split(/\s+/);
  return ((p[0]?p[0][0]:'') + (p[1]?p[1][0]:'')).toUpperCase();
}
function avatarHtml(user){
  if(!user) return '<div class="avatar">?</div>';
  const url = user.photoURL || '';
  const txt = url ? '' : initials(user.name || user.username || '?');
  return '<div class="avatar" style="' + (url?'background-image:url(\''+url+'\')':'') + '">' + esc(txt) + '</div>';
}
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function formatTime(ts){
  if(!ts) return '';
  const d = new Date(ts);
  const now = new Date();
  if(d.toDateString() === now.toDateString()) return pad(d.getHours()) + ':' + pad(d.getMinutes());
  const diff = (now - d) / 86400000;
  if(diff < 7){ const days=['Вс','Пн','Вт','Ср','Чт','Пт','Сб']; return days[d.getDay()]; }
  return pad(d.getDate()) + '.' + pad(d.getMonth()+1) + '.' + String(d.getFullYear()).slice(2);
}
function formatFullTime(ts){
  if(!ts) return '';
  const d = new Date(ts);
  return pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function formatLastSeen(ts){
  if(!ts) return 'был(а) недавно';
  const d = new Date(ts);
  const now = new Date();
  const diff = (now - d) / 1000;
  if(diff < 60) return 'был(а) только что';
  if(diff < 3600) return 'был(а) ' + Math.floor(diff/60) + ' мин назад';
  if(d.toDateString() === now.toDateString()) return 'был(а) в ' + formatFullTime(ts);
  return 'был(а) ' + pad(d.getDate()) + '.' + pad(d.getMonth()+1) + '.' + d.getFullYear();
}

    attachChatListeners();
    renderChats();
  });
}

function attachChatListeners(){
  Object.keys(chatUnsubs).forEach(function(id){
    if(!userChatsMap[id]){
      const c = chatUnsubs[id];
      if(c && c.off) c.off();
      if(c && c.unreadOff) c.unreadOff();
      delete chatUnsubs[id];
      delete chatsData[id];
    }
  });
  Object.keys(userChatsMap).forEach(function(id){
    if(chatUnsubs[id]) return;
    const obj = {};
    const metaRef = db.ref('chats/' + id);
    obj.off = function(){ metaRef.off('value', obj.cb); };
    obj.cb = function(s){
      chatsData[id] = s.val() || {};
      renderChats();
    };
    metaRef.on('value', obj.cb);
    const unreadRef = db.ref('chats/' + id + '/unread/' + currentUser.uid);
    obj.unreadCb = function(){ renderChats(); };
    unreadRef.on('value', obj.unreadCb);
    obj.unreadOff = function(){ unreadRef.off('value', obj.unreadCb); };
    chatUnsubs[id] = obj;
  });
}

async function fetchUser(uid){
  if(userCache[uid]) return userCache[uid];
  try {
    const s = await db.ref('users/' + uid).once('value');
    if(s.exists()){
      userCache[uid] = Object.assign({uid: uid}, s.val());
      return userCache[uid];
    }
  } catch(e){}
  return {uid: uid, name: 'Пользователь', username: ''};
}

async function renderChats(){
  const list = $('chats-list');
  if(!list) return;
  const ids = Object.keys(chatsData);
  if(!ids.length){
    list.innerHTML = '<div class="empty">Нет чатов. Начните новую переписку.</div>';
    return;
  }
  const arr = [];
  ids.forEach(function(id){
    const c = chatsData[id];
    if(!c || !c.members) return;
    const otherId = Object.keys(c.members).find(function(m){ return m !== currentUser.uid; });
    if(!otherId) return;
    arr.push({id: id, data: c, otherId: otherId});
  });
  await Promise.all(arr.map(function(x){ return fetchUser(x.otherId); }));
  arr.sort(function(a,b){
    const ta = a.data.lastMessageTime || 0;
    const tb = b.data.lastMessageTime || 0;
    return tb - ta;
  });
  const q = searchQuery.toLowerCase();
  let html = '';
  arr.forEach(function(x){
    const u = userCache[x.otherId] || {name:'Пользователь'};
    const unread = (x.data.unread && x.data.unread[currentUser.uid]) || 0;
    const time = formatTime(x.data.lastMessageTime);
    const last = x.data.lastMessage || 'Нет сообщений';
    const prefix = x.data.lastSender === currentUser.uid ? 'Вы: ' : '';
    if(q){
      const hay = ((u.name||'') + ' ' + (u.username||'') + ' ' + last).toLowerCase();
      if(hay.indexOf(q) === -1) return;
    }
    html += '<div class="chat-item" data-chat="' + x.id + '" data-user="' + x.otherId + '">' +
      avatarHtml(u) +
      '<div class="chat-item-info">' +
        '<div class="chat-item-top">' +
          '<div class="chat-item-name">' + esc(u.name) + '</div>' +
          '<div class="chat-item-time">' + esc(time) + '</div>' +
        '</div>' +
        '<div class="chat-item-bottom">' +
          '<div class="chat-item-msg">' + esc(prefix + last) + '</div>' +
          (unread > 0 ? '<div class="chat-item-unread">' + unread + '</div>' : '') +
        '</div>' +
      '</div>' +
    '</div>';
  });
  if(!html) html = '<div class="empty">Ничего не найдено</div>';
  list.innerHTML = html;
  list.querySelectorAll('.chat-item').forEach(function(el){
    el.onclick = function(){ openChat(el.dataset.chat, el.dataset.user); };
  });
}

function formatDateLabel(d){
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const dd = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = Math.round((today - dd) / 86400000);
  if(diff === 0) return 'Сегодня';
  if(diff === 1) return 'Вчера';
  return d.getDate() + ' ' + ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'][d.getMonth()];
}
function checkSingle(){
  return '<span class="msg-check"><svg viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 5.5L5.5 10L14 1"/></svg></span>';
}
function checkDouble(){
  return '<span class="msg-check"><svg viewBox="0 0 19 11" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 5.5L5.5 10L14 1"/><path d="M6 5.5L10.5 10L19 1"/></svg></span>';
}

function renderMessages(msgs){
  const box = $('messages');
  if(!box) return;
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  let html = '';
  let lastDate = '';
  msgs.forEach(function(m){
    const d = new Date(m.timestamp || Date.now());
    const key = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
    if(key !== lastDate){
      lastDate = key;
      html += '<div class="msg-date">' + formatDateLabel(d) + '</div>';
    }
    const isOut = m.senderId === currentUser.uid;
    const time = formatFullTime(m.timestamp);
    let check = '';
    if(isOut) check = m.read ? checkDouble() : checkSingle();
    html += '<div class="msg ' + (isOut?'out':'in') + '">' +
      '<span class="msg-text">' + esc(m.text) + '</span>' +
      '<span class="msg-time">' + time + check + '</span>' +
    '</div>';
  });
  box.innerHTML = html;
  if(atBottom) box.scrollTop = box.scrollHeight;
}

async function markAsRead(){
  if(!currentChatId || !currentUser) return;
  try {
    const snap = await db.ref('chats/' + currentChatId + '/messages')
      .orderByChild('read').equalTo(false).limitToFirst(200).once('value');
    if(!snap.exists()) return;
    const updates = {};
    snap.forEach(function(child){
      const v = child.val();
      if(v.senderId !== currentUser.uid){
        updates['chats/' + currentChatId + '/messages/' + child.key + '/read'] = true;
      }
    });
    if(Object.keys(updates).length) await db.ref().update(updates);
  } catch(e){}
}

async function sendMessage(){
  const inp = $('msg-input');
  const text = inp.value.trim();
  if(!text || !currentChatId || !currentChatUser) return;
  inp.value = '';
  try {
    const msgRef = db.ref('chats/' + currentChatId + '/messages').push();
    const msg = {
      senderId: currentUser.uid,
      text: text,
      timestamp: TS,
      read: false
    };
    const updates = {};
    updates['chats/' + currentChatId + '/messages/' + msgRef.key] = msg;
    updates['chats/' + currentChatId + '/lastMessage'] = text;
    updates['chats/' + currentChatId + '/lastMessageTime'] = TS;
    updates['chats/' + currentChatId + '/lastSender'] = currentUser.uid;
    const unreadRef = db.ref('chats/' + currentChatId + '/unread');
    const u = await unreadRef.once('value');
    const unread = u.val() || {};
    unread[currentChatUser.uid] = (unread[currentChatUser.uid] || 0) + 1;
    unread[currentUser.uid] = 0;
    updates['chats/' + currentChatId + '/unread'] = unread;
    updates['users/' + currentUser.uid + '/typing'] = null;
    await db.ref().update(updates);
  } catch(e){
    toast('Ошибка отправки');
  }
}

      members[currentUser.uid] = true;
      members[uid] = true;
      const unread = {};
      unread[currentUser.uid] = 0;
      unread[uid] = 0;
      const updates = {};
      updates['chats/' + chatId] = {
        members: members,
        lastMessage: '',
        lastMessageTime: TS,
        lastSender: '',
        unread: unread
      };
      updates['userChats/' + currentUser.uid + '/' + chatId] = true;
      updates['userChats/' + uid + '/' + chatId] = true;
      await db.ref().update(updates);

  } catch(e){

$('search-toggle').onclick = function(){
  const sb = $('search-bar');
  sb.classList.toggle('hidden');
  if(!sb.classList.contains('hidden')) $('chat-search').focus();
  else { searchQuery = ''; $('chat-search').value = ''; renderChats(); }
};
$('chat-search').addEventListener('input', function(){
  searchQuery = this.value.trim();
  renderChats();
});

setTheme(localStorage.getItem('tg_theme') === 'dark');
</script>
