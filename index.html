.gate{flex:1;overflow-y:auto;padding:40px 24px;background:var(--bg)}.gate h1{font-weight:500;margin:14px 0 4px;text-align:center}.gate p{color:var(--sub);text-align:center;margin-bottom:10px}
.logo{width:96px;height:96px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;margin:0 auto}.logo svg{width:50px;height:50px;stroke-width:1.5}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.15;transform:scale(0);animation:rp .5s ease-out forwards;pointer-events:none}@keyframes rp{to{transform:scale(1);opacity:0}}
.na *{animation:none!important;transition:none!important}
@media(min-width:520px){#app{max-height:900px;margin:auto;border-radius:24px;box-shadow:0 0 0 8px #111}}
</style></head>

const ic=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;
const RC={heart:'#e5484d',fire:'#f08a24',thumb:'#3b82f6',laugh:'#e8a90c',wow:'#8b5cf6',sad:'#64748b'};
const rsvg=k=>`<svg viewBox="0 0 24 24" fill="${k=='heart'||k=='fire'?RC[k]+'33':'none'}" stroke="${RC[k]}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${P[k]}"/></svg>`;
const GR=[['#4facfe','#43e97b'],['#667eea','#764ba2'],['#f093fb','#f5576c'],['#fa709a','#fee140'],['#30cfd0','#330867'],['#ff9a44','#fc6076'],['#0ba360','#3cba92'],['#232526','#5f6c8a']];
const WALL=[['#9cc08c','#d9e8b9'],['#7ea6d4','#dcebf7'],['#b9a2dc','#f4e3ef'],['#1b2430','#0e151d']];
const KEY='yougram1',$=s=>document.querySelector(s),app=$('#app');
let S=JSON.parse(localStorage.getItem(KEY)||'null')||{u:null,s:{theme:'light',font:16,corner:14,wall:0,enter:0,sound:1,vib:1,seen:1,anim:1}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Нет места: фото слишком большое')}syncUser()};
let db,uid,view='list',peer=null,sub=null,CU={},UC={},PR={},MS=[],RD=0,reply=null,off=[],st=0;

const hash=s=>[...String(s)].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7);
const tm=t=>t?new Date(t).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}):'';

 return `<span class="avw ${on?'on':''}">${w}</span>`}

 app.className=S.s.anim?'':'na';$('meta[name=theme-color]').content=getComputedStyle(r).getPropertyValue('--hd')}

// ---------- cloud ----------
function syncUser(){if(!uid||!S.u)return;clearTimeout(st);st=setTimeout(()=>{const u=S.u;db.ref('users/'+uid).set({name:u.name,username:u.username,bio:u.bio||'',avatar:u.avatar||'',grad:u.grad}).catch(e=>toast('Ошибка: '+e.code))},500)}

function initCloud(){
 if(!window.firebase){toast('Нет соединения с Firebase');return}
 firebase.initializeApp(FIREBASE_CONFIG);db=firebase.database();
 firebase.auth().signInAnonymously().catch(e=>toast('Ошибка входа: '+e.code));
 firebase.auth().onAuthStateChanged(u=>{if(!u)return;uid=u.uid;
  db.ref('users').on('value',x=>{CU=x.val()||{};ch()});
  db.ref('userChats/'+uid).on('value',x=>{UC=x.val()||{};ch()});
  db.ref('presence').on('value',x=>{PR=x.val()||{};if(view=='chat')updHdr();else ch()});
  syncUser();presence();render()})}

 app.innerHTML=`<div class="gate"><div class="logo">${ic('send')}</div><h1>YouGram</h1><p>Введите данные, чтобы начать общение</p>

 <p id="ge" style="color:#e5484d;margin-top:8px"></p><button class="pri" id="go">Продолжить</button></div>`;
 $('#go').onclick=()=>{const v=i=>$('#g'+i).value.trim(),er=m=>$('#ge').textContent=m;
  if(v(1).length<2)return er('Введите имя');if(!/^[a-z0-9_]{3,20}$/i.test(v(2)))return er('Имя пользователя: 3–20 символов, латиница, цифры, _');
  if(Object.entries(CU).some(([k,u])=>k!=uid&&(u.username||'').toLowerCase()==v(2).toLowerCase()))return er('Это имя пользователя уже занято');
  S.u={name:v(1),username:v(2),bio:v(3),avatar:'',grad:GR[0]};save();render()}}

// ---------- views ----------
function render(){
 applyTheme();if(!S.u)return gate();
 if(!uid){app.innerHTML=`<div class="empty" style="margin:auto">Подключение…</div>`;return}
 if(view=='chat')return chatView();
 const keep=$('.body')?.scrollTop||0;
 if(view=='list')app.innerHTML=listV();else if(view=='contacts')app.innerHTML=contactsV();else if(view=='me')app.innerHTML=meV();else app.innerHTML=setV();
 const b=$('.body');if(b)b.scrollTop=keep;bind()}
const bar=(l,r='')=>`<div class="hd"><button id="mn">${ic(l)}</button><h1>${{list:'YouGram',contacts:'Контакты',me:'Профиль',settings:sub?PAGES[sub].t:'Настройки'}[view]}</h1>${r}</div>`;
function listV(){
 const rows=Object.entries(UC).sort((a,b)=>b[1].ts-a[1].ts).map(([id,c])=>{const u=CU[id]||{name:'Пользователь'};
 return `<button class="ch" data-p="${id}">${av(u,54,PR[id]===true)}<div class="t"><div class="l1"><b>${esc(u.name)}</b><span class="tm">${lt(c.ts)}</span></div><div class="l2"><span>${esc(c.last)}</span>${c.unread?`<i class="ub">${c.unread}</i>`:''}</div></div></button>`}).join('');
 return bar('menu',`<button id="sr">${ic('search')}</button>`)+`<div class="body">${rows||`<div class="empty">Чатов пока нет.<br>Нажмите на кнопку внизу и выберите собеседника.</div>`}</div><button class="fab" id="nw">${ic('pen')}</button>`}
function contactsV(q=''){
 const rows=Object.entries(CU).filter(([k,u])=>k!=uid&&(u.name+' '+u.username).toLowerCase().includes(q.toLowerCase())).map(([id,u])=>`<button class="ch" data-p="${id}">${av(u,50,PR[id]===true)}<div class="t"><div class="l1"><b>${esc(u.name)}</b></div><div class="l2"><span>${status(id)} · @${esc(u.username)}</span></div></div></button>`).join('');
 return `<div class="hd"><button id="mn">${ic('back')}</button><input class="inp" id="q" placeholder="Поиск по имени или @username" value="${esc(q)}" style="margin:0;border:0;color:#fff;flex:1"></div><div class="body" id="cl">${rows||'<div class="empty">Никого не найдено</div>'}</div>`}
function meV(){const u=S.u,g=u.grad;
 return bar('back')+`<div class="body"><div class="hero" style="background:linear-gradient(160deg,${g[0]},${g[1]})">${av(u,96)}<h2 style="font-weight:500">${esc(u.name)}</h2><div style="opacity:.9">в сети</div></div>
 <div class="acts"><button id="bp">${ic('cam')}Выбрать фото</button><button id="be">${ic('pen')}Изменить</button><button id="bg">${ic('paint')}Фон</button></div>
 <div class="row"><div class="t">@${esc(u.username)}<div class="s">Имя пользователя</div></div></div><div class="row"><div class="t">${esc(u.bio||'Не указано')}<div class="s">О себе</div></div></div><input type="file" accept="image/*" id="fi" hidden></div>`}
const toggle=(k,l,s)=>({type:'tg',k,l,s});
const PAGES={
account:{t:'Аккаунт',i:[{type:'tx',k:'u.name',l:'Имя'},{type:'tx',k:'u.username',l:'Имя пользователя'},{type:'tx',k:'u.bio',l:'О себе'}]},
chats:{t:'Настройки чатов',i:[{type:'seg',k:'theme',l:'Тема',o:[['light','Светлая'],['dark','Тёмная'],['auto','Авто']]},{type:'rg',k:'font',l:'Размер текста',a:13,b:20},{type:'rg',k:'corner',l:'Скругление сообщений',a:4,b:22},{type:'wl'},toggle('enter','Отправка клавишей Enter'),toggle('anim','Анимации')]},
privacy:{t:'Конфиденциальность',i:[toggle('seen','Время захода','Показывать «в сети» и время захода')]},
notif:{t:'Уведомления',i:[toggle('sound','Звук сообщений'),toggle('vib','Вибрация')]},
data:{t:'Данные и память',i:[{type:'bt',l:'Очистить локальные настройки',a:'clr'}]},
devices:{t:'Устройства',i:[{type:'bt',l:'Выйти из аккаунта',a:'out',red:1}]},
energy:{t:'Энергосбережение',i:[toggle('anim','Экономия энергии','Отключает анимации')]}};
const MENU=[['account','Аккаунт','Имя, имя пользователя, «О себе»','user','#3b8fe8'],['chats','Настройки чатов','Обои, ночной режим, анимации','chat','#e8a13b'],['privacy','Конфиденциальность','Время захода','lock','#4cb36a'],['notif','Уведомления','Звуки, вибрация','bell','#e5484d'],['data','Данные и память','Локальные данные','pie','#4a62c9'],['devices','Устройства','Сеанс и выход','device','#3aa6b9'],['energy','Энергосбережение','Экономия энергии','bat','#e0734a']];
const gv=k=>k.startsWith('u.')?S.u[k.slice(2)]:S.s[k],sv=(k,v)=>{k.startsWith('u.')?S.u[k.slice(2)]=v:S.s[k]=v;save();applyTheme()};
function setV(){
 if(!sub)return bar('back')+`<div class="body"><div class="row" id="pf" style="gap:14px">${av(S.u,60)}<div class="t"><b style="font-weight:500">${esc(S.u.name)}</b><div class="s">@${esc(S.u.username)}</div></div></div><div class="gap"></div>
 ${MENU.map(m=>`<button class="row" data-sub="${m[0]}"><span class="av" style="width:40px;height:40px;border-radius:10px;background:${m[4]};color:#fff">${ic(m[3]).replace('class="i ','class="i" style="color:#fff" data-x="')}</span><span class="t">${m[1]}<div class="s">${m[2]}</div></span></button>`).join('')}</div>`;
 return bar('back')+`<div class="body">${PAGES[sub].i.map(item).join('')}</div>`}
function item(it){
 if(it.type=='tg')return `<button class="row" data-tg="${it.k}"><span class="t">${it.l}${it.s?`<div class="s">${it.s}</div>`:''}</span><span class="tg ${S.s[it.k]?'on':''}"></span></button>`;
 if(it.type=='tx')return `<div style="padding:2px 18px"><label class="f">${it.l}</label><input class="inp" data-tx="${it.k}" value="${esc(gv(it.k)||'')}"></div>`;
 if(it.type=='seg')return `<div class="hs">${it.l}</div><div class="seg">${it.o.map(o=>`<button data-sg="${it.k}:${o[0]}" class="${S.s[it.k]==o[0]?'on':''}">${o[1]}</button>`).join('')}</div>`;
 if(it.type=='rg')return `<div class="hs">${it.l}</div><div style="padding:6px 18px"><input type="range" min="${it.a}" max="${it.b}" value="${S.s[it.k]}" data-rg="${it.k}" style="width:100%"></div>`;
 if(it.type=='wl')return `<div class="hs">Обои чата</div><div class="sw" style="padding:0 18px">${WALL.map((w,i)=>`<button data-w="${i}" class="${S.s.wall==i?'on':''}" style="background:linear-gradient(135deg,${w[0]},${w[1]})"></button>`).join('')}</div>`;
 if(it.type=='bt')return `<button class="row" data-bt="${it.a}"><span class="t" style="color:${it.red?'#e5484d':'var(--ac)'}">${it.l}</span></button>`}

// ---------- chat ----------
function chatView(){
 const u=CU[peer]||{name:'Пользователь'};
 app.innerHTML=`<div class="hd"><button id="bk">${ic('back')}</button><button id="ph" style="display:flex;align-items:center;gap:10px;flex:1;height:48px;width:auto;border-radius:8px;text-align:left;justify-content:flex-start">${av(u,40)}<div><div id="nm" style="font-weight:500"></div><small id="st" style="opacity:.8"></small></div></button></div>
 <div class="ml" id="ml" style="background:linear-gradient(160deg,${WALL[S.s.wall][0]},${WALL[S.s.wall][1]})"></div><div id="rp"></div>
 <div class="ib"><button id="at">${ic('attach')}</button><textarea id="ti" rows="1" placeholder="Сообщение"></textarea><button class="snd" id="sd">${ic('send')}</button></div><input type="file" accept="image/*" id="fi" hidden>`;
 updHdr();drawMsgs(true);bindChat()}
function updHdr(){const n=$('#nm');if(!n)return;n.textContent=(CU[peer]||{}).name||'Пользователь';$('#st').textContent=status(peer)}
function drawMsgs(first){const ml=$('#ml');if(!ml)return;const near=first||ml.scrollHeight-ml.scrollTop-ml.clientHeight<140;let day='',h='';
 MS.forEach(m=>{const d=dl(m.ts||Date.now());if(d!=day){day=d;h+=`<div class="dc">${d}</div>`}
  const me=m.from==uid,rx={};Object.values(m.rx||{}).forEach(k=>rx[k]=(rx[k]||0)+1);
  h+=`<div class="b ${me?'out':''}" data-id="${m.id}" style="${me?'border-radius:'+S.s.corner+'px '+S.s.corner+'px 4px '+S.s.corner+'px':'border-radius:'+S.s.corner+'px '+S.s.corner+'px '+S.s.corner+'px 4px'}">
  ${m.re?`<div class="q"><b>${m.re.from==uid?'Вы':esc((CU[m.re.from]||{}).name||'')}</b>${esc(m.re.t)}</div>`:''}${m.img?`<img class="mi" src="${m.img}">`:''}${m.t?`<p>${esc(m.t)}</p>`:''}
  <span class="mt">${tm(m.ts)}${me?ic(RD>=m.ts?'check2':'check'):''}</span>
  ${Object.keys(rx).length?`<div class="rxs">${Object.keys(rx).map(k=>`<button class="rx ${(m.rx||{})[uid]==k?'me':''}" data-rk="${k}">${rsvg(k)}${rx[k]}</button>`).join('')}</div>`:''}</div>`});
 ml.innerHTML=h||`<div class="dc">Напишите первое сообщение</div>`;if(near)ml.scrollTop=ml.scrollHeight}
function openChat(p){view='chat';peer=p;MS=[];RD=0;reply=null;render();const c=cid(p);
 const r1=db.ref('messages/'+c).limitToLast(150),r2=db.ref('reads/'+c+'/'+p);
 r1.on('value',x=>{const n=MS.length;MS=Object.entries(x.val()||{}).map(([id,v])=>({id,...v})).sort((a,b)=>(a.ts||1e15)-(b.ts||1e15));const l=MS[MS.length-1];if(n&&l&&l.from!=uid&&MS.length>n)beep();drawMsgs();markRead()},e=>toast('Ошибка: '+e.code));
 r2.on('value',x=>{RD=x.val()||0;drawMsgs()});off=[r1,r2]}
function closeChat(){off.forEach(r=>r.off());off=[];peer=null;reply=null}
function markRead(){if(view!='chat')return;db.ref('reads/'+cid(peer)+'/'+uid).set(SV());if(UC[peer]&&UC[peer].unread)db.ref('userChats/'+uid+'/'+peer+'/unread').set(0)}
function send(t,img){const m={from:uid,ts:SV()};if(t)m.t=t;if(img)m.img=img;if(reply)m.re={t:reply.t||'Фото',from:reply.from};
 const last=img&&!t?'Фото':t;db.ref('messages/'+cid(peer)).push(m).catch(e=>toast('Ошибка: '+e.code));
 db.ref('userChats/'+uid+'/'+peer).update({last,ts:SV(),unread:0});db.ref('userChats/'+peer+'/'+uid).update({last,ts:SV(),unread:firebase.database.ServerValue.increment(1)});
 reply=null;$('#rp').innerHTML=''}
function bindChat(){
 const ti=$('#ti'),sd=$('#sd'),go=()=>{const t=ti.value.trim();if(!t)return;send(t);ti.value='';ti.style.height='';sd.classList.remove('on')};
 ti.oninput=()=>{ti.style.height='auto';ti.style.height=ti.scrollHeight+'px';sd.classList.toggle('on',!!ti.value.trim())};
 ti.onkeydown=e=>{if(e.key=='Enter'&&S.s.enter&&!e.shiftKey){e.preventDefault();go()}};sd.onclick=go;
 $('#bk').onclick=back;$('#at').onclick=()=>$('#fi').click();$('#ph').onclick=()=>profSheet(peer);
 $('#fi').onchange=e=>resize(e.target.files[0],800,.72,d=>send('',d));
 const ml=$('#ml');let tm_,sx,sy;
 ml.onpointerdown=e=>{const b=e.target.closest('.b');if(!b)return;sx=e.clientX;sy=e.clientY;tm_=setTimeout(()=>ctx(b),420)};
 ml.onpointermove=e=>{if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>10)clearTimeout(tm_)};ml.onpointerup=ml.onpointercancel=()=>clearTimeout(tm_);
 ml.oncontextmenu=e=>{e.preventDefault();const b=e.target.closest('.b');if(b)ctx(b)};
 ml.ondblclick=e=>{const b=e.target.closest('.b');if(b)toggleRx(b.dataset.id,'heart')};
 ml.onclick=e=>{const r=e.target.closest('[data-rk]');if(r)toggleRx(r.closest('.b').dataset.id,r.dataset.rk)}}
function toggleRx(id,k){const m=MS.find(x=>x.id==id);if(!m)return;if(S.s.vib&&navigator.vibrate)navigator.vibrate(12);const r=db.ref('messages/'+cid(peer)+'/'+id+'/rx/'+uid);(m.rx||{})[uid]==k?r.remove():r.set(k).catch(e=>toast('Ошибка: '+e.code))}
function ctx(b){const m=MS.find(x=>x.id==b.dataset.id);if(!m)return;if(navigator.vibrate)navigator.vibrate(15);clearTimeout(0);
 const a=app.getBoundingClientRect(),r=b.getBoundingClientRect(),top=Math.min(Math.max(r.bottom-a.top+8,110),a.height-200),x=Math.min(Math.max(r.left-a.left,8),a.width-300);
 const el=document.createElement('div');el.className='cxb';
 el.innerHTML=`<div class="rbar" style="left:${x}px;top:${top-58}px">${Object.keys(RC).map(k=>`<button data-r="${k}">${rsvg(k)}</button>`).join('')}</div>
 <div class="menu" style="left:${x}px;top:${top}px"><button data-a="re">${ic('reply')}Ответить</button>${m.t?`<button data-a="cp">${ic('copy')}Копировать</button>`:''}${m.from==uid?`<button data-a="del" style="color:#e5484d">${ic('trash')}Удалить</button>`:''}</div>`;
 app.append(el);el.onclick=e=>{const k=e.target.closest('[data-r]'),a=e.target.closest('[data-a]');
  if(k)toggleRx(m.id,k.dataset.r);
  if(a){const t=a.dataset.a;if(t=='re'){reply=m;$('#rp').innerHTML=`<div class="rp"><div><b>${m.from==uid?'Вы':esc((CU[m.from]||{}).name)}</b><span>${esc(m.t||'Фото')}</span></div><button id="xr">${ic('close')}</button></div>`;$('#xr').onclick=()=>{reply=null;$('#rp').innerHTML=''};$('#ti').focus()}
   if(t=='cp'){navigator.clipboard?.writeText(m.t);toast('Скопировано')}
   if(t=='del')db.ref('messages/'+cid(peer)+'/'+m.id).remove()}
  el.remove()}}
function resize(f,max,q,cb){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',q))};im.src=r.result};r.readAsDataURL(f)}
function profSheet(id){const u=CU[id]||{name:'Пользователь'},g=u.grad||GR[0],b=document.createElement('div');
 b.innerHTML=`<div class="sheet-bg"></div><div class="sheet" style="padding:0"><div class="hero" style="background:linear-gradient(160deg,${g[0]},${g[1]})">${av(u,84)}<h2 style="font-weight:500">${esc(u.name)}</h2><div style="opacity:.9">${status(id)}</div></div>
 <div class="row"><div class="t">@${esc(u.username||'')}<div class="s">Имя пользователя</div></div></div><div class="row"><div class="t">${esc(u.bio||'Не указано')}<div class="s">О себе</div></div></div></div>`;app.append(b);b.firstChild.onclick=()=>b.remove()}

// ---------- bindings / nav ----------
function go(v){if(view=='chat')closeChat();view=v;sub=null;render()}
function back(){if($('.sheet-bg')){$('.sheet-bg').click();return}if($('.dr-bg')){$('.dr-bg').click();return}if($('.cxb')){$('.cxb').remove();return}
 if(view=='settings'&&sub){sub=null;render();return}if(view!='list')go('list')}
function drawer(){const u=S.u,g=u.grad,b=document.createElement('div');
 b.innerHTML=`<div class="dr-bg"></div><div class="dr" style="--c1:${g[0]};--c2:${g[1]}"><div class="top">${av(u,64)}<b>${esc(u.name)}</b><small>@${esc(u.username)}</small></div>
 ${[['me','user','Мой профиль'],['contacts','users','Контакты'],['settings','gear','Настройки']].map(r=>`<button class="row" data-g="${r[0]}">${ic(r[1])}<span class="t">${r[2]}</span></button>`).join('')}
 <button class="row" id="dk">${ic('moon')}<span class="t">Тёмная тема</span><span class="tg ${S.s.theme=='dark'?'on':''}"></span></button></div>`;app.append(b);
 b.firstChild.onclick=()=>b.remove();b.querySelectorAll('[data-g]').forEach(x=>x.onclick=()=>{b.remove();go(x.dataset.g)});
 $('#dk').onclick=()=>{sv('theme',S.s.theme=='dark'?'light':'dark');b.remove();render()}}
function bind(){
 const mn=$('#mn');if(mn)mn.onclick=()=>view=='list'?drawer():back();
 document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>openChat(b.dataset.p));
 if($('#sr'))$('#sr').onclick=()=>go('contacts');if($('#nw'))$('#nw').onclick=()=>go('contacts');
 if($('#q')){$('#q').focus();$('#q').oninput=e=>{const t=document.createElement('div');t.innerHTML=contactsV(e.target.value);$('#cl').innerHTML=t.querySelector('#cl').innerHTML;document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>openChat(b.dataset.p))}}
 if(view=='me')bindMe();if(view=='settings')bindSet()}
function bindMe(){
 $('#bp').onclick=()=>$('#fi').click();$('#fi').onchange=e=>resize(e.target.files[0],256,.85,d=>{S.u.avatar=d;save();render();toast('Фото обновлено')});
 $('#be').onclick=()=>{view='settings';sub='account';render()};
 $('#bg').onclick=()=>{const b=document.createElement('div');let c=[...S.u.grad];
  b.innerHTML=`<div class="sheet-bg"></div><div class="sheet"><b>Фон профиля</b><div class="sw">${GR.map((g,i)=>`<button data-g="${i}" class="${g[0]==c[0]&&g[1]==c[1]?'on':''}" style="background:linear-gradient(135deg,${g[0]},${g[1]})"></button>`).join('')}</div>
  <label class="f">Свой градиент</label><div style="display:flex;gap:10px"><input type="color" id="c1" value="${c[0]}" style="flex:1;height:44px;border:0;background:none"><input type="color" id="c2" value="${c[1]}" style="flex:1;height:44px;border:0;background:none"></div><button class="pri" id="ok">Готово</button></div>`;app.append(b);
  const up=()=>{S.u.grad=c;save();$('.hero').style.background=`linear-gradient(160deg,${c[0]},${c[1]})`};
  b.querySelector('.sw').onclick=e=>{const i=e.target.dataset.g;if(i==null)return;c=[...GR[i]];$('#c1').value=c[0];$('#c2').value=c[1];b.querySelectorAll('.sw button').forEach(x=>x.classList.toggle('on',x==e.target));up()};
  $('#c1').oninput=e=>{c[0]=e.target.value;up()};$('#c2').oninput=e=>{c[1]=e.target.value;up()};$('#ok').onclick=b.firstChild.onclick=()=>b.remove()}}
function bindSet(){
 document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{sub=b.dataset.sub;render()});if($('#pf'))$('#pf').onclick=()=>{view='me';render()};
 document.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{const k=b.dataset.tg;sv(k,S.s[k]?0:1);if(k=='seen')presence();b.querySelector('.tg').classList.toggle('on')});
 document.querySelectorAll('[data-tx]').forEach(i=>i.onchange=()=>{const v=i.value.trim(),k=i.dataset.tx;
  if(k=='u.username'){if(!/^[a-z0-9_]{3,20}$/i.test(v)){i.value=S.u.username;return toast('Некорректное имя пользователя')}
   if(Object.entries(CU).some(([x,u])=>x!=uid&&(u.username||'').toLowerCase()==v.toLowerCase())){i.value=S.u.username;return toast('Имя пользователя занято')}}
  if(k=='u.name'&&v.length<2){i.value=S.u.name;return toast('Имя слишком короткое')}sv(k,v);toast('Сохранено')});
 document.querySelectorAll('[data-sg]').forEach(b=>b.onclick=()=>{const[k,v]=b.dataset.sg.split(':');sv(k,v);render()});
 document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{sv('wall',+b.dataset.w);render()});
 document.querySelectorAll('[data-rg]').forEach(i=>i.oninput=()=>sv(i.dataset.rg,+i.value));
 document.querySelectorAll('[data-bt]').forEach(b=>b.onclick=()=>{const a=b.dataset.bt;
  if(a=='clr'){const u=S.u;localStorage.removeItem(KEY);S=JSON.parse(JSON.stringify({u,s:{theme:'light',font:16,corner:14,wall:0,enter:0,sound:1,vib:1,seen:1,anim:1}}));save();render();toast('Настройки сброшены')}
  if(a=='out'&&confirm('Выйти? Профиль будет удалён с этого устройства.')){const x=()=>{localStorage.removeItem(KEY);location.reload()};db.ref('users/'+uid).remove().finally(()=>firebase.auth().signOut().finally(x))}})}
document.addEventListener('pointerdown',e=>{const t=e.target.closest('button,.row,.ch');if(!t)return;const r=t.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,x=document.createElement('span');
 x.className='rip';x.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;t.style.position=t.style.position||'relative';t.style.overflow='hidden';t.append(x);setTimeout(()=>x.remove(),550)});
history.pushState({},'');addEventListener('popstate',()=>{history.pushState({},'');back()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
initCloud();render();
</script></body></html>
