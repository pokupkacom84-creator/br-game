<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Telegram Online</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#0e1621;color:#fff;overflow:hidden;font-size:15px}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:#2b3844;border-radius:3px}

.screen{display:none;height:100vh;height:100dvh}
.screen.show{display:flex}

/* SPLASH */
#splashScreen{align-items:center;justify-content:center;flex-direction:column;gap:20px;background:#0e1621}
.spinner{width:44px;height:44px;border:3px solid #1c2733;border-top-color:#5288c1;
  border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#splashScreen .logo{width:72px;height:72px;border-radius:50%;
  background:linear-gradient(135deg,#5288c1,#64b5ef);display:flex;align-items:center;
  justify-content:center;font-size:32px}
#splashScreen .loading{color:#8b9aa8;font-size:13px}

/* AUTH / PROFILE */
.center{align-items:center;justify-content:center;padding:20px;background:#0e1621}
.card{background:#17212b;border-radius:18px;padding:32px 26px;width:100%;max-width:400px;
  box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card h1{font-size:24px;font-weight:600;margin-bottom:6px;text-align:center}
.card .sub{color:#8b9aa8;font-size:13px;text-align:center;margin-bottom:22px}
.tabs{display:flex;background:#0e1621;border-radius:10px;padding:4px;margin-bottom:20px}
.tab{flex:1;padding:9px;border-radius:8px;font-size:14px;font-weight:500;color:#8b9aa8;transition:.15s}
.tab.active{background:#5288c1;color:#fff}
.field-input{width:100%;background:#0e1621;border-radius:10px;padding:13px 16px;
  font-size:15px;margin-bottom:10px;border:1.5px solid transparent;transition:.15s}
.field-input:focus{border-color:#5288c1}
.error{background:#e0483d22;border:1px solid #e0483d55;color:#ff8b80;font-size:13px;
  padding:10px 14px;border-radius:9px;margin-bottom:12px;min-height:0}
.error:empty{display:none;padding:0;border:none;margin:0}
.primary{background:#5288c1;color:#fff;padding:13px 20px;border-radius:10px;
  font-size:15px;font-weight:600;width:100%;transition:.15s}
.primary:hover{background:#64b5ef}
.primary:disabled{opacity:.6;cursor:default}
.ghost{padding:10px 16px;border-radius:9px;color:#64b5ef;font-weight:500}
.ghost:hover{background:#ffffff11}
.small{font-size:12px;color:#8b9aa8}

/* APP LAYOUT */
#appScreen{flex-direction:row;background:#0e1621}
#sidebar{width:360px;background:#17212b;display:flex;flex-direction:column;
  border-right:1px solid #0b1219;position:relative;flex-shrink:0}
#chatPanel{flex:1;display:flex;flex-direction:column;position:relative;min-width:0;background:#0e1621}

@media(max-width:820px){
  #sidebar{width:100%;border:none}
  #chatPanel{position:fixed;inset:0;z-index:60;transform:translateX(100%);
    transition:transform .25s cubic-bezier(.4,0,.2,1)}
  #chatPanel.open{transform:none}
}

/* SIDEBAR */
#sidebar>header{padding:14px 16px;background:#17212b;
  padding-top:calc(14px + env(safe-area-inset-top,0));
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid #0b1219}
.me{display:flex;align-items:center;gap:12px;min-width:0}
.me .avatar{width:40px;height:40px;font-size:16px}
#meName{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;color:#8b9aa8;transition:.15s;flex-shrink:0}
.icon:hover{background:#ffffff11;color:#fff}
.icon:active{transform:scale(.92)}
#chatSearch{margin:10px 12px;background:#242f3d;border-radius:20px;padding:10px 16px;
  font-size:14px;color:#fff}
#chatSearch::placeholder{color:#6c7883}
#chatList{flex:1;overflow-y:auto;padding:0 6px}

.chat-item{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:12px;
  cursor:pointer;transition:background .12s;user-select:none}
.chat-item:hover{background:#202b36}
.chat-item.active{background:#2b5278}
.ci-body{flex:1;min-width:0}
.ci-top{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.ci-name{font-weight:600;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.ci-time{font-size:12px;color:#6c7883;flex-shrink:0}
.chat-item.active .ci-time{color:#a8d8ff}
.ci-preview{font-size:13.5px;color:#8b9aa8;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;line-height:1.3}
.chat-item.active .ci-preview{color:#dbe9f7}
.ci-dot{width:9px;height:9px;border-radius:50%;background:#e0483d;flex-shrink:0}
.empty{text-align:center;color:#6c7883;font-size:14px;padding:40px 20px;line-height:1.5}

#newChatBtn{position:absolute;right:16px;bottom:16px;width:56px;height:56px;
  border-radius:50%;background:#5288c1;color:#fff;font-size:28px;font-weight:300;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(0,0,0,.4);transition:.15s}
#newChatBtn:hover{background:#64b5ef;transform:scale(1.05)}
#newChatBtn:active{transform:scale(.9)}

/* CHAT VIEW */
#chatView{flex:1;display:flex;flex-direction:column;overflow:hidden}
#chatView>header{padding:10px 14px;background:#17212b;
  padding-top:calc(10px + env(safe-area-inset-top,0));
  display:flex;align-items:center;gap:12px;
  border-bottom:1px solid #0b1219;flex-shrink:0}
#chatView>header .avatar{width:42px;height:42px;font-size:17px}
#chatView>header>div:last-child{min-width:0;flex:1}
#chatTitle{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#backBtn{display:none}
@media(max-width:820px){#backBtn{display:flex}}

#emptyState{flex:1;display:flex;align-items:center;justify-content:center;
  color:#6c7883;font-size:14px;text-align:center;padding:20px;line-height:1.6}

#messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:3px;
  scroll-behavior:smooth}
.date-sep{align-self:center;background:rgba(0,0,0,.3);color:#fff;font-size:12px;
  padding:4px 12px;border-radius:12px;margin:12px 0 8px;font-weight:500}

.msg{display:flex;max-width:78%;animation:in .18s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.in{align-self:flex-start}
.msg.out{align-self:flex-end}
.bubble{background:#182533;border-radius:14px;padding:8px 12px 7px;
  box-shadow:0 1px 3px rgba(0,0,0,.25);min-width:60px;position:relative;word-break:break-word}
.msg.out .bubble{background:#2b5278;border-bottom-right-radius:4px}
.msg.in .bubble{border-bottom-left-radius:4px}
.bubble-text{font-size:15px;line-height:1.35;white-space:pre-wrap}
.bubble-meta{float:right;margin:5px 0 -3px 12px;font-size:11px;color:#6c7883;
  display:flex;align-items:center;gap:4px;user-select:none}
.msg.out .bubble-meta{color:#a8d8ff}

#composer{background:#17212b;border-top:1px solid #0b1219;padding:10px 12px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0));
  display:flex;gap:8px;align-items:flex-end;flex-shrink:0}
#msgInput{flex:1;background:#242f3d;border-radius:20px;padding:11px 16px;
  font-size:15px;resize:none;max-height:130px;line-height:1.35;color:#fff;
  font-family:inherit}
#msgInput::placeholder{color:#6c7883}
#sendBtn{width:46px;height:46px;border-radius:50%;background:#5288c1;color:#fff;
  font-size:18px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:.15s}
#sendBtn:hover{background:#64b5ef}
#sendBtn:active{transform:scale(.9)}

/* AVATAR */
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:600;font-size:20px;flex-shrink:0;
  width:54px;height:54px;overflow:hidden}
.avatar.sm{width:36px;height:36px;font-size:15px}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:900;
  display:none;align-items:center;justify-content:center;padding:20px;
  backdrop-filter:blur(3px)}
.overlay.show{display:flex;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-box{background:#17212b;border-radius:16px;padding:22px;width:100%;max-width:420px;
  animation:pop .2s cubic-bezier(.4,0,.2,1);max-height:85vh;overflow-y:auto}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.modal-box h3{font-size:19px;font-weight:600;margin-bottom:6px}
.modal-box .sub{color:#8b9aa8;font-size:13.5px;margin-bottom:16px;line-height:1.4}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.modal-actions .ghost{color:#64b5ef}
.modal-actions .primary{width:auto}

.found-user{display:flex;align-items:center;gap:12px;background:#0e1621;
  border-radius:12px;padding:12px;margin-top:12px}
.found-user>div:nth-child(2){flex:1;min-width:0}
.fu-name{font-weight:600;font-size:15px}
.fu-user{color:#64b5ef;margin-top:1px}
.found-user .primary{width:auto;padding:9px 16px;font-size:14px}

/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,80px);
  background:#2b3844;color:#fff;padding:11px 20px;border-radius:10px;
  font-size:14px;z-index:9999;opacity:0;transition:all .3s cubic-bezier(.4,0,.2,1);
  pointer-events:none;max-width:88vw;text-align:center;
  box-shadow:0 6px 24px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* Offline indicator */
#offlineBar{position:fixed;top:0;left:0;right:0;background:#e0483d;color:#fff;
  font-size:12.5px;text-align:center;padding:6px;z-index:9998;
  transform:translateY(-100%);transition:transform .25s}
#offlineBar.show{transform:none}
</style>
</head>
<body>

<div id="offlineBar">Нет подключения к интернету</div>

<!-- SPLASH -->
<div class="screen center show" id="splashScreen">
  <div class="logo">💬</div>
  <div class="spinner"></div>
  <div class="loading" id="splashText">Загрузка...</div>
</div>

<!-- AUTH -->
<div class="screen center" id="authScreen">
  <div class="card">
    <h1>Telegram</h1>
    <p class="sub">Онлайн-мессенджер</p>
    <div class="tabs">
      <button class="tab active" data-mode="login">Вход</button>
      <button class="tab" data-mode="register">Регистрация</button>
    </div>
    <input class="field-input" id="email" type="email" placeholder="Email" autocomplete="email">
    <input class="field-input" id="password" type="password" placeholder="Пароль (мин. 6 символов)" autocomplete="current-password">
    <div class="error" id="authError"></div>
    <button class="primary" id="authBtn">Войти</button>
  </div>
</div>

<!-- PROFILE SETUP -->
<div class="screen center" id="profileScreen">
  <div class="card">
    <h1>Настройка профиля</h1>
    <p class="sub">Как вас будут видеть другие пользователи</p>
    <input class="field-input" id="pName" placeholder="Ваше имя" maxlength="30">
    <input class="field-input" id="pUsername" placeholder="@username (a-z, 0-9, _)"
      maxlength="20" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="error" id="profileError"></div>
    <button class="primary" id="profileBtn">Продолжить</button>
  </div>
</div>

<!-- APP -->
<div class="screen" id="appScreen">
  <aside id="sidebar">
    <header>
      <div class="me">
        <div class="avatar" id="meAvatar"></div>
        <div style="min-width:0">
          <div id="meName"></div>
          <div id="meUser" class="small"></div>
        </div>
      </div>
      <button class="icon" id="logoutBtn" title="Выйти">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </header>
    <input id="chatSearch" placeholder="Поиск чатов">
    <div id="chatList"></div>
    <button id="newChatBtn" title="Новый чат">+</button>
  </aside>

  <main id="chatPanel">
    <div id="emptyState">
      <div>Выберите чат слева<br>или нажмите «+», чтобы начать новый</div>
    </div>
    <div id="chatView" style="display:none">
      <header>
        <button id="backBtn" class="icon">←</button>
        <div class="avatar sm" id="chatAvatar"></div>
        <div>
          <div id="chatTitle"></div>
          <div id="chatSub" class="small"></div>
        </div>
      </header>
      <div id="messages"></div>
      <div id="composer">
        <textarea id="msgInput" rows="1" placeholder="Сообщение..."></textarea>
        <button id="sendBtn">➤</button>
      </div>
    </div>
  </main>
</div>

<div class="overlay" id="modal"><div class="modal-box" id="modalBox"></div></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
'use strict';

/* ========== FIREBASE ========== */
const firebaseConfig = {
  apiKey: "AIzaSyAfNoV7tt_6eP1gRQxLc4Yk5FJzwVxDMQw",
  authDomain: "game-cd07d.firebaseapp.com",
  databaseURL: "https://game-cd07d-default-rtdb.firebaseio.com",
  projectId: "game-cd07d",
  storageBucket: "game-cd07d.firebasestorage.app",
  messagingSenderId: "1001558545053",
  appId: "1:1001558545053:web:fc60d548ff751b0dd13a74"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.database();

/* Сохраняем сессию в localStorage — автологин при перезапуске браузера */
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.warn);

/* ========== HELPERS ========== */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => Date.now();
const fmtTime = ts => {
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
};
const COLORS = ['#e0483d','#4caf50','#ff9800','#9c27b0','#00bcd4','#e91e63','#5288c1','#795548'];
function colorFor(id){ let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return COLORS[h % COLORS.length]; }
function initial(n){ return (n || '?').trim().charAt(0).toUpperCase() || '?'; }
function avatarEl(name, id, cls){
  const c = colorFor(id || name);
  return `<div class="avatar ${cls || ''}" style="background:linear-gradient(135deg,${c},${c}aa)">${esc(initial(name))}</div>`;
}
let toastTimer;
function toast(msg, ms){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), ms || 2200);
}

/* ========== LOCAL CACHE ========== */
const LS = {
  ME:      'tg_me_profile',
  CHATS:   'tg_chats_cache',
  LAST:    'tg_last_chat',
  save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  load(k){ try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch(e){ return null; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};

/* ========== STATE ========== */
let me = LS.load(LS.ME);         // кэш профиля — показываем мгновенно
let chats = LS.load(LS.CHATS) || {};
let chatListRef = null;
let msgRef = null;
let statusRef = null;
let presenceRef = null;
let currentOtherUid = null;
let currentChatId = null;
let restoringChatId = LS.load(LS.LAST);   // последний открытый чат
let appStarted = false;
let authResolved = false;

/* ========== SCREEN NAV ========== */
function showScreen(id){
  ['splashScreen','authScreen','profileScreen','appScreen'].forEach(s =>
    $('#' + s).classList.toggle('show', s === id));
}

/* ========== AUTH ========== */
let authMode = 'login';
$$('.tab').forEach(t => t.addEventListener('click', () => {
  authMode = t.dataset.mode;
  $$('.tab').forEach(x => x.classList.toggle('active', x === t));
  $('#authBtn').textContent = authMode === 'login' ? 'Войти' : 'Создать аккаунт';
  $('#authError').textContent = '';
}));

$('#authBtn').addEventListener('click', doAuth);
$('#email').addEventListener('keydown', e => { if (e.key === 'Enter') $('#password').focus(); });
$('#password').addEventListener('keydown', e => { if (e.key === 'Enter') doAuth(); });

async function doAuth(){
  const email = $('#email').value.trim();
  const password = $('#password').value;
  $('#authError').textContent = '';
  if (!email || !password){ $('#authError').textContent = 'Заполните все поля'; return; }
  if (password.length < 6){ $('#authError').textContent = 'Пароль минимум 6 символов'; return; }

  const btn = $('#authBtn');
  const oldText = btn.textContent;
  btn.disabled = true; btn.textContent = '...';
  try {
    if (authMode === 'login'){
      await auth.signInWithEmailAndPassword(email, password);
    } else {
      await auth.createUserWithEmailAndPassword(email, password);
    }
    // onAuthStateChanged сам разберётся дальше
  } catch (e){
    const MSGS = {
      'auth/user-not-found': 'Пользователь с таким email не найден',
      'auth/wrong-password': 'Неверный пароль',
      'auth/invalid-credential': 'Неверный email или пароль',
      'auth/invalid-login-credentials': 'Неверный email или пароль',
      'auth/email-already-in-use': 'Этот email уже занят',
      'auth/invalid-email': 'Неверный формат email',
      'auth/weak-password': 'Слишком простой пароль',
      'auth/network-request-failed': 'Нет подключения к сети',
      'auth/too-many-requests': 'Слишком много попыток. Попробуйте позже'
    };
    $('#authError').textContent = MSGS[e.code] || ('Ошибка: ' + (e.message || e.code));
    btn.disabled = false;
    btn.textContent = oldText;
  }
}

$('#logoutBtn').addEventListener('click', async () => {
  if (!confirm('Выйти из аккаунта?')) return;
  try { if (statusRef) await statusRef.set({ online: false, ts: now() }); } catch(e){}
  // Чистим кэш
  LS.del(LS.ME); LS.del(LS.CHATS); LS.del(LS.LAST);
  await auth.signOut();
});

/* ========== PROFILE SETUP ========== */
function showProfileSetup(user){
  showScreen('profileScreen');
  $('#pName').value = '';
  $('#pUsername').value = '';
  $('#profileError').textContent = '';
  setTimeout(() => $('#pName').focus(), 150);

  $('#profileBtn').onclick = async () => {
    const name = $('#pName').value.trim();
    const username = ($('#pUsername').value || '')
      .trim().replace(/^@+/, '').toLowerCase()
      .replace(/[^a-z0-9_]/g, '').slice(0, 20);
    $('#profileError').textContent = '';
    if (name.length < 2){ $('#profileError').textContent = 'Имя минимум 2 символа'; return; }
    if (username.length < 3){ $('#profileError').textContent = 'Username минимум 3 символа'; return; }

    const btn = $('#profileBtn');
    btn.disabled = true; btn.textContent = 'Проверка...';
    try {
      const unameRef = db.ref('messenger/usernames/' + username);
      const snap = await unameRef.get();
      if (snap.exists() && snap.val() !== user.uid){
        throw new Error('Такой username уже занят');
      }
      await unameRef.set(user.uid);
      await db.ref('messenger/users/' + user.uid + '/profile').set({
        name, username, email: user.email, createdAt: now()
      });
      me = { uid: user.uid, email: user.email, name, username };
      LS.save(LS.ME, me);
      showScreen('appScreen');
      startApp();
    } catch (e){
      $('#profileError').textContent = e.message || 'Ошибка сохранения';
      btn.disabled = false; btn.textContent = 'Продолжить';
    }
  };
}

/* ========== AUTH STATE ========== */
auth.onAuthStateChanged(async user => {
  authResolved = true;
  if (!user){
    me = null;
    LS.del(LS.ME);
    stopApp();
    showScreen('authScreen');
    return;
  }

  // 1. Если есть кэш профиля для ЭТОГО uid — показываем приложение сразу
  const cached = LS.load(LS.ME);
  if (cached && cached.uid === user.uid){
    me = cached;
    renderMyHeader();
    showScreen('appScreen');
    startApp();
  } else {
    $('#splashText').textContent = 'Загрузка профиля...';
  }

  // 2. В фоне синхронизируем с сервером
  try {
    const snap = await db.ref('messenger/users/' + user.uid + '/profile').get();
    if (!snap.exists()){
      showProfileSetup(user);
      return;
    }
    const p = snap.val();
    const fresh = { uid: user.uid, email: user.email, name: p.name, username: p.username };
    const changed = !me || me.name !== fresh.name || me.username !== fresh.username;
    me = fresh;
    LS.save(LS.ME, me);
    renderMyHeader();
    if (changed && !appStarted){
      showScreen('appScreen');
      startApp();
    }
  } catch (e){
    console.error(e);
    // Оффлайн, но есть кэш — работаем
    if (!me){
      LS.del(LS.ME);
      showScreen('authScreen');
      toast('Ошибка загрузки профиля');
    }
  }
});

/* ========== RENDER MY HEADER ========== */
function renderMyHeader(){
  if (!me) return;
  $('#meName').textContent = me.name;
  $('#meUser').textContent = '@' + me.username;
  const av = $('#meAvatar');
  av.outerHTML = avatarEl(me.name, me.uid).replace('class="avatar"', 'class="avatar" id="meAvatar"');
}

/* ========== START APP ========== */
function startApp(){
  if (appStarted) return;
  appStarted = true;

  renderMyHeader();

  // Presence
  statusRef = db.ref('messenger/status/' + me.uid);
  statusRef.set({ online: true, ts: now() }).catch(()=>{});
  statusRef.onDisconnect().set({ online: false, ts: now() }).catch(()=>{});
  presenceRef = setInterval(() => {
    if (statusRef) statusRef.update({ online: true, ts: now() }).catch(()=>{});
  }, 30000);

  // Рендерим кэшированные чаты сразу
  renderChatList();

  // Восстанавливаем последний чат
  if (restoringChatId && chats[restoringChatId]){
    const id = restoringChatId;
    restoringChatId = null;
    setTimeout(() => openChat(id), 250);
  }

  loadChats();
}

function stopApp(){
  if (chatListRef){ chatListRef.off(); chatListRef = null; }
  if (msgRef){ msgRef.off(); msgRef = null; }
  Object.values(chats).forEach(c => {}); // no-op
  chats = LS.load(LS.CHATS) || {};
  if (presenceRef){ clearInterval(presenceRef); presenceRef = null; }
  appStarted = false;
}

window.addEventListener('beforeunload', () => {
  if (statusRef) statusRef.set({ online: false, ts: now() }).catch(()=>{});
});

/* ========== CHAT LIST ========== */
function loadChats(){
  if (chatListRef) chatListRef.off();
  chatListRef = db.ref('messenger/userChats/' + me.uid);
  chatListRef.on('value', async snap => {
    const ids = Object.keys(snap.val() || {});

    // Грузим меты пачкой
    const metas = await Promise.all(ids.map(id =>
      db.ref('messenger/chats/' + id + '/meta').get().then(s => ({ id, meta: s.val() })).catch(() => null)
    ));

    const freshChats = {};
    metas.forEach(m => { if (m && m.meta) freshChats[m.id] = m.meta; });
    chats = freshChats;
    LS.save(LS.CHATS, chats);
    renderChatList();
  }, err => {
    console.warn('chats listener error', err);
  });
}

function renderChatList(){
  const q = ($('#chatSearch').value || '').trim().toLowerCase();
  const box = $('#chatList');

  const items = Object.values(chats).map(c => {
    const otherUid = (c.members || []).find(u => u !== me.uid) || me.uid;
    const otherName = (c.memberNames && c.memberNames[otherUid]) || 'Чат';
    const lastRead = (c.reads && c.reads[me.uid]) || 0;
    const unread = (c.lastTs && c.lastTs > lastRead && c.lastFrom && c.lastFrom !== me.uid);
    return {
      id: c.id,
      otherUid,
      name: otherName,
      lastMessage: c.lastMessage || 'Нет сообщений',
      lastTs: c.lastTs || c.createdAt || 0,
      unread
    };
  }).filter(c => {
    if (!q) return true;
    return (c.name || '').toLowerCase().includes(q) ||
           (c.lastMessage || '').toLowerCase().includes(q);
  }).sort((a,b) => (b.lastTs || 0) - (a.lastTs || 0));

  if (!items.length){
    box.innerHTML = `<div class="empty">${q ? 'Ничего не найдено' : 'Нет чатов.<br>Нажмите «+», чтобы начать новый.'}</div>`;
    return;
  }

  box.innerHTML = items.map(c => `
    <div class="chat-item ${c.id === currentChatId ? 'active' : ''}" data-id="${c.id}">
      ${avatarEl(c.name, c.otherUid)}
      <div class="ci-body">
        <div class="ci-top">
          <div class="ci-name">${esc(c.name)}</div>
          <div class="ci-time">${c.lastTs ? fmtTime(c.lastTs) : ''}</div>
        </div>
        <div class="ci-preview">${esc(c.lastMessage)}</div>
      </div>
      ${c.unread ? '<div class="ci-dot"></div>' : ''}
    </div>
  `).join('');

  box.querySelectorAll('.chat-item').forEach(el => {
    el.addEventListener('click', () => openChat(el.dataset.id));
  });
}

$('#chatSearch').addEventListener('input', renderChatList);

/* ========== OPEN CHAT ========== */
function openChat(chatId){
  const chat = chats[chatId];
  if (!chat) return;

  currentChatId = chatId;
  currentOtherUid = (chat.members || []).find(u => u !== me.uid) || null;
  LS.save(LS.LAST, chatId);

  $('#emptyState').style.display = 'none';
  $('#chatView').style.display = 'flex';
  $('#chatPanel').classList.add('open');

  const otherName = (chat.memberNames && chat.memberNames[currentOtherUid]) || 'Чат';
  $('#chatTitle').textContent = otherName;
  const av = $('#chatAvatar');
  av.outerHTML = avatarEl(otherName, currentOtherUid || chatId, 'sm')
    .replace('class="avatar sm"', 'class="avatar sm" id="chatAvatar"');

  // Presence
  if (currentOtherUid){
    const stRef = db.ref('messenger/status/' + currentOtherUid);
    stRef.on('value', s => {
      const v = s.val();
      if (v && v.online && now() - v.ts < 90000){
        $('#chatSub').textContent = 'онлайн';
      } else if (v && v.ts){
        $('#chatSub').textContent = 'был(а) ' +
          new Date(v.ts).toLocaleString('ru-RU', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
      } else {
        $('#chatSub').textContent = 'не в сети';
      }
    });
  } else {
    $('#chatSub').textContent = '';
  }

  // Messages
  if (msgRef){ msgRef.off(); msgRef = null; }
  msgRef = db.ref('messenger/messages/' + chatId).orderByChild('ts').limitToLast(200);
  msgRef.on('value', snap => {
    const data = snap.val() || {};
    const list = Object.keys(data)
      .map(k => Object.assign({ id: k }, data[k]))
      .sort((a,b) => (a.ts || 0) - (b.ts || 0));
    renderMessages(list);
    db.ref('messenger/chats/' + chatId + '/reads/' + me.uid).set(now()).catch(()=>{});
  });

  setTimeout(() => $('#msgInput').focus(), 150);
  renderChatList();
}

$('#backBtn').addEventListener('click', () => {
  $('#chatPanel').classList.remove('open');
  if (msgRef){ msgRef.off(); msgRef = null; }
  currentChatId = null;
  currentOtherUid = null;
  LS.del(LS.LAST);
  renderChatList();
});

/* ========== RENDER MESSAGES ========== */
function renderMessages(list){
  const box = $('#messages');
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 150;

  if (!list.length){
    box.innerHTML = `<div class="empty" style="margin:auto">Нет сообщений. Напишите первым!</div>`;
    return;
  }

  let lastDay = '';
  let html = '';
  list.forEach(m => {
    const out = m.from === me.uid;
    const d = new Date(m.ts);
    const dayKey = d.toDateString();
    if (dayKey !== lastDay){
      lastDay = dayKey;
      const today = new Date().toDateString();
      const yest = new Date(Date.now() - 86400000).toDateString();
      let label = d.toLocaleDateString('ru-RU', { day:'numeric', month:'long' });
      if (dayKey === today) label = 'Сегодня';
      else if (dayKey === yest) label = 'Вчера';
      html += `<div class="date-sep">${label}</div>`;
    }
    html += `
      <div class="msg ${out ? 'out' : 'in'}">
        <div class="bubble">
          <div class="bubble-text">${esc(m.text).replace(/\n/g, '<br>')}</div>
          <div class="bubble-meta">
            <span>${fmtTime(m.ts)}</span>
            ${out ? '<span>✓✓</span>' : ''}
          </div>
        </div>
      </div>`;
  });
  box.innerHTML = html;

  if (nearBottom || box.dataset.first !== '1'){
    box.dataset.first = '1';
    requestAnimationFrame(() => box.scrollTop = box.scrollHeight);
  }
}

/* ========== SEND ========== */
async function sendMessage(){
  const text = ($('#msgInput').value || '').trim();
  if (!text || !currentChatId) return;

  const inp = $('#msgInput');
  inp.value = '';
  autoGrow();

  try {
    const newRef = db.ref('messenger/messages/' + currentChatId).push();
    await newRef.set({ from: me.uid, text, ts: now() });
    await db.ref('messenger/chats/' + currentChatId + '/meta').update({
      lastMessage: text.slice(0, 60),
      lastTs: now(),
      lastFrom: me.uid
    });
  } catch (e){
    console.error(e);
    toast('Не удалось отправить сообщение');
  }
}

$('#sendBtn').addEventListener('click', sendMessage);
$('#msgInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
});
function autoGrow(){
  const t = $('#msgInput');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 130) + 'px';
}
$('#msgInput').addEventListener('input', autoGrow);

/* ========== NEW CHAT ========== */
$('#newChatBtn').addEventListener('click', () => {
  openModal(`
    <h3>Новый чат</h3>
    <p class="sub">Найдите человека по @username</p>
    <input class="field-input" id="findUser" placeholder="@username"
      autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="20">
    <div id="findResult"></div>
    <div class="modal-actions">
      <button class="ghost" data-close>Отмена</button>
      <button class="primary" id="findBtn">Найти</button>
    </div>
  `);
  setTimeout(() => $('#findUser').focus(), 100);
  $('#findBtn').addEventListener('click', findUser);
  $('#findUser').addEventListener('keydown', e => { if (e.key === 'Enter') findUser(); });
});

async function findUser(){
  const username = ($('#findUser').value || '').trim()
    .replace(/^@+/, '').toLowerCase().replace(/[^a-z0-9_]/g, '');
  const res = $('#findResult');
  if (username.length < 3){ res.innerHTML = '<div class="error">Минимум 3 символа</div>'; return; }
  if (username === me.username){ res.innerHTML = '<div class="error">Это вы сами</div>'; return; }

  res.innerHTML = '<div class="empty" style="padding:20px">Поиск...</div>';
  try {
    const snap = await db.ref('messenger/usernames/' + username).get();
    if (!snap.exists()){ res.innerHTML = '<div class="error">Пользователь не найден</div>'; return; }
    const otherUid = snap.val();
    const pSnap = await db.ref('messenger/users/' + otherUid + '/profile').get();
    if (!pSnap.exists()){ res.innerHTML = '<div class="error">Профиль недоступен</div>'; return; }
    const p = pSnap.val();

    res.innerHTML = `
      <div class="found-user">
        ${avatarEl(p.name, otherUid, 'sm')}
        <div>
          <div class="fu-name">${esc(p.name)}</div>
          <div class="fu-user small">@${esc(p.username)}</div>
        </div>
        <button class="primary" id="startChatBtn">Написать</button>
      </div>`;
    $('#startChatBtn').addEventListener('click', () => startChatWith(otherUid, p.name));
  } catch (e){
    console.error(e);
    res.innerHTML = '<div class="error">Ошибка поиска</div>';
  }
}

async function startChatWith(otherUid, otherName){
  const chatId = [me.uid, otherUid].sort().join('_');
  try {
    const metaSnap = await db.ref('messenger/chats/' + chatId + '/meta').get();
    if (!metaSnap.exists()){
      await db.ref('messenger/chats/' + chatId + '/meta').set({
        id: chatId,
        type: 'private',
        members: [me.uid, otherUid],
        memberNames: { [me.uid]: me.name, [otherUid]: otherName },
        createdAt: now(),
        lastTs: now(),
        lastMessage: 'Чат создан'
      });
      await db.ref('messenger/userChats/' + me.uid + '/' + chatId).set(true);
      await db.ref('messenger/userChats/' + otherUid + '/' + chatId).set(true);
    }
    closeModal();
    setTimeout(() => openChat(chatId), 300);
  } catch (e){
    console.error(e);
    toast('Ошибка: ' + (e.message || ''));
  }
}

/* ========== MODAL ========== */
function openModal(html){
  $('#modalBox').innerHTML = html;
  $('#modal').classList.add('show');
  $$('#modalBox [data-close]').forEach(b =>
    b.addEventListener('click', closeModal));
}
function closeModal(){ $('#modal').classList.remove('show'); }
$('#modal').addEventListener('click', e => {
  if (e.target === $('#modal')) closeModal();
});

/* ========== OFFLINE / ONLINE ========== */
function updateOfflineBar(){
  $('#offlineBar').classList.toggle('show', !navigator.onLine);
}
window.addEventListener('online', () => { updateOfflineBar(); toast('Соединение восстановлено'); });
window.addEventListener('offline', () => { updateOfflineBar(); toast('Нет подключения', 3000); });
updateOfflineBar();

/* ========== FALLBACK — если Firebase долго не отвечает ========== */
setTimeout(() => {
  if (!authResolved && me){
    // Показываем приложение с кэшем даже без ответа от Firebase
    showScreen('appScreen');
    startApp();
  }
}, 4000);

/* Fallback: если совсем ничего не пришло за 8 сек — покажем форму входа */
setTimeout(() => {
  if (!authResolved){
    showScreen('authScreen');
  }
}, 8000);

</script>
</body>
