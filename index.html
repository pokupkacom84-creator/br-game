<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fef7ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Чаты</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js"></script>
<style>
:root{
  --bg:#fef7ff;--surf:#f7f2fa;--surf2:#f3edf7;--surf3:#ece6f0;--surf4:#e6e0e9;
  --on:#1d1b20;--onv:#49454f;--out:#cac4d0;
  --p:#6750a4;--onp:#fff;--pc:#eaddff;--onpc:#21005d;
  --sc:#e8def8;--onsc:#1d192b;--tc:#ffd8e4;--ontc:#31111d;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141218;--surf:#1d1b20;--surf2:#211f26;--surf3:#2b2930;--surf4:#36343b;
  --on:#e6e0e9;--onv:#cac4d0;--out:#49454f;
  --p:#d0bcff;--onp:#381e72;--pc:#4f378b;--onpc:#eaddff;
  --sc:#4a4458;--onsc:#e8def8;--tc:#633b48;--ontc:#ffd8e4}}
:root[data-theme="dark"]{
  --bg:#141218;--surf:#1d1b20;--surf2:#211f26;--surf3:#2b2930;--surf4:#36343b;
  --on:#e6e0e9;--onv:#cac4d0;--out:#49454f;
  --p:#d0bcff;--onp:#381e72;--pc:#4f378b;--onpc:#eaddff;
  --sc:#4a4458;--onsc:#e8def8;--tc:#633b48;--ontc:#ffd8e4}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--on);
  font-family:"Roboto Flex",Roboto,system-ui,sans-serif;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:24px;height:24px;fill:currentColor;flex:none}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;background:var(--bg)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);
  transition:transform .45s cubic-bezier(.2,0,0,1),opacity .3s}
#chat{transform:translateX(100%);z-index:5;padding-top:var(--safe-t)}
#chat.open{transform:none}
#list{padding-top:var(--safe-t)}
#list.back{transform:translateX(-20%);opacity:.6}
.press{transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .2s}
.press:active{transform:scale(.93)}

/* top */
.top{padding:12px 16px 4px}
.title{font-size:32px;font-weight:700;letter-spacing:-.5px;padding:8px 8px 12px;display:flex;justify-content:space-between;align-items:center}
.icon-btn{width:48px;height:48px;border-radius:24px;display:grid;place-items:center}
.icon-btn:active{background:var(--surf4)}
.search{height:56px;border-radius:28px;background:var(--surf3);display:flex;align-items:center;gap:12px;padding:0 20px;color:var(--onv)}
.search input{flex:1;border:0;background:none;outline:0;font:inherit;font-size:16px;color:var(--on);user-select:text;min-width:0}
.chips{display:flex;gap:8px;padding:12px 16px 8px;overflow-x:auto;scrollbar-width:none}
.chip{height:36px;padding:0 18px;border-radius:12px;border:1px solid var(--out);font-size:14px;font-weight:500;white-space:nowrap;transition:all .3s cubic-bezier(.2,0,0,1)}
.chip.on{background:var(--sc);color:var(--onsc);border-color:transparent;border-radius:18px}

/* list */
.rows{flex:1;overflow-y:auto;padding:4px 8px 120px}
.row{display:flex;gap:14px;align-items:center;padding:12px 12px;border-radius:28px;width:100%;text-align:left}
.row:active{background:var(--surf3)}
.av{width:56px;height:56px;display:grid;place-items:center;font-weight:700;font-size:22px;flex:none;color:#fff;
  clip-path:circle(50%)}
.av.sq{border-radius:20px;clip-path:none}
.mid{flex:1;min-width:0}
.nm{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ls{font-size:14px;color:var(--onv);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12px;color:var(--onv)}
.badge{min-width:24px;height:24px;padding:0 8px;border-radius:12px;background:var(--p);color:var(--onp);font-size:12px;font-weight:700;display:grid;place-items:center}
.empty{padding:60px 24px;text-align:center;color:var(--onv)}

/* fab */
.fab{position:absolute;right:20px;bottom:calc(96px + var(--safe-b));height:64px;padding:0 24px 0 20px;border-radius:22px;
  background:var(--pc);color:var(--onpc);display:flex;align-items:center;gap:12px;font-weight:600;font-size:16px;
  box-shadow:0 4px 14px rgba(0,0,0,.18)}
.fab svg{width:28px;height:28px}

/* nav */
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--surf2);padding:12px 8px calc(16px + var(--safe-b))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--onv);position:relative}
.nav .pill{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;transition:all .35s cubic-bezier(.3,1.4,.5,1)}
.nav button.on{color:var(--on);font-weight:700}
.nav button.on .pill{background:var(--sc);width:72px}
.nav .dot{position:absolute;top:-2px;left:calc(50% + 10px);min-width:18px;height:18px;border-radius:9px;background:#ba1a1a;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* chat */
.chead{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 4px;background:var(--surf2);border-radius:0 0 28px 28px}
.chead .av{width:44px;height:44px;font-size:18px}
.chead .nm{font-size:18px}
.chead .ls{font-size:13px;margin:0}
.msgs{flex:1;overflow-y:auto;padding:16px 12px 8px;display:flex;flex-direction:column;gap:3px}
.day{align-self:center;background:var(--surf3);color:var(--onv);font-size:12px;font-weight:500;padding:6px 14px;border-radius:12px;margin:6px 0 10px}
.b{max-width:80%;padding:10px 14px 8px;font-size:16px;line-height:1.35;user-select:text;-webkit-user-select:text;
  animation:pop .4s cubic-bezier(.3,1.5,.5,1) both;word-break:break-word}
.b.in{align-self:flex-start;background:var(--surf4);border-radius:22px 22px 22px 6px;transform-origin:left bottom}
.b.out{align-self:flex-end;background:var(--pc);color:var(--onpc);border-radius:22px 22px 6px 22px;transform-origin:right bottom}
.b .t{font-size:11px;opacity:.7;float:right;margin:6px 0 0 12px;display:flex;gap:3px;align-items:center}
.b .t svg{width:14px;height:14px}
.who{font-size:13px;font-weight:700;color:var(--p);margin-bottom:2px}
.typing{align-self:flex-start;background:var(--surf4);border-radius:22px 22px 22px 6px;padding:14px 16px;display:flex;gap:5px}
.typing i{width:8px;height:8px;border-radius:4px;background:var(--onv);animation:bounce 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:none}30%{transform:translateY(-6px)}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.bar{display:flex;gap:8px;align-items:flex-end;padding:8px 12px calc(12px + var(--safe-b))}
.field{flex:1;min-height:56px;border-radius:28px;background:var(--surf3);display:flex;align-items:center;padding:0 8px 0 18px;gap:6px;color:var(--onv)}
.field textarea{flex:1;border:0;background:none;outline:0;font:inherit;font-size:16px;color:var(--on);resize:none;height:24px;max-height:96px;user-select:text;padding:0}
.send{width:56px;height:56px;background:var(--p);color:var(--onp);display:grid;place-items:center;
  border-radius:28px;transition:border-radius .4s cubic-bezier(.3,1.5,.5,1),transform .2s}
.send.has{border-radius:18px}
.send:active{transform:scale(.9)}
.send .ic-send{display:none}.send.has .ic-send{display:block}.send.has .ic-mic{display:none}
.toast{position:absolute;left:16px;right:16px;bottom:calc(100px + var(--safe-b));background:var(--on);color:var(--bg);padding:14px 20px;border-radius:16px;font-size:14px;opacity:0;transform:translateY(20px);transition:all .3s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:none}
.nav{z-index:3}.msgs{touch-action:manipulation}.b{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pin{width:14px;height:14px}
.rx{display:inline-block;clear:both;margin-top:4px;padding:2px 8px;border-radius:12px;background:var(--surf);font-size:14px;animation:pop .35s cubic-bezier(.3,1.8,.5,1) both}
.picker{position:absolute;z-index:30;display:flex;gap:2px;padding:6px;border-radius:30px;background:var(--surf4);box-shadow:0 6px 20px rgba(0,0,0,.25);animation:pop .3s cubic-bezier(.3,1.5,.5,1) both}
.picker button{width:44px;height:44px;border-radius:22px;font-size:24px;transition:transform .15s}.picker button:active{transform:scale(1.35)}
.vm{display:flex;align-items:center;gap:10px;min-width:190px}
.play{width:40px;height:40px;border-radius:20px;background:var(--p);color:var(--onp);display:grid;place-items:center}
.wave{display:flex;gap:2px;align-items:center;height:28px;flex:1}.wave i{width:3px;border-radius:2px;background:currentColor;opacity:.35;transition:opacity .2s}.wave i.f{opacity:1}
.recbar{display:none;flex:1;align-items:center;gap:10px;font-weight:600;color:var(--on)}
.rd{width:10px;height:10px;border-radius:5px;background:#ba1a1a;animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}
.rcx{margin-left:auto;padding:8px 14px;border-radius:16px;color:var(--p);font-weight:600}
.prof{position:absolute;inset:0;z-index:2;background:var(--bg);padding:calc(var(--safe-t) + 24px) 20px 120px;overflow-y:auto;opacity:0;transform:translateY(24px);pointer-events:none;transition:all .35s cubic-bezier(.2,0,0,1)}
.prof.show{opacity:1;transform:none;pointer-events:auto}
.pav{width:112px;height:112px;margin:8px auto 16px;background:var(--tc);color:var(--ontc);display:grid;place-items:center;font-size:48px;font-weight:900;border-radius:36px;animation:morph 6s ease-in-out infinite}
@keyframes morph{50%{border-radius:50%}}
.pn{text-align:center;font-size:28px;font-weight:700}.pu{text-align:center;color:var(--onv);margin:4px 0 20px}
.pst{display:flex;gap:8px;margin-bottom:20px}.pst div{flex:1;background:var(--surf3);border-radius:20px;padding:14px;text-align:center;font-size:13px;color:var(--onv)}.pst div:nth-child(2){border-radius:28px;background:var(--sc)}.pst b{display:block;font-size:24px;color:var(--on)}
.set{width:100%;display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-radius:20px;background:var(--surf2);margin-bottom:4px;font-size:16px;font-weight:500;text-align:left}
.sw{width:52px;height:32px;border-radius:16px;border:2px solid var(--out);background:var(--surf3);position:relative;transition:all .3s}
.sw i{position:absolute;top:6px;left:6px;width:16px;height:16px;border-radius:8px;background:var(--out);transition:all .3s cubic-bezier(.3,1.5,.5,1)}
.sw.on{background:var(--p);border-color:var(--p)}.sw.on i{left:22px;top:2px;width:24px;height:24px;border-radius:12px;background:var(--onp)}
.auth{position:absolute;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(var(--safe-t) + 24px) 24px 24px;overflow-y:auto}
.auth[hidden],.tf[hidden],.pick[hidden]{display:none}
.card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px}
.card h1{font-size:32px;font-weight:700;margin-bottom:4px}
.logo{width:72px;height:72px;border-radius:24px;background:var(--pc);display:grid;place-items:center;font-size:36px;animation:morph 6s ease-in-out infinite}
.tf{height:56px;border-radius:16px 16px 4px 4px;background:var(--surf3);display:flex;align-items:center;gap:6px;padding:0 18px;color:var(--onv);border-bottom:2px solid var(--out)}
.tf:focus-within{border-color:var(--p)}
.tf input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--on);user-select:text}
.btn{height:56px;border-radius:28px;background:var(--p);color:var(--onp);font-weight:700;font-size:16px}
.txt{height:44px;color:var(--p);font-weight:600}
.err{color:#ba1a1a;font-size:14px;min-height:18px}
.pick{align-self:center;width:96px;height:96px;border-radius:32px;background:var(--sc) center/cover;color:var(--onsc);font-size:13px;font-weight:600}
.mav{display:inline-block;width:20px;height:20px;border-radius:10px;background-size:cover;background-position:center;margin-right:6px;vertical-align:middle}
.who small{opacity:.7;font-weight:500}
.pav{background-size:cover;background-position:center;cursor:pointer}
.set small{display:block;font-size:13px;color:var(--onv);font-weight:400;margin-top:2px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chead .mid{cursor:pointer}
.rq{border-left:3px solid var(--p);padding:2px 8px;margin-bottom:6px;font-size:13px;border-radius:4px;background:rgba(127,127,127,.14);max-height:3.4em;overflow:hidden}.rq b{display:block}
.picker{flex-wrap:wrap;max-width:300px}.picker .acts{display:flex;width:100%;gap:2px;border-top:1px solid var(--out);margin-top:4px;padding-top:4px}
.picker .acts button{flex:1;width:auto;height:auto;font-size:13px;font-weight:600;padding:9px 4px;border-radius:14px}
.rbar{display:flex;align-items:center;gap:8px;margin:0 12px;padding:8px 8px 8px 12px;border-left:3px solid var(--p);background:var(--surf3);border-radius:12px;font-size:13px}
.rbar[hidden]{display:none}.rbar>div{flex:1;min-width:0}.rbar b{display:block;color:var(--p)}
.rbar span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--onv)}.rbar button{width:32px;height:32px;border-radius:16px}
.b a{color:inherit;text-decoration:underline}
.auth.call{z-index:60}.cbtns{display:flex;gap:28px;margin-top:48px}
.cb{width:72px;height:72px;border-radius:50%;font-size:30px;display:grid;place-items:center;background:var(--surf4);color:var(--on)}
.cb[hidden]{display:none}.cb.ok{background:#2e7d32;color:#fff}.cb.end{background:#ba1a1a;color:#fff}.cb.muted{background:var(--p)}
.ph{font-size:32px;font-weight:700;letter-spacing:-.5px;padding:8px 8px 16px}
.prof .row{padding:10px 4px;cursor:pointer}.ls.miss{color:#ba1a1a}
.cl{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;font-size:20px;background:var(--sc);flex:none}
.pic{display:block;max-width:100%;width:240px;border-radius:14px;margin:-2px 0 6px;cursor:pointer;background:var(--surf3)}
.fl{display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:6px}
.fi{width:44px;height:44px;border-radius:14px;background:var(--p);color:var(--onp);display:grid;place-items:center;font-size:20px;flex:none}
.fm b{display:block;font-size:14px;word-break:break-all}.fm small{opacity:.7}
.att{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;flex:none}
[hidden]{display:none!important}
.msgs.na .b{animation:none}#mb{cursor:pointer;border:0}
.col{display:flex;flex-direction:column;gap:8px}

/* ===== настройки / динамические цвета ===== */
.navav{width:28px;height:28px;border-radius:50%;background:var(--tc) center/cover;color:var(--ontc);display:grid;place-items:center;font-size:13px;font-weight:800;transition:box-shadow .3s}
.nav button.on .navav{box-shadow:0 0 0 2px var(--p)}
.b{font-size:calc(16px*var(--fs,1))}
.field textarea{font-size:calc(16px*var(--fs,1))}
html.noanim *{animation:none!important;transition:none!important}
html.cmp .row{padding:6px 12px}html.cmp .row .av{width:44px;height:44px;font-size:18px}
#pset{z-index:2}
.shd{display:flex;align-items:center;gap:8px;margin:0 0 8px -8px}.shd .ph{padding:0}
.sh2{font-size:14px;font-weight:700;color:var(--p);padding:20px 8px 8px}
.seg{display:flex;gap:4px;background:var(--surf3);border-radius:22px;padding:4px;margin-bottom:4px}
.seg button{flex:1;height:40px;border-radius:18px;font-size:14px;font-weight:500;color:var(--onv);transition:all .25s}
.seg button.on{background:var(--p);color:var(--onp);font-weight:700}
.swg{display:flex;flex-wrap:wrap;gap:12px;padding:14px 8px 6px}
.swc{width:48px;height:48px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;font-size:20px;font-weight:700;position:relative;background-size:cover;background-position:center;transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .2s}
.swc.on{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--p);transform:scale(.92)}
.swc input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.pvw{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:24px;background:var(--bg);border:1px solid var(--out);margin:8px 0}
.pvw .b{animation:none}
.set small.wr{white-space:normal;max-width:none}
.dis{opacity:.45;pointer-events:none}
.msgs{background:var(--wp,none)}
.b.out{background:var(--ob,var(--pc));color:var(--oon,var(--onpc))}
.pbd{display:inline-block;font-size:.8em;margin-left:4px}
.pbd.star{background:linear-gradient(135deg,#6a5cff,#ff6a9e);-webkit-background-clip:text;background-clip:text;color:transparent}
.phero{text-align:center;padding:12px 0 8px}.pstar{width:96px;height:96px;margin:0 auto 12px;border-radius:32px;display:grid;place-items:center;font-size:52px;color:#fff;background:linear-gradient(135deg,#6a5cff,#c24bff 55%,#ff6a9e);animation:morph 6s ease-in-out infinite}
.phero h2{font-size:28px}.phero p{color:var(--onv);margin-top:4px}
.pf{display:flex;gap:14px;align-items:center;padding:10px 8px}.pf>span{width:44px;height:44px;border-radius:14px;background:var(--sc);display:grid;place-items:center;font-size:22px;flex:none}.pf b{display:block}.pf small{color:var(--onv)}
.pav.prem{box-shadow:0 0 0 4px var(--bg),0 0 0 8px #c24bff;animation:morph 6s ease-in-out infinite,ring 3s linear infinite}
@keyframes ring{0%,100%{box-shadow:0 0 0 4px var(--bg),0 0 0 8px #6a5cff}50%{box-shadow:0 0 0 4px var(--bg),0 0 0 8px #ff6a9e}}
#ppr{z-index:2}
#emb{margin-left:-10px}
.emo{display:none;flex-direction:column;height:300px;background:var(--surf2);border-radius:28px 28px 0 0;padding-bottom:var(--safe-b)}
.emo.show{display:flex}
.eb{flex:1;overflow-y:auto;position:relative;padding:4px 8px 160px;scrollbar-width:none}
.eb h4{font-size:13px;font-weight:700;color:var(--onv);padding:12px 6px 4px}
.eg{display:grid;grid-template-columns:repeat(8,1fr)}
.eg button{height:42px;font-size:27px;line-height:1;border-radius:12px;font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
.eg button:active{background:var(--surf4);transform:scale(1.25)}
.eg i{grid-column:1/-1;font-style:normal;color:var(--onv);font-size:13px;padding:6px}
.et{display:flex;align-items:center;border-top:1px solid var(--out);padding:4px 4px}
.etabs{flex:1;display:flex;overflow-x:auto;scrollbar-width:none}
.etabs button{flex:none;width:44px;height:40px;font-size:22px;border-radius:14px;opacity:.55;transition:all .2s}
.etabs button.on{opacity:1;background:var(--sc)}
#ebs{width:44px;height:40px;font-size:20px;border-radius:14px;flex:none}
.b.big{background:none!important;font-size:calc(56px*var(--fs,1));line-height:1.15;padding:0 4px}
.em{display:inline-block;width:1.25em;height:1.25em;vertical-align:-.28em;-webkit-user-drag:none;pointer-events:none}
.eg .em{width:31px;height:31px;vertical-align:middle}
.eg button{display:grid;place-items:center}
.b.big .em{width:1.1em;height:1.1em;vertical-align:-.15em}

.row .chk,#cnm .chk{pointer-events:none}
.phd{position:relative;margin:-24px -20px 16px;padding:calc(var(--safe-t) + 24px) 20px 18px;border-radius:0 0 32px 32px;overflow:hidden}
.phd>*{position:relative}.phd.col,.phd.col .pn,.phd.col .pu{color:var(--profile-text,#fff)}
.pat{position:absolute!important;inset:0;pointer-events:none;overflow:hidden}
.pat span{position:absolute;width:26px;height:26px;opacity:.25;transform:translate(-50%,-50%)}.pat .em{width:100%;height:100%;vertical-align:top}
.pick.ringed{animation:ring 3s linear infinite}
.phd.col .pav.prem,.col .ringed{animation:none;box-shadow:0 0 0 4px rgba(255,255,255,.25),0 0 0 7px rgba(255,255,255,.85)}


#pcs{z-index:2}

/* ===== стиль профиля: цвета / градиенты / паттерны ===== */
.pat{background-size:44px 44px;background-position:center}
.swg.ps-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:12px 4px;justify-items:center;padding:10px 0 6px}
.ps-grid .swc{width:100%;max-width:44px;height:auto;aspect-ratio:1}
.swc.ps.solid{background:var(--a)}
.swc.ps.grad,.swc.ps.pat{background:linear-gradient(135deg,var(--a) 50%,var(--b) 50%)}
.swc.ps.pat::after{content:"";position:absolute;left:29%;top:29%;width:42%;height:42%;background:#fff;border-radius:4px;transform:rotate(45deg);pointer-events:none}
.phint{padding:8px 8px 0;color:var(--onv);font-size:14px}
.rq{position:relative;border-left:0;padding:4px 8px 4px 12px;overflow:hidden;border-radius:6px 10px 10px 6px;
  background-color:var(--reply-bg,rgba(127,127,127,.14));background-image:var(--reply-pat,none);background-size:44px 44px}
.rq:not(.lpv){max-height:3.4em}
.rq::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--reply-bar,var(--p))}
.rq b{color:var(--reply-border,var(--p))}
.rq.lpv{clear:both;margin:6px 0 2px;font-size:13px;word-break:break-all}

/* ===== профиль как в Telegram ===== */
#phd{text-align:center;padding-bottom:16px}
#phd:not(.col){background:var(--pc);color:var(--onpc)}
#phd .pav{width:104px;height:104px;margin:4px auto 14px;border-radius:50%;animation:none;font-size:44px}
#phd .pav.prem{animation:ring 3s linear infinite}
#phd.col .pav.prem{animation:none}
#phd .pn{font-size:26px;font-weight:700;line-height:1.2;color:inherit}
.pstat{font-size:15px;opacity:.8;margin:2px 0 18px}
.pacts{display:flex;gap:8px}
.pa{flex:1;height:72px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font-size:13px;font-weight:600;color:inherit;background:rgba(127,127,127,.22);background:color-mix(in srgb,currentColor 14%,transparent)}
.pa svg{width:24px;height:24px}
.pcard{background:var(--surf2);border-radius:28px;padding:6px 0;margin-bottom:12px}
.pi2{display:block;width:100%;text-align:left;padding:12px 22px}
.pi2 b{display:block;font-size:17px;font-weight:500;word-break:break-all}
.pi2 small{display:block;font-size:14px;color:var(--onv);margin-top:2px}
.pi2:active{background:var(--surf3)}
#prof .pst{background:var(--surf2);border-radius:28px;padding:6px;gap:4px;margin-bottom:12px}
#prof .pst div,#prof .pst div:nth-child(2){background:none;border-radius:22px;padding:10px 4px;display:flex;gap:6px;justify-content:center;align-items:baseline;font-size:14px}
#prof .pst div:first-child{background:var(--sc);color:var(--onsc)}
#prof .pst b{display:inline;font-size:16px}

/* ===== профиль собеседника (как в референсе) ===== */
#pi{--upg:var(--surf2);--upc:var(--bg);align-items:flex-start;justify-content:center;padding:0;background:var(--upg);z-index:52}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #pi{--upg:var(--bg);--upc:var(--surf2)}}
:root[data-theme="dark"] #pi{--upg:var(--bg);--upc:var(--surf2)}
#sh{z-index:60!important}
svg.ln{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.upf{width:100%;max-width:520px;min-height:100%;padding-bottom:calc(var(--safe-b) + 28px)}
.uph{position:relative;overflow:hidden;padding:calc(var(--safe-t) + 56px) 16px 18px;text-align:center;border-radius:0 0 32px 32px;margin-bottom:14px}
.uph>*{position:relative}
.uph.col,.uph.col .upn,.uph.col .ups{color:var(--profile-text,#fff)}.uph.col .ups{opacity:.85}
.upbar{position:absolute!important;left:12px;right:12px;top:calc(var(--safe-t) + 10px);display:flex;justify-content:space-between;z-index:2}
.upc{width:48px;height:48px;border-radius:24px;background:var(--upc);color:var(--on)!important;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.upav{width:152px;height:152px;margin:0 auto 14px;display:grid;place-items:center;font-size:58px;font-weight:900;color:var(--onsc);background:var(--sc) center/cover no-repeat;

.upavw{width:152px;height:152px;margin:0 auto 14px}.upavw .upav{margin:0}
@keyframes ringf{0%,100%{filter:drop-shadow(0 0 2px #6a5cff) drop-shadow(0 0 7px #6a5cff)}50%{filter:drop-shadow(0 0 2px #ff6a9e) drop-shadow(0 0 7px #ff6a9e)}}
.upavw.prem{animation:ringf 3s linear infinite}
.uph.col .upavw.prem{animation:none;filter:drop-shadow(0 0 2px rgba(255,255,255,.95)) drop-shadow(0 0 7px rgba(255,255,255,.6))}
.est{display:inline-flex;width:1.05em;height:1.05em;margin-left:6px;vertical-align:-.15em}.est .em,.est .tge{width:100%;height:100%}
.upn{font-size:28px;font-weight:700;line-height:1.2;display:flex;justify-content:center;align-items:center;word-break:break-word}
.ups{font-size:17px;color:var(--onv);margin-top:4px;min-height:22px}

.upa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 12px;margin-bottom:12px}
.upb{background:var(--upc);border-radius:22px;height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:600;color:var(--on)}

.upcard{display:flex;align-items:center;justify-content:space-between;width:calc(100% - 24px);margin:0 12px 12px;padding:16px 22px;border-radius:28px;background:var(--upc);text-align:left;color:var(--on)}
.upcard b{display:block;font-size:20px;font-weight:500;word-break:break-all}.upcard small{display:block;font-size:15px;color:var(--onv);margin-top:3px}
.upcard svg{width:30px;height:30px}
