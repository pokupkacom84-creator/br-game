<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Telegram You</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
:root{--fs:16px;--rad:20px;--avl:85;--avt:25;
--p:#4a5bd0;--onp:#fff;--pc:#dde1ff;--onpc:#00105c;--sc:#e1e0f9;--onsc:#191a2c;--tc:#ffd8ec;--ontc:#2e1126;
--s:#fbf8ff;--s1:#f5f2fa;--s2:#efedf4;--s3:#eae7ef;--s4:#e4e1e9;--os:#1b1b1f;--osv:#46464f;--ol:#777680;--olv:#c7c5d0}
body{font-family:Roboto,"Google Sans",system-ui,-apple-system,sans-serif;background:var(--s);color:var(--os);font-size:var(--fs);-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;border:0;outline:0;background:none;-webkit-user-select:text;user-select:text}
svg{display:block;flex-shrink:0}
#app{position:fixed;left:0;top:0;right:0;bottom:0;overflow:hidden}
.screen{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;background:var(--s);transition:transform .32s cubic-bezier(.2,0,0,1),opacity .32s}
#chat{transform:translateX(100%);z-index:5}
#chat.open{transform:none}
#main.back{transform:translateX(-18%);opacity:.6}
/* top app bar */
.bar{display:flex;align-items:center;gap:4px;min-height:64px;padding:8px 8px 8px 4px;padding-top:calc(8px + env(safe-area-inset-top))}
.ib{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--osv);transition:background .15s}
.ib:active{background:var(--s4)}
.bar h1{font-size:22px;font-weight:500;flex:1;padding-left:8px}
.searchpill{flex:1;display:flex;align-items:center;gap:8px;height:48px;border-radius:28px;background:var(--s3);padding:0 8px 0 16px;margin:0 4px 0 8px;color:var(--osv)}
.searchpill input{flex:1;font-size:16px;min-width:0}
.searchpill .ph{flex:1;opacity:.8}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--ol);font-size:14px;font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:6px;color:var(--osv)}
.chip.on{background:var(--sc);border-color:transparent;color:var(--onsc)}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
/* list */
.ci{display:flex;gap:14px;align-items:center;padding:10px 16px;margin:0 8px;border-radius:20px;transition:background .15s}
.ci:active{background:var(--s2)}
.ci.sel{background:var(--pc)}
.av{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:19px;flex-shrink:0;background:hsl(var(--h),50%,calc(var(--avl)*1%));color:hsl(var(--h),50%,calc(var(--avt)*1%));position:relative}
.av.sm{width:40px;height:40px;font-size:15px}
.av.lg{width:72px;height:72px;font-size:26px}
.av.sv{background:var(--p);color:var(--onp)}
.av .on{position:absolute;right:0;bottom:0;width:14px;height:14px;border-radius:50%;background:#2fb457;border:2.5px solid var(--s)}
.av .ck{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--p);color:var(--onp);display:flex;align-items:center;justify-content:center;border:2px solid var(--pc)}
.cm{flex:1;min-width:0}
.r1,.r2{display:flex;align-items:center;gap:8px}
.r1 b{flex:1;font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{font-size:12px;color:var(--osv)}
.r2{margin-top:2px}
.pv{flex:1;color:var(--osv);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv i{font-style:normal;color:var(--p)}
.bd{min-width:22px;height:22px;border-radius:11px;background:var(--p);color:var(--onp);font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;padding:0 7px}
.bd.mu{background:var(--ol);color:var(--s)}
.mi{color:var(--osv);display:flex}
.empty{text-align:center;padding:64px 32px;color:var(--osv)}
.empty .big{width:96px;height:96px;border-radius:50%;background:var(--pc);color:var(--onpc);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.sec{padding:16px 24px 8px;font-size:14px;font-weight:500;color:var(--p)}
/* nav bar */
.nav{display:flex;background:var(--s2);padding:12px 8px 16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.nv{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--osv)}
.nv .pill{width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;transition:background .25s}
.nv.on{color:var(--os)}
.nv.on .pill{background:var(--sc);color:var(--onsc)}
.nv .pill{position:relative}
.nv .nb{position:absolute;top:0;right:12px;background:#d93025;color:#fff;border-radius:8px;font-size:10px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.fab{position:absolute;right:16px;bottom:calc(104px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;background:var(--pc);color:var(--onpc);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.22);transition:transform .2s}
.fab:active{transform:scale(.92)}
/* settings */
.card{margin:8px 16px;padding:16px;border-radius:28px;background:var(--s2)}
.prof{display:flex;gap:16px;align-items:center;padding:20px 16px;margin:8px 16px;border-radius:28px;background:var(--pc);color:var(--onpc)}
.prof b{font-size:20px;font-weight:500;display:block}
.prof span{font-size:14px;opacity:.8}
.row{display:flex;align-items:center;gap:16px;padding:12px 8px;border-radius:16px}
.row .t{flex:1}
.row .t small{display:block;color:var(--osv);font-size:13px;margin-top:2px}
.row .ico{width:40px;height:40px;border-radius:50%;background:var(--sc);color:var(--onsc);display:flex;align-items:center;justify-content:center}
.seg{display:flex;border:1px solid var(--ol);border-radius:20px;overflow:hidden;margin:8px 0}
.seg button{flex:1;height:40px;font-size:14px;font-weight:500;color:var(--osv);border-right:1px solid var(--ol)}
.seg button:last-child{border:0}
.seg button.on{background:var(--sc);color:var(--onsc)}
.sw{width:52px;height:32px;border-radius:16px;border:2px solid var(--ol);background:var(--s4);position:relative;transition:all .2s;flex-shrink:0}
.sw::after{content:"";position:absolute;left:6px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--ol);transition:all .2s}
.sw.on{background:var(--p);border-color:var(--p)}
.sw.on::after{left:24px;top:2px;width:24px;height:24px;top:2px;background:var(--onp);transform:none}
.sw.on::after{top:2px;left:22px}
.swatches{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0 4px}
.swatch{width:44px;height:44px;border-radius:50%;border:3px solid transparent;display:flex;align-items:center;justify-content:center;color:#fff}
.swatch.on{border-color:var(--os)}
input[type=range]{-webkit-appearance:none;width:100%;height:16px;border-radius:8px;background:var(--s4);margin:12px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:36px;border-radius:4px;background:var(--p)}
.hue{background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)!important}
/* chat */
.chbar{background:var(--s);padding-left:0}
.chbar .who{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
.chbar .nm{font-weight:500;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chbar .st{font-size:13px;color:var(--osv)}
.chbar .st.ty{color:var(--p)}
.msgs{flex:1;overflow-y:auto;padding:8px 12px;background:var(--s1);display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.day{align-self:center;background:var(--s3);color:var(--osv);font-size:13px;font-weight:500;padding:4px 12px;border-radius:12px;margin:10px 0}
.m{max-width:82%;margin:2px 0;padding:8px 12px 6px;border-radius:var(--rad);position:relative;word-wrap:break-word;overflow-wrap:break-word;line-height:1.3;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.m.in{align-self:flex-start;background:var(--s4);border-bottom-left-radius:6px}
.m.out{align-self:flex-end;background:var(--pc);color:var(--onpc);border-bottom-right-radius:6px}
.m.sel{outline:2px solid var(--p)}
.m .fr{font-size:13px;font-weight:500;color:var(--p);margin-bottom:2px}
.m .mt{float:right;margin:6px 0 0 10px;font-size:11px;opacity:.7;display:flex;gap:3px;align-items:center;height:14px}
.m .tx::after{content:"";display:block;clear:both}
.q{border-left:3px solid var(--p);background:rgba(127,127,127,.14);border-radius:4px 10px 10px 4px;padding:4px 8px;margin-bottom:6px;font-size:13px;overflow:hidden}
.q b{display:block;color:var(--p);font-weight:500}
.q span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.vc{display:flex;align-items:center;gap:10px;min-width:210px;padding:2px 0 4px}
.pb{width:40px;height:40px;border-radius:50%;background:var(--p);color:var(--onp);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wv{flex:1;position:relative;height:28px;display:flex;align-items:center;gap:2px}
.wv i{flex:1;background:currentColor;opacity:.35;border-radius:2px;min-width:2px}
.wv .pg{position:absolute;left:0;top:0;bottom:0;width:0;overflow:hidden;display:flex;align-items:center;gap:2px}
.wv .pg i{opacity:1;color:var(--p);background:var(--p);flex:none}
.vd{font-size:12px;opacity:.7;margin-top:2px}
.chn{background:var(--s2);text-align:center;padding:16px;color:var(--p);font-weight:500;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.comp{background:var(--s1);padding:8px 8px 10px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.replybar{display:none;align-items:center;gap:10px;background:var(--s3);border-radius:20px 20px 6px 6px;padding:8px 8px 8px 16px;margin-bottom:4px;border-left:4px solid var(--p)}
.replybar.show{display:flex}
.replybar .q2{flex:1;min-width:0;font-size:13px}
.replybar b{display:block;color:var(--p);font-weight:500}
.replybar span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--osv)}
.crow{display:flex;gap:8px;align-items:flex-end}
.inp{flex:1;display:flex;align-items:flex-end;background:var(--s3);border-radius:26px;min-height:52px;padding:0 4px}
.inp textarea{flex:1;resize:none;max-height:120px;padding:14px 4px;line-height:1.25;min-width:0;font-size:16px;height:52px}
.inp .ib{width:44px;height:48px}
.sb{width:52px;height:52px;border-radius:50%;background:var(--p);color:var(--onp);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s}
.sb:active{transform:scale(.9)}
.recbar{display:none;flex:1;align-items:center;gap:10px;background:var(--s3);border-radius:26px;height:52px;padding:0 8px 0 18px}
.recbar .dot{width:12px;height:12px;border-radius:50%;background:#d93025;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.recbar .rt{flex:1;font-weight:500}
.rec .inp{display:none}.rec .recbar{display:flex}
.emo{display:none;grid-template-columns:repeat(8,1fr);gap:2px;max-height:210px;overflow-y:auto;padding:8px 0 0}
.emo.show{display:grid}
.emo button{font-size:26px;height:44px;border-radius:12px}
.emo button:active{background:var(--s4)}
.typing{display:inline-flex;gap:3px}.typing i{width:5px;height:5px;border-radius:50%;background:var(--p);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
/* overlays */
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#scrim.show{opacity:1;pointer-events:auto}
#drawer{position:absolute;left:0;top:0;bottom:0;width:82%;max-width:340px;background:var(--s1);border-radius:0 28px 28px 0;transform:translateX(-105%);transition:transform .3s cubic-bezier(.2,0,0,1);z-index:30;padding:calc(20px + env(safe-area-inset-top)) 12px 16px;display:flex;flex-direction:column;overflow-y:auto}
#drawer.show{transform:none}
.dh{padding:8px 16px 16px}
.dh b{display:block;font-size:20px;font-weight:500;margin-top:12px}
.dh span{color:var(--osv);font-size:14px}
.di{display:flex;gap:14px;align-items:center;height:56px;padding:0 16px;border-radius:28px;font-weight:500;color:var(--osv)}
.di:active{background:var(--sc)}
.di.on{background:var(--sc);color:var(--onsc)}
.dv{height:1px;background:var(--olv);margin:8px 16px}
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--s1);border-radius:28px 28px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,0,0,1);z-index:30;padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
#sheet.show{transform:none}
#sheet .grab{width:32px;height:4px;border-radius:2px;background:var(--ol);opacity:.5;margin:0 auto 12px}
.si{display:flex;gap:16px;align-items:center;height:52px;padding:0 12px;border-radius:16px;font-size:16px}
.si:active{background:var(--s3)}
.atg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 0 4px;text-align:center;font-size:13px}
.atg .a{display:flex;flex-direction:column;align-items:center;gap:6px}
.atg .a div{width:56px;height:56px;border-radius:20px;background:var(--sc);color:var(--onsc);display:flex;align-items:center;justify-content:center}
#dlg{position:absolute;left:24px;right:24px;top:50%;background:var(--s1);border-radius:28px;padding:24px;z-index:40;transform:translateY(-50%) scale(.85);opacity:0;pointer-events:none;transition:all .2s}
#dlg.show{transform:translateY(-50%) scale(1);opacity:1;pointer-events:auto}
#dlg h3{font-size:24px;font-weight:400;margin-bottom:12px}
#dlg p{color:var(--osv);margin-bottom:8px;line-height:1.4}
#dlg .field{border:1px solid var(--ol);border-radius:8px;padding:0 16px;height:56px;margin:12px 0 4px;display:flex;align-items:center}
#dlg .field input{flex:1;font-size:16px}
#dlg .ac{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.tb{height:40px;padding:0 16px;border-radius:20px;color:var(--p);font-weight:500;font-size:14px}
.tb:active{background:var(--sc)}
.tb.f{background:var(--p);color:var(--onp);padding:0 24px}
#snack{position:absolute;left:16px;right:16px;bottom:calc(24px + env(safe-area-inset-bottom));background:var(--os);color:var(--s);border-radius:8px;padding:14px 16px;z-index:50;transform:translateY(200%);transition:transform .3s;font-size:14px}
#snack.show{transform:none}
#login{z-index:60;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.auth{width:100%;max-width:380px;text-align:center}
.auth .big{width:96px;height:96px;border-radius:50%;background:var(--pc);color:var(--onpc);display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.auth h2{font-size:28px;font-weight:500;margin-bottom:8px}
.auth p{color:var(--osv);line-height:1.4;margin-bottom:16px}
.afield{border:1px solid var(--ol);border-radius:12px;height:58px;padding:0 16px;display:flex;align-items:center;margin-bottom:16px}
.afield:focus-within{border:2px solid var(--p);padding:0 15px}
.afield input{flex:1;font-size:18px;min-width:0}
.aw{width:100%;height:52px;border-radius:26px;font-size:16px}
.aw:disabled{opacity:.6}
.aerr{color:#d93025;font-size:14px;margin-top:14px;min-height:20px}
.alink{margin-top:8px}
.pic{display:block;max-width:100%;max-height:320px;border-radius:12px;margin-bottom:4px}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>
<div id="app">
  <section id="main" class="screen">
    <div id="hdr"></div>
    <div id="chips"></div>
    <div class="body" id="body"></div>
    <button class="fab" id="fab" onclick="newChatDlg()"></button>
    <div class="nav" id="nav"></div>
  </section>

  <section id="chat" class="screen">
    <div class="bar chbar" id="chdr"></div>
    <div class="msgs" id="msgs"></div>
    <div class="comp" id="comp">
      <div class="replybar" id="replybar"></div>
      <div class="crow">
        <div class="inp">
          <button class="ib" onclick="toggleEmo()" id="emoBtn"></button>
          <textarea id="ta" rows="1" placeholder="Сообщение"></textarea>
          <button class="ib" onclick="attachSheet()" id="attBtn"></button>
        </div>
        <div class="recbar"><span class="dot"></span><span class="rt" id="rt">0:00</span><button class="tb" onclick="cancelRec()">Отмена</button></div>
        <button class="sb" id="sb" onclick="sbClick()"></button>
      </div>
      <div class="emo" id="emo"></div>
    </div>
    <div class="chn" id="chn" style="display:none"></div>
  </section>

  <div id="scrim" onclick="closeAll()"></div>
  <aside id="drawer"></aside>
  <div id="sheet"></div>
  <div id="dlg"></div>
  <div id="snack"></div>
  <section id="login" class="screen" style="display:none"></section>
  <input type="file" id="fi" accept="image/*" style="display:none">
  <div id="rc"></div>
</div>

<script>
/* ---------- icons ---------- */

/* ---------- Material You theme ---------- */
function applyTheme(){
  var dark=S.theme==="dark"||(S.theme==="auto"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
  var h=S.hue,r=document.documentElement.style;
  function H(hh,s,l){return "hsl("+hh+","+s+"%,"+l+"%)"}
  var P=function(t){return H(h,62,t)},Sx=function(t){return H(h,22,t)},Tx=function(t){return H((h+60)%360,38,t)},N=function(t){return H(h,8,t)},V=function(t){return H(h,12,t)};
  var v;
  if(dark)v={p:P(80),onp:P(20),pc:P(30),onpc:P(90),sc:Sx(30),onsc:Sx(90),tc:Tx(30),ontc:Tx(90),s:N(6),s1:N(10),s2:N(12),s3:N(17),s4:N(22),os:N(90),osv:V(80),ol:V(60),olv:V(30),avl:30,avt:90};
  else v={p:P(40),onp:"#fff",pc:P(90),onpc:P(10),sc:Sx(90),onsc:Sx(10),tc:Tx(90),ontc:Tx(10),s:N(98),s1:N(96),s2:N(94),s3:N(92),s4:N(90),os:N(10),osv:V(30),ol:V(50),olv:V(80),avl:85,avt:25};
  for(var k in v)r.setProperty("--"+k,v[k]);
  r.setProperty("--fs",S.tsize+"px");r.setProperty("--rad",S.rad+"px");
}
if(window.matchMedia){try{window.matchMedia("(prefers-color-scheme: dark)").addListener(function(){if(S.theme==="auto")applyTheme()})}catch(e){}}

/* ---------- helpers ---------- */
function pad(n){return n<10?"0"+n:n}
function hm(t){var d=new Date(t);return pad(d.getHours())+":"+pad(d.getMinutes())}
var MON=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"],WD=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
function listTime(t){var d=new Date(t),n=new Date();if(d.toDateString()===n.toDateString())return hm(t);if(n-d<7*DAY)return WD[d.getDay()];return pad(d.getDate())+"."+pad(d.getMonth()+1)}
function dayLabel(t){var d=new Date(t),n=new Date();if(d.toDateString()===n.toDateString())return "Сегодня";if(new Date(n-DAY).toDateString()===d.toDateString())return "Вчера";return d.getDate()+" "+MON[d.getMonth()]}
function initials(n){var p=String(n||"?").trim().split(/\s+/);return ((p[0][0]||"?")+(p[1]?p[1][0]:"")).toUpperCase()}
function avatar(c,cls,extra){
  if(c.type==="saved")return '<div class="av sv '+(cls||"")+'">'+ic("bm",cls==="lg"?36:26)+(extra||"")+'</div>';
  return '<div class="av '+(cls||"")+'" style="--h:'+c.hue+'">'+esc(initials(c.name))+(extra||"")+'</div>';
}
function preview(c){
  var m=last(c);if(!m)return "Нет сообщений";
  var t=m.voice?"🎤 Голосовое сообщение":m.img?"🖼 Фото":esc(m.text||"");
  var pre=m.out?"<i>Вы: </i>":(c.type==="group"&&m.from?"<i>"+esc(m.from)+": </i>":"");
  return pre+t;
}
function statusText(c){
  if(c.typing)return '<span class="typing"><i></i><i></i><i></i></span> печатает…';
  if(c.type==="group")return c.members+" участников";
  if(c.type==="channel")return c.members.toLocaleString("ru")+" подписчиков";
  if(c.type==="bot")return "бот";
  if(c.type==="saved")return "облачное хранилище";
  return c.online?"в сети":"был(а) недавно";
}
function totalUnread(){var n=0;S.chats.forEach(function(c){if(!c.muted)n+=c.unread});return n}

    else h='<div class="bar" style="padding-top:calc(12px + env(safe-area-inset-top))"><button class="ib" onclick="openDrawer()">'+ic("menu")+'</button><div class="searchpill" onclick="toggleSearch()"><span class="ph">Поиск</span>'+ic("search")+'</div></div>';
  }else{
    var T={contacts:"Контакты",calls:"Звонки",settings:"Настройки"}[S.tab];
    h='<div class="bar"><button class="ib" onclick="openDrawer()">'+ic("menu")+'</button><h1>'+T+'</h1></div>';
  }
  $("#hdr").innerHTML=h;
  if(S.searching&&!S.sel.length){var q=$("#sq");if(q&&!q.dataset.f){q.focus();q.dataset.f=1}}
}
function renderChips(){
  var f=[["all","Все"],["user","Личные"],["unread","Непрочитанные"]];
  $("#chips").innerHTML=S.tab==="chats"&&!S.searching?'<div class="chips">'+f.map(function(x){return '<button class="chip'+(S.filter===x[0]?" on":"")+'" onclick="setFilter(\''+x[0]+'\')">'+(S.filter===x[0]?ic("check",16):"")+x[1]+'</button>'}).join("")+'</div>':"";
}
function sorted(){
  var q=S.q.trim().toLowerCase();
  return S.chats.filter(function(c){
    if(q&&c.name.toLowerCase().indexOf(q)<0)return false;
    if(S.filter==="user")return c.type==="user"||c.type==="bot"||c.type==="saved";
    if(S.filter==="group")return c.type==="group";
    if(S.filter==="channel")return c.type==="channel";
    if(S.filter==="unread")return c.unread>0;
    return true;
  }).sort(function(a,b){if(a.pinned!==b.pinned)return a.pinned?-1:1;var x=last(a),y=last(b);return (y?y.t:0)-(x?x.t:0)});
}
function renderList(){
  var l=sorted();
  if(!l.length){$("#body").innerHTML='<div class="empty"><div class="big">'+ic("chat",44)+'</div><b>'+(S.q?"Ничего не найдено":"Чатов пока нет")+'</b><p style="margin-top:6px">'+(S.q?"Попробуйте другой запрос":"Нажмите на кнопку, чтобы начать общение")+'</p></div>';return}
  $("#body").innerHTML='<div style="padding-top:4px"></div>'+l.map(function(c){
    var sel=S.sel.indexOf(c.id)>=0,m=last(c);
    var badge=c.unread?'<span class="bd'+(c.muted?" mu":"")+'">'+c.unread+'</span>':(c.pinned?'<span class="mi">'+ic("pin",18)+'</span>':"");
    var tick=m&&m.out?'<span style="color:var(--p);display:flex">'+ic(m.read?"done":"check",16)+'</span>':"";
    return '<div class="ci'+(sel?" sel":"")+'" data-id="'+c.id+'">'+avatar(c,"",sel?'<span class="ck">'+ic("check",14)+'</span>':(c.online&&c.type==="user"?'<span class="on"></span>':""))+
      '<div class="cm"><div class="r1"><b>'+esc(c.name)+(c.muted?' <span class="mi" style="display:inline-flex;vertical-align:middle">'+ic("mute",14)+'</span>':"")+'</b>'+tick+'<span class="tm">'+(m?listTime(m.t):"")+'</span></div><div class="r2"><span class="pv">'+(c.typing?'<i>печатает…</i>':preview(c))+'</span>'+badge+'</div></div></div>';
  }).join("");
}
function renderContacts(){
  var us=S.chats.filter(function(c){return c.type==="user"}).sort(function(a,b){return a.name.localeCompare(b.name)});

    return '<div class="ci" onclick="openChat(\''+c.id+'\')">'+avatar(c,"")+'<div class="cm"><div class="r1"><b>'+esc(c.name)+'</b></div><div class="r2"><span class="pv">'+(c.online?"в сети":"был(а) недавно")+'</span></div></div></div>'}).join("")+
    '<div class="ci" onclick="newChatDlg()"><div class="av sv">'+ic("add")+'</div><div class="cm"><b>Добавить контакт</b></div></div>';

var recT=null,recS=0,recDur=0,mr=null,rch=[],recSend=false;
function startRec(){
  if(!navigator.mediaDevices||!window.MediaRecorder)return toast("Запись голоса не поддерживается");
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
    rch=[];recSend=false;mr=new MediaRecorder(st);var me=mr;
    me.ondataavailable=function(e){if(e.data.size)rch.push(e.data)};
    me.onstop=function(){st.getTracks().forEach(function(t){t.stop()});if(!recSend)return;var d=recDur,rd=new FileReader();rd.onload=function(){pushMsg({voice:true,dur:d,audio:rd.result})};rd.readAsDataURL(new Blob(rch,{type:me.mimeType||"audio/webm"}))};
    me.start();recS=0;$("#rt").textContent="0:00";$("#comp").classList.add("rec");
    recT=setInterval(function(){recS++;$("#rt").textContent=Math.floor(recS/60)+":"+pad(recS%60);if(recS>=120)sendVoice()},1000);onType();
  }).catch(function(){toast("Нет доступа к микрофону")});
}

  var same=audId===id;
  if(aud){aud.pause();resetPlay(audId);aud=null;audId=null}
  if(same)return;

  var up=LM==="up",h='<div class="auth"><div class="big">'+ic("chat",44)+'</div><h2>Telegram You</h2>',bt="",fn="";
  if(step==="auth"){
    bt=up?"Зарегистрироваться":"Войти";fn="doAuth";
    h+='<p>'+(up?"Создайте аккаунт по email":"Войдите по email и паролю")+'</p><div class="afield"><input id="em" type="email" inputmode="email" autocomplete="email" placeholder="Email" onkeydown="if(event.keyCode===13)doAuth()"></div><div class="afield"><input id="pw" type="password" autocomplete="'+(up?"new-password":"current-password")+'" placeholder="Пароль (мин. 6 символов)" onkeydown="if(event.keyCode===13)doAuth()"></div>';
  }else if(step==="name"){bt="Продолжить";fn="saveName";h+='<p>Как вас зовут? Это имя увидят собеседники</p><div class="afield"><input id="nm" maxlength="30" placeholder="Имя" onkeydown="if(event.keyCode===13)saveName()"></div>'}
  else h+='<p>Загрузка…</p>';
  if(bt)h+='<button class="tb f aw" id="ab" data-t="'+bt+'" onclick="'+fn+'()">'+bt+'</button>';
  if(step==="auth"){
    h+='<button class="tb alink" onclick="showLogin(\'auth\',\''+(up?"in":"up")+'\')">'+(up?"Уже есть аккаунт? Войти":"Создать аккаунт")+'</button>';
    if(!up)h+='<br><button class="tb alink" onclick="resetPass()">Забыли пароль?</button>';
  }
  if(step==="name")h+='<br><button class="tb alink" onclick="auth.signOut()">Выйти</button>';
  el.innerHTML=h+'<div class="aerr" id="aerr"></div></div>';
  var f=el.querySelector("input");if(f)setTimeout(function(){f.focus()},100);
}
function aerr(e){
  var M={"auth/invalid-email":"Неверный адрес email","auth/weak-password":"Пароль должен быть не короче 6 символов","auth/email-already-in-use":"Этот email уже зарегистрирован — нажмите «Войти»","auth/user-not-found":"Аккаунт не найден","auth/wrong-password":"Неверный пароль","auth/invalid-credential":"Неверный email или пароль","auth/too-many-requests":"Слишком много попыток, попробуйте позже","auth/network-request-failed":"Нет соединения с сетью","auth/operation-not-allowed":"Вход по Email/Password не включён в Firebase Console","auth/unauthorized-domain":"Домен не добавлен в Authorized domains (Firebase Console → Authentication → Settings)"};
  var el=$("#aerr");if(el){el.style.color="";el.textContent=M[e&&e.code]||(e&&e.message)||"Ошибка"}
  var b=$("#ab");if(b){b.disabled=false;b.textContent=b.dataset.t}
}
function busy(t){var b=$("#ab");if(b){b.disabled=true;b.textContent=t}var e=$("#aerr");if(e){e.style.color="";e.textContent=""}}
function doAuth(){
  var e=$("#em").value.trim(),p=$("#pw").value;
  if(!/^\S+@\S+\.\S+$/.test(e))return aerr({code:"auth/invalid-email"});
  if(p.length<6)return aerr({code:"auth/weak-password"});
  busy("Подождите…");
  (LM==="up"?auth.createUserWithEmailAndPassword(e,p):auth.signInWithEmailAndPassword(e,p)).catch(aerr);
}
function resetPass(){
  var e=$("#em").value.trim();
  if(!/^\S+@\S+\.\S+$/.test(e))return aerr({message:"Введите email и снова нажмите «Забыли пароль?»"});
  auth.sendPasswordResetEmail(e).then(function(){var x=$("#aerr");x.style.color="var(--p)";x.textContent="Письмо для сброса пароля отправлено"}).catch(aerr);
}
function saveName(){
  var n=$("#nm").value.trim().slice(0,30);if(!n)return;busy("Сохранение…");
  var up={};up["users/"+ME.uid]={name:n,email:ME.email,online:true};up["emails/"+ekey(ME.email)]=ME.uid;
  db.ref().update(up).then(function(){startApp(auth.currentUser,{name:n})}).catch(aerr);
}

/* session */
function startApp(u,p){
  ME={uid:u.uid,name:p.name,email:u.email};S.name=ME.name;S.phone=ME.email;S.chats=[];S.tab="chats";S.open=null;
  $("#login").style.display="none";renderMain();
  var pr=db.ref("users/"+ME.uid);
  db.ref(".info/connected").on("value",function(s){if(s.val()){pr.child("online").onDisconnect().set(false);pr.child("last").onDisconnect().set(TS);pr.child("online").set(true)}});
  db.ref("userChats/"+ME.uid).on("value",onUC,dberr);
}
function logout(){
  if(!ME)return;closeChat();
  var out=function(){S.chats.forEach(detach);db.ref("userChats/"+ME.uid).off();db.ref(".info/connected").off();S.chats=[];ME=null;auth.signOut()};
  db.ref("users/"+ME.uid+"/online").set(false).then(out,out);
}

/* chats */
function softMain(){renderNav();if(S.tab==="chats")renderList();else if(S.tab==="contacts")renderContacts();else if(S.tab==="calls")renderCalls()}
function persist(c){db.ref("userChats/"+ME.uid+"/"+c.id).update({pin:c.type==="saved"?!!c.pinned:(c.pinned||null),mute:c.muted||null}).catch(dberr)}
function onUC(snap){
  var v=snap.val()||{},sid=cidOf(ME.uid,ME.uid);
  if(!v[sid])v[sid]={};
  Object.keys(v).forEach(function(cid){
    var m=v[cid],sv=cid===sid;if(!sv&&!m.peer)return;
    var c=chat(cid);
    if(!c){
      c={id:cid,type:sv?"saved":"user",name:sv?"Избранное":"…",hue:sv?260:hueOf(m.peer),peer:sv?ME.uid:m.peer,pinned:false,muted:false,unread:0,online:false,typing:false,msgs:[],reads:{},ready:false,refs:[]};
      S.chats.push(c);watchChat(c);
    }
    c.pinned=m.pin===undefined?sv:!!m.pin;c.muted=!!m.mute;
  });
  S.chats=S.chats.filter(function(c){if(v[c.id]&&(c.type==="saved"||v[c.id].peer))return true;detach(c);if(S.open===c.id)closeChat();return false});
  softMain();
}
function watchChat(c){
  var q=db.ref("chats/"+c.id+"/msgs").limitToLast(200),put=function(s){putMsg(c,s)};
  q.on("child_added",put,dberr);q.on("child_changed",put,dberr);
  q.on("child_removed",function(s){c.msgs=c.msgs.filter(function(x){return x.id!==s.key});if(c.ready)refresh(c)},dberr);
  q.once("value",function(){c.ready=true;refresh(c)});
  var rd=db.ref("chats/"+c.id+"/read");rd.on("value",function(s){c.reads=s.val()||{};if(c.ready)refresh(c)},dberr);
  c.refs=[q,rd];
  if(c.type==="user"){
    var u=db.ref("users/"+c.peer);u.on("value",function(s){var x=s.val()||{};c.name=x.name||x.email||"Пользователь";c.online=!!x.online;if(S.open===c.id)renderChatHdr();softMain()},dberr);
    var t=db.ref("chats/"+c.id+"/typing/"+c.peer);t.on("value",function(s){c.typing=!!s.val();if(S.open===c.id)renderChatHdr();softMain()},dberr);
    c.refs.push(u,t);
  }
}
function detach(c){(c.refs||[]).forEach(function(r){r.off()})}
function putMsg(c,s){
  var v=s.val()||{},m={id:s.key,out:v.from===ME.uid,from:v.from,text:v.text||"",t:v.t||Date.now(),voice:v.voice,dur:v.dur,audio:v.audio,img:v.img,reply:v.reply,edited:v.edited},isNew=true;
  for(var i=0;i<c.msgs.length;i++)if(c.msgs[i].id===m.id){c.msgs[i]=m;isNew=false}
  if(isNew)c.msgs.push(m);
  c.msgs.sort(function(a,b){return a.t-b.t});
  if(!c.ready)return;
  if(isNew&&!m.out){if(S.open===c.id)markRead(c);else if(S.notif&&!c.muted)toast(c.name+": "+plain(m).split("\n")[0])}
  refresh(c);
  if(isNew&&m.out&&S.open===c.id)scrollEnd();
}
function recompute(c){
  var mine=c.reads[ME.uid]||0,peer=c.reads[c.peer]||0,u=0;
  c.msgs.forEach(function(m){if(m.out)m.read=c.type==="saved"||peer>=m.t;else if(m.t>mine)u++});
  c.unread=(S.open===c.id||c.type==="saved")?0:u;
}
function refresh(c){recompute(c);if(S.open===c.id){renderMsgs(1);renderChatHdr()}softMain()}
function markRead(c,force){if(!c||c.type==="saved"||(!force&&S.open!==c.id))return;db.ref("chats/"+c.id+"/read/"+ME.uid).set(TS).catch(dberr)}
function setTyping(v){var c=chat(S.open);if(!c||c.type==="saved")return;var r=db.ref("chats/"+c.id+"/typing/"+ME.uid);if(v){r.onDisconnect().remove();r.set(true)}else r.remove();tyOn=v}
function typingPing(){if(!tyOn)setTyping(true);clearTimeout(tyT);tyT=setTimeout(function(){setTyping(false)},3000)}

/* boot */
applyTheme();
if(typeof firebase==="undefined"){showLogin("load");$("#login p").textContent="Не удалось загрузить Firebase SDK. Проверьте интернет."}
else{
  firebase.initializeApp(firebaseConfig);
  auth=firebase.auth();db=firebase.database();TS=firebase.database.ServerValue.TIMESTAMP;auth.languageCode="ru";
  showLogin("load");
  auth.onAuthStateChanged(function(u){
    if(!u){ME=null;showLogin("auth");return}
    showLogin("load");
    db.ref("users/"+u.uid).once("value").then(function(sn){
      var p=sn.val();
      if(!p){ME={uid:u.uid,email:u.email};showLogin("name");return}
      startApp(u,p);
    }).catch(function(e){showLogin("auth");aerr(e)});
  });
}
</script>
</body>
</html>
