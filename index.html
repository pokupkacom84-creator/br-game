<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BR 2D Online</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, sans-serif; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0a0f14;
    touch-action:none; user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent; }
  canvas { display:block; }

  /* ====== ОБЩИЕ ЭКРАНЫ ====== */
  .screen { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column;
    color:#fff; overflow:hidden; }
  .hidden { display:none !important; }

  /* ====== АВТОРИЗАЦИЯ ====== */
  #authScreen {
    align-items:center; justify-content:center; padding:24px;
    background:
      radial-gradient(ellipse at top left, rgba(255,180,0,0.18), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(60,140,255,0.14), transparent 60%),
      linear-gradient(180deg, #1a1f28 0%, #0a0e14 100%);
  }
  .authBox { width:100%; max-width:360px; display:flex; flex-direction:column;
    gap:12px; padding:26px 22px; border-radius:18px;
    background:rgba(15,20,28,0.85); border:1px solid rgba(255,180,0,0.25);
    box-shadow:0 20px 60px rgba(0,0,0,0.6); }
  .authLogo { font-size:20px; font-weight:900; letter-spacing:3px;
    text-align:center; margin-bottom:6px;
    background:linear-gradient(90deg,#ffb400,#ff7a00);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .authTabs { display:flex; background:rgba(0,0,0,0.4); border-radius:10px; padding:4px; }
  .authTab { flex:1; padding:10px; border:none; background:transparent; color:#8899a8;
    font-weight:bold; font-size:13px; letter-spacing:1px; border-radius:8px; cursor:pointer; }
  .authTab.active { background:linear-gradient(135deg,#ffb400,#f58b00); color:#1a1206;
    box-shadow:0 4px 12px rgba(255,180,0,0.35); }
  .authInput { padding:13px 16px; border:1.5px solid #2b3a47; background:#101820;
    color:#fff; border-radius:10px; font-size:15px; outline:none; }
  .authInput:focus { border-color:#ffb400; }
  .btnPrimary { padding:14px; border:none; border-radius:10px; font-size:15px;
    font-weight:900; letter-spacing:1.5px; cursor:pointer;
    background:linear-gradient(135deg,#ffb400,#f58b00); color:#1a1206;
    box-shadow:0 6px 20px rgba(255,180,0,0.35); transition:transform 0.1s; }
  .btnPrimary:active { transform:scale(0.97); }
  .btnPrimary:disabled { opacity:0.6; cursor:default; }
  .btnSecondary { padding:13px; border:1.5px solid #2b3a47; background:transparent;
    color:#cfd8e3; border-radius:10px; font-size:14px; font-weight:700;
    letter-spacing:1px; cursor:pointer; transition:transform 0.1s; }
  .btnSecondary:active { transform:scale(0.97); }
  .authSep { text-align:center; color:#5c6b7a; font-size:12px; letter-spacing:2px;
    margin:4px 0; }
  #authError { color:#ef476f; font-size:12.5px; text-align:center; min-height:16px; }

  /* ====== ГЛАВНОЕ МЕНЮ (PUBG-style) ====== */
  #mainMenu {
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,180,0,0.22), transparent 45%),
      radial-gradient(ellipse at 85% 90%, rgba(40,120,255,0.16), transparent 55%),
      linear-gradient(180deg, #141a22 0%, #070a0f 100%);
    padding: 16px 16px 24px;
  }
  #mainMenu::before {
    content:''; position:absolute; inset:0; pointer-events:none;
    background:
      repeating-linear-gradient(115deg, rgba(255,180,0,0.035) 0 1px, transparent 1px 60px),
      repeating-linear-gradient(-25deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 90px);
  }
  .menuTop { display:flex; align-items:center; gap:10px; position:relative; z-index:1; }
  .profilePill { display:flex; align-items:center; gap:12px;
    padding:8px 16px 8px 8px; border-radius:30px;
    background:rgba(10,15,22,0.85);
    border:1px solid rgba(255,180,0,0.35);
    box-shadow:0 4px 20px rgba(0,0,0,0.5); flex:1; max-width:280px; }
  .avatar { width:44px; height:44px; border-radius:50%;
    background:linear-gradient(135deg,#ffb400,#f58b00);
    display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:19px; color:#1a1206; flex-shrink:0;
    border:2px solid rgba(255,255,255,0.15); }
  .profileInfo { display:flex; flex-direction:column; gap:2px; overflow:hidden; }
  .profileName { font-size:14px; font-weight:900; letter-spacing:0.5px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .profileLevel { font-size:11px; color:#ffb400; font-weight:700; letter-spacing:1px; }
  .iconBtn { width:44px; height:44px; border-radius:50%; border:1px solid rgba(255,255,255,0.15);
    background:rgba(10,15,22,0.8); color:#cfd8e3; font-size:18px; cursor:pointer; }
  .iconBtn:active { transform:scale(0.95); }

  .statsRow { display:flex; gap:10px; margin-top:20px; position:relative; z-index:1; }
  .stat { flex:1; padding:14px 10px; border-radius:12px; text-align:center;
    background:linear-gradient(180deg, rgba(20,26,36,0.9), rgba(10,14,20,0.9));
    border:1px solid rgba(255,180,0,0.2);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.04); }
  .statVal { font-size:22px; font-weight:900; color:#ffb400; letter-spacing:0.5px; }
  .statLbl { font-size:10px; color:#7f8ea0; letter-spacing:1.5px; margin-top:4px; font-weight:700; }

  .menuModes { display:flex; gap:8px; margin-top:24px; position:relative; z-index:1; }
  .modeTab { flex:1; padding:12px 8px; text-align:center; border-radius:10px;
    font-size:13px; font-weight:900; letter-spacing:2px; color:#5c6b7a;
    background:rgba(10,14,20,0.6); border:1px solid rgba(255,255,255,0.06);
    cursor:pointer; transition:0.15s; }
  .modeTab.active { color:#1a1206;
    background:linear-gradient(135deg,#ffb400,#f58b00);
    border-color:transparent;
    box-shadow:0 6px 20px rgba(255,180,0,0.3); }

  .spacer { flex:1; }

  .btnPlay {
    position:relative; z-index:1;
    margin-top: 30px;
    padding:22px 28px; border:none; border-radius:16px;
    background:linear-gradient(135deg,#ffb400,#ff7a00);
    color:#1a1206; font-size:22px; font-weight:900; letter-spacing:4px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:14px;
    box-shadow:0 10px 40px rgba(255,140,0,0.45),
               inset 0 2px 0 rgba(255,255,255,0.3);
    transition:transform 0.1s;
  }
  .btnPlay:active { transform:scale(0.98); }
  .playIcon { font-size:24px; }

  .menuBottom { display:flex; gap:8px; margin-top:14px; position:relative; z-index:1; }
  .menuBottom .btnSecondary { flex:1; font-size:11px; padding:12px 8px; letter-spacing:0.5px; }

  /* ====== ЛОББИ (создание/вход в комнату) ====== */
  #lobby {
    align-items:center; justify-content:center; padding:24px; text-align:center;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(255,180,0,0.15), transparent 55%),
      linear-gradient(180deg, #141a22 0%, #070a0f 100%);
    gap:14px;
  }
  #lobby h1 { font-size:24px; font-weight:900; letter-spacing:3px;
    background:linear-gradient(90deg,#ffb400,#ff7a00);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  #lobby input { padding:13px 16px; border:1.5px solid #2b3a47; background:#101820;
    color:#fff; border-radius:10px; font-size:15px; text-align:center;
    letter-spacing:2px; text-transform:uppercase; width:230px; outline:none; }
  #lobby input:focus { border-color:#ffb400; }
  #lobby .btnPrimary { min-width:230px; }
  #lobby .btnSecondary { min-width:230px; }
  .backBtn { position:absolute; top:16px; left:16px; z-index:3;
    width:40px; height:40px; border-radius:50%; border:1px solid rgba(255,255,255,0.15);
    background:rgba(10,15,22,0.8); color:#cfd8e3; font-size:18px; cursor:pointer; }
  .divider { color:#5c6b7a; font-size:12px; letter-spacing:2px; margin:2px 0; }
  #lobbyError { color:#ef476f; font-size:13px; min-height:18px; max-width:320px; }
  .sub { color:#8899a8; font-size:12px; }

  /* ====== ЗАГРУЗКА / ОЖИДАНИЕ ====== */
  #connecting, #waiting {
    align-items:center; justify-content:center;
    background: radial-gradient(ellipse at center, #141a22 0%, #070a0f 100%);
    gap:14px; text-align:center; padding:24px;
  }
  .spinner { width:44px; height:44px; border:4px solid #2b3a47;
    border-top-color:#ffb400; border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #waitingRoom { color:#ffb400; font-size:26px; font-weight:900;
    letter-spacing:6px; margin-top:4px; }
  #connectMsg { color:#8899a8; font-size:13px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- ====== АВТОРИЗАЦИЯ ====== -->
<div id="authScreen" class="screen">
  <div class="authBox">
    <div class="authLogo">2D BATTLE ROYALE</div>
    <div class="authTabs">
      <button class="authTab active" data-mode="login" id="tabLogin">ВХОД</button>
      <button class="authTab" data-mode="register" id="tabRegister">РЕГИСТРАЦИЯ</button>
    </div>
    <input id="authName" class="authInput hidden" placeholder="НИК (до 14 симв.)" maxlength="14" autocomplete="off">
    <input id="authEmail" class="authInput" type="email" placeholder="EMAIL" autocomplete="email">
    <input id="authPass" class="authInput" type="password" placeholder="ПАРОЛЬ (мин. 6 симв.)" autocomplete="current-password">
    <button id="authSubmit" class="btnPrimary">ВОЙТИ</button>
    <div id="authError"></div>
    <div class="authSep">— или —</div>
    <button id="btnGuest" class="btnSecondary">ИГРАТЬ КАК ГОСТЬ</button>
  </div>
</div>

<!-- ====== ГЛАВНОЕ МЕНЮ ====== -->
<div id="mainMenu" class="screen hidden">
  <div class="menuTop">
    <div class="profilePill">
      <div class="avatar" id="avatarEl">P</div>
      <div class="profileInfo">
        <div class="profileName" id="profileNameEl">PLAYER</div>
        <div class="profileLevel">УР. <span id="levelEl">1</span></div>
      </div>
    </div>
    <button id="btnLogout" class="iconBtn" title="Выйти">⏻</button>
  </div>

  <div class="statsRow">
    <div class="stat"><div class="statVal" id="statKills">0</div><div class="statLbl">УБИЙСТВ</div></div>
    <div class="stat"><div class="statVal" id="statWins">0</div><div class="statLbl">ПОБЕД</div></div>
    <div class="stat"><div class="statVal" id="statMatches">0</div><div class="statLbl">МАТЧЕЙ</div></div>
  </div>

  <div class="menuModes">
    <div class="modeTab active">SOLO</div>
    <div class="modeTab">DUO</div>
    <div class="modeTab">SQUAD</div>
  </div>

  <div class="spacer"></div>

  <button id="btnPlay" class="btnPlay">
    <span class="playIcon">▶</span>
    <span class="playText">ИГРАТЬ</span>
  </button>

  <div class="menuBottom">
    <button id="btnCustom" class="btnSecondary">СВОЯ КОМНАТА</button>
    <button id="btnBots" class="btnSecondary">С БОТАМИ</button>
    <button id="btnChangeName" class="btnSecondary">СМЕНИТЬ НИК</button>
  </div>
</div>

<!-- ====== ЛОББИ (создать/войти в комнату) ====== -->
<div id="lobby" class="screen hidden">
  <button id="btnLobbyBack" class="backBtn">←</button>
  <h1>ОНЛАЙН МАТЧ</h1>
  <input id="roomInput" placeholder="КОД КОМНАТЫ" maxlength="8" autocomplete="off">
  <div class="sub">оставь пустым — создастся новая</div>
  <button id="btnOnline" class="btnPrimary">ИГРАТЬ ОНЛАЙН</button>
  <div class="divider">— или —</div>
  <button id="btnBotsFromLobby" class="btnSecondary">ТРЕНИРОВКА С БОТАМИ</button>
  <div id="lobbyError"></div>
</div>

<!-- ====== ЗАГРУЗКА ====== -->
<div id="connecting" class="screen hidden">
  <div class="spinner"></div>
  <div class="sub" id="connectMsg">Подключение к серверу...</div>
</div>

<!-- ====== ОЖИДАНИЕ ====== -->
<div id="waiting" class="screen hidden">
  <div class="sub">Код комнаты для друзей:</div>
  <div id="waitingRoom">------</div>
  <div class="sub" style="margin-top:14px">Ты вошёл как
    <b id="waitingName" style="color:#fff;letter-spacing:1px">PLAYER</b></div>
  <div class="sub" style="margin-top:20px">Старт через <span id="countdown">5</span>с</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
(() => {
'use strict';

/* ====== FIREBASE CONFIG ====== */
const firebaseConfig = {
  apiKey: "AIzaSyB0uaLhHrYjWblrCBLTPx7mF_OmUhhld70",
  authDomain: "br-game-1f919.firebaseapp.com",
  databaseURL: "https://br-game-1f919-default-rtdb.firebaseio.com",
  projectId: "br-game-1f919",
  storageBucket: "br-game-1f919.firebasestorage.app",
  messagingSenderId: "758598814466",
  appId: "1:758598814466:web:85779913ac960b18a2901b"
};

/* ============ SETUP ============ */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
function resize(){
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* ============ CONST ============ */
const WORLD = 3200;
const ZONE_START_R = 1500, ZONE_END_R = 120, ZONE_SHRINK = 22, ZONE_DPS = 7;
const BOTS_COUNT = 29, JOY_R = 80, PLAYER_SPEED = 190;
const SYNC_INTERVAL = 100, INTERP_SPEED = 14;
const START_DELAY = 6000, SHOT_MAX_AGE = 2500, LOOT_COUNT = 60;

const WEAPONS = {
  pistol:  { name:'PISTOL',  dmg:12, rate:0.28, spread:0.06, speed:750,  ammo:12, reload:1.1, color:'#ffd166', pellets:1 },
  smg:     { name:'SMG',     dmg:9,  rate:0.09, spread:0.11, speed:820,  ammo:30, reload:1.4, color:'#06d6a0', pellets:1 },
  shotgun: { name:'SHOTGUN', dmg:8,  rate:0.85, spread:0.30, speed:650,  ammo:6,  reload:1.8, color:'#ef476f', pellets:6 },
  rifle:   { name:'RIFLE',   dmg:24, rate:0.5,  spread:0.02, speed:1050, ammo:15, reload:1.6, color:'#4cc9f0', pellets:1 },
};
const WEAPON_KEYS = Object.keys(WEAPONS);

function hashStr(s){
  let h = 2166136261;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ============ STATE ============ */
let player, bots, bullets, loot, particles, killFeed, zone;
let cam = { x:0, y:0 };
let gameState = 'menu';
let time = 0, aliveCount = 0;
const rand = (a,b) => a + Math.random()*(b-a);

let netMode = 'offline';
let myUid = null;
let roomId = null;
let remotePlayers = new Map();
let listeners = [];
let lastSync = 0;
let myName = 'PLAYER';

let db = null, auth = null;
let serverOffset = 0;
const serverNow = () => Date.now() + serverOffset;

let matchStartAt = 0;
let takenLoot = new Set();
let sawOthers = false;
let countdownTimer = null;

/* профиль игрока */
let currentUser = null;
let userProfile = { name:'PLAYER', kills:0, wins:0, matches:0 };
let matchRecorded = false;

/* ============ INIT FIREBASE ============ */
function initFirebase(){
  if (!firebase.apps || firebase.apps.length === 0) firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.database();
}

/* ============ HELPERS ============ */
function log(...a){ console.log('%c[BR]', 'color:#06d6a0', ...a); }
function withTimeout(p, ms, msg){
  return Promise.race([
    p,
    new Promise((_, rej) => setTimeout(() => rej(new Error(msg || 'timeout')), ms))
  ]);
}
function sanitizeName(n){
  n = (n || '').toString().trim();
  n = n.substring(0, 14).replace(/[<>&"]/g, '').replace(/\s+/g, ' ');
  return n || 'PLAYER';
}
function showScreen(id){
  ['authScreen','mainMenu','lobby','connecting','waiting'].forEach(s => {
    document.getElementById(s).classList.toggle('hidden', s !== id);
  });
}
function hideAllScreens(){ showScreen('__none__'); }

/* ============ ENTITY ============ */
function makeEntity(x, y, isBot, name){
  return {
    x, y, r:16, hp:100, maxHp:100, angle:0,
    isBot, name, uid:null,
    speed: PLAYER_SPEED,
    weapon: WEAPONS.pistol, weaponKey: 'pistol',
    ammo: WEAPONS.pistol.ammo, reloading:0, fireCd:0,
    alive:true, kills:0,
    wanderAngle: rand(0, Math.PI*2), wanderTimer:0,
    targetX: x, targetY: y, targetAngle: 0,
    lastServerHp: 100, pendingDamage: 0,
  };
}

function spawnPointFor(uid){
  const h = hashStr((roomId || '') + uid);
  const ang = ((h % 1024) / 1024) * Math.PI * 2;
  const rad = 250 + ((h >>> 10) % 700);
  return { x: WORLD/2 + Math.cos(ang)*rad, y: WORLD/2 + Math.sin(ang)*rad };
}

function resetGame(){
  let px, py;
  if (netMode === 'online'){
    const sp = spawnPointFor(myUid);
    px = sp.x; py = sp.y;
  } else {
    px = WORLD/2 + rand(-100,100);
    py = WORLD/2 + rand(-100,100);
  }

  player = makeEntity(px, py, false, myName);
  player.uid = myUid;

  bots = [];
  if (netMode === 'offline'){
    for (let i = 0; i < BOTS_COUNT; i++){
      const b = makeEntity(rand(220, WORLD-220), rand(220, WORLD-220), true, 'Bot'+Math.floor(rand(10,999)));
      b.speed = rand(140, 175);
      const wk = WEAPON_KEYS[Math.floor(Math.random()*WEAPON_KEYS.length)];
      b.weapon = WEAPONS[wk]; b.weaponKey = wk; b.ammo = b.weapon.ammo;
      bots.push(b);
    }
  }

  bullets = []; loot = []; particles = []; killFeed = [];
  sawOthers = false;
  matchRecorded = false;

  if (netMode === 'offline') spawnLootRandom(55);
  else spawnLootSeeded(roomId, LOOT_COUNT);

  zone = { x: WORLD/2, y: WORLD/2, r: ZONE_START_R, targetR: ZONE_END_R };
  time = 0;
  gameState = 'playing';
  updateAlive();
}

function updateAlive(){
  let n = (player && player.alive) ? 1 : 0;
  if (netMode === 'online'){
    for (const e of remotePlayers.values()) if (e.alive) n++;
  } else {
    for (const b of bots) if (b.alive) n++;
  }
  aliveCount = n;
}

function spawnLootRandom(n){
  for (let i = 0; i < n; i++){
    const id = 'L' + i;
    if (Math.random() < 0.22)
      loot.push({ id, x: rand(120, WORLD-120), y: rand(120, WORLD-120), type:'health', r:12 });
    else {
      const wk = WEAPON_KEYS[Math.floor(Math.random()*WEAPON_KEYS.length)];
      loot.push({ id, x: rand(120, WORLD-120), y: rand(120, WORLD-120), type:'weapon', weaponKey: wk, r:14 });
    }
  }
}
function spawnLootSeeded(seed, n){
  const rnd = mulberry32(hashStr('loot:' + seed));
  for (let i = 0; i < n; i++){
    const id = 'L' + i;
    const roll = rnd();
    const x = 120 + rnd() * (WORLD - 240);
    const y = 120 + rnd() * (WORLD - 240);
    if (takenLoot.has(id)) continue;
    if (roll < 0.22) loot.push({ id, x, y, type:'health', r:12 });
    else {
      const wk = WEAPON_KEYS[Math.floor(rnd()*WEAPON_KEYS.length)];
      loot.push({ id, x, y, type:'weapon', weaponKey: wk, r:14 });
    }
  }
}
function removeLootById(id){
  const s = String(id);
  for (let i = loot.length - 1; i >= 0; i--){
    if (String(loot[i].id) === s) loot.splice(i, 1);
  }
}

function applyLocalDamage(e, dmg){
  if (!e || !e.alive) return;
  e.hp = Math.max(0, e.hp - dmg);
  e.pendingDamage = (e.pendingDamage || 0) + dmg;
  e.localHitAt = performance.now();
}

function killEntity(ent, killer){
  if (!ent || !ent.alive) return;
  ent.alive = false;
  if (killer && killer !== ent) killer.kills = (killer.kills || 0) + 1;

  if (netMode === 'offline'){
    loot.push({ id:'D'+Math.random(), x: ent.x, y: ent.y, type:'weapon', weaponKey: ent.weaponKey, r:14 });
    if (Math.random() < 0.6)
      loot.push({ id:'D'+Math.random(), x: ent.x + rand(-28,28), y: ent.y + rand(-28,28), type:'health', r:12 });
  }

  const kname = killer ? killer.name : 'ZONE';
  killFeed.push({ text: `${kname} → ${ent.name}`, t: 4 });
  if (killFeed.length > 4) killFeed.shift();

  for (let i = 0; i < 12; i++)
    particles.push({ x:ent.x, y:ent.y, vx: rand(-120,120), vy: rand(-120,120), life: 0.6, color:'#ff5a5a' });

  if (netMode === 'online' && ent === player && db && roomId && myUid){
    db.ref(`rooms/${roomId}/players/${myUid}`).update({ alive:false, hp:0 }).catch(()=>{});
  }
}

/* ============ INPUT ============ */
const joyL = { active:false, id:null, ox:0, oy:0, x:0, y:0 };
const joyR = { active:false, id:null, ox:0, oy:0, x:0, y:0 };
const keys = {};
const mouse = { x:0, y:0, down:false };

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (gameState === 'won' || gameState === 'lost'){ backToMainMenu(); return; }
  if (gameState !== 'playing') return;
  for (const t of e.changedTouches){
    if (t.clientX < W/2 && joyL.id === null){
      joyL.id = t.identifier; joyL.ox = t.clientX; joyL.oy = t.clientY;
      joyL.x = t.clientX; joyL.y = t.clientY; joyL.active = true;
    } else if (t.clientX >= W/2 && joyR.id === null){
      joyR.id = t.identifier; joyR.ox = t.clientX; joyR.oy = t.clientY;
      joyR.x = t.clientX; joyR.y = t.clientY; joyR.active = true;
    }
  }
}, { passive:false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches){
    if (t.identifier === joyL.id){ joyL.x = t.clientX; joyL.y = t.clientY; }
    if (t.identifier === joyR.id){ joyR.x = t.clientX; joyR.y = t.clientY; }
  }
}, { passive:false });

function endTouch(e){
  for (const t of e.changedTouches){
    if (t.identifier === joyL.id){ joyL.active=false; joyL.id=null; }
    if (t.identifier === joyR.id){ joyR.active=false; joyR.id=null; }
  }
}
canvas.addEventListener('touchend', endTouch);
canvas.addEventListener('touchcancel', endTouch);

addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
addEventListener('keyup',   e => { keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mousedown', () => {
  if (gameState === 'won' || gameState === 'lost'){ backToMainMenu(); return; }
  if (gameState === 'playing') mouse.down = true;
});
canvas.addEventListener('mouseup', () => { mouse.down = false; });

let authMode = 'login';

function setAuthMode(mode){
  authMode = mode;
  tabLogin.classList.toggle('active', mode === 'login');
  tabReg.classList.toggle('active', mode === 'register');
  authName.classList.toggle('hidden', mode === 'login');
  authSubmit.textContent = (mode === 'login') ? 'ВОЙТИ' : 'СОЗДАТЬ АККАУНТ';
  authError.textContent = '';
}

authSubmit.onclick = doAuthSubmit;
[authEmail, authPass, authName].forEach(el => {
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter') doAuthSubmit();
  });
});

async function doAuthSubmit(){
  authError.textContent = '';
  const email = (authEmail.value || '').trim();
  const pass  = (authPass.value || '').trim();
  const name  = sanitizeName(authName.value);

  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    authError.textContent = 'Введи корректный email'; return;
  }
  if (pass.length < 6){
    authError.textContent = 'Пароль минимум 6 символов'; return;
  }

  authSubmit.disabled = true;
  authSubmit.textContent = '...';
  try {
    if (!db) initFirebase();
    if (authMode === 'login'){
      await auth.signInWithEmailAndPassword(email, pass);
      /* onAuthStateChanged подхватит и откроет меню */
    } else {
      const cred = await auth.createUserWithEmailAndPassword(email, pass);
      await cred.user.updateProfile({ displayName: name });
      /* создаём профиль в базе */
      await db.ref('users/' + cred.user.uid).set({
        name, email,
        kills: 0, wins: 0, matches: 0,
        createdAt: firebase.database.ServerValue.TIMESTAMP,
      });
    }
  } catch (err){
    console.error('[auth]', err);
    const code = err.code || '';
    if (code.includes('email-already-in-use'))      authError.textContent = 'Этот email уже занят';
    else if (code.includes('invalid-email'))         authError.textContent = 'Неверный email';
    else if (code.includes('weak-password'))         authError.textContent = 'Слабый пароль (мин 6)';
    else if (code.includes('wrong-password'))        authError.textContent = 'Неверный пароль';
    else if (code.includes('user-not-found'))        authError.textContent = 'Аккаунт не найден';
    else if (code.includes('invalid-credential'))    authError.textContent = 'Неверный email или пароль';
    else if (code.includes('operation-not-allowed')) authError.textContent = 'Включи Email/Password в Firebase';
    else if (code.includes('network'))               authError.textContent = 'Нет сети';
    else                                             authError.textContent = err.message || 'Ошибка';
  } finally {
    authSubmit.disabled = false;
    authSubmit.textContent = (authMode === 'login') ? 'ВОЙТИ' : 'СОЗДАТЬ АККАУНТ';
  }
}

btnGuest.onclick = async () => {

function initAuthFlow(){

async function loadOrCreateProfile(user){
  const ref = db.ref('users/' + user.uid);
  let snap;
  try {
    snap = await withTimeout(ref.once('value'), 8000, 'profile timeout');
  } catch(e){
    /* сеть упала — используем локальный профиль */
    const fallbackName = sanitizeName(user.displayName || (user.isAnonymous
      ? ('GUEST' + user.uid.substring(0,3).toUpperCase())
      : (user.email || '').split('@')[0]));
    userProfile = { name: fallbackName, kills:0, wins:0, matches:0 };
    updateProfileUI();
    return;
  }

  const data = snap.val();
  if (data){
    userProfile = {
      name: sanitizeName(data.name || user.displayName || 'PLAYER'),
      kills: data.kills || 0,
      wins: data.wins || 0,
      matches: data.matches || 0,
    };
  } else {
    const name = sanitizeName(user.displayName || (user.isAnonymous
      ? ('GUEST' + user.uid.substring(0,3).toUpperCase())
      : (user.email || 'PLAYER').split('@')[0]));
    userProfile = { name, kills:0, wins:0, matches:0 };
    try {
      await ref.set({
        name, email: user.email || null,
        kills: 0, wins: 0, matches: 0,
        createdAt: firebase.database.ServerValue.TIMESTAMP,
      });
    } catch(e){ console.warn('profile create', e); }
  }
  myName = userProfile.name;
  updateProfileUI();
}

function updateProfileUI(){
  const name = userProfile.name || 'PLAYER';
  avatarEl.textContent = (name[0] || 'P').toUpperCase();
  profileNameEl.textContent = name;
  const level = 1 + Math.floor((userProfile.kills || 0) / 10);
  levelEl.textContent = level;
  statKills.textContent = userProfile.kills || 0;
  statWins.textContent = userProfile.wins || 0;
  statMatches.textContent = userProfile.matches || 0;
}

async function recordMatchResult(won, kills){
  if (!currentUser || matchRecorded) return;
  matchRecorded = true;
  try {
    const ref = db.ref('users/' + currentUser.uid);
    await ref.transaction(u => {
      if (!u) return u;
      u.matches = (u.matches || 0) + 1;
      u.kills = (u.kills || 0) + Math.max(0, kills|0);
      if (won) u.wins = (u.wins || 0) + 1;
      return u;
    });
    /* локально тоже обновим */
    userProfile.matches = (userProfile.matches || 0) + 1;
    userProfile.kills   = (userProfile.kills   || 0) + Math.max(0, kills|0);
    if (won) userProfile.wins = (userProfile.wins || 0) + 1;
    updateProfileUI();
  } catch(e){ console.warn('record match', e); }
}

/* ============ LOBBY ============ */
const roomInput = document.getElementById('roomInput');
const errorEl   = document.getElementById('lobbyError');
const btnOnlineEl = document.getElementById('btnOnline');

roomInput.addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); goOnline(); }
});

btnOnlineEl.onclick = goOnline;

async function goOnline(){
  if (btnOnlineEl.disabled) return;
  errorEl.textContent = '';

  if (!currentUser){
    showScreen('authScreen');
    return;
  }

  const typed = roomInput.value.trim().toUpperCase();
  if (typed && !/^[A-Z0-9]{4,8}$/.test(typed)){
    errorEl.textContent = 'Код: 4-8 символов (A-Z, 0-9)';
    return;
  }

  btnOnlineEl.disabled = true;
  showScreen('connecting');
  const connectMsgEl = document.getElementById('connectMsg');
  connectMsgEl.textContent = 'Подключение к серверу...';

  try {
    myName = userProfile.name || sanitizeName(currentUser.displayName || 'PLAYER');

    connectMsgEl.textContent = 'Синхронизация времени...';
    serverOffset = await new Promise(res => {
      const to = setTimeout(() => res(0), 2500);
      try {
        db.ref('.info/serverTimeOffset').once('value', s => {
          clearTimeout(to); res(s.val() || 0);
        }, () => { clearTimeout(to); res(0); });
      } catch(e){ clearTimeout(to); res(0); }
    });

    const creating = !typed;
    roomId = typed || ('R' + Math.random().toString(36).substring(2, 7).toUpperCase());
    log('room', roomId, 'creating:', creating);

    connectMsgEl.textContent = 'Проверка комнаты...';
    const metaRef = db.ref(`rooms/${roomId}/meta`);
    let metaSnap;
    try {
      metaSnap = await withTimeout(metaRef.once('value'), 10000, 'Не удалось прочитать комнату');
    } catch(e){
      throw new Error('Нет связи с базой. Проверь интернет.');
    }
    let meta = metaSnap.val();

    if (!creating && (!meta || !meta.startAt)){
      throw new Error('Комната "' + roomId + '" не найдена. Проверь код.');
    }

    if (!meta || !meta.startAt){
      connectMsgEl.textContent = 'Создание комнаты...';
      const t = Date.now() + serverOffset + START_DELAY;
      try {
        await withTimeout(metaRef.transaction(cur => {
          if (cur === null) return { startAt: t };
          return undefined;
        }), 8000, 'tx timeout');
      } catch(e){ log('tx failed', e.message); }
      const m2 = await withTimeout(metaRef.once('value'), 6000, 'meta re-read timeout');
      meta = m2.val() || {};
    }

    const startAtNum = Number(meta.startAt);
    matchStartAt = isFinite(startAtNum) && startAtNum > 0
      ? startAtNum
      : (Date.now() + serverOffset + START_DELAY);

    connectMsgEl.textContent = 'Вход в комнату...';
    await joinRoom();

    showScreen('waiting');
    document.getElementById('waitingRoom').textContent = roomId;
    document.getElementById('waitingName').textContent = myName;

    if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
    const countdownEl = document.getElementById('countdown');
    const tick = () => {
      const delta = matchStartAt - serverNow();
      const left = Math.max(0, Math.ceil((isFinite(delta) ? delta : 0) / 1000));
      countdownEl.textContent = left;
      if (left <= 0){
        if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
        startOnlineMatch();
      }
    };
    tick();
    countdownTimer = setInterval(tick, 120);

  } catch (err){
    console.error('[BR] online error:', err);
    showScreen('lobby');
    errorEl.textContent = (err && (err.message || err.code)) || 'Ошибка подключения';
  } finally {
    btnOnlineEl.disabled = false;
  }
}

  }

/* ============ NETWORK: вступление ============ */
async function joinRoom(){
  const sp = spawnPointFor(myUid);
  const me = {
    x: Math.round(sp.x), y: Math.round(sp.y),
    angle: 0, hp: 100, weapon: 'pistol', alive: true, kills: 0,
    name: myName,
  };

  const myRef = db.ref(`rooms/${roomId}/players/${myUid}`);
  await withTimeout(myRef.set(me), 8000, 'Не удалось войти в комнату (set timeout)');
  try { myRef.onDisconnect().remove(); } catch(e){}

  const playersRef = db.ref(`rooms/${roomId}/players`);
  const pCb = playersRef.on('value', snap => {
    const data = snap.val() || {};
    const seen = new Set();

    for (const uid in data){
      if (uid === myUid) continue;
      seen.add(uid);
      const p = data[uid];
      if (!p || typeof p.x !== 'number') continue;

      let e = remotePlayers.get(uid);
      if (!e){
        e = makeEntity(p.x, p.y, false, p.name || uid.substring(0,4));
        e.uid = uid;
        e.x = e.targetX = p.x;
        e.y = e.targetY = p.y;
        e.angle = e.targetAngle = p.angle || 0;
        e.hp = p.hp != null ? p.hp : 100;
        e.lastServerHp = e.hp;
        e.pendingDamage = 0;
        e.weaponKey = p.weapon || 'pistol';
        e.weapon = WEAPONS[e.weaponKey] || WEAPONS.pistol;
        e.alive = p.alive !== false;
        e.kills = p.kills || 0;
        remotePlayers.set(uid, e);
      } else {
        e.targetX = p.x;
        e.targetY = p.y;
        e.targetAngle = p.angle || 0;

        const serverHp   = (p.hp != null) ? p.hp : e.hp;
        const prevServer = (e.lastServerHp != null) ? e.lastServerHp : serverHp;
        const serverDrop = Math.max(0, prevServer - serverHp);

        if (serverDrop > 0){
          e.pendingDamage = Math.max(0, (e.pendingDamage || 0) - serverDrop);
        } else {
          e.pendingDamage = Math.max(0, (e.pendingDamage || 0) - 2);
        }
        e.lastServerHp = serverHp;
        e.hp = Math.max(0, serverHp - (e.pendingDamage || 0));

        e.weaponKey = p.weapon || e.weaponKey;
        e.weapon = WEAPONS[e.weaponKey] || e.weapon;

        const wasAlive = e.alive;
        e.alive = p.alive !== false;
        if (!e.alive){ e.hp = 0; e.pendingDamage = 0; }
        if (wasAlive && !e.alive && gameState === 'playing'){
          const mine = (p.killedBy && p.killedBy === myUid);
          killFeed.push({ text: mine ? `YOU → ${e.name}` : `${e.name} устранён`, t: 4 });
          if (killFeed.length > 4) killFeed.shift();
        }

        e.name = p.name || e.name;
        e.kills = p.kills != null ? p.kills : e.kills;
      }
    }

    for (const uid of [...remotePlayers.keys()]){
      if (!seen.has(uid)){
        const gone = remotePlayers.get(uid);
        if (gone && gone.alive && gameState === 'playing'){
          killFeed.push({ text: `${gone.name} покинул игру`, t: 4 });
          if (killFeed.length > 4) killFeed.shift();
        }
        remotePlayers.delete(uid);
      }
    }
    updateAlive();
  });
  listeners.push({ ref: playersRef, type: 'value', cb: pCb });

  try {
    const takenSnap = await db.ref(`rooms/${roomId}/taken`).once('value');
    const takenVal = takenSnap.val() || {};
    for (const k in takenVal) takenLoot.add(String(k));
  } catch(e){ log('taken preload failed', e.message); }
}

/* ============ NETWORK: игровые каналы ============ */
function setupGameListeners(){
  const shotsRef = db.ref(`rooms/${roomId}/shots`).limitToLast(50);
  const sCb = shotsRef.on('child_added', snap => {
    const s = snap.val();
    snap.ref.remove().catch(()=>{});
    if (!s || !bullets) return;
    if (s.uid === myUid) return;
    if (serverNow() - (s.t || 0) > SHOT_MAX_AGE) return;

    const w = WEAPONS[s.weaponKey] || WEAPONS.pistol;
    const n = w.pellets || 1;
    for (let i = 0; i < n; i++){
      const a = s.angle + rand(-w.spread, w.spread);
      bullets.push({
        x: s.x, y: s.y,
        vx: Math.cos(a)*w.speed, vy: Math.sin(a)*w.speed,
        dmg: 0, owner: null, life: 1.0, color: w.color, visual: true,
      });
    }
  });
  listeners.push({ ref: shotsRef, type: 'child_added', cb: sCb });

  const dmgRef = db.ref(`rooms/${roomId}/damage/${myUid}`);
  const dCb = dmgRef.on('child_added', snap => {
    const d = snap.val();
    snap.ref.remove().catch(()=>{});
    if (!d || !player || !player.alive || gameState !== 'playing') return;

    player.hp -= d.amount;
    if (player.hp <= 0){
      player.hp = 0;
      killEntity(player, { name: d.byName || 'ENEMY' });
      gameState = 'lost';
      if (d.by){
        db.ref(`rooms/${roomId}/players/${d.by}/kills`)
          .transaction(v => (v || 0) + 1).catch(()=>{});
        db.ref(`rooms/${roomId}/players/${myUid}/killedBy`)
          .set(d.by).catch(()=>{});
      }
    }
  });
  listeners.push({ ref: dmgRef, type: 'child_added', cb: dCb });

  const myKillsRef = db.ref(`rooms/${roomId}/players/${myUid}/kills`);
  const kCb = myKillsRef.on('value', s => {
    if (player) player.kills = s.val() || 0;
  });
  listeners.push({ ref: myKillsRef, type: 'value', cb: kCb });

  const takenRef = db.ref(`rooms/${roomId}/taken`);
  const tCb = takenRef.on('child_added', snap => {
    const id = String(snap.key);
    takenLoot.add(id);
    removeLootById(id);
  });
  listeners.push({ ref: takenRef, type: 'child_added', cb: tCb });
}

function syncMyState(){
  if (netMode !== 'online' || !db || !player || !player.alive) return;
  db.ref(`rooms/${roomId}/players/${myUid}`).update({
    x: Math.round(player.x),
    y: Math.round(player.y),
    angle: Math.round(player.angle * 100) / 100,
    hp: Math.round(player.hp),
    weapon: player.weaponKey,
    alive: player.alive,
  }).catch(()=>{});
}
function sendShot(x, y, angle, weaponKey){
  if (netMode !== 'online' || !db || !player || !player.alive) return;
  db.ref(`rooms/${roomId}/shots`).push({
    uid: myUid, x: Math.round(x), y: Math.round(y),
    angle: Math.round(angle*100)/100, weaponKey, t: serverNow(),
  }).catch(()=>{});
}
function sendDamage(targetUid, amount){
  if (netMode !== 'online' || !db) return;
  db.ref(`rooms/${roomId}/damage/${targetUid}`).push({
    amount, by: myUid, byName: myName, t: serverNow(),
  }).catch(()=>{});
}

/* ============ COMBAT ============ */
function tryFire(ent, dt){
  if (ent.fireCd > 0 || ent.reloading > 0) return;
  if (ent.ammo <= 0){ ent.reloading = ent.weapon.reload; return; }
  const w = ent.weapon;
  const p = w.pellets || 1;
  for (let i = 0; i < p; i++){
    const a = ent.angle + rand(-w.spread, w.spread);
    bullets.push({
      x: ent.x + Math.cos(ent.angle)*(ent.r + 6),
      y: ent.y + Math.sin(ent.angle)*(ent.r + 6),
      vx: Math.cos(a)*w.speed, vy: Math.sin(a)*w.speed,
      dmg: w.dmg, owner: ent, life: 1.2, color: w.color,
    });
  }
  ent.ammo--;
  ent.fireCd = w.rate;
  for (let i = 0; i < 3; i++)
    particles.push({
      x: ent.x + Math.cos(ent.angle)*(ent.r+10),
      y: ent.y + Math.sin(ent.angle)*(ent.r+10),
      vx: Math.cos(ent.angle)*rand(50,150) + rand(-40,40),
      vy: Math.sin(ent.angle)*rand(50,150) + rand(-40,40),
      life: 0.15, color: w.color
    });
  if (netMode === 'online' && ent === player)
    sendShot(ent.x, ent.y, ent.angle, ent.weaponKey);
}

/* ============ UPDATE ============ */
function updatePlayer(dt){
  if (!player.alive) return;
  let dx = 0, dy = 0;
  if (joyL.active){
    const jx = joyL.x - joyL.ox, jy = joyL.y - joyL.oy;
    const d = Math.hypot(jx, jy);
    if (d > 8){
      const k = Math.min(1, d / JOY_R);
      dx = jx/d * k; dy = jy/d * k;
    }
  }
  if (keys['w'] || keys['arrowup'])    dy -= 1;
  if (keys['s'] || keys['arrowdown'])  dy += 1;
  if (keys['a'] || keys['arrowleft'])  dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  const m = Math.hypot(dx, dy);
  if (m > 1){ dx /= m; dy /= m; }
  player.x += dx * player.speed * dt;
  player.y += dy * player.speed * dt;
  player.x = Math.max(player.r, Math.min(WORLD - player.r, player.x));
  player.y = Math.max(player.r, Math.min(WORLD - player.r, player.y));

  let wantFire = false;
  if (joyR.active){
    const jx = joyR.x - joyR.ox, jy = joyR.y - joyR.oy;
    const d = Math.hypot(jx, jy);
    if (d > 15){
      player.angle = Math.atan2(jy, jx);
      wantFire = true;
    }
  }
  if (mouse.down){
    const psx = player.x - cam.x, psy = player.y - cam.y;
    player.angle = Math.atan2(mouse.y - psy, mouse.x - psx);
    wantFire = true;
  }
  if (wantFire) tryFire(player, dt);

  if (player.fireCd > 0) player.fireCd -= dt;
  if (player.reloading > 0){
    player.reloading -= dt;
    if (player.reloading <= 0) player.ammo = player.weapon.ammo;
  }
}

function updateBot(b, dt){
  if (!b.alive) return;
  let target = null, minD = 700;
  if (player.alive){
    const d = Math.hypot(player.x - b.x, player.y - b.y);
    if (d < minD){ minD = d; target = player; }
  }
  for (const o of bots){
    if (o === b || !o.alive) continue;
    const d = Math.hypot(o.x - b.x, o.y - b.y);
    if (d < minD){ minD = d; target = o; }
  }
  const zdx = zone.x - b.x, zdy = zone.y - b.y;
  const zdist = Math.hypot(zdx, zdy);
  const outside = zdist > zone.r - 150;
  let mx = 0, my = 0;
  if (target && minD < 500 && !outside){
    const ang = Math.atan2(target.y - b.y, target.x - b.x);
    b.angle = ang;
    if (minD > 220){ mx = Math.cos(ang); my = Math.sin(ang); }
    else if (minD < 130){ mx = -Math.cos(ang); my = -Math.sin(ang); }
    else {
      const s = Math.sin(time*2 + b.wanderAngle);
      mx = Math.cos(ang + Math.PI/2) * s;
      my = Math.sin(ang + Math.PI/2) * s;
    }
    tryFire(b, dt);
  } else if (outside){
    b.angle = Math.atan2(zdy, zdx);
    mx = zdx/zdist; my = zdy/zdist;
  } else {
    b.wanderTimer -= dt;
    if (b.wanderTimer <= 0){ b.wanderAngle = rand(0, Math.PI*2); b.wanderTimer = rand(1.2, 3.5); }
    b.angle = b.wanderAngle;
    mx = Math.cos(b.wanderAngle) * 0.7;
    my = Math.sin(b.wanderAngle) * 0.7;
  }
  const m = Math.hypot(mx, my);
  if (m > 1){ mx /= m; my /= m; }
  b.x += mx * b.speed * dt;
  b.y += my * b.speed * dt;
  b.x = Math.max(b.r, Math.min(WORLD - b.r, b.x));
  b.y = Math.max(b.r, Math.min(WORLD - b.r, b.y));
  if (b.fireCd > 0) b.fireCd -= dt;
  if (b.reloading > 0){ b.reloading -= dt; if (b.reloading <= 0) b.ammo = b.weapon.ammo; }
}

function updateRemotePlayers(dt){
  if (netMode !== 'online') return;
  const k = 1 - Math.exp(-INTERP_SPEED * dt);
  for (const e of remotePlayers.values()){
    if (!e.alive) continue;
    e.x += (e.targetX - e.x) * k;
    e.y += (e.targetY - e.y) * k;
    let da = e.targetAngle - e.angle;
    while (da >  Math.PI) da -= Math.PI*2;
    while (da < -Math.PI) da += Math.PI*2;
    e.angle += da * k;
  }
}

function updateBullets(dt){
  for (let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.x < 0 || b.x > WORLD || b.y < 0 || b.y > WORLD){
      bullets.splice(i, 1); continue;
    }
    if (b.visual) continue;
    let hit = false;
    const targets = [player];
    if (netMode === 'offline') targets.push(...bots);
    else for (const e of remotePlayers.values()) targets.push(e);

    for (const t of targets){
      if (!t || !t.alive || t === b.owner) continue;
      if (Math.hypot(t.x - b.x, t.y - b.y) < t.r + 4){
        if (netMode === 'online' && t.uid){
          sendDamage(t.uid, b.dmg);
          applyLocalDamage(t, b.dmg);
        } else {
          t.hp -= b.dmg;
          if (t.hp <= 0) killEntity(t, b.owner);
        }
        for (let k = 0; k < 4; k++)
          particles.push({ x: b.x, y: b.y, vx: rand(-100,100), vy: rand(-100,100), life: 0.3, color:'#ffd166' });
        hit = true;
        break;
      }
    }
    if (hit) bullets.splice(i, 1);
  }
}

function updateLoot(){
  if (!player.alive) return;
  for (let i = loot.length - 1; i >= 0; i--){
    const l = loot[i];
    if (Math.hypot(player.x - l.x, player.y - l.y) >= player.r + l.r + 6) continue;
    if (l.type === 'health'){
      if (player.hp >= player.maxHp) continue;
      player.hp = Math.min(player.maxHp, player.hp + 40);
    } else {
      if (player.weaponKey === l.weaponKey) continue;
      player.weapon = WEAPONS[l.weaponKey];
      player.weaponKey = l.weaponKey;
      player.ammo = player.weapon.ammo;
      player.reloading = 0;
    }
    if (netMode === 'online' && l.id != null){
      const id = String(l.id);
      if (!takenLoot.has(id)){
        takenLoot.add(id);
        db.ref(`rooms/${roomId}/taken/${id}`).set(true).catch(()=>{});
      }
    }
    loot.splice(i, 1);
  }
}

function updateZone(dt){
  if (netMode === 'online'){
    const elapsed = Math.max(0, (serverNow() - matchStartAt) / 1000);
    zone.r = Math.max(ZONE_END_R, ZONE_START_R - ZONE_SHRINK * elapsed);
  } else {
    zone.r = Math.max(ZONE_END_R, zone.r - ZONE_SHRINK * dt);
  }
  if (player && player.alive){
    const d = Math.hypot(player.x - zone.x, player.y - zone.y);
    if (d > zone.r){
      player.hp -= ZONE_DPS * dt;
      if (player.hp <= 0){ player.hp = 0; killEntity(player, null); }
    }
  }
  if (netMode === 'offline'){
    for (const b of bots){
      if (!b.alive) continue;
      const d = Math.hypot(b.x - zone.x, b.y - zone.y);
      if (d > zone.r){ b.hp -= ZONE_DPS * dt; if (b.hp <= 0) killEntity(b, null); }
    }
  }
}

function updateParticles(dt){
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.92; p.vy *= 0.92;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = killFeed.length - 1; i >= 0; i--){
    killFeed[i].t -= dt;
    if (killFeed[i].t <= 0) killFeed.splice(i, 1);
  }
}

/* ============ CAMERA ============ */
function updateCamera(){
  const focus = (player && player.alive) ? player : { x: zone.x, y: zone.y };
  cam.x = focus.x - W/2;
  cam.y = focus.y - H/2;
  if (W < WORLD) cam.x = Math.max(0, Math.min(WORLD - W, cam.x));
  if (H < WORLD) cam.y = Math.max(0, Math.min(WORLD - H, cam.y));
}

/* ============ RENDER ============ */
function drawGrid(){
  const step = 100;
  const x0 = Math.floor(cam.x / step) * step;
  const y0 = Math.floor(cam.y / step) * step;
  ctx.strokeStyle = 'rgba(255,255,255,0.045)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = x0; x < cam.x + W + step; x += step){
    ctx.moveTo(x - cam.x, 0); ctx.lineTo(x - cam.x, H);
  }
  for (let y = y0; y < cam.y + H + step; y += step){
    ctx.moveTo(0, y - cam.y); ctx.lineTo(W, y - cam.y);
  }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,80,80,0.5)';
  ctx.lineWidth = 4;
  ctx.strokeRect(-cam.x, -cam.y, WORLD, WORLD);
}
function drawZone(){
  const sx = zone.x - cam.x, sy = zone.y - cam.y;
  ctx.save();
  ctx.beginPath();
  ctx.rect(-100, -100, W + 200, H + 200);
  ctx.arc(sx, sy, zone.r, 0, Math.PI*2, true);
  ctx.fillStyle = 'rgba(120,20,30,0.28)';
  ctx.fill();
  ctx.restore();
  ctx.beginPath();
  ctx.arc(sx, sy, zone.r, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(255,80,120,0.85)';
  ctx.lineWidth = 3;
  ctx.stroke();
}
function drawLoot(){
  for (const l of loot){
    const sx = l.x - cam.x, sy = l.y - cam.y;
    if (sx < -40 || sx > W + 40 || sy < -40 || sy > H + 40) continue;
    ctx.save(); ctx.translate(sx, sy);
    if (l.type === 'health'){
      ctx.fillStyle = '#06d6a0';
      ctx.beginPath(); ctx.arc(0, 0, l.r, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillRect(-6, -2, 12, 4); ctx.fillRect(-2, -6, 4, 12);
    } else {
      ctx.fillStyle = WEAPONS[l.weaponKey].color;
      ctx.fillRect(-12, -6, 24, 12);
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(-4, -6, 8, 12);
    }
    ctx.restore();
  }
}
function drawEntity(ent, color){
  if (!ent.alive) return;
  const sx = ent.x - cam.x, sy = ent.y - cam.y;
  if (sx < -50 || sx > W + 50 || sy < -50 || sy > H + 50) return;
  ctx.save();
  ctx.translate(sx, sy); ctx.rotate(ent.angle);
  ctx.beginPath(); ctx.arc(0, 0, ent.r, 0, Math.PI*2);
  ctx.fillStyle = color; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = '#0a0f14'; ctx.stroke();
  ctx.fillStyle = '#111';
  ctx.fillRect(ent.r - 4, -3, 20, 6);
  ctx.fillStyle = ent.weapon.color;
  ctx.fillRect(ent.r + 10, -2, 4, 4);
  ctx.restore();

  if (ent.hp < ent.maxHp){
    const bw = 34;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(sx - bw/2, sy - ent.r - 13, bw, 5);
    const ratio = Math.max(0, ent.hp / ent.maxHp);
    ctx.fillStyle = ratio > 0.5 ? '#06d6a0' : ratio > 0.25 ? '#ffd166' : '#ef476f';
    ctx.fillRect(sx - bw/2, sy - ent.r - 13, bw * ratio, 5);
  }
  if (ent.name && ent !== player){
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(ent.name, sx, sy - ent.r - 18);
  }
}
function drawBullets(){
  for (const b of bullets){
    const sx = b.x - cam.x, sy = b.y - cam.y;
    if (sx < -10 || sx > W + 10 || sy < -10 || sy > H + 10) continue;
    ctx.beginPath(); ctx.arc(sx, sy, 3, 0, Math.PI*2);
    ctx.fillStyle = b.color; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx - b.vx * 0.012, sy - b.vy * 0.012);
    ctx.strokeStyle = b.color; ctx.lineWidth = 2;
    ctx.globalAlpha = 0.5; ctx.stroke(); ctx.globalAlpha = 1;
  }
}
function drawParticles(){
  for (const p of particles){
    const sx = p.x - cam.x, sy = p.y - cam.y;
    if (sx < -20 || sx > W + 20 || sy < -20 || sy > H + 20) continue;
    ctx.globalAlpha = Math.max(0, p.life * 2);
    ctx.fillStyle = p.color;
    ctx.fillRect(sx - 2, sy - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
}
function drawJoystick(joy){
  if (!joy.active) return;
  ctx.beginPath(); ctx.arc(joy.ox, joy.oy, JOY_R, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fill();
  let dx = joy.x - joy.ox, dy = joy.y - joy.oy;
  const d = Math.hypot(dx, dy);
  if (d > JOY_R){ dx = dx/d*JOY_R; dy = dy/d*JOY_R; }
  ctx.beginPath(); ctx.arc(joy.ox + dx, joy.oy + dy, 30, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fill();
}
function drawHUD(){
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(16, 16, 200, 26);
  const hp = Math.max(0, player.hp) / player.maxHp;
  ctx.fillStyle = hp > 0.5 ? '#06d6a0' : hp > 0.25 ? '#ffd166' : '#ef476f';
  ctx.fillRect(18, 18, 196 * hp, 22);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('HP ' + Math.max(0, Math.round(player.hp)), 24, 34);

  ctx.textAlign = 'center'; ctx.font = 'bold 22px sans-serif'; ctx.fillStyle = '#fff';
  ctx.fillText('ALIVE: ' + aliveCount, W/2, 36);
  ctx.font = '12px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.fillText('KILLS: ' + player.kills, W/2, 54);

  ctx.textAlign = 'right'; ctx.font = 'bold 16px sans-serif';
  ctx.fillStyle = player.weapon.color;
  ctx.fillText(player.weapon.name, W - 20, H - 60);
  ctx.font = 'bold 20px sans-serif'; ctx.fillStyle = '#fff';
  if (player.reloading > 0) ctx.fillText('RELOAD...', W - 20, H - 32);
  else ctx.fillText(player.ammo + ' / ' + player.weapon.ammo, W - 20, H - 32);

  ctx.textAlign = 'right'; ctx.font = '12px sans-serif';
  killFeed.forEach((k, i) => {
    ctx.globalAlpha = Math.min(1, k.t);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillText(k.text, W - 16, 100 + i * 18);
  });
  ctx.globalAlpha = 1;

  const mm = 90, mx = W - mm - 16, my = 16;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(mx, my, mm, mm);
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.strokeRect(mx, my, mm, mm);
  const kx = mm / WORLD;
  ctx.beginPath();
  ctx.arc(mx + zone.x*kx, my + zone.y*kx, zone.r*kx, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(255,80,120,0.8)'; ctx.lineWidth = 1.5; ctx.stroke();

  if (netMode === 'online'){
    for (const e of remotePlayers.values()){
      if (!e.alive) continue;
      ctx.fillStyle = '#e63946';
      ctx.fillRect(mx + e.x*kx - 1, my + e.y*kx - 1, 3, 3);
    }
  } else {
    for (const b of bots){
      if (!b.alive) continue;
      ctx.fillStyle = '#e63946';
      ctx.fillRect(mx + b.x*kx - 1, my + b.y*kx - 1, 3, 3);
    }
  }
  if (player.alive){
    ctx.fillStyle = '#4895ef';
    ctx.fillRect(mx + player.x*kx - 2, my + player.y*kx - 2, 5, 5);
  }

  if (netMode === 'online' && roomId){
    ctx.textAlign = 'left'; ctx.font = 'bold 12px sans-serif';
    ctx.fillStyle = 'rgba(6,214,160,0.9)';
    ctx.fillText('ROOM: ' + roomId, 16, 60);
  }
}
function drawEndScreen(){
  ctx.fillStyle = 'rgba(0,0,0,0.78)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  if (gameState === 'won'){
    ctx.fillStyle = '#06d6a0';
    ctx.font = 'bold 48px sans-serif';
    ctx.fillText('ПОБЕДА!', W/2, H/2 - 30);
  } else {
    ctx.fillStyle = '#ef476f';
    ctx.font = 'bold 48px sans-serif';
    ctx.fillText('ПОРАЖЕНИЕ', W/2, H/2 - 30);
  }
  ctx.fillStyle = '#fff';
  ctx.font = '18px sans-serif';
  ctx.fillText('Убийств: ' + player.kills, W/2, H/2 + 20);
  ctx.fillText('Место: #' + Math.max(1, aliveCount), W/2, H/2 + 46);
  ctx.font = 'bold 16px sans-serif';
  ctx.fillStyle = '#ffb400';
  ctx.fillText('ТАПНИ, ЧТОБЫ ВЕРНУТЬСЯ В МЕНЮ', W/2, H/2 + 100);
}

/* ============ MAIN LOOP ============ */
let last = performance.now();
let endRecorded = false;

function loop(now){
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;

  if (gameState === 'playing' && player){
    time += dt;
    updatePlayer(dt);
    if (netMode === 'offline') for (const b of bots) updateBot(b, dt);
    else updateRemotePlayers(dt);
    updateBullets(dt);
    updateLoot();
    updateZone(dt);
    updateParticles(dt);
    updateAlive();

    if (netMode === 'offline'){
      if (!player.alive) gameState = 'lost';
      else if (aliveCount === 1) gameState = 'won';
    } else {
      if (aliveCount > 1) sawOthers = true;
      if (!player.alive) gameState = 'lost';
      else if (sawOthers && aliveCount === 1) gameState = 'won';
    }

    /* записываем результат матча один раз */
    if ((gameState === 'won' || gameState === 'lost') && !endRecorded && netMode === 'online'){
      endRecorded = true;
      recordMatchResult(gameState === 'won', player.kills);
    }
    if ((gameState === 'won' || gameState === 'lost') && !endRecorded && netMode === 'offline'){
      endRecorded = true; /* оффлайн не пишем в облако */
    }

    if (now - lastSync > SYNC_INTERVAL){
      lastSync = now;
      syncMyState();
    }
  } else if (player && (gameState === 'won' || gameState === 'lost')){
    updateParticles(dt);
  }

  if (player && gameState !== 'menu') updateCamera();

  ctx.fillStyle = '#0d141c';
  ctx.fillRect(0, 0, W, H);

  if (player && gameState !== 'menu' && gameState !== 'auth'){
    drawGrid(); drawZone(); drawLoot();
    if (netMode === 'offline'){
      for (const b of bots) drawEntity(b, '#e63946');
    } else {
      for (const e of remotePlayers.values()) drawEntity(e, '#e63946');
    }
    drawEntity(player, '#4895ef');
    drawBullets(); drawParticles();

    if (gameState === 'playing'){
      drawJoystick(joyL); drawJoystick(joyR);
      drawHUD();
    } else if (gameState === 'won' || gameState === 'lost'){
      drawEndScreen();
    }
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ============ СТАРТ ============ */
/* Настраиваем режим по умолчанию (вход) и запускаем auth-флоу */
setAuthMode('login');
initAuthFlow();

})();
</script>
