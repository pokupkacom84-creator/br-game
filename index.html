<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flux Client</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@400..700&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark;--s:#fef7ff;--on-s:#1d1b20;--p:#6750a4;--pc:#eaddff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--s:#141218;--on-s:#e6e0e9;--p:#d0bcff;--pc:#4f378b}}
:root[data-theme="dark"]{--s:#141218;--on-s:#e6e0e9;--p:#d0bcff;--pc:#4f378b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
/* запрет выделения текста и системного меню «Копировать / Выбрать все» */
html,body,*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
::selection{background:transparent}
input::selection,textarea::selection{background:var(--pc)}
body{background:var(--s);color:var(--on-s);font:400 16px/1.5 "Roboto Flex",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.01em}
button,input{font:inherit;letter-spacing:inherit}
svg.ic{width:24px;height:24px;fill:currentColor;flex:none}
.rp{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.16;transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
/* app bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--s);transition:background .25s}
.bar.sc{background:var(--s2)}
.bar .in{max-width:560px;margin:0 auto;padding:20px 20px 12px;display:flex;align-items:flex-end;gap:12px;transition:padding .25s}
.bar.sc .in{padding-top:12px;padding-bottom:12px;align-items:center}
.bar .t{flex:1;min-width:0}
h1{margin:0;font-size:34px;font-weight:500;line-height:1.15;letter-spacing:0;transition:font-size .25s}
.bar.sc h1{font-size:22px}
#sub{margin:2px 0 0;font-size:14px;color:var(--on-sv);max-height:24px;overflow:hidden;transition:max-height .25s,margin .25s,opacity .25s}
.bar.sc #sub{max-height:0;margin:0;opacity:0}
.ava{width:40px;height:40px;border-radius:50%;background:var(--tc);color:var(--on-tc);display:grid;place-items:center;font-weight:600}
.app{max-width:560px;margin:0 auto;padding:8px 16px 128px}
.scr{display:none}.scr.on{display:block}
/* hero */
.hero{background:var(--s2);color:var(--on-s);border-radius:32px;padding:24px;display:flex;align-items:center;gap:16px;transition:background .4s,color .4s}
.hero.on{background:var(--pc);color:var(--on-pc)}
.hero .m{flex:1;min-width:0}
.big{font-size:28px;font-weight:500;line-height:1.2;letter-spacing:0}
.sup{margin-top:4px;opacity:.85}
.tm{margin-top:14px;font-size:32px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:0}
.pw{width:96px;height:96px;flex:none;border:0;border-radius:28px;background:var(--p);color:var(--on-p);cursor:pointer;display:grid;place-items:center;transition:border-radius .5s cubic-bezier(.3,0,0,1.25),transform .15s}
.pw svg{width:40px;height:40px}
.pw:active{transform:scale(.94)}
.hero.on .pw{border-radius:48px}
.hero.busy .pw{animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.88);border-radius:48px}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 16px}
.stat{border-radius:24px;padding:16px 14px}
.stat svg{width:20px;height:20px}
.stat b{display:block;font-size:26px;font-weight:500;line-height:1.2;margin-top:10px;letter-spacing:0}
.stat small{font-size:12px;opacity:.8}
.stat.a{background:var(--sc);color:var(--on-sc)}.stat.b{background:var(--tc);color:var(--on-tc)}.stat.c{background:var(--s2)}
.btn{height:48px;padding:0 24px;border:0;border-radius:24px;background:var(--sc);color:var(--on-sc);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
/* grouped lists */
.lbl{font-size:14px;font-weight:500;color:var(--p);margin:20px 12px 8px}
.grp>*{border-radius:6px;margin-bottom:2px}
.grp>:first-child{border-top-left-radius:28px;border-top-right-radius:28px}
.grp>:last-child{border-bottom-left-radius:28px;border-bottom-right-radius:28px;margin-bottom:0}
.li{display:flex;align-items:center;gap:16px;width:100%;border:0;background:var(--s1);color:var(--on-s);text-align:left;padding:14px 20px;cursor:pointer;transition:background .25s}
.li.sel{background:var(--pc);color:var(--on-pc)}
.li.col{flex-direction:column;align-items:stretch;gap:14px;cursor:default}
.lead{width:44px;height:44px;border-radius:50%;background:var(--sc);color:var(--on-sc);display:grid;place-items:center;font-size:24px;line-height:1;flex:none}
.li.sel .lead{background:var(--s);color:var(--on-s)}
.m b{display:block;font-weight:500}.m small{display:block;color:var(--on-sv);font-size:14px;line-height:1.35}
.li.sel .m small{color:inherit;opacity:.8}
.m{flex:1;min-width:0}
.rad{width:20px;height:20px;border-radius:50%;border:2px solid var(--ol);display:grid;place-items:center;flex:none}
.li.sel .rad{border-color:var(--p)}.li.sel .rad::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--p)}
.field{display:flex;align-items:center;gap:12px;background:var(--s3);border-radius:28px;padding:0 20px;height:56px;color:var(--on-sv)}
.field input{flex:1;min-width:0;border:0;background:none;outline:0;color:var(--on-s)}
.empty{text-align:center;color:var(--on-sv);padding:32px 0}
.sw{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:16px;border:2px solid var(--ol);background:var(--s3);position:relative;cursor:pointer;transition:.2s;flex:none;margin:0}
.sw::after{content:"";position:absolute;top:6px;left:6px;width:16px;height:16px;border-radius:50%;background:var(--ol);transition:.2s}
.sw:checked{background:var(--p);border-color:var(--p)}
.sw:checked::after{width:24px;height:24px;top:2px;left:22px;background:var(--on-p)}
.seg{display:flex;border:1px solid var(--ol);border-radius:20px;overflow:hidden}
.seg button{flex:1;border:0;background:none;color:var(--on-s);font-weight:500;font-size:14px;height:40px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button+button{border-left:1px solid var(--ol)}
.seg button.on{background:var(--sc);color:var(--on-sc)}
.seg svg{width:18px;height:18px;display:none}.seg .on svg{display:block}
.sws{display:flex;gap:10px;flex-wrap:wrap}
.tile{width:60px;height:60px;border-radius:22px;border:2px solid transparent;cursor:pointer;display:grid;place-items:center;padding:0;position:relative;transition:border-color .2s}
.tile.on{border-color:var(--p)}
.dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff}
.dot svg{width:20px;height:20px;opacity:0;transition:opacity .2s}.tile.on .dot svg{opacity:1}
.tile input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
/* nav */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;background:var(--s1);display:flex;padding:12px 8px calc(16px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--on-sv);font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.pill{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .25s}
nav button.on{color:var(--on-s);font-weight:700}nav button.on .pill{background:var(--sc);color:var(--on-sc)}
:focus-visible{outline:3px solid var(--p);outline-offset:2px}
#snack{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--inv);color:var(--on-inv);padding:14px 20px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}
#snack.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

[hidden]{display:none!important}
.ava{border:0;cursor:pointer;font-size:16px}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.gbox{width:100%;max-width:420px;background:var(--s1);border-radius:32px;padding:28px 24px}
.gbox .logo{width:56px;height:56px;border-radius:18px;background:var(--p);color:var(--on-p);display:grid;place-items:center;margin-bottom:16px}
.gbox h2{margin:0 0 4px;font-size:28px;font-weight:500;letter-spacing:0}
.gbox p{margin:0 0 20px;color:var(--on-sv)}
.tf{display:block;position:relative;margin-bottom:12px}
.tf input{width:100%;height:56px;border:1px solid var(--ol);border-radius:16px;background:none;color:var(--on-s);padding:20px 16px 4px;outline:0}
.tf span{position:absolute;left:16px;top:16px;color:var(--on-sv);pointer-events:none;transition:.15s}
.tf input:focus+span,.tf input:not(:placeholder-shown)+span{top:5px;font-size:12px}
.tf input:focus{border:2px solid var(--p);padding-left:15px}.tf input:focus+span{color:var(--p)}
.fbtn{width:100%;height:52px;border:0;border-radius:26px;background:var(--p);color:var(--on-p);font-weight:500;cursor:pointer;margin:8px 0 4px}
.fbtn:disabled{opacity:.5}
.tbtn{height:44px;border:0;background:none;color:var(--p);font-weight:500;cursor:pointer;padding:0 14px;border-radius:22px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;align-items:end;justify-items:center;z-index:20}
.dlg{width:100%;max-width:560px;background:var(--s1);border-radius:28px 28px 0 0;padding:24px 24px calc(24px + env(safe-area-inset-bottom,0px))}
.dlg h3{margin:0 0 16px;font-size:24px;font-weight:500;letter-spacing:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chp{flex:none;height:34px;padding:0 14px;border:1px solid var(--ol);border-radius:10px;background:none;color:var(--on-sv);font-weight:500;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px}
.chp.on{background:var(--sc);color:var(--on-sc);border-color:transparent}
.chp svg{width:18px;height:18px}
.ib{width:40px;height:40px;border:0;border-radius:50%;background:none;color:var(--on-sv);display:grid;place-items:center;cursor:pointer;flex:none}
.pro{display:inline-flex;align-items:center;gap:4px;background:var(--tc);color:var(--on-tc);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:600;margin-top:6px}
.pro svg{width:14px;height:14px}
.price{font-size:20px;font-weight:500}
.avb{width:72px;height:72px;flex:none;border-radius:50%;background:var(--tc);color:var(--on-tc);display:grid;place-items:center;font-size:30px;font-weight:600}
.phero{display:flex;gap:16px;align-items:center;background:var(--s2);border-radius:32px;padding:20px}
.phero.pr{background:var(--pc);color:var(--on-pc)}
.refc{background:var(--tc);color:var(--on-tc);border-radius:28px;padding:20px}
.refc .lnk{background:var(--s);color:var(--on-s);border-radius:14px;padding:10px 14px;margin:12px 0;font-size:13px;word-break:break-all}
.refc .btn{background:var(--s);color:var(--on-s);height:44px;padding:0 18px}.refc .btn.f{background:var(--p);color:var(--on-p)}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.more{display:block;margin:10px auto}
</style>
</head>
<body>
<div id="gate" class="gate" hidden><div class="gbox" id="gbox"></div></div>
<div id="app" hidden>
<header class="bar" id="bar"><div class="in"><div class="t"><h1 id="h1">Flux Client</h1><p id="sub">Не активен</p></div><button class="ava rp" id="ava" aria-label="Профиль">F</button></div></header>
<div class="app">
 <section id="home" class="scr on">
  <div class="hero" id="hero"><div class="m"><div class="big" id="st">Не активен</div><div class="sup" id="srv">Ключ не выбран</div><div class="tm" id="tm">00:00:00</div></div><button class="pw rp" id="pw" aria-label="Активировать ключ"><i data-i="power"></i></button></div>
  <div class="lbl">Сводка</div>
  <div class="stats"><div class="stat a"><i data-i="key"></i><b id="n-keys">0</b><small>ключей в списке</small></div><div class="stat b"><i data-i="dns"></i><b id="n-proto">—</b><small>протокол</small></div><div class="stat c"><i data-i="crown"></i><b id="n-prem">Нет</b><small>Premium</small></div></div>
  <button class="btn rp" id="chg"><i data-i="key"></i>Выбрать ключ</button>
 </section>
 <section id="keys" class="scr"><div class="chips" id="cats"></div><div class="chips" id="srcs"></div><div class="lbl" id="kcount">Ключи</div><div class="grp" id="klist"></div></section>
 <section id="shop" class="scr"><div id="sbox"></div></section>
 <section id="me" class="scr"><div id="mbox"></div>
  <div class="lbl">Приложение</div>
  <div class="grp">
   <label class="li rp"><span class="lead"><i data-i="sync"></i></span><span class="m"><b>Автоактивация</b><small>Активировать выбранный ключ при запуске</small></span><input class="sw" type="checkbox" data-k="auto"></label>
   <label class="li rp"><span class="lead"><i data-i="bell"></i></span><span class="m"><b>Уведомления</b><small>Сообщать о смене статуса</small></span><input class="sw" type="checkbox" data-k="notif"></label>
  </div>
  <div class="lbl">Оформление</div>
  <div class="grp">
   <div class="li col"><div style="display:flex;align-items:center;gap:16px"><span class="lead"><i data-i="contrast"></i></span><span class="m"><b>Тема</b></span></div>
    <div class="seg" id="seg"><button data-m="auto"><i data-i="check"></i>Авто</button><button data-m="light"><i data-i="check"></i>Светлая</button><button data-m="dark"><i data-i="check"></i>Тёмная</button></div></div>
   <div class="li col"><div style="display:flex;align-items:center;gap:16px"><span class="lead"><i data-i="palette"></i></span><span class="m"><b>Динамические цвета</b><small>Выберите цвет, палитра подстроится</small></span></div><div class="sws" id="sws"></div></div>
  </div>
 </section>
</div>
<nav>
 <button data-t="home" class="on"><span class="pill"><i data-i="home"></i></span>Главная</button>
 <button data-t="keys"><span class="pill"><i data-i="key"></i></span>Ключи</button>
 <button data-t="shop"><span class="pill"><i data-i="shop"></i></span>Магазин</button>
 <button data-t="me"><span class="pill"><i data-i="user"></i></span>Профиль</button>
</nav>
</div>
<div class="scrim" id="scrim" hidden><div class="dlg" id="dlg"></div></div>
<div id="snack" role="status"></div>

<script>

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const IC={
power:"M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z",

plus:"M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"};
const icons=r=>r.querySelectorAll('i[data-i]').forEach(e=>{e.outerHTML=`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="${IC[e.dataset.i]}"/></svg>`});
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---- Динамические цвета Material 3: тональные палитры в OKLCH (тон ≈ L* из HCT) ---- */
const tl=t=>t<=8?Math.cbrt(t/903.3):(t+16)/116;

async function loadHist(){try{const a=(await db.ref('payments/'+user.uid).once('value')).val()||{};hist=Object.values(a).filter(x=>x&&x.type==='premium'&&x.status==='confirmed').sort((a,b)=>(+b.confirmedAt||+b.createdAt||0)-(+a.confirmedAt||+a.createdAt||0)).slice(0,8)}catch(e){hist=[]}rShop()}

/* ---------- профиль и рефералы ---------- */
function dlg(h){put($('#dlg'),h);$('#scrim').hidden=false}
const closeDlg=()=>{$('#scrim').hidden=true};
$('#scrim').onclick=e=>{if(e.target.id==='scrim')closeDlg()};
function rMe(){
 if(!user)return;
 const name=ud.name||'Пользователь',ref=`https://t.me/${BOT}?start=ref_${encodeURIComponent(user.uid)}`;
 put($('#mbox'),`<div class="phero"><div class="avb">${esc((name[0]||'F').toUpperCase())}</div><div class="m"><b style="font-size:22px">${esc(name)}</b><small>${ud.username?'@'+esc(ud.username)+' · ':''}${esc(user.email||'')}</small>${ud.status?`<small>${esc(ud.status)}</small>`:''}${isPrem()?'<span class="pro"><i data-i="crown"></i>Premium</span>':''}</div></div>
 <div class="lbl">Реферальная программа</div>
 <div class="refc"><b style="font-size:20px">15 ₽ за каждого приглашённого друга</b><div style="margin-top:6px;font-size:14px;opacity:.85">Баланс: ${refBal} ₽ · Друзей: ${+refSt.totalInvited||0} · Заработано: ${+refSt.totalBonus||0} ₽</div><div class="lnk">${esc(ref)}</div><div class="row2"><button class="btn rp" id="rcp"><i data-i="copy"></i>Копировать</button><button class="btn f rp" id="rsh"><i data-i="share"></i>Поделиться</button></div></div>
 <div class="lbl">Аккаунт</div>
 <div class="grp"><button class="li rp" id="ed"><span class="lead"><i data-i="edit"></i></span><span class="m"><b>Редактировать профиль</b><small>Имя и статус</small></span></button><button class="li rp" id="lo"><span class="lead"><i data-i="logout"></i></span><span class="m"><b>Выйти</b><small>${esc(user.email||'')}</small></span></button></div>`);
 $('#rcp').onclick=()=>cp(ref,'Ссылка скопирована');
 $('#rsh').onclick=()=>openUrl('https://t.me/share/url?url='+encodeURIComponent(ref)+'&text='+encodeURIComponent('Заходи в Flux! За каждого приглашённого друга начисляется 15 ₽ на баланс.'));
 $('#lo').onclick=()=>auth.signOut();
 $('#ed').onclick=()=>{dlg(`<h3>Профиль</h3>${TF('en','Имя','text',`value="${esc(ud.name||'')}"`)}${TF('es','Статус','text',`value="${esc(ud.status||'')}"`)}<div class="row2" style="justify-content:flex-end"><button class="tbtn" id="dx">Отмена</button><button class="tbtn" id="ds">Сохранить</button></div>`);
  $('#dx').onclick=closeDlg;$('#ds').onclick=async()=>{const n=$('#en').value.trim();if(!n){snack('Введите имя');return}try{await db.ref('users/'+user.uid).update({name:n.slice(0,40),status:$('#es').value.trim().slice(0,80)});closeDlg();snack('Профиль сохранён')}catch(e){snack('Не удалось сохранить')}}}}
function rAll(){
 if(!user)return;
 const n=(ud.name||user.email||'F')[0].toUpperCase();$('#ava').textContent=n;
 rHome();rShop();rMe();if(!$('#keys').classList.contains('x')){const s=curSrc();if(s.p)rKeys()}}

/* ---------- вход, регистрация, 2FA ---------- */
const TF=(id,l,t='text',x='')=>`<label class="tf"><input id="${id}" type="${t}" placeholder=" " ${x}><span>${l}</span></label>`;
const AE={'auth/invalid-email':'Неверный email','auth/user-not-found':'Пользователь не найден','auth/wrong-password':'Неверный пароль','auth/invalid-credential':'Неверный email или пароль','auth/email-already-in-use':'Этот email уже зарегистрирован','auth/weak-password':'Слишком простой пароль','auth/too-many-requests':'Слишком много попыток. Попробуйте позже','auth/network-request-failed':'Нет соединения с сетью','auth/operation-not-supported-in-this-environment':'Откройте файл через http(s), а не file://'};
const aerr=e=>e&&e.m?e.m:(AE[e&&e.code]||'Не удалось выполнить действие');
const T={
 login:{h:'Вход',s:'Войдите в аккаунт Flux',f:TF('e','Email','email','autocomplete="email"')+TF('p','Пароль','password','autocomplete="current-password"'),b:'Войти',alt:['Создать аккаунт','reg']},
 reg:{h:'Регистрация',s:'Создайте новый аккаунт',f:TF('e','Email','email','autocomplete="email"')+TF('p','Пароль (от 6 символов)','password','autocomplete="new-password"')+TF('p2','Повторите пароль','password','autocomplete="new-password"'),b:'Создать аккаунт',alt:['Уже есть аккаунт','login']},
 tf:{h:'Код подтверждения',s:'Введите 6 цифр из приложения-аутентификатора',f:TF('c','Код','text','inputmode="numeric" maxlength="6" autocomplete="one-time-code"'),b:'Подтвердить',alt:['Отмена','login']},
 onb:{h:'Ваш профиль',s:'Выберите имя и username',f:TF('n','Имя','text','maxlength="40"')+TF('u','Username (латиница, цифры, _)','text','maxlength="24" autocapitalize="none"'),b:'Продолжить',alt:['Выйти','out']}};
function gate(m){
 const t=T[m];$('#gate').hidden=false;$('#app').hidden=true;
 put($('#gbox'),`<div class="logo"><i data-i="bolt"></i></div><h2>${t.h}</h2><p>${t.s}</p>${t.f}<button class="fbtn rp" id="go">${t.b}</button><button class="tbtn" id="alt">${t.alt[0]}</button>`);
 $('#alt').onclick=()=>{if(t.alt[1]==='out')auth.signOut();else gate(t.alt[1])};
 const go=$('#go');const run=async()=>{go.disabled=true;try{await H[m]()}catch(e){snack(aerr(e))}go.disabled=false};
 go.onclick=run;$('#gbox').onkeydown=e=>{if(e.key==='Enter')run()}}
const tsec=async uid=>(await db.ref('users/'+uid+'/twofa').once('value')).val();
const H={
 async login(){const e=$('#e').value.trim(),p=$('#p').value;if(!e||!p)throw{m:'Заполните все поля'};
  hold=true;try{const c=await auth.signInWithEmailAndPassword(e,p);const tw=await tsec(c.user.uid);
   if(tw&&tw.enabled&&!localStorage.getItem('fx-2fa-'+c.user.uid)){await auth.signOut();creds={e,p};hold=false;gate('tf');return}
   hold=false;user=c.user;await boot()}catch(x){hold=false;throw x}},
 async reg(){const e=$('#e').value.trim(),p=$('#p').value;if(!e||!p)throw{m:'Заполните все поля'};if(p.length<6)throw{m:'Пароль минимум 6 символов'};if(p!==$('#p2').value)throw{m:'Пароли не совпадают'};
  hold=true;try{const c=await auth.createUserWithEmailAndPassword(e,p);hold=false;user=c.user;await boot()}catch(x){hold=false;throw x}},
 async tf(){const code=$('#c').value.replace(/\D/g,'');if(code.length!==6)throw{m:'Код из 6 цифр'};
  hold=true;try{const c=await auth.signInWithEmailAndPassword(creds.e,creds.p);const tw=await tsec(c.user.uid);
   if(tw&&tw.secret&&await okTotp(tw.secret,code)){localStorage.setItem('fx-2fa-'+c.user.uid,'1');hold=false;user=c.user;creds=null;await boot()}
   else{await auth.signOut();hold=false;gate('login');throw{m:'Неверный код'}}}catch(x){hold=false;throw x}},
 async onb(){const n=$('#n').value.trim(),u=$('#u').value.trim().toLowerCase();
  if(!n)throw{m:'Введите имя'};if(u.length<3)throw{m:'Username минимум 3 символа'};if(!/^[a-z0-9_]+$/.test(u))throw{m:'Только латиница, цифры и _'};
  const t=await db.ref('usernames/'+u).once('value');if(t.exists()&&t.val()!==user.uid)throw{m:'Username занят'};
  await db.ref().update({['users/'+user.uid]:{name:n,username:u,avatarId:'initials',lastSeen:Date.now(),online:true,bio:'',status:''},['usernames/'+u]:user.uid});enter()}};
const b32=s=>{let b='';for(const c of s.toUpperCase().replace(/[^A-Z2-7]/g,''))b+='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567'.indexOf(c).toString(2).padStart(5,'0');const o=[];for(let i=0;i+8<=b.length;i+=8)o.push(parseInt(b.substr(i,8),2));return new Uint8Array(o)};
async function totp(sec,t){const k=await crypto.subtle.importKey('raw',b32(sec),{name:'HMAC',hash:'SHA-1'},false,['sign']),c=Math.floor(t/30),bf=new ArrayBuffer(8),v=new DataView(bf);v.setUint32(0,Math.floor(c/4294967296));v.setUint32(4,c>>>0);const h=new Uint8Array(await crypto.subtle.sign('HMAC',k,bf)),o=h[19]&15;return String((((h[o]&127)<<24)|(h[o+1]<<16)|(h[o+2]<<8)|h[o+3])%1e6).padStart(6,'0')}
async function okTotp(sec,code){const n=Math.floor(Date.now()/1000);for(const i of[-1,0,1])if(await totp(sec,n+i*30)===code)return true;return false}

async function boot(){
 const s=await db.ref('users/'+user.uid).once('value');
 if(!s.exists()){gate('onb');return}
 enter()}
function listen(){
 off();const L=(p,f)=>{const r=db.ref(p);r.on('value',s=>{f(s.val());rAll()},()=>{});subs.push(r)};
 L('users/'+user.uid,v=>ud=v||{});L('users/'+user.uid+'/premium',v=>prem=v||{});L('settings/globalPremium',v=>gprem=v||{active:false});
 L('users/'+user.uid+'/refBalance/rub',v=>refBal=+v||0);L('users/'+user.uid+'/refStats',v=>refSt=v||{})}
function off(){subs.forEach(r=>r.off());subs=[]}
function enter(){
 store.set('fx-li','1');$('#gate').hidden=true;$('#app').hidden=false;listen();loadHist();loadKeys();rAll();tab('home');
 if(store.get('fx-auto','0')==='1'&&selKey)setTimeout(toggle,900)}
auth.onAuthStateChanged(u=>{
 if(hold)return;user=u;
 if(!u){store.set('fx-li','0');off();clearInterval(tick);state=0;ud={};prem={};hist=null;gate('login');return}
 boot().catch(()=>{snack('Не удалось загрузить профиль');gate('login')})});

/* ---------- навигация ---------- */
const TT={home:'Flux Client',keys:'Ключи VPN',shop:'Магазин',me:'Профиль'};
function tab(t){
 $$('nav button').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
 $$('.scr').forEach(s=>s.classList.toggle('on',s.id===t));
 $('#h1').textContent=TT[t];$('#sub').textContent=t==='home'?['Не активен','Подготовка…','Ключ активен'][state]:'';
 $('#sub').style.display=t==='home'?'':'none';scrollTo(0,0);
 if(t==='shop'&&user)loadHist();
 if(t==='keys')rKeys()}
$$('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
$('#ava').onclick=()=>tab('me');

/* ---------- тема ---------- */
const dq=matchMedia('(prefers-color-scheme: dark)');
function apply(){
 const d=mode==='dark'||(mode==='auto'&&dq.matches),r=document.documentElement,c=scheme(hue,d);
 r.dataset.theme=d?'dark':'light';for(const k in c)r.style.setProperty('--'+k,c[k]);r.style.setProperty('--olv',c.ol+'55');
 $$('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
 const HU=[293,255,195,145,60,350];
 put($('#sws'),HU.map(h=>{const s=scheme(h,d);return`<button class="tile rp${Math.abs(h-hue)<1?' on':''}" data-h="${h}" aria-label="Цвет ${h}" style="background:${s.sc}"><span class="dot" style="background:conic-gradient(${s.p} 0 50%,${s.t} 50% 75%,${s.pc} 75%)"><i data-i="check"></i></span></button>`}).join('')+`<label class="tile" style="background:${c.s3}" aria-label="Свой цвет"><span class="dot" style="color:var(--on-sv)"><i data-i="plus"></i></span><input type="color" id="cc" value="${hex(tl(d?80:40),.15,hue)}"></label>`)}
dq.addEventListener('change',apply);
$('#seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;store.set('fx-mode',mode);apply()};
$('#sws').onclick=e=>{const b=e.target.closest('.tile[data-h]');if(!b)return;hue=+b.dataset.h;store.set('fx-h',hue);apply()};
$('#sws').addEventListener('change',e=>{if(e.target.id!=='cc')return;hue=hueOf(e.target.value);store.set('fx-h',hue);apply()});
$$('.sw').forEach(c=>{c.checked=store.get('fx-'+c.dataset.k,'0')==='1';c.onchange=()=>store.set('fx-'+c.dataset.k,c.checked?'1':'0')});
document.addEventListener('pointerdown',e=>{const t=e.target.closest('.rp');if(!t)return;const r=t.getBoundingClientRect(),s=Math.max(r.width,r.height)*1.4,x=document.createElement('span');x.className='rip';x.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;t.appendChild(x);x.onanimationend=()=>x.remove()});
document.addEventListener('contextmenu',e=>{if(!e.target.closest('input,textarea'))e.preventDefault()});
document.addEventListener('selectstart',e=>{if(!e.target.closest||!e.target.closest('input,textarea'))e.preventDefault()});
addEventListener('scroll',()=>$('#bar').classList.toggle('sc',scrollY>8),{passive:true});
icons(document);apply();
/* если пользователь уже входил — сразу показываем приложение, не дожидаясь ответа Firebase */
if(store.get('fx-li','0')==='1')$('#app').hidden=false;

</script>
