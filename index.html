<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happ Free Keys</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #0f0f13;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 16px;
        }

        .header {
            text-align: center;
            padding: 20px 0 16px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 13px;
            color: #888;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1a1a22;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 13px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #fdcb6e;
            margin-right: 8px;
            display: inline-block;
            animation: pulse 1.2s infinite;
        }

        .status-dot.ok { background: #00b894; animation: none; }
        .status-dot.err { background: #e17055; animation: none; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: #fff;
        }

        .btn-primary:active { transform: scale(0.96); }

        .btn-secondary {
            background: #2d2d3a;
            color: #ccc;
        }

        .btn-secondary:active { background: #3d3d4a; }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 8px;
        }

        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .controls .btn { flex: 1; }

        .key-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .key-card {
            background: #1a1a22;
            border-radius: 14px;
            padding: 14px 16px;
            border: 1px solid #2a2a35;
            transition: border-color 0.2s;
            position: relative;
            overflow: hidden;
        }

        .key-card:active { border-color: #6c5ce7; }

        .key-card .protocol-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .protocol-badge.vless { background: #00b89433; color: #00b894; }
        .protocol-badge.vmess { background: #0984e333; color: #0984e3; }
        .protocol-badge.trojan { background: #e1705533; color: #e17055; }
        .protocol-badge.ss { background: #fdcb6e33; color: #fdcb6e; }

        .key-card .key-name {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 6px;
            word-break: break-all;
            line-height: 1.4;
        }

        .key-card .key-preview {
            font-size: 11px;
            color: #555;
            font-family: 'Courier New', monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 10px;
        }

        .key-card .card-actions {
            display: flex;
            gap: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #555;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .empty-state p {
            font-size: 14px;
            line-height: 1.5;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #2d2d3a;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 999;
            pointer-events: none;
            max-width: 90vw;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .loader {
            display: none;
            justify-content: center;
            padding: 40px;
        }

        .loader.active { display: flex; }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #2d2d3a;
            border-top-color: #6c5ce7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-msg {
            background: #e1705515;
            border: 1px solid #e1705540;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13px;
            color: #e17055;
            margin-bottom: 12px;
            display: none;
        }

        .error-msg.show { display: block; }

        .footer {
            text-align: center;
            padding: 24px 0 12px;
            font-size: 11px;
            color: #444;
        }

        .footer a { color: #6c5ce7; text-decoration: none; }

        /* Скрытый textarea для копирования */
        #copyHelper {
            position: fixed;
            left: -9999px;
            top: -9999px;
            opacity: 0;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🔑 Happ Free Keys</h1>
        <p>Бесплатные конфигурации для Happ VPN</p>
    </div>

    <div class="status-bar">
        <div>
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Готов к загрузке</span>
        </div>
        <span id="keyCount" style="color:#6c5ce7;font-weight:600;">0</span>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="controls">
        <button class="btn btn-primary" id="fetchBtn" onclick="fetchKeys()">
            ⬇ Загрузить ключи
        </button>
        <button class="btn btn-secondary" id="clearBtn" onclick="clearKeys()">
            🗑 Очистить
        </button>
    </div>

    <div class="loader" id="loader">
        <div class="spinner"></div>
    </div>

    <div class="key-list" id="keyList">
        <div class="empty-state" id="emptyState">
            <div class="icon">📡</div>
            <p>Нажмите «Загрузить ключи»,<br>чтобы получить бесплатные конфигурации</p>
        </div>
    </div>

    <div class="footer">
        Источники: <a href="https://github.com/barry-far/V2ray-Configs" target="_blank">GitHub / V2ray-Configs</a>
        <br>Ключи публичные и могут быть нестабильны
    </div>

    <div class="toast" id="toast"></div>
    <textarea id="copyHelper" readonly></textarea>

    <script>
    // ============================================================
    //  ИСТОЧНИКИ БЕСПЛАТНЫХ КОНФИГУРАЦИЙ
    // ============================================================
    // Публичные репозитории GitHub, которые обновляются ежедневно.
    // Формат: обычный текст, по одной ссылке на строку.
    // Поддерживаются: vless://, vmess://, trojan://, ss://
    // ============================================================

    const SOURCES = [
        {
            name: 'barry-far / V2ray-Configs (VLESS)',
            url: 'https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/All_Configs_Sub.txt',
            type: 'raw'
        },
        {
            name: 'barry-far / V2ray-Configs (Reality)',
            url: 'https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Splitted-By-Protocol/vless.txt',
            type: 'raw'
        },
        {
            name: 'v2ray-links / v2ray-free',
            url: 'https://raw.githubusercontent.com/v2ray-links/v2ray-free/master/v2ray',
            type: 'raw'
        },
        {
            name: 'DukeMehdi / FreeList-V2ray-Configs',
            url: 'https://raw.githubusercontent.com/DukeMehdi/FreeList-V2ray-Configs/main/Sub1.txt',
            type: 'raw'
        }
    ];

    // ============================================================
    //  ГЛОБАЛЬНОЕ СОСТОЯНИЕ
    // ============================================================
    let allKeys = [];       // массив объектов { raw, protocol, source }
    let isFetching = false;

    // ============================================================
    //  УТИЛИТЫ
    // ============================================================

    /**
     * Показывает всплывающее уведомление (тост).
     */
    function showToast(msg, duration = 2200) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => toast.classList.remove('show'), duration);
    }

    /**
     * Копирует текст в буфер обмена.
     * Использует нативный API с fallback на execCommand для WebView.
     */
    function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('✅ Скопировано в буфер');
            }).catch(() => fallbackCopy(text));
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        const helper = document.getElementById('copyHelper');
        helper.value = text;
        helper.select();
        helper.setSelectionRange(0, 99999);
        try {
            document.execCommand('copy');
            showToast('✅ Скопировано в буфер');
        } catch (e) {
            showToast('❌ Не удалось скопировать');
        }
        helper.value = '';
    }

    /**
     * Определяет протокол по префиксу ссылки.
     */
    function detectProtocol(link) {
        const l = link.toLowerCase().trim();
        if (l.startsWith('vless://')) return 'vless';
        if (l.startsWith('vmess://')) return 'vmess';
        if (l.startsWith('trojan://')) return 'trojan';
        if (l.startsWith('ss://')) return 'ss';
        return 'unknown';
    }

    /**
     * Извлекает имя сервера из ссылки (фрагмент после #).
     */
    function extractName(link) {
        try {
            const hashIndex = link.lastIndexOf('#');
            if (hashIndex !== -1) {
                const name = decodeURIComponent(link.substring(hashIndex + 1));
                if (name) return name;
            }
            // Пытаемся вытащить host из ссылки
            const match = link.match(/@([^:\/?#]+)/);
            if (match) return match[1];
        } catch (e) {}
        return 'Сервер';
    }

    /**
     * Обрезает ссылку для превью.
     */
    function truncate(str, len = 60) {
        return str.length > len ? str.substring(0, len) + '...' : str;
    }

    /**
     * Экранирует HTML.
     */
    function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ============================================================
    //  ЗАГРУЗКА КЛЮЧЕЙ
    // ============================================================

    /**
     * Загружает все источники параллельно, парсит и отображает ключи.
     */
    async function fetchKeys() {
        if (isFetching) return;
        isFetching = true;

        const fetchBtn = document.getElementById('fetchBtn');
        const loader = document.getElementById('loader');
        const errorMsg = document.getElementById('errorMsg');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        // UI: загрузка
        fetchBtn.disabled = true;
        fetchBtn.textContent = '⏳ Загрузка...';
        loader.classList.add('active');
        errorMsg.classList.remove('show');
        statusDot.className = 'status-dot';
        statusText.textContent = 'Загрузка...';

        const collected = [];
        const errors = [];

        // Загружаем источники параллельно
        const promises = SOURCES.map(async (src) => {
            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 15000);

                const resp = await fetch(src.url, { signal: controller.signal });
                clearTimeout(timeout);

                if (!resp.ok) {
                    throw new Error(`HTTP ${resp.status}`);
                }

                const text = await resp.text();

                // Парсим: каждая строка — потенциальный конфиг
                const lines = text.split(/\r?\n/);
                let sourceCount = 0;

                for (const line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed) continue;

                    const proto = detectProtocol(trimmed);
                    if (proto === 'unknown') continue;

                    collected.push({
                        raw: trimmed,
                        protocol: proto,
                        source: src.name,
                        name: extractName(trimmed)
                    });
                    sourceCount++;
                }

                console.log(`[Happ] ${src.name}: ${sourceCount} ключей`);
            } catch (e) {
                console.warn(`[Happ] Ошибка источника ${src.name}:`, e.message);
                errors.push(`${src.name}: ${e.message}`);
            }
        });

        await Promise.allSettled(promises);

        // Дедупликация по raw-строке
        const seen = new Set();
        const unique = [];
        for (const k of collected) {
            if (!seen.has(k.raw)) {
                seen.add(k.raw);
                unique.push(k);
            }
        }

        allKeys = unique;

        // UI: результат
        loader.classList.remove('active');
        fetchBtn.disabled = false;
        fetchBtn.textContent = '⬇ Загрузить ключи';
        isFetching = false;

        if (allKeys.length === 0) {
            statusDot.className = 'status-dot err';
            statusText.textContent = 'Ключи не найдены';
            errorMsg.textContent = errors.length
                ? 'Ошибки: ' + errors.join('; ')
                : 'Не удалось загрузить ни одного ключа. Проверьте интернет.';
            errorMsg.classList.add('show');
            renderKeys();
            return;
        }

        statusDot.className = 'status-dot ok';
        statusText.textContent = `Загружено (${errors.length ? errors.length + ' ошибок' : 'OK'})`;

        if (errors.length) {
            errorMsg.textContent = 'Некоторые источники недоступны: ' + errors.join('; ');
            errorMsg.classList.add('show');
        }

        renderKeys();
        showToast(`✅ Загружено ${allKeys.length} ключей`);
    }

    // ============================================================
    //  ОТОБРАЖЕНИЕ
    // ============================================================

    /**
     * Рендерит список ключей.
     */
    function renderKeys() {
        const list = document.getElementById('keyList');
        const countEl = document.getElementById('keyCount');

        countEl.textContent = allKeys.length;

        if (allKeys.length === 0) {
            list.innerHTML = `
                <div class="empty-state" id="emptyState">
                    <div class="icon">📡</div>
                    <p>Нажмите «Загрузить ключи»,<br>чтобы получить бесплатные конфигурации</p>
                </div>`;
            return;
        }

        // Сортируем: сначала vless, потом vmess, trojan, ss
        const order = { vless: 0, vmess: 1, trojan: 2, ss: 3 };
        const sorted = [...allKeys].sort((a, b) => (order[a.protocol] ?? 9) - (order[b.protocol] ?? 9));

        let html = '';
        for (let i = 0; i < sorted.length; i++) {
            const k = sorted[i];
            const protoClass = k.protocol;
            const protoLabel = k.protocol.toUpperCase();

            html += `
                <div class="key-card" data-index="${i}">
                    <span class="protocol-badge ${protoClass}">${protoLabel}</span>
                    <div class="key-name">${esc(k.name)}</div>
                    <div class="key-preview">${esc(truncate(k.raw, 70))}</div>
                    <div class="card-actions">
                        <button class="btn btn-primary btn-sm" onclick="copyKey(${i})">📋 Копировать</button>
                        <button class="btn btn-secondary btn-sm" onclick="openInHapp(${i})">🚀 Открыть в Happ</button>
                    </div>
                </div>`;
        }

        list.innerHTML = html;
    }

    /**
     * Копирует ключ по индексу.
     */
    function copyKey(index) {
        const sorted = getSortedKeys();
        const k = sorted[index];
        if (k) copyToClipboard(k.raw);
    }

    /**
     * Пытается открыть ссылку через happ:// deeplink.
     * Happ поддерживает схему happ://add?url=...
     * Если приложение не установлено — предложит скопировать.
     */
    function openInHapp(index) {
        const sorted = getSortedKeys();
        const k = sorted[index];
        if (!k) return;

        // Формируем deeplink для Happ.
        // Happ принимает happ://add?url=<encoded_subscription_url>
        // Но мы можем передать и отдельный ключ через буфер.
        // Самый надёжный способ — скопировать и открыть Happ.
        copyToClipboard(k.raw);
        showToast('📋 Ключ скопирован. Вставьте его в Happ → «+» → «Добавить из буфера»', 4000);

        // Пробуем открыть Happ (если установлен)
        try {
            window.location.href = 'happ://';
        } catch (e) {
            // Приложение не установлено — ничего страшного
        }
    }

    /**
     * Возвращает отсортированный массив ключей.
     */
    function getSortedKeys() {
        const order = { vless: 0, vmess: 1, trojan: 2, ss: 3 };
        return [...allKeys].sort((a, b) => (order[a.protocol] ?? 9) - (order[b.protocol] ?? 9));
    }

    /**
     * Очищает список.
     */
    function clearKeys() {
        allKeys = [];
        document.getElementById('keyList').innerHTML = `
            <div class="empty-state">
                <div class="icon">📡</div>
                <p>Нажмите «Загрузить ключи»,<br>чтобы получить бесплатные конфигурации</p>
            </div>`;
        document.getElementById('keyCount').textContent = '0';
        document.getElementById('statusDot').className = 'status-dot';
        document.getElementById('statusText').textContent = 'Готов к загрузке';
        document.getElementById('errorMsg').classList.remove('show');
        showToast('🗑 Список очищен');
    }

    // ============================================================
    //  ИНИЦИАЛИЗАЦИЯ
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
        console.log('[Happ Free Keys] Приложение загружено');
        console.log('[Happ Free Keys] Источники:', SOURCES.map(s => s.name).join(', '));
    });
    </script>
</body>
</html>
