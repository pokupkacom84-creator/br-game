<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1621">
<title>Flux</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%235288c1'/%3E%3Cpath d='M50 22c-16 0-28 12-28 26 0 6 2 12 6 16l-4 14 15-6c3 1 7 2 11 2 16 0 28-12 28-26S66 22 50 22z' fill='white'/%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;font-size:15px;transition:background .25s,color .25s}
:root{--bg:#0e1621;--panel:#17212b;--panel2:#242f3d;--panel3:#1c2733;--hover:#202b36;--active:#2b5278;--text:#fff;--text2:#8b9aa8;--text3:#6c7883;--accent:#5288c1;--accent2:#64b5ef;--bubble-out:#2b5278;--bubble-in:#182533;--border:#0b1219;--menu:#1c2733}
body.light{--bg:#fff;--panel:#fff;--panel2:#f4f4f5;--panel3:#f0f0f0;--hover:#f0f0f0;--active:#e8f1fb;--text:#000;--text2:#707579;--text3:#9aa0a6;--accent:#3390ec;--accent2:#3390ec;--bubble-out:#effdde;--bubble-in:#fff;--border:#e4e6e8;--menu:#fff}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#2b3844;border-radius:3px}
body.light ::-webkit-scrollbar-thumb{background:#c9ced3}
.screen{display:none;height:100vh;height:100dvh}
.screen.show{display:flex}
.center{align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.card{background:var(--panel);border-radius:18px;padding:32px 26px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card h1{font-size:24px;font-weight:600;margin-bottom:6px;text-align:center}
.card .sub{color:var(--text2);font-size:13px;text-align:center;margin-bottom:22px}
.tabs{display:flex;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:20px}
.tab{flex:1;padding:9px;border-radius:8px;font-size:14px;font-weight:500;color:var(--text2);transition:.15s}
.tab.active{background:var(--accent);color:#fff}
.field-input{width:100%;background:var(--bg);border-radius:10px;padding:13px 16px;font-size:15px;margin-bottom:10px;border:1.5px solid transparent;transition:.15s;color:var(--text)}
.field-input:focus{border-color:var(--accent)}
.error{background:#e0483d22;border:1px solid #e0483d55;color:#ff8b80;font-size:13px;padding:10px 14px;border-radius:9px;margin-bottom:12px}
.error:empty{display:none;padding:0;border:none;margin:0}
.primary{background:var(--accent);color:#fff;padding:13px 20px;border-radius:10px;font-size:15px;font-weight:600;width:100%;transition:.15s}
.primary:hover{background:var(--accent2)}
.primary:disabled{opacity:.6;cursor:default}
.ghost{padding:10px 16px;border-radius:9px;color:var(--accent2);font-weight:500}
.ghost:hover{background:var(--hover)}
.danger{background:#e0483d;color:#fff}
.small{font-size:12px;color:var(--text2)}
#splashScreen{align-items:center;justify-content:center;flex-direction:column;gap:20px;background:var(--bg)}
.spinner{width:44px;height:44px;border:3px solid var(--panel2);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#splashScreen .logo{width:80px;height:80px;border-radius:22px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700;color:#fff}
#appScreen{flex-direction:row;background:var(--bg)}
#sidebar{width:360px;background:var(--panel);display:flex;flex-direction:column;border-right:1px solid var(--border);position:relative;flex-shrink:0;transition:background .25s}
#chatPanel{flex:1;display:flex;flex-direction:column;position:relative;min-width:0;background:var(--bg)}
@media(max-width:820px){
  #sidebar{width:100%;border:none}
  #chatPanel{position:fixed;inset:0;z-index:60;transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1)}
  #chatPanel.open{transform:none}
}
#sidebar>header{padding:14px 16px;background:var(--panel);padding-top:calc(14px + env(safe-area-inset-top,0));display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.me{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer}
.me .avatar{width:40px;height:40px;font-size:16px}
#meName{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:.15s;flex-shrink:0}
.icon:hover{background:var(--hover);color:var(--text)}
.icon:active{transform:scale(.92)}
.icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#chatSearch{margin:10px 12px;background:var(--panel2);border-radius:20px;padding:10px 16px;font-size:14px;color:var(--text);flex-shrink:0}
#chatSearch::placeholder{color:var(--text3)}
.chat-tabs{display:flex;gap:6px;padding:0 12px 8px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.chat-tabs::-webkit-scrollbar{display:none}
.chat-tab{flex-shrink:0;padding:6px 14px;border-radius:16px;background:var(--panel2);color:var(--text2);font-size:13px;font-weight:500;transition:.15s;white-space:nowrap}
.chat-tab.active{background:var(--accent);color:#fff}
.chat-tab .badge{display:inline-block;background:#e0483d;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;margin-left:5px}
#chatList{flex:1;overflow-y:auto;padding:0 6px}
.chat-item{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:12px;cursor:pointer;transition:background .12s;user-select:none;position:relative}
.chat-item:hover{background:var(--hover)}
.chat-item.active{background:var(--active);color:#fff}
.chat-item.active .ci-time,.chat-item.active .ci-preview{color:#dbe9f7}
.ci-body{flex:1;min-width:0}
.ci-top{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.ci-name{font-weight:600;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.ci-time{font-size:12px;color:var(--text3);flex-shrink:0}
.ci-preview{font-size:13.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.ci-preview .prefix{color:var(--text3);font-weight:500}
.ci-ticks{color:var(--accent2);font-weight:700;font-size:11px;margin-right:3px}
.ci-mute{width:14px;height:14px;stroke:var(--text3);fill:none;stroke-width:2;flex-shrink:0}
.ci-badge{background:var(--accent);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 6px;flex-shrink:0}
.chat-item.active .ci-badge{background:#fff;color:var(--accent)}
.ci-badge.muted{background:var(--text3)}
.empty{text-align:center;color:var(--text3);font-size:14px;padding:40px 20px;line-height:1.5}
#newChatBtn{position:absolute;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;font-size:28px;font-weight:300;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.4);transition:.15s;z-index:10}
#newChatBtn:hover{background:var(--accent2);transform:scale(1.05)}
#newChatBtn:active{transform:scale(.9)}
#chatView{flex:1;display:flex;flex-direction:column;overflow:hidden}
#chatView>header{padding:10px 14px;background:var(--panel);padding-top:calc(10px + env(safe-area-inset-top,0));display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);flex-shrink:0}
#chatView>header .avatar{width:42px;height:42px;font-size:17px}
#chatView>header>div:last-child{min-width:0;flex:1}
#chatTitle{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chatSub{font-size:12px;color:var(--text2)}
#chatSub.online{color:var(--accent2)}
#chatSub.typing{color:var(--accent2);font-style:italic}
#backBtn{display:none}
@media(max-width:820px){#backBtn{display:flex}}
#emptyState{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:14px;text-align:center;padding:20px;line-height:1.6}
#pinnedBar{display:none;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--border);cursor:pointer;flex-shrink:0}
#pinnedBar.show{display:flex}
#pinnedBar .pi{width:18px;height:18px;stroke:var(--accent2);fill:none;stroke-width:2;flex-shrink:0}
#pinnedBar .pb{flex:1;min-width:0}
#pinnedBar .pb-t{font-size:12px;font-weight:600;color:var(--accent2)}
#pinnedBar .pb-x{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#messages{flex:1;overflow-y:auto;padding:14px 14px 4px;display:flex;flex-direction:column;gap:2px;scroll-behavior:smooth;position:relative}
#loadMore{text-align:center;padding:8px;font-size:12px;color:var(--accent2);cursor:pointer;flex-shrink:0}
#loadMore:hover{text-decoration:underline}
.date-sep{align-self:center;background:rgba(0,0,0,.3);color:#fff;font-size:12px;padding:4px 12px;border-radius:12px;margin:12px 0 8px;font-weight:500;backdrop-filter:blur(4px)}
body.light .date-sep{background:rgba(0,0,0,.14)}
.msg{display:flex;max-width:80%;animation:in .16s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.in{align-self:flex-start}
.msg.out{align-self:flex-end}
.msg.grouped{margin-top:-1px}
.bubble{background:var(--bubble-in);border-radius:14px;padding:7px 11px 5px;box-shadow:0 1px 3px rgba(0,0,0,.2);min-width:70px;position:relative;word-break:break-word}
.msg.out .bubble{background:var(--bubble-out);border-bottom-right-radius:4px}
.msg.in .bubble{border-bottom-left-radius:4px}
.msg.grouped.out .bubble{border-radius:14px 14px 4px 4px}
.msg.grouped.in .bubble{border-radius:14px 14px 14px 4px}
.bubble-author{font-size:13px;font-weight:600;color:var(--accent2);margin-bottom:2px}
body.light .msg.out .bubble-author{color:#3390ec}
.bubble-text{font-size:15px;line-height:1.35;white-space:pre-wrap;word-wrap:break-word}
.bubble-text.deleted{font-style:italic;color:var(--text3)}
.bubble-text a{color:var(--accent2);text-decoration:none}
.bubble-meta{float:right;margin:4px 0 -3px 12px;font-size:11px;color:var(--text3);display:flex;align-items:center;gap:3px;user-select:none;line-height:1.1}
.msg.out .bubble-meta{color:rgba(255,255,255,.6)}
body.light .msg.out .bubble-meta{color:#6fb56f}
.bubble-meta .ed{font-style:italic;opacity:.8}
.tick{font-size:11px;font-weight:700}
.tick.read{color:#64b5ef}
body.light .msg.out .tick.read{color:#4fae4e}
.reply-quote{border-left:3px solid var(--accent2);padding:3px 8px;margin-bottom:5px;background:rgba(0,0,0,.15);border-radius:5px;cursor:pointer}
body.light .reply-quote{background:rgba(0,0,0,.045)}
.reply-quote .rq-n{font-size:12.5px;font-weight:600;color:var(--accent2);margin-bottom:1px}
.reply-quote .rq-t{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.forward-note{font-size:12px;font-weight:600;color:var(--accent2);margin-bottom:3px;font-style:italic}
.bubble-media{margin:-3px -7px 4px;border-radius:11px;overflow:hidden;position:relative;cursor:pointer;background:#000}
.bubble-media img{display:block;width:100%;max-width:340px;max-height:400px;object-fit:cover}
.msg-media-upload{position:relative;padding:20px;text-align:center;background:rgba(0,0,0,.2);border-radius:11px;margin-bottom:4px}
.file-row{display:flex;align-items:center;gap:10px;padding:4px 0;min-width:200px;cursor:pointer}
.file-ico{width:42px;height:42px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.file-ico svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.file-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.file-size{font-size:12.5px;color:var(--text2);margin-top:2px}
.voice-row{display:flex;align-items:center;gap:10px;min-width:200px;padding:2px 0}
.voice-play{width:38px;height:38px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .12s}
.voice-play:active{transform:scale(.92)}
.voice-play svg{width:15px;height:15px;fill:#fff;stroke:none}
.voice-wave{flex:1;display:flex;align-items:center;gap:2px;height:26px}
.voice-wave i{width:2.5px;background:var(--text3);border-radius:2px;display:block;transition:background .1s}
.voice-wave i.played{background:var(--accent2)}
.msg.out .voice-wave i{background:rgba(255,255,255,.35)}
.msg.out .voice-wave i.played{background:#fff}
.voice-dur{font-size:12.5px;color:var(--text2);flex-shrink:0;min-width:34px;text-align:right}
.reactions{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;margin-right:-4px}
.reaction{background:rgba(0,0,0,.2);border-radius:11px;padding:2px 8px;font-size:13px;display:flex;align-items:center;gap:4px;transition:transform .12s}
.reaction:active{transform:scale(.9)}
.reaction.mine{background:var(--accent);color:#fff}
.reaction b{font-size:11.5px;font-weight:600}
body.light .reaction{background:rgba(0,0,0,.06)}
#composer{background:var(--panel);border-top:1px solid var(--border);padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0));display:flex;gap:8px;align-items:flex-end;flex-shrink:0;position:relative}
#replyPreview{display:none;align-items:center;gap:10px;padding:6px 10px;background:var(--panel2);border-radius:10px;margin-bottom:8px}
#replyPreview.show{display:flex}
#replyPreview .rp-bar{width:3px;align-self:stretch;background:var(--accent2);border-radius:2px}
#replyPreview .rp-body{flex:1;min-width:0}
#replyPreview .rp-n{font-size:12.5px;font-weight:600;color:var(--accent2)}
#replyPreview .rp-t{font-size:12.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#replyPreview button{color:var(--text3);padding:4px}
#msgInput{flex:1;background:var(--panel2);border-radius:20px;padding:11px 16px;font-size:15px;resize:none;max-height:130px;line-height:1.35;color:var(--text)}
#msgInput::placeholder{color:var(--text3)}
#sendBtn{width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s;font-size:18px}
#sendBtn:hover{background:var(--accent2)}
#sendBtn:active{transform:scale(.9)}
#sendBtn.mic{background:transparent;color:var(--text2)}
#sendBtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#attachMenu{position:absolute;bottom:calc(100% - 4px);left:8px;background:var(--menu);border-radius:14px;padding:8px;display:none;flex-direction:column;gap:2px;box-shadow:0 8px 28px rgba(0,0,0,.45);min-width:220px;z-index:30}
#attachMenu.show{display:flex;animation:popIn .14s ease}
@keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
.attach-item{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:9px;font-size:14.5px;font-weight:500;text-align:left;width:100%;position:relative;overflow:hidden;transition:background .12s;color:var(--text)}
.attach-item:hover{background:var(--hover)}
.attach-item svg{width:20px;height:20px;stroke:var(--accent2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.attach-item input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
#emojiPicker{position:absolute;bottom:calc(100% - 4px);left:8px;right:8px;max-height:280px;overflow-y:auto;background:var(--menu);border-radius:14px;padding:8px;box-shadow:0 8px 28px rgba(0,0,0,.45);z-index:30;display:none;grid-template-columns:repeat(8,1fr);gap:2px}
#emojiPicker.show{display:grid}
#emojiPicker button{font-size:23px;padding:5px;border-radius:8px;line-height:1;transition:.1s}
#emojiPicker button:hover{background:var(--hover);transform:scale(1.12)}
#ctxMenu{position:fixed;background:var(--menu);border-radius:12px;padding:6px;display:none;min-width:210px;box-shadow:0 10px 34px rgba(0,0,0,.5);z-index:900}
#ctxMenu.show{display:block;animation:popIn .13s ease}
#ctxMenu button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 13px;border-radius:8px;font-size:14.5px;font-weight:500;text-align:left;color:var(--text)}
#ctxMenu button:hover{background:var(--hover)}
#ctxMenu button.danger{color:#ff6b6b}
#ctxMenu svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
#ctxMenu .ctx-react{display:flex;gap:2px;padding:4px 4px 8px;border-bottom:1px solid var(--border);margin-bottom:5px;justify-content:space-between}
#ctxMenu .ctx-react button{width:38px;height:38px;justify-content:center;font-size:22px;border-radius:50%;padding:0}
#ctxMenu .ctx-react button:hover{transform:scale(1.2)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:800;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.overlay.show{display:flex;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-box{background:var(--panel);border-radius:16px;padding:22px;width:100%;max-width:440px;animation:popIn .2s;max-height:88vh;overflow-y:auto;color:var(--text)}
.modal-box h3{font-size:19px;font-weight:600;margin-bottom:6px}
.modal-box .sub{color:var(--text2);font-size:13.5px;margin-bottom:16px;line-height:1.4}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.modal-actions .primary{width:auto}
.found-user,.member-row{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:12px;padding:12px;margin-top:10px}
.found-user>div:nth-child(2),.member-row .mr-body{flex:1;min-width:0}
.fu-name,.mr-name{font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px}
.fu-user,.mr-sub{color:var(--text2);font-size:12.5px;margin-top:1px}
.found-user .primary,.member-row button{width:auto;padding:9px 16px;font-size:14px}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,80px);background:#2b3844;color:#fff;padding:11px 20px;border-radius:10px;font-size:14px;z-index:9999;opacity:0;transition:all .3s cubic-bezier(.4,0,.2,1);pointer-events:none;max-width:88vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex-shrink:0;width:54px;height:54px;font-size:20px;overflow:hidden;background-size:cover;background-position:center;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.sm{width:40px;height:40px;font-size:16px}
.avatar.xs{width:32px;height:32px;font-size:13px}
.avatar.lg{width:100px;height:100px;font-size:40px}
.avatar .online{position:absolute;bottom:1px;right:1px;width:12px;height:12px;border-radius:50%;background:#4caf50;border:2px solid var(--panel)}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:950;display:none;align-items:center;justify-content:center;flex-direction:column}
#lightbox.show{display:flex}
#lightbox img{max-width:96vw;max-height:88vh;object-fit:contain;border-radius:6px}
#lightbox .close{position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.13);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center}
#recOverlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:920;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px}
#recOverlay.show{display:flex}
.rec-circle{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,#e0483d,#ff8a65);display:flex;align-items:center;justify-content:center;animation:recPulse 1.4s infinite}
@keyframes recPulse{0%,100%{box-shadow:0 0 0 0 rgba(224,72,61,.55)}50%{box-shadow:0 0 0 26px rgba(224,72,61,0)}}
.rec-circle svg{width:48px;height:48px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#recTimer{color:#fff;font-size:30px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:1px}
#recLabel{color:rgba(255,255,255,.7);font-size:14px}
.rec-actions{display:flex;gap:16px}
.rec-actions button{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.rec-actions button svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.rec-cancel{background:rgba(255,255,255,.15)}
.rec-send{background:#4caf50}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 4px;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.row .lbl{font-size:15px;font-weight:500}
.row .desc{font-size:13px;color:var(--text2);margin-top:2px}
.switch{position:relative;width:46px;height:27px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0;position:absolute}
.slider{position:absolute;inset:0;background:#5b6b7a;border-radius:27px;cursor:pointer;transition:.25s}
body.light .slider{background:#c9ced3}
.slider:before{content:'';position:absolute;height:21px;width:21px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.25s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked+.slider{background:var(--accent)}
.switch input:checked+.slider:before{transform:translateX(19px)}
.color-dots{display:flex;gap:10px;flex-wrap:wrap;padding:6px 0}
.color-dot{width:34px;height:34px;border-radius:50%;border:2.5px solid transparent;transition:.12s}
.color-dot.active{border-color:var(--text);transform:scale(1.1)}
.color-dot:active{transform:scale(.9)}
#offlineBar{position:fixed;top:0;left:0;right:0;background:#e0483d;color:#fff;font-size:12.5px;text-align:center;padding:6px;z-index:9998;transform:translateY(-100%);transition:transform .25s}
#offlineBar.show{transform:none}
.install-banner{background:linear-gradient(135deg,var(--accent),var(--accent2));padding:10px 16px;color:#fff;font-size:13.5px;display:flex;align-items:center;gap:10px;border-radius:12px;margin:8px 12px;cursor:pointer}
.install-banner button{margin-left:auto;background:rgba(255,255,255,.2);padding:6px 12px;border-radius:8px;color:#fff;font-size:12.5px;font-weight:600}
.fade-in{animation:in .16s ease}
</style>
</head>

      'auth/wrong-password':'Неверный пароль',
      'auth/invalid-credential':'Неверный email или пароль',
      'auth/invalid-login-credentials':'Неверный email или пароль',
      'auth/email-already-in-use':'Email уже занят',
      'auth/invalid-email':'Неверный email',

    const changed = !me || me.name!==fresh.name || me.username!==fresh.username || me.avatar!==fresh.avatar;

    if(changed && !appStarted){ showScreen('appScreen'); startApp(); }

function updateUnreadFromChats(){
  let total = 0;
  Object.values(chats).forEach(c => {
    const lastRead = (c.reads && c.reads[me.uid]) || 0;
    const other = (c.members||[]).find(u => u!==me.uid);
    if(c.lastFrom && c.lastFrom !== me.uid && c.lastTs > lastRead){
      if(!c.muted) total++;
    }

function renderChatList(){
  const q = ($('#chatSearch').value||'').trim().toLowerCase();
  const box = $('#chatList');
  const items = Object.values(chats).map(c => {
    const otherUid = (c.members||[]).find(u => u!==me.uid) || me.uid;
    let name, avatarUrl;
    if(c.type === 'private'){
      name = (c.memberNames && c.memberNames[otherUid]) || 'Чат';
      avatarUrl = (c.memberAvatars && c.memberAvatars[otherUid]) || '';
    } else {
      name = c.name || 'Группа';
      avatarUrl = c.avatar || '';
    }
    const lastRead = (c.reads && c.reads[me.uid]) || 0;
    const unread = (c.lastFrom && c.lastFrom !== me.uid && c.lastTs > lastRead) ? 1 : 0;
    const isOwn = c.lastFrom === me.uid;
    return {
      id: c.id, type: c.type, otherUid, name, avatarUrl, unread,
      lastMessage: c.lastMessage || 'Нет сообщений',
      lastTs: c.lastTs || c.createdAt || 0,
      isOwn, muted: c.muted, members: c.members
    };
  }).filter(c => {
    if(currentTab !== 'all' && c.type !== currentTab) return false;
    if(!q) return true;
    return c.name.toLowerCase().includes(q) || (c.lastMessage||'').toLowerCase().includes(q);
  }).sort((a,b) => {
    if((b.lastTs||0) !== (a.lastTs||0)) return (b.lastTs||0)-(a.lastTs||0);
    return a.name.localeCompare(b.name);
  });
  if(!items.length){
    box.innerHTML = `<div class="empty">${q ? 'Ничего не найдено' : 'Нет чатов.<br>Нажмите «+» чтобы начать.'}</div>`;
    return;
  }
  box.innerHTML = items.map(c => {
    const preview = c.lastMessage.length>45 ? c.lastMessage.slice(0,45)+'…' : c.lastMessage;
    const ticks = c.isOwn ? '<span class="ci-ticks">✓✓</span>' : '';
    const badge = c.unread>0 ? `<div class="ci-badge${c.muted?' muted':''}">${c.unread}</div>` : '';
    const mute = c.muted ? `<svg class="ci-mute" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>` : '';
    return `
      <div class="chat-item${c.id===currentChatId?' active':''}" data-id="${c.id}">
        ${avatarEl(c.name, c.otherUid||c.id, '', c.avatarUrl)}
        <div class="ci-body">
          <div class="ci-top">
            <div class="ci-name">${esc(c.name)}</div>
            <div class="ci-time">${c.lastTs?listTime(c.lastTs):''}</div>
          </div>
          <div class="ci-preview">${ticks}${esc(preview)}</div>
        </div>
        ${mute}${badge}
      </div>`;
  }).join('');
  box.querySelectorAll('.chat-item').forEach(el => {
    el.addEventListener('click', () => openChat(el.dataset.id));
    el.addEventListener('contextmenu', e => { e.preventDefault(); showChatContext(e.clientX, e.clientY, el.dataset.id); });
    bindLongPress(el, (x,y) => showChatContext(x,y,el.dataset.id));
  });
}
function listTime(ts){
  if(!ts) return '';
  const d = new Date(ts), nd = new Date();
  if(d.toDateString()===nd.toDateString()) return fmtTime(ts);
  const yd = new Date(nd - 86400000);
  if(d.toDateString()===yd.toDateString()) return 'Вчера';
  return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0');
}

function showChatContext(x,y,chatId){
  const chat = chats[chatId]; if(!chat) return;
  let html = `<button data-a="open">${ICO.reply}Открыть</button>`;
  html += `<button data-a="pin">${ICO.pin}${chat.pinned?'Открепить':'Закрепить'}</button>`;
  html += `<button data-a="mute">${chat.muted?ICO.bell:ICO.mute}${chat.muted?'Включить звук':'Отключить звук'}</button>`;
  html += `<button data-a="read">✓✓Отметить прочитанным</button>`;
  html += `<button data-a="clear">${ICO.trash}Очистить</button>`;
  html += `<button data-a="delete" class="danger">${ICO.trash}Удалить</button>`;
  openCtxMenu(x, y, html, a => {
    if(a==='open') openChat(chatId);
    if(a==='pin'){ db.ref('flux/chats/'+chatId+'/meta/pinnedChat').set(!chat.pinned).catch(()=>{}); toast('Ок'); }
    if(a==='mute'){ db.ref('flux/chats/'+chatId+'/meta/muted').set(!chat.muted).catch(()=>{}); toast(chat.muted?'Звук включён':'Без звука'); }
    if(a==='read'){ db.ref('flux/chats/'+chatId+'/reads/'+me.uid).set(now()).catch(()=>{}); toast('Прочитано'); }
    if(a==='clear'){
      if(confirm('Очистить историю?')){
        db.ref('flux/messages/'+chatId).remove().catch(()=>{});
        toast('История очищена');
      }
    }
    if(a==='delete'){
      if(confirm('Удалить чат?')){
        db.ref('flux/userChats/'+me.uid+'/'+chatId).remove().catch(()=>{});
        db.ref('flux/chats/'+chatId+'/meta/members').transaction(m => {
          if(!m) return m;
          if(Array.isArray(m)) return m.filter(u => u!==me.uid);
          return Object.keys(m).filter(k => k!==me.uid).reduce((o,k)=>(o[k]=m[k],o),{});
        }).catch(()=>{});
        if(currentChatId===chatId) closeChatView();
        toast('Чат удалён');
      }
    }
  });
}

function openChat(chatId){
  const chat = chats[chatId]; if(!chat) return;
  currentChatId = chatId;
  currentOtherUid = (chat.members||[]).find(u => u!==me.uid) || null;
  LS.save(LS.LAST, chatId);
  $('#emptyState').style.display='none';
  $('#chatView').style.display='flex';
  $('#chatPanel').classList.add('open');
  const otherName = chat.type==='private' ? ((chat.memberNames && chat.memberNames[currentOtherUid]) || 'Чат') : (chat.name || 'Чат');
  const avatarUrl = chat.type==='private' ? ((chat.memberAvatars && chat.memberAvatars[currentOtherUid])||'') : (chat.avatar||'');
  $('#chatTitle').textContent = otherName;
  const av = $('#chatAvatar');
  av.outerHTML = avatarEl(otherName, currentOtherUid||chatId, 'sm', avatarUrl).replace('class="avatar sm"', 'class="avatar sm" id="chatAvatar"');
  db.ref('flux/chats/'+chatId+'/reads/'+me.uid).set(now()).catch(()=>{});
  if(chatMetaRef){ chatMetaRef.off(); chatMetaRef = null; }
  chatMetaRef = db.ref('flux/chats/'+chatId+'/meta');
  chatMetaRef.on('value', s => {
    if(!s.exists()){ closeChatView(); return; }
    currentChatData = s.val();
    chats[chatId] = currentChatData;
    LS.save(LS.CHATS, chats);
    updatePinnedBar();
    renderChatList();
  });
  if(currentOtherUid && chat.type==='private'){
    const stRef = db.ref('flux/status/'+currentOtherUid);
    stRef.on('value', s => {
      const v = s.val();
      const sub = $('#chatSub');
      sub.classList.remove('typing');
      if(v && v.online && now()-v.ts < 90000){
        sub.textContent = 'онлайн';
        sub.classList.add('online');
      } else if(v && v.ts){
        sub.textContent = 'был(а) '+new Date(v.ts).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
        sub.classList.remove('online');
      } else {
        sub.textContent = 'не в сети';
        sub.classList.remove('online');
      }
    });
  } else {
    const members = (chat.members||[]).length;
    $('#chatSub').textContent = members+' участн.';
  }
  if(typingWatchRef){ typingWatchRef.off(); typingWatchRef = null; }
  if(chat.type !== 'channel'){
    typingWatchRef = db.ref('flux/typing/'+chatId);
    typingWatchRef.on('value', s => {
      const data = s.val()||{};
      const others = Object.keys(data).filter(u => u!==me.uid && now()-data[u] < 5000);
      const sub = $('#chatSub');
      if(others.length){
        sub.classList.add('typing');
        sub.textContent = 'печатает...';
      } else {
        sub.classList.remove('typing');
        if(currentOtherUid && chat.type==='private'){
          db.ref('flux/status/'+currentOtherUid).get().then(ss => {
            const v = ss.val();
            if(v && v.online && now()-v.ts<90000){ sub.textContent='онлайн'; sub.classList.add('online'); }
            else if(v && v.ts){ sub.textContent='был(а) '+new Date(v.ts).toLocaleString('ru-RU',{day:'numeric',month:'short'}); sub.classList.remove('online'); }
            else { sub.textContent='не в сети'; sub.classList.remove('online'); }
          }).catch(()=>{});
        } else {
          sub.textContent = (chat.members||[]).length+' участн.';
        }
      }
    });
  }
  msgLimit = 50;
  loadMessages(chatId);
  setTimeout(() => $('#msgInput').focus(), 150);
  renderChatList();
}
function closeChatView(){
  $('#chatPanel').classList.remove('open');
  if(msgRef){ msgRef.off(); msgRef = null; }
  if(chatMetaRef){ chatMetaRef.off(); chatMetaRef = null; }
  if(typingWatchRef){ typingWatchRef.off(); typingWatchRef = null; }
  currentChatId = null;
  currentOtherUid = null;
  LS.del(LS.LAST);
  renderChatList();
}
$('#backBtn').addEventListener('click', closeChatView);

function loadMessages(chatId){
  if(msgRef) msgRef.off();
  msgRef = db.ref('flux/messages/'+chatId).orderByChild('ts').limitToLast(msgLimit);
  msgRef.on('value', snap => {
    const data = snap.val()||{};
    const list = Object.keys(data).map(k => Object.assign({ id:k }, data[k])).sort((a,b) => (a.ts||0)-(b.ts||0));
    renderMessages(list);
    const lastRead = list.length ? list[list.length-1].ts : 0;
    if(lastRead) db.ref('flux/chats/'+chatId+'/reads/'+me.uid).set(now()).catch(()=>{});
    if(list.length > lastMsgCount && lastMsgCount > 0){
      const last = list[list.length-1];
      if(last && last.from !== me.uid){
        if(!chats[chatId] || !chats[chatId].muted){
          playPop();
          notifyNewMessage(chatId, last);
        }
      }
    }
    lastMsgCount = list.length;
  });
}

function renderMessages(list){
  currentMessages = list;
  const box = $('#messages');
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 200;
  if(!list.length){
    box.innerHTML = `<div class="empty" style="margin:auto">Нет сообщений. Напишите первым!</div>`;
    updatePinnedBar();
    return;
  }
  let html = '';
  if(list.length >= msgLimit) html += `<div id="loadMore">↑ Загрузить раньше</div>`;
  let lastDay = '';
  for(let i=0;i<list.length;i++){
    const m = list[i];
    const prev = list[i-1];
    const d = new Date(m.ts);
    const dayKey = d.toDateString();
    if(dayKey !== lastDay){
      lastDay = dayKey;
      const today = new Date().toDateString();
      const yd = new Date(Date.now()-86400000).toDateString();
      let label = d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
      if(dayKey===today) label='Сегодня';
      else if(dayKey===yd) label='Вчера';
      html += `<div class="date-sep">${label}</div>`;
    }
    const grouped = prev && prev.from===m.from && (m.ts-prev.ts < 300000) && sameDay(prev.ts, m.ts) && !m.replyTo && !prev.replyTo;
    html += messageHTML(m, grouped);
  }
  box.innerHTML = html;
  box.querySelectorAll('.post-item,.msg').forEach(bindMessageEvents);
  if(nearBottom || box.dataset.init!=='1'){
    box.dataset.init='1';
    requestAnimationFrame(() => box.scrollTop = box.scrollHeight);
  }
  const lm = box.querySelector('#loadMore');
  if(lm) lm.addEventListener('click', () => { msgLimit += 50; loadMessages(currentChatId); });
  updatePinnedBar();
  markVisibleRead();
}
function sameDay(a,b){ const x=new Date(a),y=new Date(b); return x.getFullYear()===y.getFullYear()&&x.getMonth()===y.getMonth()&&x.getDate()===y.getDate(); }

function messageHTML(m, grouped){
  const chat = chats[currentChatId];
  const isOut = m.from === me.uid;
  const cls = `msg ${isOut?'out':'in'}${grouped?' grouped':''}`;
  const deleted = m.deleted;
  let inner = '';
  if(m.replyTo){
    inner += `<div class="reply-quote" data-jump="${esc(m.replyTo.id)}">
      <div class="rq-n">${esc(m.replyTo.name||'')}</div>
      <div class="rq-t">${esc(m.replyTo.text||'Вложение')}</div>
    </div>`;
  }
  if(m.forwardFrom){
    inner += `<div class="forward-note">↪ Переслано от ${esc(m.forwardFrom)}</div>`;
  }
  if(!isOut && !grouped && chat && chat.type !== 'private'){
    const name = (chat.memberNames && chat.memberNames[m.from]) || 'Пользователь';
    inner += `<div class="bubble-author">${esc(name)}</div>`;
  }
  if(deleted){
    inner += `<div class="bubble-text deleted">Сообщение удалено</div>`;
  } else if(m.type==='photo' && m.media){
    inner += `<div class="bubble-media" data-lb="${m.id}"><img src="${m.media.url}" alt="" loading="lazy"></div>`;
    if(m.text) inner += `<div class="bubble-text">${linkify(m.text)}</div>`;
  } else if(m.type==='video' && m.media){
    inner += `<div class="bubble-media"><video src="${m.media.url}" controls preload="metadata"></video></div>`;
  } else if(m.type==='file' && m.media){
    inner += `<div class="file-row" data-dl="${m.id}">
      <div class="file-ico">${ICO.file}</div>
      <div style="min-width:0">
        <div class="file-name">${esc(m.media.name||'Файл')}</div>
        <div class="file-size">${fmtSize(m.media.size||0)}</div>
      </div>
    </div>`;
    if(m.text) inner += `<div class="bubble-text">${linkify(m.text)}</div>`;
  } else if(m.type==='voice' && m.media){
    const wave = m.media.waveform || genWave(28);
    const bars = wave.map((h,i) => `<i style="height:${Math.max(3,Math.round(h*22))}px" data-i="${i}"></i>`).join('');
    inner += `<div class="voice-row" data-voice="${m.id}">
      <button class="voice-play" data-play="${m.id}">${ICO.play}</button>
      <div class="voice-wave">${bars}</div>
      <div class="voice-dur">${fmtDur(m.media.duration||0)}</div>
    </div>`;
  } else if(m.text){
    inner += `<div class="bubble-text">${linkify(m.text)}</div>`;
  }
  const rks = Object.keys(m.reactions||{}).filter(e => m.reactions[e] && Object.keys(m.reactions[e]).length>0);
  if(rks.length && !deleted){
    inner += `<div class="reactions">`+rks.map(e => {
      const users = Object.keys(m.reactions[e]||{});
      const mine = users.includes(me.uid);
      return `<button class="reaction${mine?' mine':''}" data-react="${e}">${e}<b>${users.length}</b></button>`;
    }).join('')+`</div>`;
  }
  const tick = isOut ? `<span class="tick${m.read?' read':''}">${m.read?'✓✓':'✓'}</span>` : '';

function readAsDataURL(f){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(f);
  });
}
function compressImage(file, maxW, maxH, quality){
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.width, h = img.height;
      if(w>maxW || h>maxH){
        if(w/h > maxW/maxH){ h = Math.round(h*maxW/w); w = maxW; }
        else { w = Math.round(w*maxH/h); h = maxH; }
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      res(c.toDataURL('image/jpeg', quality||0.75));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad')); };
    img.src = url;
  });
}

let mediaRecorder = null, recChunks = [], recTimer = null, recSeconds = 0, recStream = null;
async function startRecording(){
  if(!navigator.mediaDevices || !window.MediaRecorder){ toast('Запись не поддерживается'); return; }
  if(!currentChatId){ toast('Откройте чат'); return; }
  try { recStream = await navigator.mediaDevices.getUserMedia({ audio:true }); }
  catch(e){ toast('Нет доступа к микрофону'); return; }
  recChunks = []; recSeconds = 0;
  $('#recTimer').textContent = '0:00';
  $('#recOverlay').classList.add('show');
  let mime = 'audio/webm';
  if(!MediaRecorder.isTypeSupported(mime)) mime = '';
  try { mediaRecorder = mime ? new MediaRecorder(recStream, { mimeType:mime }) : new MediaRecorder(recStream); }
  catch(e){ toast('Ошибка записи'); cleanupRec(); return; }
  mediaRecorder.ondataavailable = e => { if(e.data && e.data.size) recChunks.push(e.data); };
  mediaRecorder.onstop = onRecStop;
  mediaRecorder.start();
  recTimer = setInterval(() => {
    recSeconds++;
    $('#recTimer').textContent = fmtDur(recSeconds);
    if(recSeconds >= 120) stopRec(true);
  }, 1000);
}
function cleanupRec(){
  if(recTimer){ clearInterval(recTimer); recTimer = null; }
  if(recStream){ recStream.getTracks().forEach(t => t.stop()); recStream = null; }
  $('#recOverlay').classList.remove('show');
}
function cancelRec(){
  if(mediaRecorder && mediaRecorder.state !== 'inactive'){ mediaRecorder.onstop = null; mediaRecorder.stop(); }
  mediaRecorder = null; recChunks = [];
  cleanupRec();
}
function stopRec(send){
  if(!mediaRecorder || mediaRecorder.state === 'inactive') return;
  mediaRecorder._send = !!send;
  mediaRecorder.stop();
}
function onRecStop(){
  const send = mediaRecorder && mediaRecorder._send;
  const dur = recSeconds;
  const chunks = recChunks.slice();
  mediaRecorder = null; recChunks = [];
  cleanupRec();
  if(!send || !chunks.length) return;
  const blob = new Blob(chunks, { type: chunks[0].type || 'audio/webm' });
  const reader = new FileReader();
  reader.onload = () => {
    sendMedia('voice', {
      url: reader.result,
      duration: dur,
      size: blob.size,
      waveform: genWave(28)
    });
    toast('Голосовое отправлено');
  };
  reader.readAsDataURL(blob);
}

function toggleVoicePlay(mid, btn){
  const m = currentMessages.find(x => x.id === mid);
  if(!m || !m.media || !m.media.url){ toast('Аудио недоступно'); return; }
  let audio = audioCache[mid];
  if(!audio){ audio = new Audio(m.media.url); audioCache[mid] = audio; }
  const row = btn.closest('.voice-row');
  const bars = row ? row.querySelectorAll('.voice-wave i') : [];
  if(audio.paused){
    Object.keys(audioCache).forEach(k => { if(k!==mid) audioCache[k].pause(); });
    $$('.voice-play').forEach(b => { if(b!==btn) b.innerHTML = ICO.play; });
    audio.play();
    btn.innerHTML = ICO.pause;
    const upd = () => {
      if(audio.paused) return;
      const p = audio.currentTime / (audio.duration||1);
      const upto = Math.floor(p*bars.length);
      bars.forEach((b,i) => b.classList.toggle('played', i<upto));
      if(!audio.paused) requestAnimationFrame(upd);
    };
    requestAnimationFrame(upd);
    audio.onended = () => { btn.innerHTML = ICO.play; bars.forEach(b => b.classList.remove('played')); };
  } else {
    audio.pause();
    btn.innerHTML = ICO.play;
  }
}

function generateCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out = '';
  for(let i=0;i<8;i++) out += chars.charAt(Math.floor(Math.random()*chars.length));
  return out;
}
async function processInviteFromUrl(){
  const params = new URLSearchParams(location.search);
  const code = params.get('invite');
  if(!code || !me) return;
  history.replaceState({}, '', location.pathname);
  try {
    const snap = await db.ref('flux/invites/'+code).get();
    if(!snap.exists()){ toast('Приглашение не найдено'); return; }
    const inv = snap.val();
    if(inv.expires && inv.expires < now()){ toast('Ссылка устарела'); return; }
    const chatId = inv.chatId;
    const meta = await db.ref('flux/chats/'+chatId+'/meta').get();
    if(!meta.exists()){ toast('Чат не найден'); return; }
    const data = meta.val();
    const members = Array.isArray(data.members) ? data.members.slice() : Object.keys(data.members||{});
    if(!members.includes(me.uid)){
      members.push(me.uid);
      const names = Object.assign({}, data.memberNames||{});
      names[me.uid] = me.name;
      const avatars = Object.assign({}, data.memberAvatars||{});
      if(me.avatar) avatars[me.uid] = me.avatar;
      await db.ref('flux/chats/'+chatId+'/meta').update({ members, memberNames: names, memberAvatars: avatars });
    }
    await db.ref('flux/userChats/'+me.uid+'/'+chatId).set(true);
    toast('Присоединились!');
    setTimeout(() => openChat(chatId), 400);
  } catch(e){ console.error(e); toast('Ошибка приглашения'); }
}

function openCtxMenu(x, y, html, handler){
  const menu = $('#ctxMenu');
  menu.innerHTML = html;
  menu.classList.add('show');
  const rect = menu.getBoundingClientRect();
  const maxX = window.innerWidth - rect.width - 8;
  const maxY = window.innerHeight - rect.height - 8;
  menu.style.left = clamp(x, 8, maxX) + 'px';
  menu.style.top = clamp(y, 8, maxY) + 'px';
  const onClick = e => {
    const btn = e.target.closest('button');
    if(!btn) return;
    e.stopPropagation();
    const a = btn.dataset.a;
    const r = btn.dataset.r;
    closeCtxMenu();
    handler(r ? 'r:'+r : a);
  };
  menu.addEventListener('click', onClick);
  menu._cleanup = () => menu.removeEventListener('click', onClick);
  setTimeout(() => document.addEventListener('pointerdown', outsideClose, true), 10);
}
function outsideClose(e){
  const menu = $('#ctxMenu');
  if(menu.classList.contains('show') && !menu.contains(e.target)) closeCtxMenu();
}
function closeCtxMenu(){
  const menu = $('#ctxMenu');
  if(menu._cleanup) menu._cleanup();
  menu.classList.remove('show');
  document.removeEventListener('pointerdown', outsideClose, true);
}

function bindLongPress(el, cb){
  let timer = null, startX = 0, startY = 0, fired = false;
  const start = e => {
    const t = e.touches ? e.touches[0] : e;
    startX = t.clientX; startY = t.clientY; fired = false;
    timer = setTimeout(() => { fired = true; if(navigator.vibrate) navigator.vibrate(18); cb(startX, startY); }, 480);
  };
  const move = e => {
    if(!timer) return;
    const t = e.touches ? e.touches[0] : e;
    if(Math.hypot(t.clientX-startX, t.clientY-startY) > 12){ clearTimeout(timer); timer = null; }
  };
  const end = () => { if(timer){ clearTimeout(timer); timer = null; } };
  el.addEventListener('touchstart', start, { passive:true });
  el.addEventListener('touchmove', move, { passive:true });
  el.addEventListener('touchend', end);
  el.addEventListener('touchcancel', end);
  el.addEventListener('mousedown', e => { if(e.button===0) start(e); });
  el.addEventListener('mousemove', move);
  el.addEventListener('mouseup', end);
  el.addEventListener('mouseleave', end);
  el.addEventListener('click', e => { if(fired){ e.stopPropagation(); e.preventDefault(); } }, true);
}

let audioCtx = null;
function playPop(){
  if(!settings.sound) return;
  try {
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type='sine';
    o.frequency.setValueAtTime(880, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime+0.07);
    g.gain.setValueAtTime(0.06, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.16);
    o.start(); o.stop(audioCtx.currentTime+0.17);
  } catch(e){}
}

window.addEventListener('focus', () => {
  if(statusRef) statusRef.update({ online:true, ts:now() }).catch(()=>{});
  if(currentChatId) db.ref('flux/chats/'+currentChatId+'/reads/'+me.uid).set(now()).catch(()=>{});
});
window.addEventListener('blur', () => {
  if(currentChatId && me) db.ref('flux/typing/'+currentChatId+'/'+me.uid).remove().catch(()=>{});
});
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible'){
    if(statusRef) statusRef.update({ online:true, ts:now() }).catch(()=>{});
    if(currentChatId) db.ref('flux/chats/'+currentChatId+'/reads/'+me.uid).set(now()).catch(()=>{});
    document.title = (unreadTotal>0 ? '('+unreadTotal+') ' : '') + 'Flux';
  }
});
