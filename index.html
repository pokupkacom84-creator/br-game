 app.insertAdjacentHTML('beforeend',`<div class="gate" id="gate"><h1>Добро пожаловать в Flux</h1><p class="sub">Знакомства по музыке, фильмам и сериалам. Расскажите о себе.</p>
 <label class="f">Имя</label><input type="text" id="g1"><label class="f">Имя пользователя</label><input type="text" id="g2" placeholder="username">
 <label class="f">Почта</label><input type="email" id="g3"><label class="f">День рождения</label><input type="date" id="g4">
 <label class="f">О себе</label><textarea id="g5" rows="2"></textarea><label class="f">Ваши интересы (минимум 2)</label>
 <div id="gt">${TAGS.map(t=>`<button class="chip">${t}</button>`).join('')}</div><p id="ge" style="color:#e5484d;margin:8px 0"></p><button class="pri" id="go">Начать</button></div>`);
 $('#gt').onclick=e=>{if(e.target.tagName!='BUTTON')return;const t=e.target.textContent;sel.has(t)?sel.delete(t):sel.add(t);e.target.classList.toggle('on')};
 $('#go').onclick=()=>{const v=i=>$('#g'+i).value.trim(),er=m=>$('#ge').textContent=m;
  if(v(1).length<2)return er('Введите имя');if(!/^[a-z0-9_]{3,20}$/i.test(v(2)))return er('Имя пользователя: 3–20 символов, латиница, цифры, _');
  if(!/^\S+@\S+\.\S+$/.test(v(3)))return er('Проверьте почту');if(!v(4)||age(v(4))<18)return er('Укажите дату рождения (от 18 лет)');
  if(sel.size<2)return er('Выберите минимум 2 интереса');
  S.u={name:v(1),username:v(2),email:v(3),bday:v(4),bio:v(5),phone:'',avatar:'',grad:GR[0],interests:[...sel]};save();$('#gate').remove();render()}}

// ---------- cloud (Firebase Realtime Database) ----------
const CLOUD=!!(FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.databaseURL&&window.firebase);
let db=null,uid=null,CP=[],CU={},CR={},CC={},openCm=null,drawCm=null,st=0;
const SV=()=>firebase.database.ServerValue.TIMESTAMP;
function syncUser(){if(!CLOUD||!uid||!S.u)return;clearTimeout(st);st=setTimeout(()=>{const u=S.u;
 db.ref('users/'+uid).set({name:u.name,username:u.username,bio:u.bio||'',bday:u.bday,avatar:u.avatar||'',grad:u.grad,interests:u.interests,ts:SV()}).catch(e=>toast('Ошибка синхронизации: '+e.code))},500)}
function initCloud(){
 firebase.initializeApp(FIREBASE_CONFIG);db=firebase.database();
 firebase.auth().signInAnonymously().catch(e=>toast('Ошибка входа: '+e.code));
 firebase.auth().onAuthStateChanged(u=>{if(!u)return;uid=u.uid;
  const ch=()=>{if(openCm&&drawCm)drawCm();else if(!document.querySelector('.sheet,.gate'))render()};
  db.ref('users').on('value',x=>{CU=x.val()||{};ch()});
  db.ref('posts').limitToLast(60).on('value',x=>{CP=Object.entries(x.val()||{}).map(([id,v])=>({id,...v,tags:v.tags||[]})).sort((p,q)=>q.ts-p.ts);ch()});
  db.ref('reactions').on('value',x=>{CR=x.val()||{};ch()});
  db.ref('comments').on('value',x=>{CC=x.val()||{};ch()});
  syncUser()})}
const localPosts=()=>PEOPLE.map((p,i)=>({id:'p'+i,name:p[0],age:p[1],city:p[2],kind:p[3],title:p[4],text:p[5],tags:p[6]}));
const posts=()=>CLOUD?CP:localPosts();
function rxOf(id){
 if(CLOUD){const m=CR[id]||{},c={};Object.values(m).forEach(k=>c[k]=(c[k]||0)+1);return{c,mine:m[uid]}}
 const n=+id.slice(1),c={[Object.keys(REACT)[n%6]]:2+n%4},mine=S.r[id];if(mine)c[mine]=(c[mine]||0)+1;return{c,mine}}
const cmList=id=>CLOUD?Object.values(CC[id]||{}).sort((a,b)=>a.ts-b.ts):(S.cm[id]=S.cm[id]||[]);

// ---------- feed ----------
const match=p=>Math.min(99,35+p.tags.filter(t=>S.u.interests.includes(t)).length*22+(Math.abs(hash(p.id))%7));
function feed(){
 const chips=[['all','Все'],['fit','Для вас'],...S.folders.map(f=>[f.name,f.name])];
 let list=posts().map(p=>({p,m:match(p)}));
 const f=S.feedFilter,fd=S.folders.find(x=>x.name==f);
 if(f=='fit')list=list.filter(x=>x.m>=57);else if(fd)list=list.filter(x=>x.p.tags.some(t=>fd.tags.includes(t)));
 if(!CLOUD)list.sort((a,b)=>b.m-a.m);
 return `<div class="scr"><div class="top"><h1>${T('feed')}</h1></div>
 <div style="margin-bottom:8px;white-space:nowrap;overflow-x:auto">${chips.map(c=>`<button class="chip ${f==c[0]?'on':''}" data-f="${esc(c[0])}">${esc(c[1])}</button>`).join('')}</div>
 ${list.map(({p,m})=>{const id=p.id,a=CLOUD?(CU[p.uid]||{name:'Пользователь'}):p,{c,mine}=rxOf(id),cc=cmList(id).length,ag=CLOUD?age(a.bday):p.age,sb=CLOUD?(a.username?'@'+a.username:''):p.city;
 return `<div class="post"><div class="ph">${av(a,46)}<div><b>${esc(a.name)}${ag?', '+ag:''}</b><small>${esc(sb)}</small></div><span class="match">${m}% совпадение</span></div>
 <div class="rec"><div class="ico" style="background:${['#4a62c9','#e0734a','#2fa37a'][['music','film','tv'].indexOf(p.kind)]}">${ic(p.kind)}</div><b>${esc(p.title)}</b></div>
 <p style="margin-bottom:10px">${esc(p.text||'')}</p><div>${p.tags.map(t=>`<span class="chip ${S.u.interests.includes(t)?'on':''}">${esc(t)}</span>`).join('')}</div>
 <div class="foot">${pop==id?`<div class="pop">${Object.keys(REACT).map(k=>`<button data-rx="${id}:${k}">${rsvg(k)}</button>`).join('')}</div>`:''}
 <button class="btn" data-pop="${id}">${ic('smile')}</button>
 ${Object.keys(c).filter(k=>c[k]>0).map(k=>`<button class="rc ${mine==k?'me':''}" data-rx="${id}:${k}">${rsvg(k)}${c[k]}</button>`).join('')}
 <span style="margin-left:auto;display:flex;gap:8px">${CLOUD&&p.uid==uid?`<button class="btn" data-del="${id}">${ic('close')}</button>`:''}<button class="btn" data-cm="${id}">${ic('comment')}${cc||''}</button></span></div></div>`}).join('')||`<div class="empty">${CLOUD?'Лента пуста. Нажмите «+» и расскажите, что слушаете или смотрите.':'В этой папке пока никого нет.'}</div>`}</div>`}
function react(id,k){if(S.s.vib&&navigator.vibrate)navigator.vibrate(12);pop=null;
 if(CLOUD){const r=db.ref('reactions/'+id+'/'+uid);(CR[id]||{})[uid]==k?r.remove():r.set(k).catch(e=>toast('Ошибка: '+e.code));return render()}
 S.r[id]==k?delete S.r[id]:S.r[id]=k;save();render()}
function comments(id){
 if(!S.s.canComment)return toast('Комментарии отключены в настройках');
 const bg=document.createElement('div');bg.innerHTML=`<div class="sheet-bg"></div><div class="sheet" style="height:75%"><h3>Комментарии</h3><div class="bd" id="cl" style="flex:1"></div>
 <div class="inp"><input type="text" id="ci" placeholder="Напишите комментарий"><button class="pri" style="width:48px;padding:0;display:grid;place-items:center" id="cs">${ic('send')}</button></div></div>`;
 app.append(bg);openCm=id;
 drawCm=()=>{const arr=cmList(id);$('#cl').innerHTML=arr.length?arr.map(c=>{const u=CLOUD?(CU[c.uid]||{name:c.name}):c.u;return `<div class="cm">${av(u,36)}<div><b style="font-size:.85em">${esc(u.name)}</b><p>${esc(c.t)}</p></div></div>`}).join(''):'<div class="empty">Пока нет комментариев. Начните разговор.</div>';$('#cl').scrollTop=1e5};drawCm();
 const send=()=>{const v=$('#ci').value.trim();if(!v)return;$('#ci').value='';
  if(CLOUD)db.ref('comments/'+id).push({uid,name:S.u.name,t:v,ts:SV()}).catch(e=>toast('Ошибка: '+e.code));
  else{cmList(id).push({u:{name:S.u.name,avatar:S.u.avatar},t:v});save();drawCm()}};
 $('#cs').onclick=send;$('#ci').onkeydown=e=>e.key=='Enter'&&send();bg.firstChild.onclick=()=>{openCm=null;drawCm=null;bg.remove();render()}}
function compose(){
 let kind='music';const sel=new Set(S.u.interests.slice(0,3)),b=document.createElement('div'),PF={music:'Слушаю',film:'Смотрю',tv:'Сериал'};
 b.innerHTML=`<div class="sheet-bg"></div><div class="sheet"><h3>Новый пост</h3><div class="bd"><div class="seg" id="ck" style="margin:0">${Object.keys(PF).map(k=>`<button data-k="${k}" class="${k==kind?'on':''}">${{music:'Музыка',film:'Фильм',tv:'Сериал'}[k]}</button>`).join('')}</div>
 <label class="f">Название</label><input type="text" id="ct" maxlength="80"><label class="f">Расскажите подробнее</label><textarea id="cx" rows="3" maxlength="300"></textarea>
 <label class="f">Жанры</label><div id="cg">${TAGS.map(t=>`<button class="chip ${sel.has(t)?'on':''}">${t}</button>`).join('')}</div><button class="pri" id="cp" style="margin-top:12px">Опубликовать</button></div></div>`;app.append(b);
 $('#ck').onclick=e=>{const k=e.target.dataset.k;if(!k)return;kind=k;b.querySelectorAll('#ck button').forEach(x=>x.classList.toggle('on',x==e.target))};
 $('#cg').onclick=e=>{if(e.target.tagName!='BUTTON')return;const t=e.target.textContent;sel.has(t)?sel.delete(t):sel.add(t);e.target.classList.toggle('on')};
 b.firstChild.onclick=()=>{b.remove();render()};
 $('#cp').onclick=()=>{const t=$('#ct').value.trim();if(!t)return toast('Введите название');if(!sel.size)return toast('Выберите жанр');
  db.ref('posts').push({uid,kind,title:PF[kind]+': '+t,text:$('#cx').value.trim(),tags:[...sel],ts:SV()}).then(()=>toast('Опубликовано')).catch(e=>toast('Ошибка: '+e.code));b.remove();render()}}

// ---------- profile ----------
function profile(){const u=S.u,g=u.grad;
 return `<div class="scr"><div class="hero" style="background:linear-gradient(160deg,${g[0]},${g[1]})"><div id="pa" style="display:inline-block">${av(u,96)}</div>
 <h2>${esc(u.name)}</h2><div class="st">${S.s.hideNum?'Номер скрыт':u.phone||'Номер не указан'} · @${esc(u.username)}</div>${u.bio?`<p style="margin-top:8px">${esc(u.bio)}</p>`:''}</div>
 <div class="acts"><button id="bp">${ic('cam')}Выбрать фото</button><button id="be">${ic('pen')}Изменить</button><button id="bg">${ic('paint')}Фон</button></div>
 <div class="card"><div class="hd">Информация</div>
 ${[['Почта',u.email],['День рождения',new Date(u.bday).toLocaleDateString('ru',{day:'numeric',month:'long',year:'numeric'})+' ('+age(u.bday)+')'],['Имя пользователя','@'+u.username]].map(r=>`<div class="row"><div class="t">${esc(r[1])}<div class="s">${r[0]}</div></div></div>`).join('')}</div>
 <div class="card" style="padding:12px 16px 6px"><div class="hd" style="padding:0 0 8px">Интересы</div><div id="it">${TAGS.map(t=>`<button class="chip ${u.interests.includes(t)?'on':''}">${t}</button>`).join('')}</div></div>
 <input type="file" accept="image/*" id="fi" hidden></div>`}
function bindProfile(){
 const pick=()=>$('#fi').click();$('#pa').onclick=$('#bp').onclick=pick;
 $('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=256,m=Math.min(im.width,im.height);c.width=c.height=s;
  c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,s,s);S.u.avatar=c.toDataURL('image/jpeg',.85);save();render();toast('Фото обновлено')};im.src=r.result};r.readAsDataURL(f)};
 $('#be').onclick=()=>{tab='settings';sub='account';render()};
 $('#it').onclick=e=>{if(e.target.tagName!='BUTTON')return;const t=e.target.textContent,a=S.u.interests;a.includes(t)?a.splice(a.indexOf(t),1):a.push(t);save();e.target.classList.toggle('on')};
 $('#bg').onclick=()=>{const b=document.createElement('div');let c=[...S.u.grad];
  b.innerHTML=`<div class="sheet-bg"></div><div class="sheet"><h3>Фон профиля</h3><div class="bd"><div class="sw">${GR.map((g,i)=>`<button data-g="${i}" class="${g[0]==c[0]&&g[1]==c[1]?'on':''}" style="background:linear-gradient(135deg,${g[0]},${g[1]})"></button>`).join('')}</div>
  <label class="f">Свой градиент</label><div style="display:flex;gap:10px"><input type="color" id="c1" value="${c[0]}" style="flex:1;height:44px;border:0;background:none"><input type="color" id="c2" value="${c[1]}" style="flex:1;height:44px;border:0;background:none"></div>
  <button class="pri" id="ok" style="margin-top:14px">Готово</button></div></div>`;app.append(b);
  const up=()=>{S.u.grad=c;save();$('.hero').style.background=`linear-gradient(160deg,${c[0]},${c[1]})`};
  b.querySelector('.sw').onclick=e=>{const i=e.target.dataset.g;if(i==null)return;c=[...GR[i]];$('#c1').value=c[0];$('#c2').value=c[1];b.querySelectorAll('.sw button').forEach(x=>x.classList.toggle('on',x==e.target));up()};
  $('#c1').oninput=e=>{c[0]=e.target.value;up()};$('#c2').oninput=e=>{c[1]=e.target.value;up()};$('#ok').onclick=b.firstChild.onclick=()=>b.remove()}}

// ---------- settings ----------
const toggle=(k,l,s)=>({type:'tg',k,l,s});
const PAGES={
account:{t:'Аккаунт',i:[{type:'tx',k:'u.name',l:'Имя'},{type:'tx',k:'u.username',l:'Имя пользователя'},{type:'tx',k:'u.bio',l:'О себе'},{type:'tx',k:'u.email',l:'Почта'},{type:'tx',k:'u.phone',l:'Номер телефона'},{type:'tx',k:'u.bday',l:'День рождения',d:1}]},
chats:{t:'Настройки чатов',i:[{type:'seg',k:'theme',l:'Тема',o:[['light','Светлая'],['dark','Тёмная'],['auto','Авто']]},{type:'rg',k:'font',l:'Размер текста'},toggle('anim','Анимации','Реакции и переходы')]},
privacy:{t:'Конфиденциальность',i:[toggle('hideNum','Скрывать номер'),toggle('lastSeen','Время захода','Показывать «в сети»'),toggle('showAge','Показывать возраст'),toggle('visible','Профиль виден в ленте'),toggle('canComment','Комментарии под постами')]},
notif:{t:'Уведомления',i:[toggle('sound','Звук'),toggle('vib','Вибрация'),toggle('prev','Предпросмотр сообщений'),toggle('badge','Счётчик сообщений')]},
data:{t:'Данные и память',i:[toggle('autoPhoto','Автозагрузка фото'),toggle('autoVideo','Автозагрузка видео'),{type:'bt',l:'Очистить реакции и комментарии',a:'clear'},{type:'bt',l:'Скачать мои данные (JSON)',a:'export'}]},
folders:{t:'Папки с чатами',i:[{type:'fd'}]},
devices:{t:'Устройства',i:[{type:'dv'}]},
energy:{t:'Энергосбережение',i:[toggle('lowpower','Экономия энергии','Отключает анимации')]},
lang:{t:'Язык',i:[{type:'seg',k:'lang',l:'Язык интерфейса',o:[['ru','Русский'],['en','English']]}]}};
const MENU=[['account','Аккаунт','Номер, имя пользователя, «О себе»','user','#3b8fe8'],['chats','Настройки чатов','Обои, ночной режим, анимации','chat','#e8a13b'],['privacy','Конфиденциальность','Время захода, устройства','lock','#4cb36a'],['notif','Уведомления','Звуки, счётчик сообщений','bell','#e5484d'],['data','Данные и память','Настройки загрузки медиафайлов','pie','#4a62c9'],['folders','Папки с чатами','Сортировка ленты по папкам','folder','#3b8fe8'],['devices','Устройства','Управление активными сеансами','device','#3aa6b9'],['energy','Энергосбережение','Экономия энергии при низком заряде','bat','#e0734a'],['lang','Язык',{ru:'Русский',en:'English'},'globe','#a05ad8']];
const gv=k=>k[0]=='u'&&k[1]=='.'?S.u[k.slice(2)]:S.s[k];
const sv=(k,v)=>{k[0]=='u'&&k[1]=='.'?S.u[k.slice(2)]=v:S.s[k]=v;save();applyTheme()};
function settings(){
 if(!sub)return `<div class="scr"><div class="top"><h1>${T('settings')}</h1></div><div class="card">${MENU.map(m=>`<button class="row" data-sub="${m[0]}"><span class="ico" style="background:${m[4]}">${ic(m[3])}</span><span class="t">${m[1]}<div class="s">${typeof m[2]=='object'?m[2][S.s.lang]:m[2]}</div></span></button>`).join('')}</div>
 <div class="card"><button class="row" id="lo"><span class="ico" style="background:#e5484d">${ic('out')}</span><span class="t">Выйти из аккаунта</span></button></div><p style="text-align:center;color:var(--sub);font-size:.82em">Flux v1.0</p></div>`;
 const pg=PAGES[sub];
 return `<div class="scr"><div class="top"><button id="bk" style="display:flex;align-items:center;gap:4px;color:var(--ac)">${ic('back')}Назад</button><h1 style="font-size:1.1em">${pg.t}</h1><span style="width:70px"></span></div><div class="card" id="pg">${pg.i.map(item).join('')}</div></div>`}
function item(it){
 if(it.type=='tg')return `<button class="row" data-tg="${it.k}"><span class="t">${it.l}${it.s?`<div class="s">${it.s}</div>`:''}</span><span class="tg ${S.s[it.k]?'on':''}"></span></button>`;
 if(it.type=='tx')return `<div style="padding:4px 16px"><label class="f">${it.l}</label><input type="${it.d?'date':'text'}" data-tx="${it.k}" value="${esc(gv(it.k)||'')}"></div>`;
 if(it.type=='seg')return `<div class="hd">${it.l}</div><div class="seg">${it.o.map(o=>`<button data-sg="${it.k}:${o[0]}" class="${S.s[it.k]==o[0]?'on':''}">${o[1]}</button>`).join('')}</div>`;
 if(it.type=='rg')return `<div class="hd">${it.l}</div><div style="padding:8px 16px"><input type="range" min="13" max="20" value="${S.s.font}" data-rg="${it.k}" style="width:100%"></div>`;
 if(it.type=='bt')return `<button class="row" data-bt="${it.a}"><span class="t" style="color:var(--ac)">${it.l}</span></button>`;
 if(it.type=='dv')return `<div class="hd">Это устройство</div><div class="row"><span class="ico" style="background:#3aa6b9">${ic('device')}</span><span class="t">${/Android/.test(navigator.userAgent)?'Android':/iPhone|iPad/.test(navigator.userAgent)?'iOS':'Браузер'}<div class="s">Активно сейчас · ${navigator.platform||'web'}</div></span></div><button class="row" data-bt="others"><span class="t" style="color:#e5484d">Завершить все другие сеансы</span></button>`;
 if(it.type=='fd')return `<div class="hd">Ваши папки</div>${S.folders.map((f,i)=>`<div class="row"><span class="ico" style="background:#3b8fe8">${ic('folder')}</span><span class="t">${esc(f.name)}<div class="s">${f.tags.join(', ')}</div></span><button data-df="${i}" style="color:#e5484d">${ic('close')}</button></div>`).join('')||'<div class="empty" style="padding:16px">Папок пока нет</div>'}
 <div style="padding:4px 16px"><label class="f">Название папки</label><input type="text" id="fn"><div id="ft" style="margin-top:10px">${TAGS.map(t=>`<button class="chip">${t}</button>`).join('')}</div><button class="pri" id="fa" style="margin:6px 0 12px">Создать папку</button></div>`}
function bindSettings(){
 document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{sub=b.dataset.sub;render()});
 const bk=$('#bk');if(bk)bk.onclick=()=>{sub=null;render()};
 const lo=$('#lo');if(lo)lo.onclick=()=>{if(confirm('Выйти и удалить профиль с этого устройства?')){const go=()=>{localStorage.removeItem(KEY);location.reload()};CLOUD&&uid?db.ref('users/'+uid).remove().finally(()=>firebase.auth().signOut().finally(go)):go()}};
 document.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{const k=b.dataset.tg;sv(k,S.s[k]?0:1);b.querySelector('.tg').classList.toggle('on')});
 document.querySelectorAll('[data-tx]').forEach(i=>i.onchange=()=>{let v=i.value.trim();const k=i.dataset.tx;
  if(k=='u.username'&&!/^[a-z0-9_]{3,20}$/i.test(v)){i.value=S.u.username;return toast('Некорректное имя пользователя')}
  if(k=='u.name'&&v.length<2){i.value=S.u.name;return toast('Имя слишком короткое')}sv(k,v);toast('Сохранено')});
 document.querySelectorAll('[data-sg]').forEach(b=>b.onclick=()=>{const[k,v]=b.dataset.sg.split(':');sv(k,v);render()});
 document.querySelectorAll('[data-rg]').forEach(i=>i.oninput=()=>sv(i.dataset.rg,+i.value));
 document.querySelectorAll('[data-bt]').forEach(b=>b.onclick=()=>{const a=b.dataset.bt;
  if(a=='clear'){S.r={};S.c={};S.cm={};save();toast('Очищено')}
  if(a=='others')toast('Другие сеансы завершены');
  if(a=='export'){const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='flux-data.json';l.click()}});
 const ft=$('#ft');if(ft){ft.onclick=e=>e.target.tagName=='BUTTON'&&e.target.classList.toggle('on');
  $('#fa').onclick=()=>{const n=$('#fn').value.trim(),t=[...ft.querySelectorAll('.on')].map(x=>x.textContent);if(!n||!t.length)return toast('Введите название и выберите жанры');S.folders.push({name:n,tags:t});save();render()};
  document.querySelectorAll('[data-df]').forEach(b=>b.onclick=()=>{S.folders.splice(+b.dataset.df,1);S.feedFilter='all';save();render()})}}

// ---------- shell ----------
function render(){
 const keep=app.querySelector('.scr')?.scrollTop||0;
 app.querySelectorAll('.scr,.nav,.fab,.sheet,.sheet-bg').forEach(e=>e.remove());
 applyTheme();if(!S.u)return gate();
 app.insertAdjacentHTML('afterbegin',(tab=='feed'?feed():tab=='profile'?profile():settings())+
 `<div class="nav">${[['feed','cards'],['profile','user'],['settings','gear']].map(n=>`<button data-tab="${n[0]}" class="${tab==n[0]?'on':''}"><span class="pl">${ic(n[1])}</span>${T(n[0])}</button>`).join('')}</div>${tab=='feed'&&CLOUD?`<button class="fab" id="fab">${ic('plus')}</button>`:''}`);
 app.querySelector('.scr').scrollTop=keep;
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;if(tab!='settings')sub=null;pop=null;render()});
 if(tab=='feed'){
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.feedFilter=b.dataset.f;save();render()});
  document.querySelectorAll('[data-pop]').forEach(b=>b.onclick=()=>{pop=pop==b.dataset.pop?null:b.dataset.pop;render()});
  document.querySelectorAll('[data-rx]').forEach(b=>b.onclick=()=>{const[i,k]=b.dataset.rx.split(':');react(i,k)});
  document.querySelectorAll('[data-cm]').forEach(b=>b.onclick=()=>comments(b.dataset.cm));
  const fb=$('#fab');if(fb)fb.onclick=compose;
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>confirm('Удалить пост?')&&db.ref('posts/'+b.dataset.del).remove())}
 if(tab=='profile')bindProfile();if(tab=='settings')bindSettings()}
if(CLOUD)initCloud();render();
app.insertAdjacentHTML('beforeend',`<div class="splash" id="sp">${ic('send')}</div>`);setTimeout(()=>$('#sp').classList.add('out'),650);setTimeout(()=>$('#sp').remove(),1200);
document.addEventListener('pointerdown',e=>{const t=e.target.closest('button,.row,.chip');if(!t)return;const r=t.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,x=document.createElement('span');
 x.className='rip';x.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;t.append(x);setTimeout(()=>x.remove(),600)});
history.pushState({},'');
addEventListener('popstate',()=>{history.pushState({},'');const sh=document.querySelector('.sheet-bg');
 if(sh){sh.click();return}if(pop){pop=null;render();return}if(sub){sub=null;render();return}if(tab!='feed'){tab='feed';render()}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
