<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17212b">
<title>Flux</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;transition:background .2s,color .2s;-webkit-font-smoothing:antialiased}
:root{
  --bg:#0e1621;--panel:#17212b;--panel2:#242f3d;--hover:#202b36;--active:#2b5278;
  --text:#fff;--text2:#8b9aa8;--text3:#6c7883;--accent:#4ea4f6;--accent2:#64b5ef;
  --bubble-in:#212d3b;--bubble-out:#2b5278;--border:#0b1219;--menu:#1c2733;
  --divider:#101921;--section:#1a2533;--icon-bg:#222f3e;
}
body.light{
  --bg:#fff;--panel:#fff;--panel2:#f1f3f5;--hover:#f4f4f5;--active:#e8f1fb;
  --text:#000;--text2:#707579;--text3:#9aa0a6;--accent:#3390ec;--accent2:#3390ec;
  --bubble-in:#fff;--bubble-out:#effdde;--border:#e4e6e8;--menu:#fff;
  --divider:#eaecef;--section:#f7f8fa;--icon-bg:#eef1f4;
}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer}
::-webkit-scrollbar{width:0;height:0}
.screen{display:none;height:100vh;height:100dvh;overflow:hidden}
.screen.show{display:flex}
.center{align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.card{background:var(--panel);border-radius:18px;padding:32px 26px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card h1{font-size:26px;font-weight:600;margin-bottom:6px;text-align:center;background:linear-gradient(135deg,var(--accent),#64b5ef);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card .sub{color:var(--text2);font-size:13px;text-align:center;margin-bottom:22px}
.tabs-seg{display:flex;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:20px}
.tab-seg{flex:1;padding:10px;border-radius:8px;font-size:14px;font-weight:500;color:var(--text2);transition:.15s}
.tab-seg.active{background:var(--accent);color:#fff}
.fi{width:100%;background:var(--bg);border-radius:10px;padding:13px 16px;font-size:15px;margin-bottom:10px;border:1.5px solid transparent;color:var(--text)}
.fi:focus{border-color:var(--accent)}
.err{background:#e0483d22;border:1px solid #e0483d55;color:#ff8b80;font-size:13px;padding:10px 14px;border-radius:9px;margin-bottom:12px}
.err:empty{display:none;padding:0;border:none;margin:0}
.primary{background:var(--accent);color:#fff;padding:13px 22px;border-radius:10px;font-size:15px;font-weight:600}
.primary:hover{filter:brightness(1.1)}
.primary:disabled{opacity:.6}
.primary.wide{width:100%}
.ghost{padding:10px 16px;border-radius:9px;color:var(--accent);font-weight:500}
.danger{background:#e0483d;color:#fff}
.sm{font-size:12px;color:var(--text2)}
#splash{align-items:center;justify-content:center;flex-direction:column;gap:20px;background:var(--bg)}
#splash .logo{width:80px;height:80px;border-radius:22px;background:linear-gradient(135deg,var(--accent),#64b5ef);display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700;color:#fff;box-shadow:0 12px 40px rgba(78,164,246,.4)}
.spinner{width:42px;height:42px;border:3px solid var(--panel2);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* APP LAYOUT */
#app{flex-direction:column;background:var(--bg);position:relative}
.app-content{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}
.app-view{display:none;flex-direction:column;height:100%;overflow:hidden}
.app-view.active{display:flex}
.bottom-nav{display:flex;background:var(--panel);border-top:1px solid var(--divider);padding-bottom:env(safe-area-inset-bottom,0);flex-shrink:0;z-index:20}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px 6px;color:var(--text3);gap:3px;position:relative;transition:color .15s}
.bn-item.active{color:var(--accent)}
.bn-item svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bn-item.active svg{stroke-width:2.2}
.bn-item .label{font-size:10.5px;font-weight:500}
.bn-item .badge{position:absolute;top:4px;right:calc(50% - 22px);background:#e0483d;color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:flex;align-items:center;justify-content:center;border:2px solid var(--panel)}

/* HEADER */
.scr-head{display:flex;align-items:center;gap:8px;padding:14px 16px 8px;padding-top:calc(14px + env(safe-area-inset-top,0));background:var(--panel);flex-shrink:0}
.scr-head h1{font-size:24px;font-weight:700;flex:1;letter-spacing:-.4px}
.scr-head .ibtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text2);flex-shrink:0;transition:.15s}
.scr-head .ibtn:hover{background:var(--hover);color:var(--text)}
.scr-head .ibtn:active{transform:scale(.92)}
.scr-head .ibtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* CHATS TAB */
.search-pill{margin:8px 12px 10px;background:var(--panel2);border-radius:22px;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.search-pill svg{width:18px;height:18px;stroke:var(--text3);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.search-pill input{flex:1;font-size:15px;color:var(--text);min-width:0}
.search-pill input::placeholder{color:var(--text3)}

.folder-tabs{display:flex;gap:0;padding:0 12px 8px;flex-shrink:0}
.folder-tab{flex:1;padding:8px 14px;border-radius:18px;font-size:14px;font-weight:500;color:var(--text2);background:transparent;text-align:center;transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px}
.folder-tab.active{background:var(--active);color:#fff;font-weight:600}
body.light .folder-tab.active{background:var(--accent);color:#fff}
.folder-tab .cnt{background:rgba(255,255,255,.15);color:inherit;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:9px;min-width:22px}
.folder-tab:not(.active) .cnt{background:var(--panel2);color:var(--text3)}

#chatList{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ci{display:flex;align-items:center;gap:12px;padding:8px 12px;cursor:pointer;transition:background .1s;user-select:none;position:relative}
.ci:hover{background:var(--hover)}
.ci.active{background:var(--active)}
.ci.active .ci-name,.ci.active .ci-prev{color:#fff}
.ci.active .ci-time{color:rgba(255,255,255,.7)}
.ci-body{flex:1;min-width:0}
.ci-top{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.ci-name{font-weight:600;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.ci-name .pin-mini{width:14px;height:14px;stroke:var(--text3);fill:none;stroke-width:2;flex-shrink:0}
.ci-time{font-size:12px;color:var(--text3);flex-shrink:0;display:flex;align-items:center;gap:4px}
.ci-bot{display:flex;align-items:center;gap:6px}
.ci-prev{font-size:14px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;flex:1;min-width:0}
.ci-ticks{color:var(--accent);font-weight:800;font-size:11px;letter-spacing:-1px;margin-right:2px;flex-shrink:0}
.ci-mute{width:14px;height:14px;stroke:var(--text3);fill:none;stroke-width:2;flex-shrink:0}
.ci-badge{background:var(--accent);color:#fff;font-size:12px;font-weight:700;min-width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;padding:0 7px;flex-shrink:0}
.ci-badge.muted{background:var(--text3)}
.empty{text-align:center;color:var(--text3);font-size:14px;padding:60px 24px;line-height:1.6}
.empty svg{width:64px;height:64px;stroke:var(--text3);fill:none;stroke-width:1.2;opacity:.5;margin-bottom:12px}

#fab{position:absolute;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;background:#4ea4f6;color:#fff;font-size:28px;font-weight:300;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(78,164,246,.5);z-index:10;transition:transform .15s}
#fab:active{transform:scale(.9)}

/* CONTACTS */
.contact-item{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;transition:.1s}
.contact-item:hover{background:var(--hover)}
.contact-item .avatar{width:54px;height:54px;font-size:20px}
.contact-body{flex:1;min-width:0}
.contact-name{font-size:15px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact-sub{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact-status{font-size:12px;color:var(--text3);flex-shrink:0}
.contact-status.online{color:var(--accent)}

/* SETTINGS */
.settings-scroll{flex:1;overflow-y:auto}
.settings-profile{display:flex;flex-direction:column;align-items:center;padding:24px 20px 20px;cursor:pointer}
.settings-profile .avatar{width:110px;height:110px;font-size:42px;margin-bottom:14px;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.settings-profile .pname{font-size:22px;font-weight:700;margin-bottom:4px}
.settings-profile .puser{font-size:14px;color:var(--text2)}
.settings-section{margin:8px 12px 14px;border-radius:14px;background:var(--section);overflow:hidden}
.setting-row{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer;transition:background .1s;position:relative}
.setting-row:hover{background:var(--hover)}
.setting-row:not(:last-child)::after{content:'';position:absolute;left:64px;right:0;bottom:0;height:1px;background:var(--divider)}
.setting-row .ico{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.setting-row .ico svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.setting-row .lbl{flex:1;font-size:15px;font-weight:400}
.setting-row .val{font-size:14px;color:var(--text2)}
.setting-row .arrow{width:16px;height:16px;stroke:var(--text3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ico-blue{background:#3390ec}.ico-green{background:#4caf50}.ico-orange{background:#ff9800}.ico-red{background:#f44336}
.ico-purple{background:#9c27b0}.ico-teal{background:#00bcd4}.ico-indigo{background:#3f51b5}
.settings-version{text-align:center;font-size:12px;color:var(--text3);padding:16px 0 24px}

/* PROFILE */
.profile-hero{display:flex;flex-direction:column;align-items:center;padding:20px 20px 16px}
.profile-avatar-wrap{position:relative;margin-bottom:14px}
.profile-avatar-wrap .avatar{width:120px;height:120px;font-size:48px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.profile-avatar-wrap .cam{position:absolute;bottom:2px;right:2px;width:36px;height:36px;border-radius:50%;background:#4ea4f6;display:flex;align-items:center;justify-content:center;border:3px solid var(--bg)}
.profile-avatar-wrap .cam svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.profile-name{font-size:24px;font-weight:700;margin-bottom:4px}
.profile-user{font-size:14px;color:var(--text2)}
.profile-status{font-size:13px;color:var(--accent);margin-top:6px}
.profile-actions{display:flex;gap:8px;padding:0 12px 16px;width:100%;max-width:420px}
.profile-action{flex:1;background:var(--section);border-radius:14px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:.15s}
.profile-action:hover{background:var(--hover)}
.profile-action:active{transform:scale(.97)}
.profile-action svg{width:22px;height:22px;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.profile-action .lbl{font-size:12px;font-weight:500;text-align:center}
.profile-info-card{background:var(--section);border-radius:14px;margin:0 12px 14px;overflow:hidden}
.profile-info-row{padding:12px 16px;position:relative}
.profile-info-row:not(:last-child)::after{content:'';position:absolute;left:16px;right:0;bottom:0;height:1px;background:var(--divider)}
.profile-info-row .lbl{font-size:15px;color:var(--text);margin-bottom:2px}
.profile-info-row .sub{font-size:13px;color:var(--text3)}

/* CHAT VIEW */
#chatView{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;flex-direction:column;transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1)}
#chatView.show{display:flex;transform:none}

#cvHead{display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0));background:var(--panel);border-bottom:1px solid var(--divider);flex-shrink:0;z-index:10}
#cvHead .avatar{width:42px;height:42px;font-size:17px;flex-shrink:0}
#cvHead .info{flex:1;min-width:0;cursor:pointer;padding:4px 0}
#cvTitle{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
#cvSub{font-size:13px;color:var(--text2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cvSub.online{color:var(--accent)}
#cvSub.typing{color:var(--accent);font-style:italic}
#cvHead .ibtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text2);flex-shrink:0}
#cvHead .ibtn:hover{background:var(--hover);color:var(--text)}
#cvHead .ibtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#pinned{display:none;align-items:center;gap:12px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--divider);cursor:pointer;flex-shrink:0}
#pinned.show{display:flex}
#pinned .bar{width:3px;align-self:stretch;background:var(--accent);border-radius:2px}
#pinned .pb{flex:1;min-width:0}
#pinned .pb-t{font-size:13px;font-weight:600;color:var(--accent);margin-bottom:1px}
#pinned .pb-x{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pinned svg.close{width:20px;height:20px;stroke:var(--text3);fill:none;stroke-width:2;flex-shrink:0}

#chatSearchBar{display:none;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--divider);flex-shrink:0}
#chatSearchBar.show{display:flex}
#chatSearchBar input{flex:1;background:var(--panel2);border-radius:18px;padding:8px 14px;font-size:14px;color:var(--text)}
#chatSearchBar button{color:var(--text2);padding:6px;display:flex}
#chatSearchBar svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

#messages{flex:1;overflow-y:auto;padding:14px 10px 6px;display:flex;flex-direction:column;position:relative;background-image:radial-gradient(circle at 15% 25%,rgba(78,164,246,.05) 0,transparent 45%),radial-gradient(circle at 85% 75%,rgba(155,89,182,.04) 0,transparent 45%);-webkit-overflow-scrolling:touch}
body.light #messages{background-image:radial-gradient(circle at 15% 25%,rgba(78,164,246,.07) 0,transparent 45%),radial-gradient(circle at 85% 75%,rgba(155,89,182,.07) 0,transparent 45%)}

#loadMore{text-align:center;padding:10px;font-size:13px;color:var(--accent);cursor:pointer;flex-shrink:0;font-weight:500}

.date-sep{align-self:center;background:rgba(0,0,0,.35);color:#fff;font-size:12.5px;padding:4px 12px;border-radius:12px;margin:14px 0 10px;font-weight:500;backdrop-filter:blur(8px)}
body.light .date-sep{background:rgba(0,0,0,.18)}

.msg{display:flex;align-items:flex-end;gap:6px;margin-top:2px;max-width:82%;position:relative;animation:msgIn .18s ease}
.msg.in{align-self:flex-start}
.msg.out{align-self:flex-end;flex-direction:row-reverse}
.msg.group-start{margin-top:10px}
.msg:first-child{margin-top:0}
@keyframes msgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.msg-av{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:13px;overflow:hidden;background-size:cover;background-position:center;align-self:flex-end}
.msg-av.spacer{visibility:hidden}

.bubble{display:flex;flex-direction:column;padding:7px 12px 5px 13px;border-radius:16px;background:var(--bubble-in);min-width:80px;max-width:100%;box-shadow:0 1px 1.5px rgba(0,0,0,.12);position:relative;word-wrap:break-word}
.msg.out .bubble{background:var(--bubble-out);color:#fff}
body.light .msg.out .bubble{background:linear-gradient(135deg,#e7ffdb,#d2f5c2);color:#000}

.msg.in.group-end .bubble{border-bottom-left-radius:5px}
.msg.out.group-end .bubble{border-bottom-right-radius:5px}

.msg.in.group-end .bubble::after{content:'';position:absolute;left:-7px;bottom:0;width:10px;height:14px;background:var(--bubble-in);clip-path:polygon(100% 0,100% 100%,0 100%)}
.msg.out.group-end .bubble::after{content:'';position:absolute;right:-7px;bottom:0;width:10px;height:14px;background:var(--bubble-out);clip-path:polygon(0 0,100% 100%,0 100%)}
body.light .msg.out.group-end .bubble::after{background:#d2f5c2}

.author{font-size:13.5px;font-weight:600;color:#64b5ef;margin-bottom:2px;padding-top:1px}
body.light .msg.in .author{color:#3390ec}

.text{font-size:15px;line-height:1.35;white-space:pre-wrap;word-wrap:break-word;padding-bottom:1px}
.text.deleted{font-style:italic;color:var(--text3);font-size:13.5px}
.msg.out .text.deleted{color:rgba(255,255,255,.6)}
body.light .msg.out .text.deleted{color:#6fb56f}
.text a{color:#64b5ef;text-decoration:underline;text-decoration-color:rgba(100,181,239,.45)}
.msg.out .text a{color:#a8d8ff}
body.light .msg.out .text a{color:#3390ec}
body.light .msg.in .text a{color:#3390ec}

.meta{display:flex;align-items:center;justify-content:flex-end;gap:3px;margin-top:1px;margin-bottom:-1px;margin-right:-2px;font-size:11px;line-height:1;color:var(--text3);user-select:none;font-variant-numeric:tabular-nums}
.msg.out .meta{color:rgba(255,255,255,.75)}
body.light .msg.out .meta{color:#6fb56f}
.meta .ed{font-style:italic;opacity:.85;margin-right:1px}
.tick{font-size:12px;font-weight:700;letter-spacing:-1.5px}
.tick.read{color:#64b5ef}
.msg.out .tick{color:rgba(255,255,255,.75)}
.msg.out .tick.read{color:#64b5ef}
body.light .msg.out .tick{color:#5a8a5a}
body.light .msg.out .tick.read{color:#4fae4e}

.quote{border-left:3px solid #64b5ef;padding:3px 8px;margin-bottom:5px;background:rgba(0,0,0,.15);border-radius:5px;cursor:pointer}
.msg.out .quote{border-left-color:#a8d8ff;background:rgba(0,0,0,.2)}
body.light .msg.out .quote{background:rgba(255,255,255,.55);border-left-color:#4fae4e}
.quote .qn{font-size:12.5px;font-weight:600;color:#64b5ef;margin-bottom:1px}
.msg.out .quote .qn{color:#a8d8ff}
body.light .msg.out .quote .qn{color:#4fae4e}
.quote .qt{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.msg.out .quote .qt{color:rgba(255,255,255,.85)}
body.light .msg.out .quote .qt{color:#5a8a5a}

.fwd-note{font-size:12.5px;font-weight:600;color:#64b5ef;margin-bottom:3px;font-style:italic}
.msg.out .fwd-note{color:#a8d8ff}
body.light .msg.out .fwd-note{color:#4fae4e}

.media{margin:-4px -9px 5px -10px;border-radius:12px;overflow:hidden;cursor:pointer;background:#000;display:block}
.media img{display:block;width:100%;max-width:340px;max-height:420px;object-fit:cover}
.media video{display:block;width:100%;max-width:340px;border-radius:12px;background:#000}

.file{display:flex;align-items:center;gap:10px;padding:4px 0;min-width:210px;cursor:pointer}
.file-ico{width:44px;height:44px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.file-ico svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.file-n{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.file-s{font-size:12px;color:var(--text2);margin-top:2px}

.voice{display:flex;align-items:center;gap:10px;min-width:200px;padding:2px 0}
.voice-btn{width:38px;height:38px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.voice-btn svg{width:14px;height:14px;fill:#fff;stroke:none}
.voice-wave{flex:1;display:flex;align-items:center;gap:2px;height:26px}
.voice-wave i{width:2.5px;background:var(--text3);border-radius:2px;display:block;transition:background .1s}
.voice-wave i.played{background:var(--accent)}
.msg.out .voice-wave i{background:rgba(255,255,255,.4)}
.msg.out .voice-wave i.played{background:#fff}
.voice-dur{font-size:12px;color:var(--text2);flex-shrink:0;min-width:32px;text-align:right}

.rxns{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;margin-bottom:-2px}
.rxn{background:rgba(0,0,0,.25);border-radius:12px;padding:2px 9px;font-size:14px;display:flex;align-items:center;gap:4px;color:#fff;transition:.12s}
.rxn:active{transform:scale(.9)}
.rxn.mine{background:var(--accent)}
.rxn b{font-size:12px;font-weight:600}
body.light .rxn{background:rgba(0,0,0,.08);color:var(--text)}
body.light .rxn.mine{background:#d0e7ff;color:#145a9e}

#composer{background:var(--panel);border-top:1px solid var(--divider);padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0));flex-shrink:0;position:relative}
#replyPrev{display:none;align-items:center;gap:10px;padding:6px 10px;background:var(--panel2);border-radius:10px;margin-bottom:8px}
#replyPrev.show{display:flex}
#replyPrev .rp-bar{width:3px;align-self:stretch;background:var(--accent);border-radius:2px}
#replyPrev .rp-body{flex:1;min-width:0}
#replyPrev .rp-n{font-size:12.5px;font-weight:600;color:var(--accent)}
#replyPrev .rp-t{font-size:12.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#replyPrev button{color:var(--text3);padding:4px;font-size:18px;line-height:1}

.row-input{display:flex;gap:6px;align-items:flex-end}
#msgInput{flex:1;background:var(--panel2);border-radius:22px;padding:11px 16px;font-size:15px;resize:none;max-height:130px;line-height:1.35;color:var(--text);font-family:inherit}
#msgInput::placeholder{color:var(--text3)}
#sendBtn{width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s;box-shadow:0 2px 8px rgba(78,164,246,.4)}
#sendBtn:active{transform:scale(.9)}
#sendBtn.mic{background:transparent;color:var(--text2);box-shadow:none}
#sendBtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.ibtn-sm{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text2);flex-shrink:0;transition:.15s}
.ibtn-sm:hover{background:var(--hover);color:var(--text)}
.ibtn-sm svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#attachMenu{position:absolute;bottom:calc(100% + 4px);left:8px;background:var(--menu);border-radius:14px;padding:8px;display:none;flex-direction:column;gap:2px;box-shadow:0 8px 28px rgba(0,0,0,.5);min-width:230px;z-index:30}
#attachMenu.show{display:flex;animation:pop .14s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
.ai{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:9px;font-size:14.5px;font-weight:500;text-align:left;width:100%;position:relative;overflow:hidden;color:var(--text)}
.ai:hover{background:var(--hover)}
.ai svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ai input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}

#emojiPicker{position:absolute;bottom:calc(100% + 4px);left:8px;right:8px;max-height:280px;overflow-y:auto;background:var(--menu);border-radius:14px;padding:8px;box-shadow:0 8px 28px rgba(0,0,0,.5);z-index:30;display:none;grid-template-columns:repeat(8,1fr);gap:2px}
#emojiPicker.show{display:grid}
#emojiPicker button{font-size:23px;padding:5px;border-radius:8px;line-height:1;transition:.1s}
#emojiPicker button:hover{background:var(--hover);transform:scale(1.12)}

/* AVATARS */
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex-shrink:0;width:54px;height:54px;font-size:20px;overflow:hidden;background-size:cover;background-position:center;position:relative}
.avatar.sm{width:40px;height:40px;font-size:16px}
.avatar.xs{width:32px;height:32px;font-size:13px}
.avatar.lg{width:110px;height:110px;font-size:44px}

/* CONTEXT MENU */
#ctxMenu{position:fixed;background:var(--menu);border-radius:14px;padding:6px;display:none;min-width:230px;box-shadow:0 12px 40px rgba(0,0,0,.6);z-index:900;overflow:hidden;animation:pop .13s ease}
#ctxMenu.show{display:block}
#ctxMenu button{display:flex;align-items:center;gap:14px;width:100%;padding:11px 14px;border-radius:9px;font-size:15px;font-weight:500;text-align:left;color:var(--text);transition:background .1s}
#ctxMenu button:hover{background:var(--hover)}
#ctxMenu button.danger{color:#ff6b6b}
#ctxMenu button.danger:hover{background:rgba(224,72,61,.15)}
#ctxMenu svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
#ctxMenu .rxs{display:flex;gap:2px;padding:4px 4px 8px;border-bottom:1px solid var(--divider);margin-bottom:4px;justify-content:space-between}
#ctxMenu .rxs button{width:40px;height:40px;justify-content:center;font-size:24px;border-radius:50%;padding:0;transition:transform .12s}
#ctxMenu .rxs button:hover{transform:scale(1.18);background:transparent}

/* MODALS */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:800;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.overlay.show{display:flex;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border-radius:16px;padding:22px;width:100%;max-width:440px;animation:pop .2s;max-height:88vh;overflow-y:auto;color:var(--text)}
.modal h3{font-size:19px;font-weight:600;margin-bottom:6px}
.modal .sub{color:var(--text2);font-size:13.5px;margin-bottom:16px;line-height:1.4}
.mActions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.found{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:12px;padding:12px;margin-top:10px}
.found .info{flex:1;min-width:0}
.found .nm{font-weight:600;font-size:15px}
.found .us{color:var(--accent);font-size:12.5px;margin-top:1px}
.member{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:10px;padding:10px;margin-top:8px}
.member .info{flex:1;min-width:0}
.member .nm{font-weight:600;font-size:14px}
.member .sub{color:var(--text2);font-size:12px;margin-top:1px}

#toast{position:fixed;bottom:80px;left:50%;transform:translate(-50%,80px);background:#2b3844;color:#fff;padding:11px 20px;border-radius:22px;font-size:14px;z-index:9999;opacity:0;transition:all .3s cubic-bezier(.4,0,.2,1);pointer-events:none;max-width:88vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.5);font-weight:500}
#toast.show{opacity:1;transform:translate(-50%,0)}

#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:950;display:none;align-items:center;justify-content:center}
#lightbox.show{display:flex}
#lightbox img{max-width:96vw;max-height:88vh;object-fit:contain}
#lightbox .close{position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center}

#recOv{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:920;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px}
#recOv.show{display:flex}
.rec-circle{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,#e0483d,#ff8a65);display:flex;align-items:center;justify-content:center;animation:recP 1.4s infinite}
@keyframes recP{0%,100%{box-shadow:0 0 0 0 rgba(224,72,61,.55)}50%{box-shadow:0 0 0 26px rgba(224,72,61,0)}}
.rec-circle svg{width:48px;height:48px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#recTimer{color:#fff;font-size:30px;font-weight:300;font-variant-numeric:tabular-nums}
#recLabel{color:rgba(255,255,255,.7);font-size:14px}
.rec-actions{display:flex;gap:16px}
.rec-actions button{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.rec-actions svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.rec-cancel{background:rgba(255,255,255,.15)}
.rec-send{background:#4caf50}

.offline{position:fixed;top:0;left:0;right:0;background:#e0483d;color:#fff;font-size:12.5px;text-align:center;padding:6px;z-index:9998;transform:translateY(-100%);transition:transform .25s}
.offline.show{transform:none}
</style>
</head>
<body>

<div class="offline" id="offlineBar">Нет подключения к интернету</div>

<div class="screen center show" id="splash">
  <div class="logo">F</div>
  <div class="spinner"></div>
  <div class="sm" id="splashText">Flux загружается...</div>
</div>

<div class="screen center" id="authScreen">
  <div class="card">
    <h1>Flux</h1>
    <p class="sub">Быстрый онлайн-мессенджер</p>
    <div class="tabs-seg">
      <button class="tab-seg active" data-mode="login">Вход</button>
      <button class="tab-seg" data-mode="register">Регистрация</button>
    </div>
    <input class="fi" id="email" type="email" placeholder="Email" autocomplete="email">
    <input class="fi" id="password" type="password" placeholder="Пароль (мин. 6)" autocomplete="current-password">
    <div class="err" id="authError"></div>
    <button class="primary wide" id="authBtn">Войти</button>
  </div>
</div>

<div class="screen center" id="profileSetup">
  <div class="card">
    <h1>Настройка профиля</h1>
    <p class="sub">Как вас будут видеть другие</p>
    <div style="text-align:center;margin-bottom:16px">
      <div class="avatar lg" id="setupAv" style="margin:0 auto;background:linear-gradient(135deg,#4ea4f6,#64b5ef);cursor:pointer">+</div>
      <input type="file" id="setupAvFile" accept="image/*" style="display:none">
      <div class="sm" style="margin-top:8px">Нажмите чтобы добавить фото</div>
    </div>
    <input class="fi" id="pName" placeholder="Ваше имя" maxlength="30">
    <input class="fi" id="pUser" placeholder="@username (a-z, 0-9, _)" maxlength="20" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="err" id="profileError"></div>
    <button class="primary wide" id="profileBtn">Продолжить</button>
  </div>
</div>

<div class="screen" id="app">
  <div class="app-content">
    <div class="app-view active" id="view-chats">
      <div class="scr-head">
        <h1>Flux</h1>
        <button class="ibtn" id="lockBtn" title="Конфиденциальность">
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </button>
        <button class="ibtn" id="menuBtn" title="Меню">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>
        </button>
      </div>
      <div class="search-pill">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.2" y1="16.2" x2="21" y2="21"/></svg>
        <input id="sbSearch" placeholder="Поиск чатов">
      </div>
      <div class="folder-tabs">
        <button class="folder-tab active" data-tab="all">Все чаты <span class="cnt" id="cntAll">0</span></button>
        <button class="folder-tab" data-tab="private">ЛС</button>
      </div>
      <div id="chatList"></div>
      <button id="fab" title="Новый">+</button>
    </div>

    <div class="app-view" id="view-contacts">
      <div class="scr-head">
        <h1>Контакты</h1>
        <button class="ibtn" id="findUserBtn" title="Найти">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.2" y1="16.2" x2="21" y2="21"/></svg>
        </button>
      </div>
      <div class="search-pill">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.2" y1="16.2" x2="21" y2="21"/></svg>
        <input id="contactSearch" placeholder="Найти людей">
      </div>
      <div style="flex:1;overflow-y:auto" id="contactsList"></div>
    </div>

    <div class="app-view" id="view-settings">
      <div class="scr-head">
        <h1>Настройки</h1>
        <button class="ibtn" id="settingsSearchBtn">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.2" y1="16.2" x2="21" y2="21"/></svg>
        </button>
      </div>
      <div class="settings-scroll" id="settingsScroll"></div>
    </div>

    <div class="app-view" id="view-profile">
      <div class="scr-head">
        <button class="ibtn" id="profileQrBtn">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><line x1="14" y1="14" x2="14" y2="21"/><line x1="17" y1="14" x2="17" y2="17"/><line x1="21" y1="14" x2="21" y2="14"/><line x1="14" y1="21" x2="21" y2="21"/></svg>
        </button>
        <h1 style="text-align:center;font-size:17px">Профиль</h1>
        <button class="ibtn" id="profileMenuBtn">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>
        </button>
      </div>
      <div class="settings-scroll" id="profileScroll"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="bn-item active" data-view="chats">
      <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <span class="label">Чаты</span>
      <span class="badge" id="navBadge" style="display:none">0</span>
    </button>
    <button class="bn-item" data-view="contacts">
      <svg viewBox="0 0 24 24"><path d="M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 20v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span class="label">Контакты</span>
    </button>
    <button class="bn-item" data-view="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span class="label">Настройки</span>
    </button>
    <button class="bn-item" data-view="profile">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span class="label">Профиль</span>
    </button>
  </nav>
</div>

<div id="chatView">
  <div id="cvHead">
    <button class="ibtn" id="backBtn">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="avatar sm" id="cvAvatar"></div>
    <div class="info" id="cvInfo">
      <div id="cvTitle"></div>
      <div id="cvSub"></div>
    </div>
    <button class="ibtn" id="cvSearchBtn">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.2" y1="16.2" x2="21" y2="21"/></svg>
    </button>
    <button class="ibtn" id="cvMenuBtn">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>
    </button>
  </div>
  <div id="chatSearchBar">
    <input type="text" id="chatSearchInput" placeholder="Поиск в чате..." autocomplete="off">
    <button id="closeChatSearch">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div id="pinned">
    <div class="bar"></div>
    <div class="pb">
      <div class="pb-t" id="pinnedTitle">Закреплено</div>
      <div class="pb-x" id="pinnedText"></div>
    </div>
    <svg class="close" viewBox="0 0 24 24" id="unpinBtn"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </div>
  <div id="messages"></div>
  <div id="composer">
    <div id="replyPrev">
      <div class="rp-bar"></div>
      <div class="rp-body">
        <div class="rp-n" id="rpName"></div>
        <div class="rp-t" id="rpText"></div>
      </div>
      <button id="cancelReply">✕</button>
    </div>
    <div id="attachMenu">
      <label class="ai">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        Фото или видео
        <input type="file" id="fileImg" accept="image/*,video/*">
      </label>
      <label class="ai">
        <svg viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
        Файл
        <input type="file" id="fileAny">
      </label>
      <button class="ai" id="btnVoice">
        <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        Голосовое
      </button>
    </div>
    <div id="emojiPicker"></div>
    <div class="row-input">
      <button class="ibtn-sm" id="attachBtn">
        <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <textarea id="msgInput" rows="1" placeholder="Сообщение..."></textarea>
      <button class="ibtn-sm" id="emojiBtn">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
      </button>
      <button id="sendBtn" class="mic"></button>
    </div>
  </div>
</div>

<div class="overlay" id="modal"><div class="modal" id="modalBox"></div></div>
<div id="ctxMenu"></div>
<div id="lightbox"><button class="close">✕</button><img id="lightboxImg" alt=""></div>
<div id="recOv">
  <div class="rec-circle">
    <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
  </div>
  <div id="recTimer">0:00</div>

  btn.disabled = true; btn.textContent = '...';
  try {
    if(authMode==='login') await auth.signInWithEmailAndPassword(email, password);
    else await auth.createUserWithEmailAndPassword(email, password);
  } catch(e){
    const M = {'auth/user-not-found':'Пользователь не найден','auth/wrong-password':'Неверный пароль','auth/invalid-credential':'Неверный email или пароль','auth/invalid-login-credentials':'Неверный email или пароль','auth/email-already-in-use':'Email занят','auth/invalid-email':'Неверный email','auth/weak-password':'Пароль слишком простой','auth/network-request-failed':'Нет сети','auth/too-many-requests':'Слишком много попыток'};

function loadChats(){

    const ids = Object.keys(snap.val()||{});

      db.ref('flux/chats/'+id+'/meta').get().then(s => ({ id, meta:s.val() })).catch(()=>null)
    ));
    const fresh = {};
    metas.forEach(m => { if(m && m.meta) fresh[m.id] = m.meta; });
    chats = fresh;
    LS.save(LS.CHATS, chats);
    renderChatList();
    updateUnread();
  }, err => console.warn(err));
}

function updateUnread(){
  let total = 0;
  Object.values(chats).forEach(c => {
    const lastRead = (c.reads && c.reads[me.uid]) || 0;
    if(c.lastFrom && c.lastFrom !== me.uid && c.lastTs > lastRead && !c.muted) total++;
  });
  unreadTotal = total;
  document.title = (total>0 ? '('+total+') ' : '') + 'Flux';
  const navBadge = $('#navBadge');
  if(navBadge){
    if(total > 0){ navBadge.textContent = total > 99 ? '99+' : total; navBadge.style.display = 'flex'; }
    else navBadge.style.display = 'none';
  }
  const cntAll = $('#cntAll');
  if(cntAll) cntAll.textContent = Object.keys(chats).length;
}

function renderChatList(){
  const q = ($('#sbSearch').value||'').trim().toLowerCase();
  const box = $('#chatList');
  const items = Object.values(chats).map(c => {
    const otherUid = (c.members||[]).find(u => u!==me.uid) || me.uid;
    let name, avatarUrl;
    if(c.type === 'private'){
      name = (c.memberNames && c.memberNames[otherUid]) || 'Чат';
      avatarUrl = (c.memberAvatars && c.memberAvatars[otherUid]) || '';
    } else {
      name = c.name || (c.type==='group'?'Группа':'Канал');
      avatarUrl = c.avatar || '';
    }
    const lastRead = (c.reads && c.reads[me.uid]) || 0;
    const unread = (c.lastFrom && c.lastFrom !== me.uid && c.lastTs > lastRead) ? 1 : 0;
    const isOwn = c.lastFrom === me.uid;
    const isRead = (c.lastReadTs && c.lastReadTs >= c.lastTs) || false;
    return { id:c.id, type:c.type, otherUid, name, avatarUrl, unread, lastMessage:c.lastMessage||'Нет сообщений', lastTs:c.lastTs||c.createdAt||0, isOwn, muted:c.muted, pinned:c.pinnedChat, isRead };
  }).filter(c => {
    if(currentTab === 'private'){ if(c.type !== 'private') return false; }
    if(!q) return true;
    return c.name.toLowerCase().includes(q) || (c.lastMessage||'').toLowerCase().includes(q);
  }).sort((a,b) => {
    if(!!a.pinned !== !!b.pinned) return (b.pinned?1:0)-(a.pinned?1:0);
    return (b.lastTs||0)-(a.lastTs||0);
  });

  if(!items.length){
    box.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <div>${q ? 'Ничего не найдено' : 'Нет чатов.<br>Нажмите «+», чтобы начать.'}</div>
    </div>`;
    return;
  }
  box.innerHTML = items.map(c => {
    const prev = c.lastMessage.length>42 ? c.lastMessage.slice(0,42)+'…' : c.lastMessage;
    const ticks = c.isOwn ? `<span class="ci-ticks${c.isRead?' read':''}">✓✓</span>` : '';
    const badge = c.unread>0 ? `<div class="ci-badge${c.muted?' muted':''}">${c.unread}</div>` : '';
    const pinSvg = c.pinned ? `<svg class="pin-mini" viewBox="0 0 24 24"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14l-1.5-6.5L20 7l-2-3H6L4 7l2.5 3.5z"/></svg>` : '';
    const muteSvg = c.muted ? `<svg class="ci-mute" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>` : '';
    return `<div class="ci${c.id===currentChatId?' active':''}" data-id="${c.id}">
      ${avatarEl(c.name, c.otherUid||c.id, '', c.avatarUrl)}
      <div class="ci-body">
        <div class="ci-top">
          <div class="ci-name">${esc(c.name)}${pinSvg}</div>
          <div class="ci-time">${c.lastTs?listTime(c.lastTs):''}${c.muted?' '+muteSvg:''}</div>
        </div>
        <div class="ci-bot">
          <div class="ci-prev">${ticks}${esc(prev)}</div>
          ${badge}
        </div>
      </div>
    </div>`;
  }).join('');
  box.querySelectorAll('.ci').forEach(el => {
    el.addEventListener('click', () => openChat(el.dataset.id));
    el.addEventListener('contextmenu', e => { e.preventDefault(); showChatContext(e.clientX, e.clientY, el.dataset.id); });
    bindLongPress(el, (x,y) => showChatContext(x,y,el.dataset.id));
  });
}
function listTime(ts){
  if(!ts) return '';
  const d = new Date(ts), nd = new Date();
  if(d.toDateString()===nd.toDateString()) return fmtT(ts);
  const yd = new Date(nd - 86400000);
  if(d.toDateString()===yd.toDateString()) return 'Вчера';
  const diff = Math.floor((nd - d) / 86400000);
  if(diff < 7) return ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][d.getDay()];
  return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0');
}

function showChatContext(x,y,chatId){
  const chat = chats[chatId]; if(!chat) return;
  let html = '';
  html += `<button data-a="open">${ICO.reply}Открыть</button>`;
  html += `<button data-a="pin">${ICO.pin}${chat.pinnedChat?'Открепить':'Закрепить'}</button>`;
  html += `<button data-a="mute">${chat.muted?ICO.bell:ICO.mute}${chat.muted?'Включить звук':'Выключить звук'}</button>`;
  html += `<button data-a="read">${ICO.check}Отметить прочитанным</button>`;
  html += `<button data-a="clear">${ICO.trash}Очистить историю</button>`;
  html += `<button data-a="delete" class="danger">${ICO.trash}Удалить чат</button>`;
  openCtxMenu(x, y, html, a => {
    if(a==='open') openChat(chatId);
    if(a==='pin'){ db.ref('flux/chats/'+chatId+'/meta/pinnedChat').set(!chat.pinnedChat).catch(()=>{}); toast(chat.pinnedChat?'Откреплено':'Закреплено'); }
    if(a==='mute'){ db.ref('flux/chats/'+chatId+'/meta/muted').set(!chat.muted).catch(()=>{}); toast(chat.muted?'Звук включён':'Звук выключен'); }
    if(a==='read'){ markAllRead(chatId); toast('Прочитано'); }
    if(a==='clear'){
      db.ref('flux/messages/'+chatId).remove().catch(()=>{});
      toast('История очищена');
    }
    if(a==='delete'){
      db.ref('flux/userChats/'+me.uid+'/'+chatId).remove().catch(()=>{});
      if(currentChatId===chatId) closeChatView();
      toast('Чат удалён');
    }
  });
}

/* OPEN CHAT */
function openChat(chatId){
  const chat = chats[chatId]; if(!chat) return;
  currentChatId = chatId;
  currentOtherUid = (chat.members||[]).find(u => u!==me.uid) || null;
  LS.save(LS.LAST, chatId);
  const otherName = chat.type==='private' ? ((chat.memberNames && chat.memberNames[currentOtherUid]) || 'Чат') : (chat.name||'Чат');
  const avatarUrl = chat.type==='private' ? ((chat.memberAvatars && chat.memberAvatars[currentOtherUid])||'') : (chat.avatar||'');
  $('#cvTitle').textContent = otherName;
  const av = $('#cvAvatar');
  av.outerHTML = avatarEl(otherName, currentOtherUid||chatId, 'sm', avatarUrl).replace('class="avatar sm"', 'class="avatar sm" id="cvAvatar"');
  $('#chatView').classList.add('show');
  chatSearchQuery = '';
  $('#chatSearchBar').classList.remove('show');
  $('#chatSearchInput').value = '';
  markAllRead(chatId);
  if(chatMetaRef){ chatMetaRef.off(); chatMetaRef = null; }
  chatMetaRef = db.ref('flux/chats/'+chatId+'/meta');
  chatMetaRef.on('value', s => {
    if(!s.exists()){ closeChatView(); return; }
    currentChatData = s.val();
    chats[chatId] = currentChatData;
    LS.save(LS.CHATS, chats);
    updatePinnedBar();
    renderChatList();
  });
  if(statusWatchRef){ statusWatchRef.off(); statusWatchRef = null; }
  if(currentOtherUid && chat.type==='private'){
    statusWatchRef = db.ref('flux/status/'+currentOtherUid);
    statusWatchRef.on('value', s => {
      const v = s.val();
      const sub = $('#cvSub');
      if(sub.classList.contains('typing')) return;
      if(v && v.online && now()-v.ts<90000){ sub.textContent='онлайн'; sub.classList.add('online'); }
      else if(v && v.ts){ sub.textContent='был(а) '+new Date(v.ts).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); sub.classList.remove('online'); }
      else { sub.textContent='не в сети'; sub.classList.remove('online'); }
    });
  } else {
    $('#cvSub').textContent = (chat.members||[]).length+' участников';
  }
  if(typingWatchRef){ typingWatchRef.off(); typingWatchRef = null; }
  if(chat.type !== 'channel'){
    typingWatchRef = db.ref('flux/typing/'+chatId);
    typingWatchRef.on('value', s => {
      const data = s.val()||{};
      const others = Object.keys(data).filter(u => u!==me.uid && now()-data[u] < 5000);
      const sub = $('#cvSub');
      if(others.length){
        sub.classList.add('typing');
        sub.textContent = 'печатает...';
      } else {
        sub.classList.remove('typing');
        if(currentOtherUid && chat.type==='private'){
          db.ref('flux/status/'+currentOtherUid).get().then(ss => {
            const v = ss.val();
            if(v && v.online && now()-v.ts<90000){ sub.textContent='онлайн'; sub.classList.add('online'); }
            else if(v && v.ts){ sub.textContent='был(а) '+new Date(v.ts).toLocaleString('ru-RU',{day:'numeric',month:'short'}); sub.classList.remove('online'); }
            else { sub.textContent='не в сети'; sub.classList.remove('online'); }
          }).catch(()=>{});
        } else {
          sub.textContent = (chat.members||[]).length+' участников';
        }
      }
    });
  }
  msgLimit = 50;
  loadMessages(chatId);
  setTimeout(() => $('#msgInput').focus(), 150);
  renderChatList();
}
function closeChatView(){
  $('#chatView').classList.remove('show');
  if(msgRef){ msgRef.off(); msgRef = null; }
  if(chatMetaRef){ chatMetaRef.off(); chatMetaRef = null; }
  if(typingWatchRef){ typingWatchRef.off(); typingWatchRef = null; }
  if(statusWatchRef){ statusWatchRef.off(); statusWatchRef = null; }
  currentChatId = null;
  currentOtherUid = null;
  LS.del(LS.LAST);
  renderChatList();
}
$('#backBtn').addEventListener('click', closeChatView);

/* MARK ALL READ */
function markAllRead(chatId){
  if(!me || !chatId) return;
  db.ref('flux/chats/'+chatId+'/reads/'+me.uid).set(now()).catch(()=>{});
  db.ref('flux/messages/'+chatId).once('value').then(s => {
    const data = s.val() || {};
    const updates = {};
    let hasIncoming = false;
    Object.keys(data).forEach(k => {
      const m = data[k];
      if(m && m.from && m.from !== me.uid && !m.read){ updates[k+'/read'] = true; hasIncoming = true; }
    });
    if(hasIncoming) db.ref('flux/messages/'+chatId).update(updates).catch(()=>{});
  }).catch(()=>{});
}

/* MESSAGES */
function loadMessages(chatId){
  if(msgRef) msgRef.off();
  msgRef = db.ref('flux/messages/'+chatId).orderByChild('ts').limitToLast(msgLimit);
  msgRef.on('value', snap => {
    const data = snap.val()||{};
    const list = Object.keys(data).map(k => Object.assign({ id:k }, data[k])).sort((a,b) => (a.ts||0)-(b.ts||0));
    renderMessages(list);
    if(list.length > lastMsgCount && lastMsgCount > 0){
      const last = list[list.length-1];
      if(last && last.from !== me.uid){
        if(currentChatId !== chatId){
          if(!chats[chatId] || !chats[chatId].muted){
            playPop();
            showNotification(chatId, last);
          }
        }
      }
    }
    lastMsgCount = list.length;
    if(list.length){
      db.ref('flux/chats/'+chatId+'/reads/'+me.uid).set(now()).catch(()=>{});
    }
  });
}

function renderMessages(list){
  currentMessages = list;
  const box = $('#messages');
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 200;
  if(!list.length){
    box.innerHTML = `<div class="empty" style="margin:auto">Нет сообщений. Напишите первым!</div>`;
    updatePinnedBar();
    return;
  }
  let html = '';
  if(list.length >= msgLimit) html += `<div id="loadMore">↑ Загрузить раньше</div>`;
  let lastDay = '';
  for(let i = 0; i < list.length; i++){
    const m = list[i];
    const prev = list[i-1];
    const next = list[i+1];
    const d = new Date(m.ts);
    const dayKey = d.toDateString();
    if(dayKey !== lastDay){
      lastDay = dayKey;
      const today = new Date().toDateString();
      const yd = new Date(Date.now() - 86400000).toDateString();
      let label = d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
      if(dayKey === today) label = 'Сегодня';
      else if(dayKey === yd) label = 'Вчера';
      html += `<div class="date-sep">${label}</div>`;
    }
    const GAP = 5 * 60 * 1000;
    const isGroupStart = !prev || prev.from !== m.from || (m.ts - prev.ts) > GAP || prev.replyTo || !sameDay(prev.ts, m.ts);
    const isGroupEnd = !next || next.from !== m.from || (next.ts - m.ts) > GAP || next.replyTo || !sameDay(next.ts, m.ts);
    html += messageHTML(m, isGroupStart, isGroupEnd);
  }
  box.innerHTML = html;
  box.querySelectorAll('.msg').forEach(bindMessageEvents);
  if(nearBottom || box.dataset.init !== '1'){
    box.dataset.init = '1';
    requestAnimationFrame(() => box.scrollTop = box.scrollHeight);
  }
  const lm = box.querySelector('#loadMore');
  if(lm) lm.addEventListener('click', () => { msgLimit += 50; loadMessages(currentChatId); });
  updatePinnedBar();
  if(chatSearchQuery) applyChatSearch();
}
function sameDay(a,b){ const x=new Date(a),y=new Date(b); return x.getFullYear()===y.getFullYear()&&x.getMonth()===y.getMonth()&&x.getDate()===y.getDate(); }

function messageHTML(m, isGroupStart, isGroupEnd){
  const chat = chats[currentChatId];
  const isOut = m.from === me.uid;
  const cls = `msg ${isOut?'out':'in'}${isGroupStart?' group-start':''}${isGroupEnd?' group-end':''}`;
  let inner = '';

  if(m.replyTo){
    inner += `<div class="quote" data-jump="${esc(m.replyTo.id)}">
      <div class="qn">${esc(m.replyTo.name||'')}</div>
      <div class="qt">${esc(m.replyTo.text||'Вложение')}</div>
    </div>`;
  }
  if(m.forwardFrom) inner += `<div class="fwd-note">↪ Переслано от ${esc(m.forwardFrom)}</div>`;

  if(!isOut && isGroupStart && chat && chat.type !== 'private'){
    const name = (chat.memberNames && chat.memberNames[m.from]) || 'Пользователь';
    inner += `<div class="author">${esc(name)}</div>`;
  }

  if(m.deleted){
    inner += `<div class="text deleted">Сообщение удалено</div>`;
  } else if(m.type === 'photo' && m.media){
    inner += `<div class="media" data-lb="${m.id}"><img src="${m.media.url}" alt="" loading="lazy"></div>`;
    if(m.text) inner += `<div class="text">${linkify(m.text)}</div>`;
  } else if(m.type === 'video' && m.media){
    inner += `<div class="media"><video src="${m.media.url}" controls preload="metadata"></video></div>`;
  } else if(m.type === 'file' && m.media){
    inner += `<div class="file" data-dl="${m.id}">
      <div class="file-ico">${ICO.file}</div>
      <div style="min-width:0">
        <div class="file-n">${esc(m.media.name||'Файл')}</div>
        <div class="file-s">${fmtS(m.media.size||0)}</div>
      </div>
    </div>`;
    if(m.text) inner += `<div class="text">${linkify(m.text)}</div>`;
  } else if(m.type === 'voice' && m.media){
    const wave = m.media.waveform || genWave(28);
    const bars = wave.map((h,i) => `<i style="height:${Math.max(3,Math.round(h*22))}px" data-i="${i}"></i>`).join('');
    inner += `<div class="voice">
      <button class="voice-btn" data-play="${m.id}">${ICO.play}</button>
      <div class="voice-wave">${bars}</div>
      <div class="voice-dur">${fmtD(m.media.duration||0)}</div>
    </div>`;
  } else if(m.text){
    inner += `<div class="text">${linkify(m.text)}</div>`;
  }

  const rks = Object.keys(m.reactions||{}).filter(e => m.reactions[e] && Object.keys(m.reactions[e]).length > 0);
  if(rks.length && !m.deleted){
    inner += `<div class="rxns">` + rks.map(e => {
      const users = Object.keys(m.reactions[e]||{});
      const mine = users.includes(me.uid);
      return `<button class="rxn${mine?' mine':''}" data-react="${e}">${e}<b>${users.length}</b></button>`;
    }).join('') + `</div>`;
  }

  const tick = isOut ? `<span class="tick${m.read?' read':''}">${m.read?'✓✓':'✓'}</span>` : '';
  const editedMark = (m.edited && !m.deleted) ? '<span class="ed">изм.</span>' : '';
  inner += `<div class="meta">${editedMark}<span>${fmtT(m.ts)}</span>${tick}</div>`;

  let av = '';
  if(!isOut){
    if(isGroupEnd){
      const name = (chat && chat.memberNames && chat.memberNames[m.from]) || '?';
      const url = (chat && chat.memberAvatars && chat.memberAvatars[m.from]) || '';
      const col = colorFor(m.from);
      av = url
        ? `<div class="msg-av" style="background-image:url(${url})"></div>`
        : `<div class="msg-av" style="background:linear-gradient(135deg,${col},${col}bb)">${esc(initial(name))}</div>`;
    } else {
      av = `<div class="msg-av spacer"></div>`;
    }
  }
  return `<div class="${cls}" data-mid="${m.id}" id="m_${m.id}">${av}<div class="bubble">${inner}</div></div>`;
}
function genWave(n){ const a=[]; for(let i=0;i<n;i++) a.push(0.25+Math.random()*0.75); return a; }
function linkify(t){ return esc(t).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>'); }

function bindMessageEvents(el){
  const mid = el.dataset.mid;
  el.addEventListener('contextmenu', e => { e.preventDefault(); showMessageContext(e.clientX, e.clientY, mid); });
  bindLongPress(el, (x,y) => showMessageContext(x,y,mid));
  el.addEventListener('click', e => {
    const rq = e.target.closest('.quote');
    if(rq){ jumpToMessage(rq.dataset.jump); return; }
    const r = e.target.closest('[data-react]');
    if(r){ toggleReaction(mid, r.dataset.react); return; }
    const lb = e.target.closest('[data-lb]');
    if(lb){ const m = currentMessages.find(x => x.id===mid); if(m && m.media) { $('#lightboxImg').src = m.media.url; $('#lightbox').classList.add('show'); } return; }
    const dl = e.target.closest('[data-dl]');
    if(dl){ const m = currentMessages.find(x => x.id===mid); if(m && m.media && m.media.url){ const a=document.createElement('a'); a.href=m.media.url; a.download=m.media.name||'file'; a.click(); } return; }
    const pb = e.target.closest('[data-play]');
    if(pb){ toggleVoicePlay(pb.dataset.play, pb); return; }
  });
}

/* MESSAGE CONTEXT */
function showMessageContext(x, y, mid){
  const m = currentMessages.find(v => v.id === mid);
  if(!m) return;
  const chat = chats[currentChatId];
  const canEdit = m.from===me.uid && m.type==='text' && !m.deleted;
  const canDelete = m.from===me.uid;
  let html = `<div class="rxs">`+QUICK_EMOJI.map(e => `<button data-r="${e}">${e}</button>`).join('')+`</div>`;
  html += `<button data-a="reply">${ICO.reply}Ответить</button>`;
  if(m.text && !m.deleted) html += `<button data-a="copy">${ICO.copy}Копировать</button>`;
  if(!m.deleted) html += `<button data-a="forward">${ICO.fwd}Переслать</button>`;
  if(canEdit) html += `<button data-a="edit">${ICO.edit}Изменить</button>`;
  if(chat && (chat.type !== 'private' || m.from===me.uid)) html += `<button data-a="pin">${ICO.pin}${(chat.pinned && chat.pinned.id===mid)?'Открепить':'Закрепить'}</button>`;
  if(canDelete) html += `<button data-a="delete" class="danger">${ICO.trash}Удалить</button>`;
  openCtxMenu(x, y, html, a => {
    if(a.startsWith('r:')){ toggleReaction(mid, a.slice(2)); return; }
    if(a==='reply') startReply(m);
    if(a==='copy'){ navigator.clipboard.writeText(m.text||'').then(()=>toast('Скопировано')).catch(()=>toast('Ошибка')); }
    if(a==='forward') openForward(m);
    if(a==='edit') startEdit(m);
    if(a==='pin') togglePinMsg(m);
    if(a==='delete') deleteMessage(mid);
  });
}
function startReply(m){
  const chat = chats[currentChatId];
  const name = m.from===me.uid ? 'Вы' : ((chat.memberNames && chat.memberNames[m.from]) || 'Собеседник');
  replyTo = { id:m.id, name, text: m.text || (m.type==='photo'?'Фото':m.type==='file'?'Файл':m.type==='voice'?'Голосовое':m.type==='video'?'Видео':'Вложение') };
  editingId = null;
  $('#replyPrev').classList.add('show');
  $('#rpName').textContent = 'Ответ '+name;
  $('#rpText').textContent = replyTo.text;
  $('#msgInput').focus();
}
function startEdit(m){
  editingId = m.id;
  replyTo = null;
  $('#replyPrev').classList.add('show');
  $('#rpName').textContent = 'Редактирование';
  $('#rpText').textContent = m.text || '';
  const inp = $('#msgInput');
  inp.value = m.text || '';
  autoGrow(); updateSendBtn();
  inp.focus();
}
function cancelReplyUI(){
  replyTo = null; editingId = null;
  $('#replyPrev').classList.remove('show');
  $('#msgInput').value = '';
  autoGrow(); updateSendBtn();
}
$('#cancelReply').addEventListener('click', cancelReplyUI);
function togglePinMsg(m){
  if(!currentChatId) return;
  const chat = chats[currentChatId];
  if(chat.pinned && chat.pinned.id === m.id){
    db.ref('flux/chats/'+currentChatId+'/meta/pinned').remove().catch(()=>{});
    toast('Откреплено');
  } else {
    db.ref('flux/chats/'+currentChatId+'/meta/pinned').set({ id:m.id, text:(m.text||'Вложение').slice(0,80), from: m.from===me.uid?me.name:((chat.memberNames&&chat.memberNames[m.from])||''), ts: now() }).catch(()=>{});
    toast('Закреплено');
  }
}
function deleteMessage(mid){
  if(!currentChatId) return;
  db.ref('flux/messages/'+currentChatId+'/'+mid).update({ deleted:true, text:'', media:null, reactions:null, type:'text', edited:false })
    .then(()=>toast('Удалено'))
    .catch(()=>toast('Ошибка'));
}
function toggleReaction(mid, emoji){
  if(!currentChatId) return;
  const path = 'flux/messages/'+currentChatId+'/'+mid+'/reactions/'+emoji+'/'+me.uid;
  db.ref(path).get().then(s => {
    if(s.exists()) db.ref(path).remove().catch(()=>{});
    else db.ref(path).set(true).catch(()=>{});
  }).catch(()=>{});
}
function jumpToMessage(mid){
  const el = document.getElementById('m_'+mid);
  if(!el){ toast('Сообщение не загружено'); return; }
  el.scrollIntoView({ behavior:'smooth', block:'center' });

}
function updatePinnedBar(){
  const chat = chats[currentChatId];
  const bar = $('#pinned');

$('#pinned').addEventListener('click', () => {

$('#unpinBtn').addEventListener('click', e => {

/* SEND */
async function sendMessage(){
  const text = ($('#msgInput').value||'').trim();
  if(!text || !currentChatId) return;
  if(editingId){
    await db.ref('flux/messages/'+currentChatId+'/'+editingId).update({ text, edited:true, editedAt:now() }).catch(()=>{});
    editingId = null;
    cancelReplyUI();
    return;
  }
  const msg = { from: me.uid, text, ts: now(), type:'text', read:false };
  if(replyTo) msg.replyTo = { id: replyTo.id, name: replyTo.name, text: replyTo.text };
  const ref = db.ref('flux/messages/'+currentChatId).push();
  $('#msgInput').value = '';
  autoGrow(); updateSendBtn();
  replyTo = null; cancelReplyUI();
  try {
    await ref.set(msg);
    await db.ref('flux/chats/'+currentChatId+'/meta').update({ lastMessage: text.slice(0,60), lastTs: now(), lastFrom: me.uid });
    db.ref('flux/typing/'+currentChatId+'/'+me.uid).remove().catch(()=>{});
  } catch(e){ toast('Не удалось отправить'); }
}
async function sendMedia(type, media, text){
  const msg = { from: me.uid, text: text||'', ts: now(), type, media, read:false };
  if(replyTo) msg.replyTo = { id: replyTo.id, name: replyTo.name, text: replyTo.text };
  replyTo = null; cancelReplyUI();
  try {
    await db.ref('flux/messages/'+currentChatId).push(msg);
    const preview = type==='photo'?'📷 Фото':type==='video'?'🎬 Видео':type==='voice'?'🎤 Голосовое':type==='file'?'📎 '+(media.name||'Файл'):'Сообщение';
    await db.ref('flux/chats/'+currentChatId+'/meta').update({ lastMessage: preview.slice(0,60), lastTs: now(), lastFrom: me.uid });
  } catch(e){ toast('Ошибка отправки'); }
}
$('#sendBtn').addEventListener('click', () => {
  if($('#msgInput').value.trim()) sendMessage();
  else startRecording();
});
$('#msgInput').addEventListener('keydown', e => {
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
});
$('#msgInput').addEventListener('input', () => {
  autoGrow(); updateSendBtn();
  if(currentChatId && chats[currentChatId] && chats[currentChatId].type !== 'channel'){
    db.ref('flux/typing/'+currentChatId+'/'+me.uid).set(now()).catch(()=>{});
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => {
      if(currentChatId) db.ref('flux/typing/'+currentChatId+'/'+me.uid).remove().catch(()=>{});
    }, 3000);
  }
});
function autoGrow(){

}
function updateSendBtn(){

}

function readAsDataURL(f){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(f);
  });
}
function compressImage(file, maxW, maxH, q){
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.width, h = img.height;
      if(w>maxW || h>maxH){
        if(w/h > maxW/maxH){ h = Math.round(h*maxW/w); w = maxW; }
        else { w = Math.round(w*maxH/h); h = maxH; }
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      res(c.toDataURL('image/jpeg', q||0.75));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad')); };
    img.src = url;
  });
}

/* VOICE REC */
let mediaRecorder = null, recChunks = [], recTimer = null, recSeconds = 0, recStream = null;
async function startRecording(){
  if(!navigator.mediaDevices || !window.MediaRecorder){ toast('Запись не поддерживается'); return; }
  if(!currentChatId){ toast('Откройте чат'); return; }
  try { recStream = await navigator.mediaDevices.getUserMedia({ audio:true }); }
  catch(e){ toast('Нет доступа к микрофону'); return; }
  recChunks = []; recSeconds = 0;
  $('#recTimer').textContent = '0:00';
  $('#recOv').classList.add('show');
  let mime = 'audio/webm';
  if(!MediaRecorder.isTypeSupported(mime)) mime = '';
  try { mediaRecorder = mime ? new MediaRecorder(recStream, { mimeType:mime }) : new MediaRecorder(recStream); }
  catch(e){ toast('Ошибка записи'); cleanupRec(); return; }
  mediaRecorder.ondataavailable = e => { if(e.data && e.data.size) recChunks.push(e.data); };
  mediaRecorder.onstop = onRecStop;
  mediaRecorder.start();
  recTimer = setInterval(() => {
    recSeconds++;
    $('#recTimer').textContent = fmtD(recSeconds);
    if(recSeconds >= 120) stopRec(true);
  }, 1000);
}
function cleanupRec(){
  if(recTimer){ clearInterval(recTimer); recTimer = null; }
  if(recStream){ recStream.getTracks().forEach(t => t.stop()); recStream = null; }
  $('#recOv').classList.remove('show');
}
function cancelRec(){
  if(mediaRecorder && mediaRecorder.state !== 'inactive'){ mediaRecorder.onstop = null; mediaRecorder.stop(); }
  mediaRecorder = null; recChunks = [];
  cleanupRec();
}
function stopRec(send){
  if(!mediaRecorder || mediaRecorder.state === 'inactive') return;
  mediaRecorder._send = !!send;
  mediaRecorder.stop();
}
function onRecStop(){
  const send = mediaRecorder && mediaRecorder._send;
  const dur = recSeconds;
  const chunks = recChunks.slice();
  mediaRecorder = null; recChunks = [];
  cleanupRec();
  if(!send || !chunks.length) return;
  const blob = new Blob(chunks, { type: chunks[0].type || 'audio/webm' });
  const reader = new FileReader();
  reader.onload = () => {
    sendMedia('voice', { url: reader.result, duration: dur, size: blob.size, waveform: genWave(28) });
    toast('Голосовое отправлено');
  };
  reader.readAsDataURL(blob);
}
$('#recCancel').addEventListener('click', cancelRec);

function toggleVoicePlay(mid, btn){
  const m = currentMessages.find(x => x.id === mid);
  if(!m || !m.media || !m.media.url){ toast('Аудио недоступно'); return; }
  let audio = audioCache[mid];
  if(!audio){ audio = new Audio(m.media.url); audioCache[mid] = audio; }
  const row = btn.closest('.voice');
  const bars = row ? row.querySelectorAll('.voice-wave i') : [];
  if(audio.paused){
    Object.keys(audioCache).forEach(k => { if(k!==mid) audioCache[k].pause(); });
    $$('.voice-btn').forEach(b => { if(b!==btn) b.innerHTML = ICO.play; });
    audio.play();
    btn.innerHTML = ICO.pause;
    const upd = () => {
      if(audio.paused) return;
      const p = audio.currentTime / (audio.duration||1);
      const upto = Math.floor(p*bars.length);
      bars.forEach((b,i) => b.classList.toggle('played', i<upto));
      if(!audio.paused) requestAnimationFrame(upd);
    };
    requestAnimationFrame(upd);
    audio.onended = () => { btn.innerHTML = ICO.play; bars.forEach(b => b.classList.remove('played')); };
  } else {
    audio.pause();
    btn.innerHTML = ICO.play;
  }
}

function generateCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out = '';
  for(let i=0;i<8;i++) out += chars.charAt(Math.floor(Math.random()*chars.length));
  return out;
}
async function processInviteFromUrl(){
  const params = new URLSearchParams(location.search);
  const code = params.get('invite');
  if(!code || !me) return;
  history.replaceState({}, '', location.pathname);
  try {
    const snap = await db.ref('flux/invites/'+code).get();
    if(!snap.exists()){ toast('Приглашение не найдено'); return; }
    const inv = snap.val();
    if(inv.expires && inv.expires < now()){ toast('Ссылка устарела'); return; }
    const chatId = inv.chatId;
    const meta = await db.ref('flux/chats/'+chatId+'/meta').get();
    if(!meta.exists()){ toast('Чат не найден'); return; }
    const data = meta.val();
    const members = Array.isArray(data.members) ? data.members.slice() : Object.keys(data.members||{});
    if(!members.includes(me.uid)){
      members.push(me.uid);
      const names = Object.assign({}, data.memberNames||{});
      names[me.uid] = me.name;
      const avatars = Object.assign({}, data.memberAvatars||{});
      if(me.avatar) avatars[me.uid] = me.avatar;
      await db.ref('flux/chats/'+chatId+'/meta').update({ members, memberNames: names, memberAvatars: avatars });
    }
    await db.ref('flux/userChats/'+me.uid+'/'+chatId).set(true);
    toast('Присоединились!');
    setTimeout(() => openChat(chatId), 400);
  } catch(e){ console.error(e); toast('Ошибка приглашения'); }
}

/* CONTACTS */
function loadFriends(){
  if(!me) return;
  db.ref('flux/users/'+me.uid+'/friends').on('value', s => {

function renderContacts(){
  const q = ($('#contactSearch').value||'').trim().toLowerCase();
  const box = $('#contactsList');
  const list = Object.keys(friends).map(uid => ({ uid, ...friends[uid] })).filter(f => {
    if(!q) return true;
    return (f.name||'').toLowerCase().includes(q) || (f.username||'').toLowerCase().includes(q);
  });
  if(!list.length){
    box.innerHTML = `<div class="empty" style="padding:60px 24px">${q ? 'Ничего не найдено' : 'Нет контактов.<br>Нажмите на лупу, чтобы найти людей.'}</div>`;
    return;
  }
  box.innerHTML = list.map(c => `
    <div class="contact-item" data-uid="${c.uid}">
      ${avatarEl(c.name, c.uid, '', c.avatar||'')}
      <div class="contact-body">

        <div class="contact-sub">${c.username ? '@'+esc(c.username) : ''}</div>
      </div>
      <div class="contact-status" data-status="${c.uid}"></div>
    </div>
  `).join('');
  box.querySelectorAll('.contact-item').forEach(el => {
    el.addEventListener('click', () => {
      const f = friends[el.dataset.uid];
      if(f) startChatWith(el.dataset.uid, f.name, f.avatar||'');
    });
  });
  list.forEach(c => {
    db.ref('flux/status/'+c.uid).get().then(s => {
      const el = box.querySelector(`[data-status="${c.uid}"]`);
      if(!el) return;
      const v = s.val();
      if(v && v.online && now()-v.ts<90000){ el.textContent='онлайн'; el.classList.add('online'); }
      else el.textContent='';
    }).catch(()=>{});
  });
}

/* MODALS */
function openModal(html){

function openCtxMenu(x, y, html, handler){
  const menu = $('#ctxMenu');
  menu.innerHTML = html;
  menu.classList.add('show');
  const rect = menu.getBoundingClientRect();
  const maxX = window.innerWidth - rect.width - 8;
  const maxY = window.innerHeight - rect.height - 8;
  menu.style.left = clamp(x, 8, maxX) + 'px';
  menu.style.top = clamp(y, 8, maxY) + 'px';
  const onClick = e => {
    const btn = e.target.closest('button');
    if(!btn) return;
    e.stopPropagation();
    const a = btn.dataset.a;
    const r = btn.dataset.r;
    closeCtxMenu();
    handler(r ? 'r:'+r : a);
  };
  menu.addEventListener('click', onClick);
  menu._cleanup = () => menu.removeEventListener('click', onClick);
  setTimeout(() => document.addEventListener('pointerdown', outsideClose, true), 10);
}
function outsideClose(e){
  const menu = $('#ctxMenu');
  if(menu.classList.contains('show') && !menu.contains(e.target)) closeCtxMenu();
}
function closeCtxMenu(){
  const menu = $('#ctxMenu');
  if(menu._cleanup) menu._cleanup();
  menu.classList.remove('show');
  document.removeEventListener('pointerdown', outsideClose, true);
}
document.addEventListener('keydown', e => {

function bindLongPress(el, cb){
  let timer = null, startX = 0, startY = 0, fired = false;
  const start = e => {
    const t = e.touches ? e.touches[0] : e;
    startX = t.clientX; startY = t.clientY; fired = false;
    timer = setTimeout(() => { fired = true; if(navigator.vibrate) navigator.vibrate(18); cb(startX, startY); }, 480);
  };
  const move = e => {
    if(!timer) return;
    const t = e.touches ? e.touches[0] : e;
    if(Math.hypot(t.clientX-startX, t.clientY-startY) > 12){ clearTimeout(timer); timer = null; }
  };
  const end = () => { if(timer){ clearTimeout(timer); timer = null; } };
  el.addEventListener('touchstart', start, { passive:true });
  el.addEventListener('touchmove', move, { passive:true });
  el.addEventListener('touchend', end);
  el.addEventListener('touchcancel', end);
  el.addEventListener('mousedown', e => { if(e.button===0) start(e); });
  el.addEventListener('mousemove', move);
  el.addEventListener('mouseup', end);
  el.addEventListener('mouseleave', end);
  el.addEventListener('click', e => { if(fired){ e.stopPropagation(); e.preventDefault(); } }, true);
}

/* SOUND + NOTIFICATIONS */
let audioCtx = null;
function playPop(){
  if(!settings.sound) return;
  try {
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type='sine';
    o.frequency.setValueAtTime(880, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime+0.07);
    g.gain.setValueAtTime(0.06, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.16);
    o.start(); o.stop(audioCtx.currentTime+0.17);
  } catch(e){}
}

async function askNotificationPermission(){
  // Android WebView (Sketchware bridge)
  if(window.Android && typeof window.Android.requestPermission === 'function'){
    try {
      if(typeof window.Android.isPermissionGranted === 'function' && !window.Android.isPermissionGranted()){
        window.Android.requestPermission();
        toast('Разрешите уведомления в системном окне');
      } else {
        toast('Уведомления уже включены');
      }
    } catch(e){}
    return;
  }
  // Обычный браузер
  if(!('Notification' in window)){ toast('Уведомления не поддерживаются'); return; }
  if(Notification.permission === 'granted'){ toast('Уведомления включены'); return; }
  if(Notification.permission === 'denied'){ toast('Уведомления заблокированы'); return; }
  try {
    const p = await Notification.requestPermission();
    if(p === 'granted'){
      toast('Уведомления включены');
      try { new Notification('Flux', { body: 'Уведомления успешно включены ✓' }); } catch(e){}
    } else {
      toast('Уведомления не разрешены');
    }
  } catch(e){}
}

function showNotification(chatId, msg){
  const chat = chats[chatId];
  if(!chat || chat.muted) return;
  if(currentChatId === chatId && !document.hidden) return;

  let name = '';
  if(chat.type === 'private') name = (chat.memberNames && chat.memberNames[msg.from]) || 'Пользователь';
  else {
    name = (chat.memberNames && chat.memberNames[msg.from]) || 'Кто-то';
    name += ' · ' + (chat.name || 'Чат');
  }
  const body = msg.text || (msg.type === 'photo' ? '📷 Фото' : msg.type === 'voice' ? '🎤 Голосовое' : msg.type === 'file' ? '📎 Файл' : msg.type === 'video' ? '🎬 Видео' : 'Сообщение');
  const title = 'Flux · ' + name;

  // Android bridge
  if(window.Android && typeof window.Android.notifyWithChat === 'function'){
    try {
      window.Android.notifyWithChat(title, body.slice(0, 140), chatId);
      return;
    } catch(e){}
  }

  // Browser Notification
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    const n = new Notification(title, {
      body: body.slice(0, 120),
      tag: chatId,
      renotify: true
    });
    n.onclick = () => { window.focus(); openChat(chatId); n.close(); };
  } catch(e){}
}

/* GLOBAL INCOMING LISTENER */
let globalIncomingRefs = {};
function setupGlobalIncomingListener(){
  if(!me) return;
  Object.values(globalIncomingRefs).forEach(r => { try { r.ref.off('child_added', r.handler); } catch(e){} });
  globalIncomingRefs = {};
  db.ref('flux/userChats/'+me.uid).once('value').then(snap => {
    const ids = Object.keys(snap.val() || {});
    ids.forEach(chatId => {
      const ref = db.ref('flux/messages/'+chatId).orderByChild('ts').limitToLast(1);
      const handler = mSnap => {
        const m = mSnap.val();
        if(!m || !m.from || m.from === me.uid) return;
        const readTs = (chats[chatId] && chats[chatId].reads && chats[chatId].reads[me.uid]) || 0;
        if(m.ts <= readTs) return;
        if(currentChatId === chatId){ markAllRead(chatId); return; }
        const ch = chats[chatId];
        if(ch && ch.muted) return;
        playPop();
        showNotification(chatId, m);
      };
      ref.on('child_added', handler);
      globalIncomingRefs[chatId] = { ref, handler };
    });
  }).catch(()=>{});
}
