<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17212b">
<title>Telegram Web — Flux</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;transition:background .2s,color .2s;-webkit-font-smoothing:antialiased}

:root{
  --bg:#0f1721;--panel:#17212b;--panel2:#242f3d;--hover:#202b36;--active:#2b5278;
  --text:#ffffff;--text2:#8b9aa8;--text3:#6c7883;--accent:#3390ec;--accent2:#5288c1;
  --bubble-in:#182533;--bubble-out:#2b5278;--border:#0b1219;--menu:#1c2733;
  --divider:#101921;--section:#1a2533;--icon-bg:#222f3e;
}
body.light{
  --bg:#8b9aa8;--panel:#ffffff;--panel2:#f1f3f5;--hover:#f4f4f5;--active:#e8f1fb;
  --text:#000000;--text2:#707579;--text3:#9aa0a6;--accent:#3390ec;--accent2:#3390ec;
  --bubble-in:#ffffff;--bubble-out:#eeffde;--border:#e4e6e8;--menu:#ffffff;
  --divider:#eaecef;--section:#f7f8fa;--icon-bg:#eef1f4;
}

button,input,textarea{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:3px}

.screen{display:none;height:100vh;height:100dvh;overflow:hidden}
.screen.show{display:flex}
.center{align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.card{background:var(--panel);border-radius:18px;padding:32px 26px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card h1{font-size:26px;font-weight:600;margin-bottom:6px;text-align:center;color:var(--accent)}
.card .sub{color:var(--text2);font-size:13px;text-align:center;margin-bottom:22px}
.tabs-seg{display:flex;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:20px}
.tab-seg{flex:1;padding:10px;border-radius:8px;font-size:14px;font-weight:500;color:var(--text2);transition:.15s;text-align:center}
.tab-seg.active{background:var(--accent);color:#fff}
.fi{width:100%;background:var(--bg);border-radius:10px;padding:13px 16px;font-size:15px;margin-bottom:10px;border:1.5px solid transparent;color:var(--text)}
.fi:focus{border-color:var(--accent)}
.err{background:#e0483d22;border:1px solid #e0483d55;color:#ff8b80;font-size:13px;padding:10px 14px;border-radius:9px;margin-bottom:12px}
.err:empty{display:none}
.primary{background:var(--accent);color:#fff;padding:13px 22px;border-radius:10px;font-size:15px;font-weight:600;width:100%}
.primary:hover{filter:brightness(1.1)}
.primary:disabled{opacity:.6}

#splash{align-items:center;justify-content:center;flex-direction:column;gap:20px;background:var(--bg)}
#splash .logo{width:80px;height:80px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700;color:#fff;box-shadow:0 12px 40px rgba(51,144,236,.4)}
.spinner{width:42px;height:42px;border:3px solid var(--panel2);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* APP LAYOUT */
#app{display:none;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:var(--bg);position:relative}
#app.show{display:flex}
.sidebar{width:100%;max-width:420px;height:100%;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--divider);flex-shrink:0;position:relative;z-index:2}
.main-chat{flex:1;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;z-index:1}

@media(max-width:820px){
  .sidebar{max-width:100%}
  .main-chat{position:fixed;inset:0;z-index:10;transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1)}
  .main-chat.show{transform:none}
}

.scr-head{display:flex;align-items:center;gap:8px;padding:14px 16px 8px;padding-top:calc(14px + env(safe-area-inset-top,0));background:var(--panel);flex-shrink:0}
.scr-head h1{font-size:22px;font-weight:700;flex:1;letter-spacing:-.4px}
.ibtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text2);flex-shrink:0;transition:.15s}
.ibtn:hover{background:var(--hover);color:var(--text)}
.ibtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.search-pill{margin:8px 12px 10px;background:var(--panel2);border-radius:22px;padding:8px 14px;display:flex;align-items:center;gap:10px}
.search-pill svg{width:18px;height:18px;stroke:var(--text3);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.search-pill input{flex:1;font-size:15px;color:var(--text)}

.folder-tabs{display:flex;gap:0;padding:0 12px 8px;flex-shrink:0;border-bottom:1px solid var(--divider)}
.folder-tab{flex:1;padding:8px;border-radius:12px;font-size:13.5px;font-weight:500;color:var(--text2);text-align:center;transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px}
.folder-tab.active{background:var(--hover);color:var(--accent);font-weight:600}

#chatList{flex:1;overflow-y:auto}
.ci{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;transition:background .1s;user-select:none;position:relative}
.ci:hover{background:var(--hover)}
.ci.active{background:var(--active);color:#fff}
.ci-body{flex:1;min-width:0}
.ci-top{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.ci-name{font-weight:600;font-size:15.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-time{font-size:12px;color:var(--text3)}
.ci-bot{display:flex;align-items:center;gap:6px}
.ci-prev{font-size:14px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.ci.active .ci-prev,.ci.active .ci-time{color:rgba(255,255,255,.8)}
.ci-badge{background:var(--accent);color:#fff;font-size:12px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 6px}

#fab{position:absolute;right:18px;bottom:75px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(51,144,236,.4);z-index:5}

/* BOTTOM NAV */
.bottom-nav{display:flex;background:var(--panel);border-top:1px solid var(--divider);padding-bottom:env(safe-area-inset-bottom,0);flex-shrink:0}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;color:var(--text3);gap:3px}
.bn-item.active{color:var(--accent)}
.bn-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
.bn-item .label{font-size:11px;font-weight:500}

/* CHAT VIEW */
#cvHead{display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0));background:var(--panel);border-bottom:1px solid var(--divider);z-index:5}
#cvHead .info{flex:1;min-width:0;cursor:pointer}
#cvTitle{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cvSub{font-size:12.5px;color:var(--text2)}
#cvSub.online{color:var(--accent)}

#pinned{display:none;align-items:center;gap:12px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--divider);cursor:pointer}
#pinned.show{display:flex}
#pinned .bar{width:3px;height:32px;background:var(--accent);border-radius:2px}
#pinned .pb{flex:1;min-width:0}
#pinned .pb-t{font-size:12.5px;font-weight:600;color:var(--accent)}
#pinned .pb-x{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#messages{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:4px;background-image:radial-gradient(circle at 50% 50%,rgba(51,144,236,.05) 0,transparent 60%)}
.date-sep{align-self:center;background:rgba(0,0,0,.4);color:#fff;font-size:12px;padding:4px 12px;border-radius:12px;margin:10px 0;font-weight:500}

.msg{display:flex;max-width:78%;position:relative;animation:msgIn .15s ease;align-items:flex-end;gap:8px}
.msg.in{align-self:flex-start}
.msg.out{align-self:flex-end;flex-direction:row-reverse}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.bubble{position:relative;background:var(--bubble-in);border-radius:16px;padding:8px 12px 6px;box-shadow:0 1px 2px rgba(0,0,0,.2);word-break:break-word;font-size:15px;line-height:1.35;color:var(--text)}
.msg.out .bubble{background:var(--bubble-out);color:#fff}
body.light .msg.out .bubble{background:var(--bubble-out);color:#000}

.msg.in .bubble{border-bottom-left-radius:4px}
.msg.out .bubble{border-bottom-right-radius:4px}

.meta{display:inline-flex;align-items:center;gap:3px;float:right;margin:4px -4px -2px 10px;font-size:11px;color:var(--text3);user-select:none}
.msg.out .meta{color:rgba(255,255,255,.7)}
body.light .msg.out .meta{color:#5a8a5a}
.tick{font-weight:700;letter-spacing:-1px}
.tick.read{color:var(--accent)}
.msg.out .tick.read{color:#64b5ef}

.quote{border-left:3px solid var(--accent);padding:2px 8px;margin-bottom:6px;background:rgba(0,0,0,.15);border-radius:4px;font-size:13px;cursor:pointer}
.quote .qn{font-weight:600;color:var(--accent)}
.quote .qt{color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.media img{max-width:100%;max-height:320px;border-radius:12px;display:block;cursor:pointer}
.media video{max-width:100%;border-radius:12px;display:block}

.rxns{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.rxn{background:rgba(0,0,0,.2);border-radius:10px;padding:2px 6px;font-size:12px;display:flex;align-items:center;gap:3px;cursor:pointer}
.rxn.mine{background:var(--accent);color:#fff}

#composer{background:var(--panel);border-top:1px solid var(--divider);padding:8px 12px;flex-shrink:0;position:relative}
#replyPrev{display:none;align-items:center;gap:10px;padding:6px 10px;background:var(--panel2);border-radius:10px;margin-bottom:8px}
#replyPrev.show{display:flex}
#replyPrev .rp-body{flex:1;min-width:0}
#replyPrev .rp-n{font-size:12px;font-weight:600;color:var(--accent)}
#replyPrev .rp-t{font-size:12.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.row-input{display:flex;gap:8px;align-items:flex-end}
#msgInput{flex:1;background:var(--panel2);border-radius:20px;padding:10px 16px;font-size:15px;max-height:120px;resize:none;color:var(--text)}
#sendBtn{width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
#sendBtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2}

/* AVATARS */
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex-shrink:0;width:46px;height:46px;font-size:18px;overflow:hidden;background-size:cover;background-position:center}
.avatar.sm{width:38px;height:38px;font-size:15px}
.avatar.lg{width:90px;height:90px;font-size:36px}

/* CONTEXT MENU & MODALS */
#ctxMenu{position:fixed;background:var(--menu);border-radius:12px;padding:6px;display:none;min-width:200px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:900;animation:pop .12s ease}
#ctxMenu.show{display:block}
@keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
#ctxMenu button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:8px;font-size:14.5px;color:var(--text)}
#ctxMenu button:hover{background:var(--hover)}
#ctxMenu button.danger{color:#ff5c5c}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:800;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.overlay.show{display:flex}
.modal{background:var(--panel);border-radius:16px;padding:22px;width:100%;max-width:400px;color:var(--text)}

#toast{position:fixed;bottom:80px;left:50%;transform:translate(-50%,80px);background:#2b3844;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:9999;opacity:0;transition:all .25s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}

#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:950;display:none;align-items:center;justify-content:center}
#lightbox.show{display:flex}
#lightbox img{max-width:95vw;max-height:90vh;object-fit:contain}

#recOv{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:920;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px}
#recOv.show{display:flex}
.rec-circle{width:100px;height:100px;border-radius:50%;background:#e0483d;display:flex;align-items:center;justify-content:center;animation:recP 1.2s infinite}
@keyframes recP{0%,100%{box-shadow:0 0 0 0 rgba(224,72,61,.6)}50%{box-shadow:0 0 0 20px rgba(224,72,61,0)}}
#recTimer{color:#fff;font-size:28px;font-weight:300}

.hidden{display:none!important}
</style>
</head>
<body>

<!-- SPLASH -->
<div class="screen center show" id="splash">
  <div class="logo">✈</div>
  <div class="spinner"></div>
  <div style="color:var(--text2);font-size:13px" id="splashText">Загрузка Flux...</div>
</div>

<!-- AUTH -->
<div class="screen center" id="authScreen">
  <div class="card">
    <h1>Telegram</h1>
    <p class="sub">Вход в мессенджер</p>
    <div class="tabs-seg">
      <button class="tab-seg active" data-mode="login">Вход</button>
      <button class="tab-seg" data-mode="register">Регистрация</button>
    </div>
    <input class="fi" id="email" type="email" placeholder="Email">
    <input class="fi" id="password" type="password" placeholder="Пароль">
    <div class="err" id="authError"></div>
    <button class="primary" id="authBtn">Войти</button>
  </div>
</div>

<!-- SETUP PROFILE -->
<div class="screen center" id="profileSetup">
  <div class="card">
    <h1>Профиль</h1>
    <p class="sub">Заполните личные данные</p>
    <div style="text-align:center;margin-bottom:16px">
      <div class="avatar lg" id="setupAv" style="margin:0 auto;background:var(--accent);cursor:pointer">+</div>
      <input type="file" id="setupAvFile" accept="image/*" style="display:none">
    </div>
    <input class="fi" id="pName" placeholder="Имя">
    <input class="fi" id="pUser" placeholder="@username">
    <div class="err" id="profileError"></div>
    <button class="primary" id="profileBtn">Сохранить</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="scr-head">
      <h1>Чаты</h1>
      <button class="ibtn" id="findUserBtn" title="Поиск пользователей">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.2" y1="16.2" x2="21" y2="21"/></svg>
      </button>
    </div>
    <div class="search-pill">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.2" y1="16.2" x2="21" y2="21"/></svg>
      <input id="sbSearch" placeholder="Поиск">
    </div>
    <div class="folder-tabs">
      <button class="folder-tab active" data-tab="all">Все чаты</button>
      <button class="folder-tab" data-tab="private">Личные</button>
    </div>
    <div id="chatList"></div>
    <button id="fab">+</button>
    
    <nav class="bottom-nav">
      <button class="bn-item active" data-view="chats">
        <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        <span class="label">Чаты</span>
      </button>
      <button class="bn-item" data-view="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span class="label">Настройки</span>
      </button>
    </nav>
  </div>

  <!-- MAIN CHAT VIEW -->
  <div class="main-chat" id="chatView">
    <div id="cvHead">
      <button class="ibtn" id="backBtn">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="avatar sm" id="cvAvatar"></div>
      <div class="info" id="cvInfo">
        <div id="cvTitle">Выберите чат</div>
        <div id="cvSub"></div>
      </div>
    </div>
    <div id="pinned">
      <div class="bar"></div>
      <div class="pb">
        <div class="pb-t">Закрепленное сообщение</div>
        <div class="pb-x" id="pinnedText"></div>
      </div>
    </div>
    <div id="messages"></div>
    <div id="composer">
      <div id="replyPrev">
        <div class="rp-body">
          <div class="rp-n" id="rpName"></div>
          <div class="rp-t" id="rpText"></div>
        </div>
        <button id="cancelReply">✕</button>
      </div>
      <div class="row-input">
        <button class="ibtn" id="attachBtn">
          <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <input type="file" id="fileInput" style="display:none">
        <textarea id="msgInput" rows="1" placeholder="Сообщение..."></textarea>
        <button id="sendBtn">
          <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- MODALS & OVERLAYS -->
<div class="overlay" id="modal"><div class="modal" id="modalBox"></div></div>
<div id="ctxMenu"></div>
<div id="lightbox"><img id="lightboxImg" alt=""></div>
<div id="recOv">
  <div class="rec-circle">
    <svg viewBox="0 0 24 24" width="40" height="40" stroke="#fff" fill="none" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
  </div>
  <div id="recTimer">0:00</div>
  <div style="display:flex;gap:16px">
    <button class="primary" id="recCancel" style="background:#555">Отмена</button>
    <button class="primary" id="recSend" style="background:#4caf50">Отправить</button>
  </div>
</div>
<div id="toast"></div>

};
firebase.initializeApp(CFG);
const auth = firebase.auth();
const db = firebase.database();

const $ = s => document.querySelector(s); const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => Date.now();
const fmtT = ts => { const d = new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
const fmtD = s => { s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };

const COLORS = ['#e0483d','#4caf50','#ff9800','#9c27b0','#00bcd4','#e91e63','#3390ec','#795548'];
const colorFor = id => { let h=0; for(const c of String(id)) h=(h*31+c.charCodeAt(0))>>>0; return COLORS[h%COLORS.length]; };
const initial = n => (n||'?').trim().charAt(0).toUpperCase();

function avatarEl(name, uid, cls, url){
  if(url) return `<div class="avatar ${cls||''}" style="background-image:url(${url})"></div>`;
  const col = colorFor(uid || name);
  return `<div class="avatar ${cls||''}" style="background:${col}">${esc(initial(name))}</div>`;
}

function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}

// State
let me = JSON.parse(localStorage.getItem('flux_me')||'null');
let chats = {};
let currentChatId = null;
let currentOtherUid = null;
let currentMessages = [];
let replyTo = null;
let editingId = null;
let mediaRecorder = null, audioChunks = [], recTimerInt = null, recSeconds = 0;

// Init
function showScreen(id){
  ['splash','authScreen','profileSetup','app'].forEach(s => $('#'+s).classList.toggle('show', s===id)); }  // Auth Flow let authMode = 'login'; $$('.tab-seg').forEach(t => t.addEventListener('click', () => {   authMode = t.dataset.mode;   $$('.tab-seg').forEach(x => x.classList.toggle('active', x===t));$('#authBtn').textContent = authMode==='login'?'Войти':'Зарегистрироваться';
}));

$('#authBtn').onclick = async () => {
  const email = $('#email').value.trim();
  const password = $('#password').value;
  if(!email || !password) return $('#authError').textContent = 'Заполните поля';
  try {
    if(authMode==='login') await auth.signInWithEmailAndPassword(email, password);
    else await auth.createUserWithEmailAndPassword(email, password);
  } catch(e) { $('#authError').textContent = e.message; }
};

auth.onAuthStateChanged(async user => {
  if(!user){ showScreen('authScreen'); me = null; return; }
  const snap = await db.ref('flux/users/'+user.uid+'/profile').get();
  if(!snap.exists()){
    showScreen('profileSetup');
    $('#profileBtn').onclick = async () => {
      const name = $('#pName').value.trim();
      const username = $('#pUser').value.trim().replace(/^@+/,'').toLowerCase();
      if(!name || !username) return $('#profileError').textContent = 'Заполните форму';
      me = { uid: user.uid, email: user.email, name, username };
      await db.ref('flux/users/'+user.uid+'/profile').set(me);
      await db.ref('flux/usernames/'+username).set(user.uid);
      localStorage.setItem('flux_me', JSON.stringify(me));
      startApp();
    };
  } else {
    me = snap.val(); me.uid = user.uid;
    localStorage.setItem('flux_me', JSON.stringify(me));
    startApp();
  }
});

function startApp(){
  showScreen('app');
  db.ref('flux/status/'+me.uid).set({ online: true, ts: now() });
  db.ref('flux/status/'+me.uid).onDisconnect().set({ online: false, ts: now() });
  
  loadChats();
}

function loadChats(){
  db.ref('flux/userChats/'+me.uid).on('value', async snap => {
    const ids = Object.keys(snap.val()||{});
    chats = {};
    for(let id of ids){
      const meta = (await db.ref('flux/chats/'+id+'/meta').get()).val();
      if(meta) chats[id] = meta;
    }
    renderChatList();
  });
}

function renderChatList(){
  const box = $('#chatList');
  const list = Object.values(chats);
  if(!list.length){ box.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text2)">Нет чатов</div>`; return; }
  
  box.innerHTML = list.map(c => {
    const otherUid = (c.members||[]).find(u => u!==me.uid) || me.uid;
    const name = c.type==='private' ? ((c.memberNames&&c.memberNames[otherUid])||'Чат') : c.name;
    return `<div class="ci ${c.id===currentChatId?'active':''}" onclick="openChat('${c.id}')">
      ${avatarEl(name, otherUid, '', c.type==='private'?(c.memberAvatars&&c.memberAvatars[otherUid]):'')}
      <div class="ci-body">
        <div class="ci-top">
          <div class="ci-name">${esc(name)}</div>
          <div class="ci-time">${c.lastTs?fmtT(c.lastTs):''}</div>
        </div>
        <div class="ci-bot">
          <div class="ci-prev">${esc(c.lastMessage||'Сообщений нет')}</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function openChat(id){
  currentChatId = id;
  const c = chats[id];
  currentOtherUid = (c.members||[]).find(u => u!==me.uid) || me.uid;
  const name = c.type==='private' ? ((c.memberNames&&c.memberNames[currentOtherUid])||'Чат') : c.name;
  
  $('#cvTitle').textContent = name;
  $('#cvAvatar').outerHTML = avatarEl(name, currentOtherUid, 'sm', c.type==='private'?(c.memberAvatars&&c.memberAvatars[currentOtherUid]):'').replace('class="avatar sm"', 'class="avatar sm" id="cvAvatar"');
  
  if(window.innerWidth <= 820) $('#chatView').classList.add('show');
  
  // Status listener
  db.ref('flux/status/'+currentOtherUid).on('value', s => {
    const v = s.val();
    $('#cvSub').textContent = (v&&v.online) ? 'онлайн' : 'был(а) недавно';
    $('#cvSub').classList.toggle('online', v&&v.online);
  });

  loadMessages(id);
  renderChatList();
}

$('#backBtn').onclick = () => $('#chatView').classList.remove('show');

function loadMessages(id){
  db.ref('flux/messages/'+id).on('value', s => {
    const data = s.val()||{};
    currentMessages = Object.keys(data).map(k => ({id:k, ...data[k]})).sort((a,b)=>a.ts-b.ts);
    renderMessages();
  });
}

function renderMessages(){
  const box = $('#messages');
  box.innerHTML = currentMessages.map(m => {
    const isOut = m.from === me.uid;
    let content = esc(m.text||'');
    if(m.type==='photo') content = `<div class="media"><img src="${m.media.url}" onclick="showLightbox('${m.media.url}')"></div>`;
    if(m.type==='voice') content = `<audio controls src="${m.media.url}"></audio>`;
    if(m.deleted) content = `<i style="opacity:.6">Сообщение удалено</i>`;

    return `<div class="msg ${isOut?'out':'in'}" id="m_${m.id}" oncontextmenu="showMsgCtx(event,'${m.id}')">
      <div class="bubble">
        ${m.replyTo?`<div class="quote"><div class="qn">${esc(m.replyTo.name)}</div><div class="qt">${esc(m.replyTo.text)}</div></div>`:''}
        ${content}
        <div class="meta">
          ${fmtT(m.ts)}
          ${isOut?`<span class="tick ${m.read?'read':''}">✓✓</span>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

// Input Handlers
const msgInp = $('#msgInput');
msgInp.oninput = () => {
  msgInp.style.height = 'auto';
  msgInp.style.height = msgInp.scrollHeight + 'px';
  const hasText = msgInp.value.trim().length > 0;
  $('#sendBtn').innerHTML = hasText 
    ? `<svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>`
    : `<svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="19" x2="12" y2="22"/></svg>`;
};

$('#sendBtn').onclick = () => {
  const text = msgInp.value.trim();
  if(!text){ startVoiceRec(); return; }
  sendMessage({ type: 'text', text });
};

async function sendMessage(payload){
  if(!currentChatId) return;
  const msgData = {
    from: me.uid,
    ts: now(),
    ...payload
  };
  if(replyTo){ msgData.replyTo = replyTo; cancelReply(); }
  
  if(editingId){
    await db.ref('flux/messages/'+currentChatId+'/'+editingId).update({ text: payload.text, edited: true });
    cancelReply();
    return;
  }

  const ref = db.ref('flux/messages/'+currentChatId).push();
  await ref.set(msgData);
  
  db.ref('flux/chats/'+currentChatId+'/meta').update({
    lastMessage: payload.text || 'Вложение',
    lastTs: now(),
    lastFrom: me.uid
  });

  msgInp.value = '';
  msgInp.style.height = 'auto';
  msgInp.oninput();
}

// Voice Recording
async function startVoiceRec(){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = async () => {
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      const reader = new FileReader();
      reader.readAsDataURL(blob);
      reader.onloadend = () => {
        sendMessage({ type: 'voice', media: { url: reader.result } });
      };
    };
    mediaRecorder.start();
    $('#recOv').classList.add('show');
    recSeconds = 0;
    recTimerInt = setInterval(() => {
      recSeconds++;
      $('#recTimer').textContent = fmtD(recSeconds);
    }, 1000);
  } catch(e) { toast('Микрофон недоступен'); }
}

$('#recCancel').onclick = () => {
  if(mediaRecorder) mediaRecorder.stop();
  clearInterval(recTimerInt);
  $('#recOv').classList.remove('show');
};

$('#recSend').onclick = () => {
  if(mediaRecorder) mediaRecorder.stop();
  clearInterval(recTimerInt);
  $('#recOv').classList.remove('show');
};

// File Attachment
$('#attachBtn').onclick = () => $('#fileInput').click();
$('#fileInput').onchange = e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    sendMessage({ type: file.type.startsWith('image/')?'photo':'file', media: { url: reader.result, name: file.name } });
  };
  reader.readAsDataURL(file);
};

// Context Menu
function showMsgCtx(e, mid){
  e.preventDefault();
  const m = currentMessages.find(x => x.id === mid);
  if(!m || m.deleted) return;
  
  const menu = $('#ctxMenu');
  menu.style.left = Math.min(e.clientX, window.innerWidth-210)+'px';
  menu.style.top = Math.min(e.clientY, window.innerHeight-150)+'px';
  
  menu.innerHTML = `
    <button onclick="setReply('${m.id}')">Ответить</button>
    ${m.from===me.uid && m.type==='text'?`<button onclick="setEdit('${m.id}')">Изменить</button>`:''}
    ${m.from===me.uid?`<button class="danger" onclick="delMsg('${m.id}')">Удалить</button>`:''}
  `;
  menu.classList.add('show');
}

document.onclick = () => $('#ctxMenu').classList.remove('show');

function setReply(mid){
  const m = currentMessages.find(x => x.id === mid);
  replyTo = { id: m.id, name: m.from===me.uid?'Вы':'Собеседник', text: m.text||'Вложение' };
  $('#rpName').textContent = replyTo.name;
  $('#rpText').textContent = replyTo.text;
  $('#replyPrev').classList.add('show');
}

function setEdit(mid){
  const m = currentMessages.find(x => x.id === mid);
  editingId = mid;
  msgInp.value = m.text;
  msgInp.oninput();
  $('#rpName').textContent = 'Редактирование';
  $('#rpText').textContent = m.text;
  $('#replyPrev').classList.add('show');
}

function cancelReply(){
  replyTo = null; editingId = null;
  $('#replyPrev').classList.remove('show');
}
$('#cancelReply').onclick = cancelReply;

async function delMsg(mid){
  await db.ref('flux/messages/'+currentChatId+'/'+mid).update({ deleted: true, text: '' });
}

// User Search Modal
$('#findUserBtn').onclick = () => {
  const m = $('#modalBox');
  m.innerHTML = `
    <h3>Поиск пользователя</h3>
    <input class="fi" id="sUser" placeholder="@username" style="margin-top:12px">
    <div id="sRes"></div>
    <button class="primary" id="sBtn" style="margin-top:10px">Найти</button>
  `;
  $('#modal').classList.add('show');
  
  $('#sBtn').onclick = async () => {
    const un = $('#sUser').value.trim().replace(/^@+/,'').toLowerCase();
    const uidSnap = await db.ref('flux/usernames/'+un).get();
    if(!uidSnap.exists()) return $('#sRes').innerHTML = `<div style="margin-top:10px;color:var(--text2)">Не найден</div>`;
    
    const uid = uidSnap.val();
    const uProfile = (await db.ref('flux/users/'+uid+'/profile').get()).val();
    
    $('#sRes').innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;margin-top:12px;cursor:pointer" id="startC">
        ${avatarEl(uProfile.name, uid, 'sm')}
        <div><b>${esc(uProfile.name)}</b><br><small style="color:var(--text2)">@${esc(uProfile.username)}</small></div>
      </div>
    `;
    
    $('#startC').onclick = async () => {
      const chatId = [me.uid, uid].sort().join('_');
      const meta = {
        id: chatId,
        type: 'private',
        members: [me.uid, uid],
        memberNames: { [me.uid]: me.name, [uid]: uProfile.name }
      };
      await db.ref('flux/chats/'+chatId+'/meta').set(meta);
      await db.ref('flux/userChats/'+me.uid+'/'+chatId).set(true);
      await db.ref('flux/userChats/'+uid+'/'+chatId).set(true);
      $('#modal').classList.remove('show');
      openChat(chatId);
    };
  };
};

$('#modal').onclick = e => { if(e.target===$('#modal')) $('#modal').classList.remove('show'); };

function showLightbox(url){
  $('#lightboxImg').src = url;
  $('#lightbox').classList.add('show');
}
$('#lightbox').onclick = () => $('#lightbox').classList.remove('show');

</script>
</body>
</html>
