<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BR 2D Online</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, -apple-system, sans-serif; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0a0f14;
    touch-action:none; user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent; }
  canvas { display:block; }

  :root {
    --fs-xs: clamp(10px, 2vh, 12px);
    --fs-sm: clamp(11px, 2.2vh, 14px);
    --fs-md: clamp(13px, 2.6vh, 16px);
    --fs-lg: clamp(15px, 3.2vh, 20px);
    --fs-xl: clamp(22px, 4.5vh, 30px);
    --gap: clamp(4px, 1vh, 10px);
    --pad: clamp(6px, 1.4vh, 14px);
    --btn-h: clamp(34px, 8vh, 52px);
  }

  .screen { position:fixed; inset:0; z-index:20; color:#fff; overflow:hidden; }
  .hidden { display:none !important; }

  /* ============ AUTH ============ */
  #authScreen {
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse at top left, rgba(255,180,0,0.16), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(60,140,255,0.12), transparent 60%),
      linear-gradient(180deg, #1a1f28 0%, #0a0e14 100%);
    padding: var(--pad);
  }
  .authBox {
    width: min(94vw, 780px);
    display:grid;
    grid-template-columns: 1fr 1fr auto;
    gap: var(--gap);
    padding: calc(var(--pad)*1.5);
    border-radius: 14px;
    background: rgba(15,20,28,0.9);
    border: 1px solid rgba(255,180,0,0.25);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .authLogo {
    grid-column: 1 / -1; text-align:center;
    font-size: var(--fs-lg); font-weight: 900; letter-spacing: 3px;
    background: linear-gradient(90deg,#ffb400,#ff7a00);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .authTabs {
    grid-column: 1 / -1; display: flex;
    background: rgba(0,0,0,0.4); border-radius: 8px; padding: 3px;
  }
  .authTab {
    flex: 1; padding: calc(var(--gap)*1.2); border:none; background:transparent;
    color:#8899a8; font-weight: bold; font-size: var(--fs-xs);
    letter-spacing: 1px; border-radius: 6px; cursor: pointer;
  }
  .authTab.active {
    background: linear-gradient(135deg,#ffb400,#f58b00); color:#1a1206;
  }
  .authInput {
    padding: 0 calc(var(--gap)*1.4);
    height: var(--btn-h);
    border: 1.5px solid #2b3a47; background:#101820;
    color:#fff; border-radius: 8px; font-size: var(--fs-sm);
    outline: none; min-width: 0;
  }
  .authInput:focus { border-color: #ffb400; }
  #authName { grid-column: 1 / -1; }
  #authSubmit { grid-column: 3 / 4; }
  #authError {
    grid-column: 1 / -1; color:#ef476f; font-size: var(--fs-xs);
    text-align: center; min-height: 1em;
  }
  #btnGuest { grid-column: 1 / -1; }

  .btnPrimary {
    padding: 0 calc(var(--gap)*1.4);
    height: var(--btn-h);
    border: none; border-radius: 8px;
    font-size: var(--fs-sm); font-weight: 900; letter-spacing: 1px;
    cursor: pointer;
    background: linear-gradient(135deg,#ffb400,#f58b00);
    color: #1a1206;
    box-shadow: 0 4px 14px rgba(255,180,0,0.3);
    transition: transform 0.1s;
    display:inline-flex; align-items:center; justify-content:center;
    white-space:nowrap;
  }
  .btnPrimary:active { transform: scale(0.97); }
  .btnPrimary:disabled { opacity: 0.6; cursor: default; }

  .btnSecondary {
    padding: 0 calc(var(--gap)*1.4);
    height: var(--btn-h);
    border: 1.5px solid #2b3a47; background: transparent;
    color: #cfd8e3; border-radius: 8px;
    font-size: var(--fs-sm); font-weight: 700;
    letter-spacing: 0.5px; cursor: pointer;
    transition: transform 0.1s;
    display:inline-flex; align-items:center; justify-content:center;
    white-space:nowrap;
  }
  .btnSecondary:active { transform: scale(0.97); }

  /* ============ MAIN MENU ============ */
  #mainMenu {
    display: grid;
    grid-template-rows: auto 1fr;
    gap: var(--gap);
    padding: var(--pad);
    background:
      radial-gradient(ellipse at 15% 10%, rgba(255,180,0,0.18), transparent 45%),
      radial-gradient(ellipse at 85% 95%, rgba(40,120,255,0.14), transparent 55%),
      linear-gradient(180deg, #141a22 0%, #070a0f 100%);
  }
  #mainMenu::before {
    content:''; position:absolute; inset:0; pointer-events:none;
    background: repeating-linear-gradient(115deg, rgba(255,180,0,0.03) 0 1px, transparent 1px 50px);
  }

  .topBar {
    display: flex; align-items: center; gap: var(--gap);
    position: relative; z-index: 1;
    max-width: min(1200px, 100%); width:100%; margin:0 auto;
  }
  .profilePill {
    display: flex; align-items: center; gap: calc(var(--gap)*1.2);
    padding: calc(var(--gap)*0.6);
    padding-right: calc(var(--gap)*1.5);
    border-radius: 40px;
    background: rgba(10,15,22,0.85);
    border: 1px solid rgba(255,180,0,0.35);
    flex-shrink: 0;
    height: var(--btn-h);
  }
  .avatar {
    width: calc(var(--btn-h) - 8px); height: calc(var(--btn-h) - 8px);
    border-radius: 50%;
    background: linear-gradient(135deg,#ffb400,#f58b00);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: var(--fs-md); color:#1a1206;
    flex-shrink: 0;
  }
  .profileInfo { display: flex; flex-direction: column; overflow: hidden; }
  .profileName {
    font-size: var(--fs-sm); font-weight: 900;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .profileLevel { font-size: var(--fs-xs); color:#ffb400; font-weight: 700; letter-spacing: 1px; }

  .statsRow { display: flex; gap: var(--gap); flex: 1; min-width: 0; }
  .stat {
    flex: 1; padding: 3px calc(var(--gap)*0.6);
    border-radius: 8px; text-align: center;
    background: linear-gradient(180deg, rgba(20,26,36,0.9), rgba(10,14,20,0.9));
    border: 1px solid rgba(255,180,0,0.2);
    min-width: 0;
  }
  .statVal { font-size: var(--fs-md); font-weight: 900; color:#ffb400; line-height:1.1; }
  .statLbl { font-size: var(--fs-xs); color:#7f8ea0; letter-spacing: 1px; font-weight: 700; }

  .iconBtn {
    width: var(--btn-h); height: var(--btn-h);
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(10,15,22,0.8);
    color: #cfd8e3; font-size: var(--fs-md);
    cursor: pointer; flex-shrink: 0;
    display:flex; align-items:center; justify-content:center;
  }
  .iconBtn:active { transform: scale(0.95); }

  .menuContent {
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: var(--gap);
    position: relative; z-index: 1;
    max-width: min(1200px, 100%); width:100%; margin:0 auto;
    min-height: 0;
  }

  .panelTitle {
    font-size: var(--fs-xs); color: #7f8ea0;
    letter-spacing: 2px; font-weight: 900;
    margin-bottom: 2px;
  }
  .modeList {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: calc(var(--gap)*0.7);
  }
  .modeBtn {
    padding: calc(var(--gap)*0.8) calc(var(--gap)*0.6);
    border-radius: 8px;
    background: rgba(10,14,20,0.7);
    border: 1px solid rgba(255,255,255,0.08);
    color: #cfd8e3;
    font-size: var(--fs-xs); font-weight: 900;
    letter-spacing: 1px;
    cursor: pointer;
    text-align: center;
    display: flex; align-items: center; justify-content: center;
    gap: 6px;
    transition: 0.15s;
    min-height: var(--btn-h);
  }
  .modeBtn.active {
    background: linear-gradient(135deg,#ffb400,#f58b00);
    color: #1a1206; border-color: transparent;
    box-shadow: 0 4px 14px rgba(255,180,0,0.3);
  }
  .modeBtn .mIcon { font-size: 1.1em; }

  .playPanel {
    display: grid;
    grid-template-columns: 1fr 1fr 2fr;
    gap: var(--gap);
    min-height: 0;
    align-items: end;
  }
  .btnPlay {
    padding: 0 var(--pad);
    border: none; border-radius: 14px;
    background: linear-gradient(135deg,#ffb400,#ff7a00);
    color:#1a1206; font-size: var(--fs-xl);
    font-weight: 900; letter-spacing: 5px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    box-shadow: 0 8px 30px rgba(255,140,0,0.4), inset 0 2px 0 rgba(255,255,255,0.3);
    transition: transform 0.1s;
    height: calc(var(--btn-h) * 1.3);
    min-height: 0;
  }
  .btnPlay:active { transform: scale(0.98); }
  .btnPlay span:first-child { font-size: 0.9em; }

  /* ============ SERVER BROWSER ============ */
  #serverBrowser {
    display: grid;
    grid-template-rows: auto 1fr;
    gap: var(--gap);
    padding: var(--pad);
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,180,0,0.14), transparent 55%),
      linear-gradient(180deg, #141a22 0%, #070a0f 100%);
    max-width: min(1200px, 100%);
    margin: 0 auto;
  }
  .browserHeader {
    display: flex; align-items: center; gap: var(--gap);
    flex-wrap: wrap;
  }
  .browserHeader h2 {
    font-size: var(--fs-lg); font-weight: 900; letter-spacing: 2px;
    background: linear-gradient(90deg,#ffb400,#ff7a00);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    flex: 1; white-space: nowrap;
  }
  .codeInput {
    padding: 0 calc(var(--gap)*1.2);
    height: var(--btn-h);
    border: 1.5px solid #2b3a47; background:#101820;
    color:#fff; border-radius: 8px; font-size: var(--fs-sm);
    outline: none; letter-spacing: 2px; text-transform: uppercase;
    width: min(30vw, 160px); min-width: 100px;
  }
  .codeInput:focus { border-color: #ffb400; }

  .serverList {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: var(--gap);
    overflow-y: auto;
    padding-right: 4px;
    align-content: start;
  }
  .serverCard {
    padding: calc(var(--gap)*0.9) calc(var(--gap)*1.1);
    border-radius: 10px;
    background: linear-gradient(180deg, rgba(20,26,36,0.95), rgba(10,14,20,0.95));
    border: 1px solid rgba(255,180,0,0.2);
    cursor: pointer;
    display: flex; flex-direction: column; gap: 3px;
    transition: 0.15s;
    min-height: 0;
  }
  .serverCard:active { transform: scale(0.98); }
  .serverCard .srvName {
    font-size: var(--fs-sm); font-weight: 900;
    display: flex; align-items: center; gap: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .serverCard .srvMeta {
    font-size: var(--fs-xs); color: #7f8ea0;
    display: flex; justify-content: space-between; gap: 6px;
  }
  .serverCard .srvMeta span:first-child { color:#06d6a0; font-weight:700; }
  .emptyList {
    grid-column: 1 / -1;
    text-align: center; padding: 20px;
    color: #5c6b7a; font-size: var(--fs-sm);
  }

  /* ============ MODALS ============ */
  .modal {
    position: fixed; inset: 0; z-index: 40;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.7);
    padding: var(--pad);
  }
  .modalBox {
    width: min(94vw, 440px);
    display: flex; flex-direction: column; gap: var(--gap);
    padding: calc(var(--pad)*1.4);
    border-radius: 14px;
    background: rgba(15,20,28,0.98);
    border: 1px solid rgba(255,180,0,0.3);
    box-shadow: 0 20px 60px rgba(0,0,0,0.7);
  }
  .modalTitle {
    font-size: var(--fs-md); font-weight: 900; letter-spacing: 2px;
    text-align: center;
    background: linear-gradient(90deg,#ffb400,#ff7a00);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .modalBox input {
    padding: 0 calc(var(--gap)*1.4);
    height: var(--btn-h);
    border: 1.5px solid #2b3a47; background:#101820;
    color:#fff; border-radius: 8px; font-size: var(--fs-sm);
    outline: none;
  }
  .modalBox input:focus { border-color: #ffb400; }
  .modalRow { display: flex; gap: var(--gap); }
  .modalRow .btnPrimary, .modalRow .btnSecondary { flex: 1; }
  .modalErr { color: #ef476f; font-size: var(--fs-xs); text-align: center; min-height: 1em; }

  /* ============ WAITING / CONNECTING ============ */
  #connecting, #waiting {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: var(--gap); padding: var(--pad); text-align: center;
    background: radial-gradient(ellipse at center, #141a22 0%, #070a0f 100%);
  }
  .spinner {
    width: clamp(32px, 9vh, 50px); height: clamp(32px, 9vh, 50px);
    border: 3px solid #2b3a47;
    border-top-color: #ffb400;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #waitingRoom {
    color: #ffb400; font-size: var(--fs-xl); font-weight: 900;
    letter-spacing: 5px;
  }
  #waitingServerName {
    color: #fff; font-size: var(--fs-md); font-weight: 700; letter-spacing: 1px;
  }
  .sub { color: #8899a8; font-size: var(--fs-xs); }
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- ===== AUTH ===== -->
<div id="authScreen" class="screen">
  <div class="authBox">
    <div class="authLogo">2D BATTLE ROYALE</div>
    <div class="authTabs">
      <button class="authTab active" id="tabLogin">ВХОД</button>
      <button class="authTab" id="tabRegister">РЕГИСТРАЦИЯ</button>
    </div>
    <input id="authName" class="authInput hidden" placeholder="НИК (до 14 симв.)" maxlength="14" autocomplete="off">
    <input id="authEmail" class="authInput" type="email" placeholder="EMAIL" autocomplete="email">
    <input id="authPass" class="authInput" type="password" placeholder="ПАРОЛЬ" autocomplete="current-password">
    <button id="authSubmit" class="btnPrimary">ВОЙТИ</button>
    <div id="authError"></div>
    <button id="btnGuest" class="btnSecondary">ИГРАТЬ КАК ГОСТЬ</button>
  </div>
</div>

<!-- ===== MAIN MENU ===== -->
<div id="mainMenu" class="screen hidden">
  <div class="topBar">
    <div class="profilePill">
      <div class="avatar" id="avatarEl">P</div>
      <div class="profileInfo">
        <div class="profileName" id="profileNameEl">PLAYER</div>
        <div class="profileLevel">УР. <span id="levelEl">1</span></div>
      </div>
    </div>
    <div class="statsRow">
      <div class="stat"><div class="statVal" id="statKills">0</div><div class="statLbl">УБИЙСТВ</div></div>
      <div class="stat"><div class="statVal" id="statWins">0</div><div class="statLbl">ПОБЕД</div></div>
      <div class="stat"><div class="statVal" id="statMatches">0</div><div class="statLbl">МАТЧЕЙ</div></div>
    </div>
    <button id="btnChangeName" class="iconBtn" title="Сменить ник">✎</button>
    <button id="btnLogout" class="iconBtn" title="Выйти">⏻</button>
  </div>

  <div class="menuContent">
    <div>
      <div class="panelTitle">РЕЖИМЫ ПРОТИВ БОТОВ</div>
      <div class="modeList" id="modeList"></div>
    </div>
    <div></div>
    <div class="playPanel">
      <button id="btnServers" class="btnSecondary">СЕРВЕРА</button>
      <button id="btnCreateServer" class="btnSecondary">СОЗДАТЬ</button>
      <button id="btnBotsPlay" class="btnPlay">
        <span>▶</span><span>ИГРАТЬ</span>
      </button>
    </div>
  </div>
</div>

<!-- ===== SERVER BROWSER ===== -->
<div id="serverBrowser" class="screen hidden">
  <div class="browserHeader">
    <button id="btnBrowserBack" class="iconBtn" style="position:static">←</button>
    <h2>СЕРВЕРА</h2>
    <input id="codeInput" class="codeInput" placeholder="КОД" maxlength="8" autocomplete="off">
    <button id="btnJoinCode" class="btnPrimary" style="min-width:0; padding-left:14px; padding-right:14px;">ВОЙТИ</button>
    <button id="btnBrowserRefresh" class="iconBtn" style="position:static">⟳</button>
    <button id="btnBrowserCreate" class="btnPrimary">СОЗДАТЬ</button>
  </div>
  <div class="serverList" id="serverList">
    <div class="emptyList">Загрузка...</div>
  </div>
</div>

<!-- ===== MODAL: CREATE ===== -->
<div id="createServerModal" class="modal hidden">
  <div class="modalBox">
    <div class="modalTitle">НОВЫЙ СЕРВЕР</div>
    <input id="newServerName" placeholder="НАЗВАНИЕ (напр. «Наши») " maxlength="24" autocomplete="off">
    <input id="newServerPass" placeholder="ПАРОЛЬ (необязательно)" maxlength="20" autocomplete="off">
    <div class="modalErr" id="createServerErr"></div>
    <div class="modalRow">
      <button id="btnCancelCreate" class="btnSecondary">ОТМЕНА</button>
      <button id="btnConfirmCreate" class="btnPrimary">СОЗДАТЬ</button>
    </div>
  </div>
</div>

<!-- ===== MODAL: JOIN PASSWORD ===== -->
<div id="joinModal" class="modal hidden">
  <div class="modalBox">
    <div class="modalTitle">ВВЕДИ ПАРОЛЬ</div>
    <div class="sub" id="joinServerName" style="text-align:center"></div>
    <input id="joinPassword" type="password" placeholder="ПАРОЛЬ" maxlength="20" autocomplete="off">
    <div class="modalErr" id="joinErr"></div>
    <div class="modalRow">
      <button id="btnCancelJoin" class="btnSecondary">ОТМЕНА</button>
      <button id="btnConfirmJoin" class="btnPrimary">ВОЙТИ</button>
    </div>
  </div>
</div>

<!-- ===== CONNECTING ===== -->
<div id="connecting" class="screen hidden">
  <div class="spinner"></div>
  <div class="sub" id="connectMsg">Подключение...</div>
</div>

<!-- ===== WAITING ===== -->
<div id="waiting" class="screen hidden">
  <div class="sub">Сервер</div>
  <div id="waitingServerName">-</div>
  <div class="sub" style="margin-top:2px">Код комнаты</div>
  <div id="waitingRoom">------</div>
  <div class="sub" style="margin-top:6px">Ты вошёл как
    <b id="waitingName" style="color:#fff">PLAYER</b></div>
  <div class="sub" style="margin-top:6px">Старт через <span id="countdown">5</span>с</div>
  <button id="btnWaitingBack" class="btnSecondary" style="margin-top:8px">ОТМЕНА</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

function hashStr(s){
  let h = 2166136261;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function simpleHash(s){
  let h = 0;
  for (let i = 0; i < s.length; i++){ h = ((h << 5) - h + s.charCodeAt(i)) | 0; }
  return 'h' + Math.abs(h).toString(36);
}

function makeEntity(x, y, isBot, name){
  return {
    x, y, r:16, hp:100, maxHp:100, angle:0,
    isBot, name, uid:null,
    speed: PLAYER_SPEED,
    weapon: WEAPONS.pistol, weaponKey: 'pistol',

    alive:true, kills:0,
    wanderAngle: rand(0, Math.PI*2), wanderTimer:0,
    targetX: x, targetY: y, targetAngle: 0,
    lastServerHp: 100, pendingDamage: 0,
    dmgMul: 1,
  };
}

function spawnPointFor(uid){
  const h = hashStr((roomId || '') + uid);
  const ang = ((h % 1024) / 1024) * Math.PI * 2;
  const rad = 250 + ((h >>> 10) % 700);
  return { x: WORLD/2 + Math.cos(ang)*rad, y: WORLD/2 + Math.sin(ang)*rad };
}

function resetGame(){
  let px, py;
  if (netMode === 'online'){
    const sp = spawnPointFor(myUid);
    px = sp.x; py = sp.y;
  } else {
    px = WORLD/2 + rand(-100,100);
    py = WORLD/2 + rand(-100,100);
  }

  player = makeEntity(px, py, false, myName);
  player.uid = myUid;

  bots = [];
  if (netMode === 'offline'){
    const cfg = BOT_MODES[selectedBotMode] || BOT_MODES.classic;
    for (let i = 0; i < cfg.bots; i++){
      const b = makeEntity(rand(220, WORLD-220), rand(220, WORLD-220), true,
                          'Bot' + Math.floor(rand(10,999)));
      if (cfg.botSpeed) b.speed = rand(cfg.botSpeed[0], cfg.botSpeed[1]);
      else b.speed = rand(140, 175);
      if (cfg.botDmgMul) b.dmgMul = cfg.botDmgMul;
      const wk = cfg.weapon || WEAPON_KEYS[Math.floor(Math.random()*WEAPON_KEYS.length)];
      b.weapon = WEAPONS[wk]; b.weaponKey = wk; b.ammo = b.weapon.ammo;
      bots.push(b);
    }
    if (cfg.weapon){
      player.weapon = WEAPONS[cfg.weapon];
      player.weaponKey = cfg.weapon;
      player.ammo = player.weapon.ammo;
    }
  }

  bullets = []; loot = []; particles = []; killFeed = [];
  sawOthers = false;
  matchRecorded = false;

  if (netMode === 'offline') spawnLootRandom(55, selectedBotMode);
  else spawnLootSeeded(roomId, LOOT_COUNT);

  zone = { x: WORLD/2, y: WORLD/2, r: ZONE_START_R, targetR: ZONE_END_R };
  time = 0;
  gameState = 'playing';
  updateAlive();
}

function updateAlive(){
  let n = (player && player.alive) ? 1 : 0;
  if (netMode === 'online'){
    for (const e of remotePlayers.values()) if (e.alive) n++;
  } else {
    for (const b of bots) if (b.alive) n++;
  }
  aliveCount = n;
}

function spawnLootRandom(n, mode){
  const cfg = BOT_MODES[mode] || {};
  const forceWeapon = cfg.weapon;
  for (let i = 0; i < n; i++){
    const id = 'L' + i;
    const r = Math.random();
    if (r < 0.22){
      loot.push({ id, x: rand(120,WORLD-120), y: rand(120,WORLD-120), type:'health', r:12 });
    } else {
      const wk = forceWeapon || WEAPON_KEYS[Math.floor(Math.random()*WEAPON_KEYS.length)];
      loot.push({ id, x: rand(120,WORLD-120), y: rand(120,WORLD-120), type:'weapon', weaponKey: wk, r:14 });
    }
  }
}

function spawnLootSeeded(seed, n){
  const rnd = mulberry32(hashStr('loot:' + seed));
  for (let i = 0; i < n; i++){
    const id = 'L' + i;
    const roll = rnd();
    const x = 120 + rnd() * (WORLD - 240);
    const y = 120 + rnd() * (WORLD - 240);
    if (takenLoot.has(id)) continue;
    if (roll < 0.22) loot.push({ id, x, y, type:'health', r:12 });
    else {
      const wk = WEAPON_KEYS[Math.floor(rnd()*WEAPON_KEYS.length)];
      loot.push({ id, x, y, type:'weapon', weaponKey: wk, r:14 });
    }
  }
}

function removeLootById(id){
  const s = String(id);
  for (let i = loot.length - 1; i >= 0; i--){
    if (String(loot[i].id) === s) loot.splice(i, 1);
  }
}

function applyLocalDamage(e, dmg){
  if (!e || !e.alive) return;
  e.hp = Math.max(0, e.hp - dmg);
  e.pendingDamage = (e.pendingDamage || 0) + dmg;
  e.localHitAt = performance.now();
}

function killEntity(ent, killer){
  if (!ent || !ent.alive) return;
  ent.alive = false;
  if (killer && killer !== ent) killer.kills = (killer.kills || 0) + 1;

  if (netMode === 'offline'){
    loot.push({ id:'D'+Math.random(), x: ent.x, y: ent.y, type:'weapon', weaponKey: ent.weaponKey, r:14 });
    if (Math.random() < 0.6)
      loot.push({ id:'D'+Math.random(), x: ent.x + rand(-28,28), y: ent.y + rand(-28,28), type:'health', r:12 });
  }

  const kname = killer ? killer.name : 'ZONE';
  killFeed.push({ text: `${kname} → ${ent.name}`, t: 4 });
  if (killFeed.length > 4) killFeed.shift();

  for (let i = 0; i < 12; i++)
    particles.push({ x:ent.x, y:ent.y, vx: rand(-120,120), vy: rand(-120,120), life: 0.6, color:'#ff5a5a' });

  if (netMode === 'online' && ent === player && db && roomId && myUid){
    db.ref(`rooms/${roomId}/players/${myUid}`).update({ alive:false, hp:0 }).catch(()=>{});
  }
}

const joyL = { active:false, id:null, ox:0, oy:0, x:0, y:0 };
const joyR = { active:false, id:null, ox:0, oy:0, x:0, y:0 };
const keys = {};

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (gameState === 'won' || gameState === 'lost'){ backToMainMenu(); return; }
  if (gameState !== 'playing') return;
  for (const t of e.changedTouches){
    if (t.clientX < W/2 && joyL.id === null){
      joyL.id = t.identifier; joyL.ox = t.clientX; joyL.oy = t.clientY;
      joyL.x = t.clientX; joyL.y = t.clientY; joyL.active = true;
    } else if (t.clientX >= W/2 && joyR.id === null){
      joyR.id = t.identifier; joyR.ox = t.clientX; joyR.oy = t.clientY;
      joyR.x = t.clientX; joyR.y = t.clientY; joyR.active = true;
    }
  }
}, { passive:false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches){
    if (t.identifier === joyL.id){ joyL.x = t.clientX; joyL.y = t.clientY; }
    if (t.identifier === joyR.id){ joyR.x = t.clientX; joyR.y = t.clientY; }
  }
}, { passive:false });

function endTouch(e){
  for (const t of e.changedTouches){
    if (t.identifier === joyL.id){ joyL.active=false; joyL.id=null; }
    if (t.identifier === joyR.id){ joyR.active=false; joyR.id=null; }
  }
}
canvas.addEventListener('touchend', endTouch);
canvas.addEventListener('touchcancel', endTouch);

});

async function doAuthSubmit(){
  authError.textContent = '';
  const email = (authEmail.value || '').trim();
  const pass = (authPass.value || '').trim();
  const name = sanitizeName(authName.value);

  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    authError.textContent = 'Введи корректный email'; return;
  }
  if (pass.length < 6){
    authError.textContent = 'Пароль минимум 6 символов'; return;
  }
  authSubmit.disabled = true;
  const oldLabel = authSubmit.textContent;
  authSubmit.textContent = '...';
  try {
    if (!db) initFirebase();
    if (authMode === 'login'){
      await auth.signInWithEmailAndPassword(email, pass);
    } else {
      const cred = await auth.createUserWithEmailAndPassword(email, pass);
      await cred.user.updateProfile({ displayName: name });
      await db.ref('users/' + cred.user.uid).set({
        name, email,
        kills:0, wins:0, matches:0,
        createdAt: firebase.database.ServerValue.TIMESTAMP,
      });
    }
  } catch(err){
    console.error('[auth]', err);
    const c = err.code || '';
    if (c.includes('email-already-in-use'))   authError.textContent = 'Email уже занят';
    else if (c.includes('invalid-email'))     authError.textContent = 'Неверный email';
    else if (c.includes('weak-password'))     authError.textContent = 'Слабый пароль (мин 6)';
    else if (c.includes('wrong-password'))    authError.textContent = 'Неверный пароль';
    else if (c.includes('user-not-found'))    authError.textContent = 'Аккаунт не найден';
    else if (c.includes('invalid-credential'))authError.textContent = 'Неверный email или пароль';
    else if (c.includes('operation-not-allowed')) authError.textContent = 'Включи Email/Password в Firebase';
    else if (c.includes('network'))           authError.textContent = 'Нет сети';
    else authError.textContent = err.message || 'Ошибка';
  } finally {
    authSubmit.disabled = false;
    authSubmit.textContent = oldLabel;
  }
}

btnGuest.onclick = async () => {
  authError.textContent = '';
  btnGuest.disabled = true;
  try {
    if (!db) initFirebase();

function renderServerList(rooms){
  const now = serverNow();
  const items = [];
  for (const rid in rooms){
    const r = rooms[rid];
    const meta = r && r.meta;
    if (!meta) continue;
    if (!meta.startAt) continue;
    // показываем только те, что ещё не стартанули, либо стартовали меньше 40 сек назад
    if (meta.startAt < now - 40000) continue;
    // и не слишком далеко в будущем (>15 мин)
    if (meta.startAt > now + 15 * 60 * 1000) continue;
    const players = r.players ? Object.keys(r.players).length : 0;
    items.push({ rid, meta, players });
  }
  items.sort((a,b) => b.meta.createdAt - a.meta.createdAt);

  if (items.length === 0){
    serverListEl.innerHTML = '<div class="emptyList">Пока нет открытых серверов. Создай свой!</div>';
    return;
  }
  serverListEl.innerHTML = '';
  for (const it of items){
    const card = document.createElement('div');
    card.className = 'serverCard';
    const started = it.meta.startAt <= now + 500;
    const lock = it.meta.hasPassword ? '<span class="lock">🔒</span>' : '';
    const tag = started ? '▶ игра идёт' : ('старт ' + Math.max(0, Math.ceil((it.meta.startAt - now)/1000)) + 'с');
    card.innerHTML = `
      <div class="srvName">${lock}${escapeHtml(it.meta.name || 'Сервер')}</div>
      <div class="srvMeta">
        <span>${it.players} игроков</span>
        <span>${tag}</span>
      </div>
      <div class="srvMeta" style="font-size:10px; opacity:0.7;">
        <span>от ${escapeHtml(it.meta.createdByName || '?')}</span>
        <span>код: ${it.rid}</span>
      </div>
    `;
    card.onclick = () => joinServerById(it.rid, it.meta);
    serverListEl.appendChild(card);
  }
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

async function joinServerById(rid, knownMeta){
  rid = rid.toUpperCase();
  showScreen('connecting');
  document.getElementById('connectMsg').textContent = 'Проверка комнаты...';
  try {
    let meta = knownMeta;
    if (!meta){
      const snap = await withTimeout(db.ref('rooms/' + rid + '/meta').once('value'), 8000, 'timeout');
      meta = snap.val();
    }
    if (!meta || !meta.startAt){
      showScreen('serverBrowser');
      alert('Комната "' + rid + '" не найдена');
      return;
    }
    roomId = rid;
    roomMeta = meta;
    if (meta.hasPassword){
      // если уже вводили пароль — проверяем
      if (pendingJoinRoomId === rid && joinPassword.value){
        const h = simpleHash(rid + ':' + joinPassword.value);
        if (h === meta.passwordHash){
          const p = joinPassword.value;
          joinPassword.value = '';
          pendingJoinRoomId = null;
          await connectToRoom(meta, false, p);
          return;
        }
      }
      pendingJoinRoomId = rid;
      document.getElementById('joinServerName').textContent = '«' + (meta.name || 'Сервер') + '»';
      document.getElementById('joinErr').textContent = '';
      document.getElementById('joinPassword').value = '';
      document.getElementById('joinModal').classList.remove('hidden');
      document.getElementById('joinPassword').focus();
      hideAllScreens();
      showScreen('serverBrowser');
      return;
    }
    await connectToRoom(meta, false);
  } catch(err){
    console.error(err);
    showScreen('serverBrowser');
    alert('Ошибка: ' + (err.message || err));
  }
}

const joinPassword = document.getElementById('joinPassword');

document.getElementById('btnCancelJoin').onclick = () => {

/* ============ CONNECT TO ROOM ============ */
async function connectToRoom(meta, isHost, passwordForHost){
  matchStartAt = Number(meta.startAt) || (Date.now() + serverOffset + START_DELAY);

  showScreen('connecting');
  document.getElementById('connectMsg').textContent = 'Синхронизация...';

  serverOffset = await new Promise(res => {
    const to = setTimeout(() => res(0), 2500);
    try {
      db.ref('.info/serverTimeOffset').once('value', s => {
        clearTimeout(to); res(s.val() || 0);
      }, () => { clearTimeout(to); res(0); });
    } catch(e){ clearTimeout(to); res(0); }
  });

  document.getElementById('connectMsg').textContent = 'Вход...';
  try {
    await joinRoom();
  } catch(err){
    console.error('[joinRoom]', err);
    showScreen('serverBrowser');
    alert('Ошибка входа: ' + (err.message || err));
    return;
  }

  showScreen('waiting');
  document.getElementById('waitingServerName').textContent = meta.name || 'Сервер';
  document.getElementById('waitingRoom').textContent = roomId;
  document.getElementById('waitingName').textContent = myName;

  document.getElementById('btnWaitingBack').onclick = () => {
    cleanupRoom();
    showScreen('mainMenu');
  };

  if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
  const countdownEl = document.getElementById('countdown');
  const tick = () => {
    const delta = matchStartAt - serverNow();
    const left = Math.max(0, Math.ceil((isFinite(delta) ? delta : 0) / 1000));
    countdownEl.textContent = left;
    if (left <= 0){
      if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
      startOnlineMatch();
    }
  };
  tick();
  countdownTimer = setInterval(tick, 120);
}

function startOnlineMatch(){
  netMode = 'online';
  hideAllScreens();
  resetGame();
  player.uid = myUid;
  player.name = myName;
  db.ref(`rooms/${roomId}/players/${myUid}`).update({
    x: Math.round(player.x), y: Math.round(player.y),
    hp: 100, weapon: 'pistol', alive: true, name: myName,
  }).catch(()=>{});
  setupGameListeners();
}

function cleanupRoom(){
  if (countdownTimer){ clearInterval(countdownTimer); countdownTimer = null; }
  for (const l of listeners){
    try { l.ref.off(l.type, l.cb); } catch(e){}
  }
  listeners = [];
  remotePlayers.clear();
  takenLoot = new Set();
  if (db && roomId && myUid){
    db.ref(`rooms/${roomId}/players/${myUid}`).remove().catch(()=>{});
  }
}

function backToMainMenu(){
  cleanupRoom();
  netMode = 'offline';
  gameState = 'menu';
  showScreen('mainMenu');
}

/* ============ NETWORK: joinRoom ============ */
async function joinRoom(){
  const sp = spawnPointFor(myUid);
  const me = {
    x: Math.round(sp.x), y: Math.round(sp.y),
    angle: 0, hp: 100, weapon: 'pistol', alive: true, kills: 0,
    name: myName,
  };
  const myRef = db.ref(`rooms/${roomId}/players/${myUid}`);
  await withTimeout(myRef.set(me), 8000, 'set timeout');
  try { myRef.onDisconnect().remove(); } catch(e){}

  const playersRef = db.ref(`rooms/${roomId}/players`);
  const pCb = playersRef.on('value', snap => {
    const data = snap.val() || {};
    const seen = new Set();
    for (const uid in data){
      if (uid === myUid) continue;
      seen.add(uid);
      const p = data[uid];
      if (!p || typeof p.x !== 'number') continue;
      let e = remotePlayers.get(uid);
      if (!e){
        e = makeEntity(p.x, p.y, false, p.name || uid.substring(0,4));
        e.uid = uid;
        e.x = e.targetX = p.x;
        e.y = e.targetY = p.y;
        e.angle = e.targetAngle = p.angle || 0;
        e.hp = p.hp != null ? p.hp : 100;
        e.lastServerHp = e.hp;
        e.pendingDamage = 0;
        e.weaponKey = p.weapon || 'pistol';
        e.weapon = WEAPONS[e.weaponKey] || WEAPONS.pistol;
        e.alive = p.alive !== false;
        e.kills = p.kills || 0;
        remotePlayers.set(uid, e);
      } else {
        e.targetX = p.x;
        e.targetY = p.y;
        e.targetAngle = p.angle || 0;
        const serverHp = (p.hp != null) ? p.hp : e.hp;
        const prevServer = (e.lastServerHp != null) ? e.lastServerHp : serverHp;
        const serverDrop = Math.max(0, prevServer - serverHp);
        if (serverDrop > 0){
          e.pendingDamage = Math.max(0, (e.pendingDamage || 0) - serverDrop);
        } else {
          e.pendingDamage = Math.max(0, (e.pendingDamage || 0) - 2);
        }
        e.lastServerHp = serverHp;
        e.hp = Math.max(0, serverHp - (e.pendingDamage || 0));
        e.weaponKey = p.weapon || e.weaponKey;
        e.weapon = WEAPONS[e.weaponKey] || e.weapon;
        const wasAlive = e.alive;
        e.alive = p.alive !== false;
        if (!e.alive){ e.hp = 0; e.pendingDamage = 0; }
        if (wasAlive && !e.alive && gameState === 'playing'){
          const mine = (p.killedBy && p.killedBy === myUid);
          killFeed.push({ text: mine ? `YOU → ${e.name}` : `${e.name} устранён`, t: 4 });
          if (killFeed.length > 4) killFeed.shift();
        }
        e.name = p.name || e.name;
        e.kills = p.kills != null ? p.kills : e.kills;
      }
    }
    for (const uid of [...remotePlayers.keys()]){
      if (!seen.has(uid)){
        const gone = remotePlayers.get(uid);
        if (gone && gone.alive && gameState === 'playing'){
          killFeed.push({ text: `${gone.name} покинул игру`, t: 4 });
          if (killFeed.length > 4) killFeed.shift();
        }
        remotePlayers.delete(uid);
      }
    }
    updateAlive();
  });
  listeners.push({ ref: playersRef, type: 'value', cb: pCb });

  try {
    const takenSnap = await db.ref(`rooms/${roomId}/taken`).once('value');
    const takenVal = takenSnap.val() || {};
    for (const k in takenVal) takenLoot.add(String(k));
  } catch(e){}
}

/* ============ NETWORK: game listeners ============ */
function setupGameListeners(){
  const shotsRef = db.ref(`rooms/${roomId}/shots`).limitToLast(50);
  const sCb = shotsRef.on('child_added', snap => {
    const s = snap.val();
    snap.ref.remove().catch(()=>{});
    if (!s || !bullets) return;
    if (s.uid === myUid) return;
    if (serverNow() - (s.t || 0) > SHOT_MAX_AGE) return;
    const w = WEAPONS[s.weaponKey] || WEAPONS.pistol;
    const n = w.pellets || 1;
    for (let i = 0; i < n; i++){
      const a = s.angle + rand(-w.spread, w.spread);
      bullets.push({
        x: s.x, y: s.y,
        vx: Math.cos(a)*w.speed, vy: Math.sin(a)*w.speed,
        dmg: 0, owner: null, life: 1.0, color: w.color, visual: true,
      });
    }
  });
  listeners.push({ ref: shotsRef, type: 'child_added', cb: sCb });

  const dmgRef = db.ref(`rooms/${roomId}/damage/${myUid}`);
  const dCb = dmgRef.on('child_added', snap => {
    const d = snap.val();
    snap.ref.remove().catch(()=>{});
    if (!d || !player || !player.alive || gameState !== 'playing') return;
    player.hp -= d.amount;
    if (player.hp <= 0){
      player.hp = 0;
      killEntity(player, { name: d.byName || 'ENEMY' });
      gameState = 'lost';
      if (d.by){
        db.ref(`rooms/${roomId}/players/${d.by}/kills`)
          .transaction(v => (v||0)+1).catch(()=>{});
        db.ref(`rooms/${roomId}/players/${myUid}/killedBy`)
          .set(d.by).catch(()=>{});
      }
    }
  });
  listeners.push({ ref: dmgRef, type: 'child_added', cb: dCb });

  const myKillsRef = db.ref(`rooms/${roomId}/players/${myUid}/kills`);
  const kCb = myKillsRef.on('value', s => {
    if (player) player.kills = s.val() || 0;
  });
  listeners.push({ ref: myKillsRef, type: 'value', cb: kCb });

  const takenRef = db.ref(`rooms/${roomId}/taken`);
  const tCb = takenRef.on('child_added', snap => {
    const id = String(snap.key);
    takenLoot.add(id);
    removeLootById(id);
  });
  listeners.push({ ref: takenRef, type: 'child_added', cb: tCb });
}

function syncMyState(){
  if (netMode !== 'online' || !db || !player || !player.alive) return;
  db.ref(`rooms/${roomId}/players/${myUid}`).update({
    x: Math.round(player.x),
    y: Math.round(player.y),
    angle: Math.round(player.angle * 100) / 100,
    hp: Math.round(player.hp),
    weapon: player.weaponKey,
    alive: player.alive,
  }).catch(()=>{});
}
function sendShot(x, y, angle, weaponKey){
  if (netMode !== 'online' || !db || !player || !player.alive) return;
  db.ref(`rooms/${roomId}/shots`).push({
    uid: myUid, x: Math.round(x), y: Math.round(y),
    angle: Math.round(angle*100)/100, weaponKey, t: serverNow(),
  }).catch(()=>{});
}
function sendDamage(targetUid, amount){
  if (netMode !== 'online' || !db) return;
  db.ref(`rooms/${roomId}/damage/${targetUid}`).push({
    amount, by: myUid, byName: myName, t: serverNow(),
  }).catch(()=>{});

/* ============ COMBAT ============ */
function tryFire(ent, dt){
  if (ent.fireCd > 0 || ent.reloading > 0) return;
  if (ent.ammo <= 0){ ent.reloading = ent.weapon.reload; return; }
  const w = ent.weapon;
  const p = w.pellets || 1;
  const mul = ent.dmgMul || 1;
  for (let i = 0; i < p; i++){
    const a = ent.angle + rand(-w.spread, w.spread);
    bullets.push({
      x: ent.x + Math.cos(ent.angle)*(ent.r + 6),
      y: ent.y + Math.sin(ent.angle)*(ent.r + 6),
      vx: Math.cos(a)*w.speed, vy: Math.sin(a)*w.speed,
      dmg: w.dmg * mul, owner: ent, life: 1.2, color: w.color,
    });
  }
  ent.ammo--;
  ent.fireCd = w.rate;
  for (let i = 0; i < 3; i++)
    particles.push({
      x: ent.x + Math.cos(ent.angle)*(ent.r+10),
      y: ent.y + Math.sin(ent.angle)*(ent.r+10),
      vx: Math.cos(ent.angle)*rand(50,150) + rand(-40,40),
      vy: Math.sin(ent.angle)*rand(50,150) + rand(-40,40),
      life: 0.15, color: w.color,
    });
  if (netMode === 'online' && ent === player)
    sendShot(ent.x, ent.y, ent.angle, ent.weaponKey);
}

/* ============ UPDATE ============ */
function updatePlayer(dt){
  if (!player.alive) return;
  let dx = 0, dy = 0;
  if (joyL.active){
    const jx = joyL.x - joyL.ox, jy = joyL.y - joyL.oy;
    const d = Math.hypot(jx, jy);
    if (d > 8){
      const k = Math.min(1, d / JOY_R);
      dx = jx/d * k; dy = jy/d * k;
    }
  }
  if (keys['w'] || keys['arrowup'])    dy -= 1;
  if (keys['s'] || keys['arrowdown'])  dy += 1;
  if (keys['a'] || keys['arrowleft'])  dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  const m = Math.hypot(dx, dy);
  if (m > 1){ dx /= m; dy /= m; }
  player.x += dx * player.speed * dt;
  player.y += dy * player.speed * dt;
  player.x = Math.max(player.r, Math.min(WORLD - player.r, player.x));
  player.y = Math.max(player.r, Math.min(WORLD - player.r, player.y));

  let wantFire = false;
  if (joyR.active){
    const jx = joyR.x - joyR.ox, jy = joyR.y - joyR.oy;
    const d = Math.hypot(jx, jy);
    if (d > 15){
      player.angle = Math.atan2(jy, jx);
      wantFire = true;
    }
  }
  if (mouse.down){
    const psx = player.x - cam.x, psy = player.y - cam.y;
    player.angle = Math.atan2(mouse.y - psy, mouse.x - psx);
    wantFire = true;
  }
  if (wantFire) tryFire(player, dt);

  if (player.fireCd > 0) player.fireCd -= dt;
  if (player.reloading > 0){
    player.reloading -= dt;
    if (player.reloading <= 0) player.ammo = player.weapon.ammo;
  }
}

function updateBot(b, dt){
  if (!b.alive) return;
  let target = null, minD = 700;
  if (player.alive){
    const d = Math.hypot(player.x - b.x, player.y - b.y);
    if (d < minD){ minD = d; target = player; }
  }
  for (const o of bots){
    if (o === b || !o.alive) continue;
    const d = Math.hypot(o.x - b.x, o.y - b.y);
    if (d < minD){ minD = d; target = o; }
  }
  const zdx = zone.x - b.x, zdy = zone.y - b.y;
  const zdist = Math.hypot(zdx, zdy);
  const outside = zdist > zone.r - 150;
  let mx = 0, my = 0;
  if (target && minD < 500 && !outside){
    const ang = Math.atan2(target.y - b.y, target.x - b.x);
    b.angle = ang;
    if (minD > 220){ mx = Math.cos(ang); my = Math.sin(ang); }
    else if (minD < 130){ mx = -Math.cos(ang); my = -Math.sin(ang); }
    else {
      const s = Math.sin(time*2 + b.wanderAngle);
      mx = Math.cos(ang + Math.PI/2) * s;
      my = Math.sin(ang + Math.PI/2) * s;
    }
    tryFire(b, dt);
  } else if (outside){
    b.angle = Math.atan2(zdy, zdx);
    mx = zdx/zdist; my = zdy/zdist;
  } else {
    b.wanderTimer -= dt;
    if (b.wanderTimer <= 0){ b.wanderAngle = rand(0, Math.PI*2); b.wanderTimer = rand(1.2, 3.5); }
    b.angle = b.wanderAngle;
    mx = Math.cos(b.wanderAngle) * 0.7;
    my = Math.sin(b.wanderAngle) * 0.7;
  }
  const m = Math.hypot(mx, my);
  if (m > 1){ mx /= m; my /= m; }
  b.x += mx * b.speed * dt;
  b.y += my * b.speed * dt;
  b.x = Math.max(b.r, Math.min(WORLD - b.r, b.x));
  b.y = Math.max(b.r, Math.min(WORLD - b.r, b.y));
  if (b.fireCd > 0) b.fireCd -= dt;
  if (b.reloading > 0){ b.reloading -= dt; if (b.reloading <= 0) b.ammo = b.weapon.ammo; }
}

function updateRemotePlayers(dt){
  if (netMode !== 'online') return;
  const k = 1 - Math.exp(-INTERP_SPEED * dt);
  for (const e of remotePlayers.values()){
    if (!e.alive) continue;
    e.x += (e.targetX - e.x) * k;
    e.y += (e.targetY - e.y) * k;
    let da = e.targetAngle - e.angle;
    while (da >  Math.PI) da -= Math.PI*2;
    while (da < -Math.PI) da += Math.PI*2;
    e.angle += da * k;
  }
}

function updateBullets(dt){
  for (let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.x < 0 || b.x > WORLD || b.y < 0 || b.y > WORLD){
      bullets.splice(i, 1); continue;
    }
    if (b.visual) continue;
    let hit = false;
    const targets = [player];
    if (netMode === 'offline') targets.push(...bots);
    else for (const e of remotePlayers.values()) targets.push(e);
    for (const t of targets){
      if (!t || !t.alive || t === b.owner) continue;
      if (Math.hypot(t.x - b.x, t.y - b.y) < t.r + 4){
        if (netMode === 'online' && t.uid){
          sendDamage(t.uid, b.dmg);
          applyLocalDamage(t, b.dmg);
        } else {
          t.hp -= b.dmg;
          if (t.hp <= 0) killEntity(t, b.owner);
        }
        for (let k = 0; k < 4; k++)
          particles.push({ x: b.x, y: b.y, vx: rand(-100,100), vy: rand(-100,100), life: 0.3, color:'#ffd166' });
        hit = true;
        break;
      }
    }
    if (hit) bullets.splice(i, 1);
  }
}

function updateLoot(){
  if (!player.alive) return;
  for (let i = loot.length - 1; i >= 0; i--){
    const l = loot[i];
    if (Math.hypot(player.x - l.x, player.y - l.y) >= player.r + l.r + 6) continue;
    if (l.type === 'health'){
      if (player.hp >= player.maxHp) continue;
      player.hp = Math.min(player.maxHp, player.hp + 40);
    } else {
      if (player.weaponKey === l.weaponKey) continue;
      player.weapon = WEAPONS[l.weaponKey];
      player.weaponKey = l.weaponKey;
      player.ammo = player.weapon.ammo;
      player.reloading = 0;
    }
    if (netMode === 'online' && l.id != null){
      const id = String(l.id);
      if (!takenLoot.has(id)){
        takenLoot.add(id);
        db.ref(`rooms/${roomId}/taken/${id}`).set(true).catch(()=>{});
      }
    }
    loot.splice(i, 1);
  }
}

function updateZone(dt){
  if (netMode === 'online'){
    const elapsed = Math.max(0, (serverNow() - matchStartAt) / 1000);
    zone.r = Math.max(ZONE_END_R, ZONE_START_R - ZONE_SHRINK * elapsed);
  } else {
    zone.r = Math.max(ZONE_END_R, zone.r - ZONE_SHRINK * dt);
  }
  if (player && player.alive){
    const d = Math.hypot(player.x - zone.x, player.y - zone.y);
    if (d > zone.r){
      player.hp -= ZONE_DPS * dt;
      if (player.hp <= 0){ player.hp = 0; killEntity(player, null); }
    }
  }
  if (netMode === 'offline'){
    for (const b of bots){
      if (!b.alive) continue;
      const d = Math.hypot(b.x - zone.x, b.y - zone.y);
      if (d > zone.r){ b.hp -= ZONE_DPS * dt; if (b.hp <= 0) killEntity(b, null); }
    }
  }
}

function updateParticles(dt){
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.92; p.vy *= 0.92;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = killFeed.length - 1; i >= 0; i--){
    killFeed[i].t -= dt;
    if (killFeed[i].t <= 0) killFeed.splice(i, 1);
  }
}

/* ============ CAMERA ============ */
function updateCamera(){
  const focus = (player && player.alive) ? player : { x: zone.x, y: zone.y };
  cam.x = focus.x - W/2;
  cam.y = focus.y - H/2;
  if (W < WORLD) cam.x = Math.max(0, Math.min(WORLD - W, cam.x));
  if (H < WORLD) cam.y = Math.max(0, Math.min(WORLD - H, cam.y));
}

/* ============ RENDER ============ */
function drawGrid(){
  const step = 100;
  const x0 = Math.floor(cam.x / step) * step;
  const y0 = Math.floor(cam.y / step) * step;
  ctx.strokeStyle = 'rgba(255,255,255,0.045)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = x0; x < cam.x + W + step; x += step){
    ctx.moveTo(x - cam.x, 0); ctx.lineTo(x - cam.x, H);
  }
  for (let y = y0; y < cam.y + H + step; y += step){
    ctx.moveTo(0, y - cam.y); ctx.lineTo(W, y - cam.y);
  }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,80,80,0.5)';
  ctx.lineWidth = 4;
  ctx.strokeRect(-cam.x, -cam.y, WORLD, WORLD);
}
function drawZone(){
  const sx = zone.x - cam.x, sy = zone.y - cam.y;
  ctx.save();
  ctx.beginPath();
  ctx.rect(-100, -100, W + 200, H + 200);
  ctx.arc(sx, sy, zone.r, 0, Math.PI*2, true);
  ctx.fillStyle = 'rgba(120,20,30,0.28)';
  ctx.fill();
  ctx.restore();
  ctx.beginPath();
  ctx.arc(sx, sy, zone.r, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(255,80,120,0.85)';
  ctx.lineWidth = 3;
  ctx.stroke();
}
function drawLoot(){
  for (const l of loot){
    const sx = l.x - cam.x, sy = l.y - cam.y;
    if (sx < -40 || sx > W + 40 || sy < -40 || sy > H + 40) continue;
