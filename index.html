<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
:root{--fs:16px;--rad:20px;--avl:85;--avt:25;
--p:#4a5bd0;--onp:#fff;--pc:#dde1ff;--onpc:#00105c;--sc:#e1e0f9;--onsc:#191a2c;--tc:#ffd8ec;--ontc:#2e1126;
--s:#fbf8ff;--s1:#f5f2fa;--s2:#efedf4;--s3:#eae7ef;--s4:#e4e1e9;--os:#1b1b1f;--osv:#46464f;--ol:#777680;--olv:#c7c5d0}
body{font-family:Roboto,"Google Sans",system-ui,-apple-system,sans-serif;background:var(--s);color:var(--os);font-size:var(--fs);-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;border:0;outline:0;background:none;-webkit-user-select:text;user-select:text}
svg{display:block;flex-shrink:0}
#app{position:fixed;left:0;top:0;right:0;bottom:0;overflow:hidden}
.screen{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;background:var(--s);transition:transform .32s cubic-bezier(.2,0,0,1),opacity .32s}
#chat{transform:translateX(100%);z-index:5}
#chat.open{transform:none}
#main.back{transform:translateX(-18%);opacity:.6}
/* top app bar */
.bar{display:flex;align-items:center;gap:4px;min-height:64px;padding:8px 8px 8px 4px;padding-top:calc(8px + env(safe-area-inset-top))}
.ib{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--osv);transition:background .15s}
.ib:active{background:var(--s4)}
.bar h1{font-size:22px;font-weight:500;flex:1;padding-left:8px}
.searchpill{flex:1;display:flex;align-items:center;gap:8px;height:48px;border-radius:28px;background:var(--s3);padding:0 8px 0 16px;margin:0 4px 0 8px;color:var(--osv)}
.searchpill input{flex:1;font-size:16px;min-width:0}
.searchpill .ph{flex:1;opacity:.8}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--ol);font-size:14px;font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:6px;color:var(--osv)}
.chip.on{background:var(--sc);border-color:transparent;color:var(--onsc)}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
/* list */
.ci{display:flex;gap:14px;align-items:center;padding:10px 16px;margin:0 8px;border-radius:20px;transition:background .15s}
.ci:active{background:var(--s2)}
.ci.sel{background:var(--pc)}
.av{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:19px;flex-shrink:0;background:hsl(var(--h),50%,calc(var(--avl)*1%));color:hsl(var(--h),50%,calc(var(--avt)*1%));position:relative}
.av.sm{width:40px;height:40px;font-size:15px}
.av.lg{width:72px;height:72px;font-size:26px}
.av.sv{background:var(--p);color:var(--onp)}
.av .on{position:absolute;right:0;bottom:0;width:14px;height:14px;border-radius:50%;background:#2fb457;border:2.5px solid var(--s)}
.av .ck{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--p);color:var(--onp);display:flex;align-items:center;justify-content:center;border:2px solid var(--pc)}
.cm{flex:1;min-width:0}
.r1,.r2{display:flex;align-items:center;gap:8px}
.r1 b{flex:1;font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{font-size:12px;color:var(--osv)}
.r2{margin-top:2px}
.pv{flex:1;color:var(--osv);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv i{font-style:normal;color:var(--p)}
.bd{min-width:22px;height:22px;border-radius:11px;background:var(--p);color:var(--onp);font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;padding:0 7px}
.bd.mu{background:var(--ol);color:var(--s)}
.mi{color:var(--osv);display:flex}
.empty{text-align:center;padding:64px 32px;color:var(--osv)}
.empty .big{width:96px;height:96px;border-radius:50%;background:var(--pc);color:var(--onpc);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.sec{padding:16px 24px 8px;font-size:14px;font-weight:500;color:var(--p)}
/* nav bar */
.nav{display:flex;background:var(--s2);padding:12px 8px 16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.nv{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--osv)}
.nv .pill{width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;transition:background .25s}
.nv.on{color:var(--os)}
.nv.on .pill{background:var(--sc);color:var(--onsc)}
.nv .pill{position:relative}
.nv .nb{position:absolute;top:0;right:12px;background:#d93025;color:#fff;border-radius:8px;font-size:10px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.fab{position:absolute;right:16px;bottom:calc(104px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;background:var(--pc);color:var(--onpc);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.22);transition:transform .2s}
.fab:active{transform:scale(.92)}
/* settings */
.card{margin:8px 16px;padding:16px;border-radius:28px;background:var(--s2)}
.prof{display:flex;gap:16px;align-items:center;padding:20px 16px;margin:8px 16px;border-radius:28px;background:var(--pc);color:var(--onpc)}
.prof b{font-size:20px;font-weight:500;display:block}
.prof span{font-size:14px;opacity:.8}
.row{display:flex;align-items:center;gap:16px;padding:12px 8px;border-radius:16px}
.row .t{flex:1}
.row .t small{display:block;color:var(--osv);font-size:13px;margin-top:2px}

function applyTheme(){
  var dark=S.theme==="dark"||(S.theme==="auto"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);

  var P=function(t){return H(h,62,t)},Sx=function(t){return H(h,22,t)},Tx=function(t){return H((h+60)%360,38,t)},N=function(t){return H(h,8,t)},V=function(t){return H(h,12,t)};
  var v;
  if(dark)v={p:P(80),onp:P(20),pc:P(30),onpc:P(90),sc:Sx(30),onsc:Sx(90),tc:Tx(30),ontc:Tx(90),s:N(6),s1:N(10),s2:N(12),s3:N(17),s4:N(22),os:N(90),osv:V(80),ol:V(60),olv:V(30),avl:30,avt:90};

  for(var k in v)r.setProperty("--"+k,v[k]);
  r.setProperty("--fs",S.tsize+"px");r.setProperty("--rad",S.rad+"px");
}

/* ---------- helpers ---------- */
function pad(n){return n<10?"0"+n:n}
function hm(t){var d=new Date(t);return pad(d.getHours())+":"+pad(d.getMinutes())}
var MON=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"],WD=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
function listTime(t){var d=new Date(t),n=new Date();if(d.toDateString()===n.toDateString())return hm(t);if(n-d<7*DAY)return d.toLocaleDateString(LOC(),{weekday:"short"});return pad(d.getDate())+"."+pad(d.getMonth()+1)}
function dayLabel(t){var d=new Date(t),n=new Date();if(d.toDateString()===n.toDateString())return "Сегодня";if(new Date(n-DAY).toDateString()===d.toDateString())return "Вчера";return d.toLocaleDateString(LOC(),{day:"numeric",month:"long"})}
function initials(n){var p=String(n||"?").trim().split(/\s+/);return ((p[0][0]||"?")+(p[1]?p[1][0]:"")).toUpperCase()}
function avatar(c,cls,extra){
  if(c.type==="saved")return '<div class="av sv '+(cls||"")+'">'+ic("bm",cls==="lg"?36:26)+(extra||"")+'</div>';
  return '<div class="av '+(cls||"")+'" style="--h:'+c.hue+(c.photo?";background-image:url("+c.photo+")":"")+'">'+(c.photo?"":esc(initials(c.name)))+(extra||"")+'</div>';
}
function preview(c){
  var m=last(c);if(!m)return "Нет сообщений";
  var t=m.voice?"🎤 Голосовое сообщение":m.img?"🖼 Фото":m.imgs?"🖼 Альбом":m.sticker?m.sticker:m.file?"📎 "+esc(m.file.n):esc(m.text||"");
  var pre=m.out?"<i>Вы: </i>":(c.type==="group"&&m.from?"<i>"+esc(m.from)+": </i>":"");
  return pre+t;
}
function statusText(c){
  if(c.typing)return '<span class="typing"><i></i><i></i><i></i></span> печатает…';
  if(c.type==="group")return c.members+" участников";
  if(c.type==="channel")return c.members.toLocaleString("ru")+" подписчиков";
  if(c.type==="bot")return "бот";
  if(c.type==="saved")return "облачное хранилище";
  return c.online?"в сети":"был(а) недавно";
}

    me.onstop=function(){st.getTracks().forEach(function(t){t.stop()});if(!recSend)return;var d=recDur,rd=new FileReader();rd.onload=function(){pushMsg({voice:true,dur:d,audio:rd.result})};rd.readAsDataURL(new Blob(rch,{type:me.mimeType||"audio/webm"}))};

  }).catch(function(){toast("Нет доступа к микрофону")});
}

function resetPlay(id){var pg=$("#pg"+id),pb=$("#pb"+id);if(pg)pg.style.width="0";if(pb)pb.innerHTML=ic("play")}
function playVoice(id){
  var m=findMsg(id);if(!m||!m.audio)return;
  var same=audId===id;
  if(aud){aud.pause();resetPlay(audId);aud=null;audId=null}
  if(same)return;
  aud=new Audio(m.audio);aud.playbackRate=VS;audId=id;
  aud.ontimeupdate=function(){var pg=$("#pg"+id),d=isFinite(aud.duration)?aud.duration:m.dur;if(pg)pg.style.width=Math.min(100,aud.currentTime/d*100)+"%"};
  aud.onended=function(){resetPlay(id);aud=null;audId=null};
  var pb=$("#pb"+id);if(pb)pb.innerHTML=ic("pause");
  aud.play().catch(function(){resetPlay(id);aud=null;audId=null});
}

};

function fireworks(){
  var cv=document.createElement("canvas");cv.style.cssText="position:absolute;left:0;top:0;z-index:90;pointer-events:none";cv.width=innerWidth;cv.height=innerHeight;$("#app").appendChild(cv);
  var x=cv.getContext("2d"),P=[],t0=Date.now(),lb=-999;
  function boom(){var cx=cv.width*(.15+Math.random()*.7),cy=cv.height*(.12+Math.random()*.4),h=Math.random()*360;for(var i=0;i<80;i++){var a=Math.random()*6.283,s=1.5+Math.random()*5;P.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,h:h+Math.random()*40})}}
  (function f(){var T=Date.now()-t0;
    x.globalCompositeOperation="destination-out";x.fillStyle="rgba(0,0,0,.18)";x.fillRect(0,0,cv.width,cv.height);x.globalCompositeOperation="lighter";
    if(T<3800&&T-lb>380){boom();lb=T}
    P=P.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.vy=p.vy*.985+.07;p.l-=.011;if(p.l<=0)return false;x.fillStyle="hsla("+p.h+",100%,60%,"+p.l+")";x.beginPath();x.arc(p.x,p.y,2.4,0,6.283);x.fill();return true});
    if(T<6000||P.length)requestAnimationFrame(f);else cv.remove()})();
}

function cycSpd(){VS=VS===1?1.5:VS===1.5?2:1;if(aud)aud.playbackRate=VS;var b=document.querySelectorAll(".vd b");for(var i=0;i<b.length;i++)b[i].textContent=VS+"x"}
/* файлы / видео (со сжатием) / GIF / кружки */
function sendFile(k){var i=document.createElement("input");i.type="file";i.accept=k==="v"?"video/*":k==="a"?"audio/*":k==="g"?"image/gif":"*/*";i.style.display="none";document.body.appendChild(i);
  i.onchange=function(){var f=i.files[0];i.remove();if(!f)return;
    if(k==="v"&&f.size>1500000)return compressVideo(f,function(b){sendBlob(b,f.name.replace(/\.\w+$/,"")+".webm",k)});
    sendBlob(f,f.name,k)};i.click()}
function sendBlob(b,name,k){if(b.size>MAXF)return toast("Файл слишком большой (макс. 5 МБ)");if(!chat(S.open))return;toast("Отправка…");
  var r=new FileReader();r.onload=function(){var key=db.ref("media").push().key;db.ref("media/"+key).set(r.result).then(function(){pushMsg({file:{n:name,s:b.size,t:b.type||"",k:k},mid:key})}).catch(dberr)};r.readAsDataURL(b)}
function compressVideo(f,cb){
  var v=document.createElement("video");v.src=URL.createObjectURL(f);v.playsInline=true;
  var AC=window.AudioContext||window.webkitAudioContext,ac=new AC(),src=ac.createMediaElementSource(v),dst=ac.createMediaStreamDestination();src.connect(dst);ac.resume();
  v.onloadedmetadata=function(){var k=Math.min(1,480/Math.max(v.videoWidth,v.videoHeight)),cv=document.createElement("canvas");cv.width=Math.round(v.videoWidth*k)&~1;cv.height=Math.round(v.videoHeight*k)&~1;
    var x=cv.getContext("2d"),vs=cv.captureStream(24);dst.stream.getAudioTracks().forEach(function(t){vs.addTrack(t)});
    var ch=[],mr=new MediaRecorder(vs,{videoBitsPerSecond:450000,audioBitsPerSecond:48000}),n=0,iv;
    mr.ondataavailable=function(e){if(e.data.size)ch.push(e.data)};
    mr.onstop=function(){clearInterval(iv);ac.close();cb(new Blob(ch,{type:mr.mimeType||"video/webm"}))};
    iv=setInterval(function(){x.drawImage(v,0,0,cv.width,cv.height);if(++n%25===0)toast("Сжатие видео… "+Math.round(v.currentTime)+" с")},40);
    v.onended=function(){mr.stop()};mr.start();v.play().catch(function(){clearInterval(iv);toast("Не удалось сжать видео")})}}
function fileCard(m){var f=m.file,d=MC[m.mid];
  if(f.k==="g"){if(!d&&!m.__l){m.__l=1;getMedia(m.id,1)}return d?'<img class="pic" src="'+d+'">':'<div class="vd">GIF…</div>'}
  if(f.k==="c")return d?'<video class="circ" autoplay loop playsinline src="'+d+'" onclick="event.stopPropagation();this.paused?this.play():this.pause()"></video>':'<div class="circ" onclick="event.stopPropagation();getMedia(\''+m.id+'\')">'+ic("play",44)+'</div>';
  if(d&&f.k==="v")return '<video class="pic" controls playsinline src="'+d+'"></video>';
  if(d&&f.k==="a")return '<audio controls src="'+d+'" style="max-width:100%"></audio>';
  return '<div class="vc" onclick="event.stopPropagation();getMedia(\''+m.id+'\')"><div class="pb">'+ic(f.k==="v"?"play":f.k==="a"?"mic":"file")+'</div><div style="min-width:0"><div style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px">'+esc(f.n)+'</div><div class="vd">'+fmtB(f.s)+(d?"":" · ↓")+'</div></div></div>'}
function getMedia(id,quiet){var m=findMsg(id);if(!m||!m.mid)return;
  var done=function(d){MC[m.mid]=d;if(m.file.k==="f"){if(window.Android&&Android.saveFile)Android.saveFile(m.file.n,d);else{var a=document.createElement("a");a.href=d;a.download=m.file.n;document.body.appendChild(a);a.click();a.remove()}}renderMsgs(1)};
  if(MC[m.mid])return done(MC[m.mid]);
  if(!quiet)toast("Загрузка…");db.ref("media/"+m.mid).once("value").then(function(s){var d=s.val();if(!d)return quiet||toast("Файл недоступен");done(d)}).catch(dberr)}
function circRec(){
  if(!navigator.mediaDevices||!window.MediaRecorder)return toast("Запись не поддерживается");
  navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:320,height:320},audio:true}).then(function(st){
    var o=document.createElement("div");o.style.cssText="position:absolute;left:0;top:0;right:0;bottom:0;z-index:95;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;color:#fff";
    o.innerHTML='<video muted playsinline autoplay style="width:260px;height:260px;border-radius:50%;object-fit:cover;transform:scaleX(-1)"></video><div id="ct">0:00</div><div style="display:flex;gap:16px"><button class="tb" style="color:#fff" id="cc">Отмена</button><button class="tb f" id="cs">Отправить</button></div>';
    $("#app").appendChild(o);o.querySelector("video").srcObject=st;
    var ch=[],mr=new MediaRecorder(st,{videoBitsPerSecond:500000}),n=0,send=false,iv;
    mr.ondataavailable=function(e){if(e.data.size)ch.push(e.data)};
    mr.onstop=function(){clearInterval(iv);st.getTracks().forEach(function(t){t.stop()});o.remove();if(send&&n>0)sendBlob(new Blob(ch,{type:mr.mimeType||"video/webm"}),"circle.webm","c")};
    mr.start();iv=setInterval(function(){n++;o.querySelector("#ct").textContent=Math.floor(n/60)+":"+pad(n%60);if(n>=30){send=true;mr.stop()}},1000);
    o.querySelector("#cc").onclick=function(){send=false;mr.stop()};o.querySelector("#cs").onclick=function(){send=true;mr.stop()}
  }).catch(function(){toast("Нет доступа к камере")})}
/* стикеры */
var STK="🐱 🐶 🦊 🐼 🐵 🦁 🐸 🐧 🦄 🐙 🍕 🍔 🍩 🎂 ❤️ 🔥 😂 😎 🥳 😭 😡 🤯 👍 🙏".split(" ");
function stickerSheet(){sheet('<div style="display:grid;grid-template-columns:repeat(6,1fr);max-height:50vh;overflow-y:auto">'+STK.map(function(e){return '<button style="font-size:36px;height:60px" onclick="closeAll();pushMsg({sticker:\''+e+'\'})">'+e+'</button>'}).join("")+'</div>')}
/* блокировка и жалобы */
function blockedBy(c){return !!(c&&c.u&&c.u.blocked&&c.u.blocked[ME.uid])}
function iBlock(c){return !!(S.me&&S.me.blocked&&S.me.blocked[c.peer])}
function blockLbl(){var c=chat(S.open);return c&&iBlock(c)?"Разблокировать":"Заблокировать"}
function toggleBlock(){var c=chat(S.open),b=iBlock(c);db.ref("users/"+ME.uid+"/blocked/"+c.peer).set(b?null:true).then(function(){S.me.blocked=S.me.blocked||{};if(b)delete S.me.blocked[c.peer];else S.me.blocked[c.peer]=true;renderMsgs(1);toast(b?"Разблокирован":"Заблокирован")}).catch(dberr)}
function reportDlg(){var c=chat(S.open);dialog.ph="Причина";dialog("Пожаловаться","Опишите причину жалобы","","Отправить",function(v){db.ref("reports").push({from:ME.uid,peer:c.peer,cid:c.id,reason:v,t:TS}).then(function(){toast("Жалоба отправлена")}).catch(dberr)})}

/* boot */
applyTheme();applyLang();
if(typeof firebase==="undefined"){showLogin("load");$("#login p").textContent="Не удалось загрузить Firebase SDK. Проверьте интернет."}
else{
  firebase.initializeApp(firebaseConfig);
  auth=firebase.auth();db=firebase.database();TS=firebase.database.ServerValue.TIMESTAMP;auth.languageCode=S.lang;
  showLogin("load");
  auth.onAuthStateChanged(function(u){
    if(!u){ME=null;showLogin("auth");return}
    showLogin("load");
    db.ref("users/"+u.uid).once("value").then(function(sn){
      var p=sn.val();
      if(!p){ME={uid:u.uid,email:u.email};showLogin("name");return}
      startApp(u,p);
    }).catch(function(e){showLogin("auth");aerr(e)});
  });
}
</script>
