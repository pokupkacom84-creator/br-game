<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fef7ff">
<title>Чаты</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fef7ff;--surf:#f7f2fa;--surf2:#f3edf7;--surf3:#ece6f0;--surf4:#e6e0e9;
  --on:#1d1b20;--onv:#49454f;--out:#cac4d0;
  --p:#6750a4;--onp:#fff;--pc:#eaddff;--onpc:#21005d;
  --sc:#e8def8;--onsc:#1d192b;--tc:#ffd8e4;--ontc:#31111d;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141218;--surf:#1d1b20;--surf2:#211f26;--surf3:#2b2930;--surf4:#36343b;
  --on:#e6e0e9;--onv:#cac4d0;--out:#49454f;
  --p:#d0bcff;--onp:#381e72;--pc:#4f378b;--onpc:#eaddff;
  --sc:#4a4458;--onsc:#e8def8;--tc:#633b48;--ontc:#ffd8e4}}
:root[data-theme="dark"]{
  --bg:#141218;--surf:#1d1b20;--surf2:#211f26;--surf3:#2b2930;--surf4:#36343b;
  --on:#e6e0e9;--onv:#cac4d0;--out:#49454f;
  --p:#d0bcff;--onp:#381e72;--pc:#4f378b;--onpc:#eaddff;
  --sc:#4a4458;--onsc:#e8def8;--tc:#633b48;--ontc:#ffd8e4}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--on);
  font-family:"Roboto Flex",Roboto,system-ui,sans-serif;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:24px;height:24px;fill:currentColor;flex:none}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;background:var(--bg)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);
  transition:transform .45s cubic-bezier(.2,0,0,1),opacity .3s}
#chat{transform:translateX(100%);z-index:5;padding-top:var(--safe-t)}
#chat.open{transform:none}
#list{padding-top:var(--safe-t)}
#list.back{transform:translateX(-20%);opacity:.6}
.press{transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .2s}
.press:active{transform:scale(.93)}

/* top */
.top{padding:12px 16px 4px}
.title{font-size:32px;font-weight:700;letter-spacing:-.5px;padding:8px 8px 12px;display:flex;justify-content:space-between;align-items:center}
.icon-btn{width:48px;height:48px;border-radius:24px;display:grid;place-items:center}
.icon-btn:active{background:var(--surf4)}
.search{height:56px;border-radius:28px;background:var(--surf3);display:flex;align-items:center;gap:12px;padding:0 20px;color:var(--onv)}
.search input{flex:1;border:0;background:none;outline:0;font:inherit;font-size:16px;color:var(--on);user-select:text;min-width:0}
.chips{display:flex;gap:8px;padding:12px 16px 8px;overflow-x:auto;scrollbar-width:none}
.chip{height:36px;padding:0 18px;border-radius:12px;border:1px solid var(--out);font-size:14px;font-weight:500;white-space:nowrap;transition:all .3s cubic-bezier(.2,0,0,1)}
.chip.on{background:var(--sc);color:var(--onsc);border-color:transparent;border-radius:18px}

/* list */
.rows{flex:1;overflow-y:auto;padding:4px 8px 120px}
.row{display:flex;gap:14px;align-items:center;padding:12px 12px;border-radius:28px;width:100%;text-align:left}
.row:active{background:var(--surf3)}
.av{width:56px;height:56px;display:grid;place-items:center;font-weight:700;font-size:22px;flex:none;color:#fff;
  clip-path:circle(50%)}
.av.sq{border-radius:20px;clip-path:none}
.mid{flex:1;min-width:0}
.nm{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ls{font-size:14px;color:var(--onv);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12px;color:var(--onv)}
.badge{min-width:24px;height:24px;padding:0 8px;border-radius:12px;background:var(--p);color:var(--onp);font-size:12px;font-weight:700;display:grid;place-items:center}
.empty{padding:60px 24px;text-align:center;color:var(--onv)}

/* fab */
.fab{position:absolute;right:20px;bottom:calc(96px + var(--safe-b));height:64px;padding:0 24px 0 20px;border-radius:22px;
  background:var(--pc);color:var(--onpc);display:flex;align-items:center;gap:12px;font-weight:600;font-size:16px;
  box-shadow:0 4px 14px rgba(0,0,0,.18)}
.fab svg{width:28px;height:28px}

/* nav */
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--surf2);padding:12px 8px calc(16px + var(--safe-b))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--onv);position:relative}
.nav .pill{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;transition:all .35s cubic-bezier(.3,1.4,.5,1)}
.nav button.on{color:var(--on);font-weight:700}
.nav button.on .pill{background:var(--sc);width:72px}
.nav .dot{position:absolute;top:-2px;left:calc(50% + 10px);min-width:18px;height:18px;border-radius:9px;background:#ba1a1a;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* chat */
.chead{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 4px;background:var(--surf2);border-radius:0 0 28px 28px}
.chead .av{width:44px;height:44px;font-size:18px}
.chead .nm{font-size:18px}
.chead .ls{font-size:13px;margin:0}
.msgs{flex:1;overflow-y:auto;padding:16px 12px 8px;display:flex;flex-direction:column;gap:3px}
.day{align-self:center;background:var(--surf3);color:var(--onv);font-size:12px;font-weight:500;padding:6px 14px;border-radius:12px;margin:6px 0 10px}
.b{max-width:80%;padding:10px 14px 8px;font-size:16px;line-height:1.35;user-select:text;-webkit-user-select:text;
  animation:pop .4s cubic-bezier(.3,1.5,.5,1) both;word-break:break-word}
.b.in{align-self:flex-start;background:var(--surf4);border-radius:22px 22px 22px 6px;transform-origin:left bottom}
.b.out{align-self:flex-end;background:var(--pc);color:var(--onpc);border-radius:22px 22px 6px 22px;transform-origin:right bottom}
.b .t{font-size:11px;opacity:.7;float:right;margin:6px 0 0 12px;display:flex;gap:3px;align-items:center}
.b .t svg{width:14px;height:14px}
.who{font-size:13px;font-weight:700;color:var(--p);margin-bottom:2px}
.typing{align-self:flex-start;background:var(--surf4);border-radius:22px 22px 22px 6px;padding:14px 16px;display:flex;gap:5px}
.typing i{width:8px;height:8px;border-radius:4px;background:var(--onv);animation:bounce 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:none}30%{transform:translateY(-6px)}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.bar{display:flex;gap:8px;align-items:flex-end;padding:8px 12px calc(12px + var(--safe-b))}
.field{flex:1;min-height:56px;border-radius:28px;background:var(--surf3);display:flex;align-items:center;padding:0 8px 0 18px;gap:6px;color:var(--onv)}
.field textarea{flex:1;border:0;background:none;outline:0;font:inherit;font-size:16px;color:var(--on);resize:none;height:24px;max-height:96px;user-select:text;padding:0}
.send{width:56px;height:56px;background:var(--p);color:var(--onp);display:grid;place-items:center;
  border-radius:28px;transition:border-radius .4s cubic-bezier(.3,1.5,.5,1),transform .2s}
.send.has{border-radius:18px}
.send:active{transform:scale(.9)}
.send .ic-send{display:none}.send.has .ic-send{display:block}.send.has .ic-mic{display:none}
.toast{position:absolute;left:16px;right:16px;bottom:calc(100px + var(--safe-b));background:var(--on);color:var(--bg);padding:14px 20px;border-radius:16px;font-size:14px;opacity:0;transform:translateY(20px);transition:all .3s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:none}
.nav{z-index:3}.msgs{touch-action:manipulation}.b{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pin{width:14px;height:14px}
.rx{display:inline-block;clear:both;margin-top:4px;padding:2px 8px;border-radius:12px;background:var(--surf);font-size:14px;animation:pop .35s cubic-bezier(.3,1.8,.5,1) both}
.picker{position:absolute;z-index:30;display:flex;gap:2px;padding:6px;border-radius:30px;background:var(--surf4);box-shadow:0 6px 20px rgba(0,0,0,.25);animation:pop .3s cubic-bezier(.3,1.5,.5,1) both}
.picker button{width:44px;height:44px;border-radius:22px;font-size:24px;transition:transform .15s}.picker button:active{transform:scale(1.35)}
.vm{display:flex;align-items:center;gap:10px;min-width:190px}
.play{width:40px;height:40px;border-radius:20px;background:var(--p);color:var(--onp);display:grid;place-items:center}
.wave{display:flex;gap:2px;align-items:center;height:28px;flex:1}.wave i{width:3px;border-radius:2px;background:currentColor;opacity:.35;transition:opacity .2s}.wave i.f{opacity:1}
.recbar{display:none;flex:1;align-items:center;gap:10px;font-weight:600;color:var(--on)}
.rd{width:10px;height:10px;border-radius:5px;background:#ba1a1a;animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}
.rcx{margin-left:auto;padding:8px 14px;border-radius:16px;color:var(--p);font-weight:600}
.prof{position:absolute;inset:0;z-index:2;background:var(--bg);padding:calc(var(--safe-t) + 24px) 20px 120px;overflow-y:auto;opacity:0;transform:translateY(24px);pointer-events:none;transition:all .35s cubic-bezier(.2,0,0,1)}
.prof.show{opacity:1;transform:none;pointer-events:auto}
.pav{width:112px;height:112px;margin:8px auto 16px;background:var(--tc);color:var(--ontc);display:grid;place-items:center;font-size:48px;font-weight:900;border-radius:36px;animation:morph 6s ease-in-out infinite}
@keyframes morph{50%{border-radius:50%}}
.pn{text-align:center;font-size:28px;font-weight:700}.pu{text-align:center;color:var(--onv);margin:4px 0 20px}
.pst{display:flex;gap:8px;margin-bottom:20px}.pst div{flex:1;background:var(--surf3);border-radius:20px;padding:14px;text-align:center;font-size:13px;color:var(--onv)}.pst div:nth-child(2){border-radius:28px;background:var(--sc)}.pst b{display:block;font-size:24px;color:var(--on)}
.set{width:100%;display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-radius:20px;background:var(--surf2);margin-bottom:4px;font-size:16px;font-weight:500;text-align:left}
.sw{width:52px;height:32px;border-radius:16px;border:2px solid var(--out);background:var(--surf3);position:relative;transition:all .3s}
.sw i{position:absolute;top:6px;left:6px;width:16px;height:16px;border-radius:8px;background:var(--out);transition:all .3s cubic-bezier(.3,1.5,.5,1)}
.sw.on{background:var(--p);border-color:var(--p)}.sw.on i{left:22px;top:2px;width:24px;height:24px;border-radius:12px;background:var(--onp)}
.auth{position:absolute;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(var(--safe-t) + 24px) 24px 24px;overflow-y:auto}
.auth[hidden],.tf[hidden],.pick[hidden]{display:none}
.card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px}
.card h1{font-size:32px;font-weight:700;margin-bottom:4px}
.logo{width:72px;height:72px;border-radius:24px;background:var(--pc);display:grid;place-items:center;font-size:36px;animation:morph 6s ease-in-out infinite}
.tf{height:56px;border-radius:16px 16px 4px 4px;background:var(--surf3);display:flex;align-items:center;gap:6px;padding:0 18px;color:var(--onv);border-bottom:2px solid var(--out)}
.tf:focus-within{border-color:var(--p)}
.tf input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--on);user-select:text}
.btn{height:56px;border-radius:28px;background:var(--p);color:var(--onp);font-weight:700;font-size:16px}
.txt{height:44px;color:var(--p);font-weight:600}
.err{color:#ba1a1a;font-size:14px;min-height:18px}
.pick{align-self:center;width:96px;height:96px;border-radius:32px;background:var(--sc) center/cover;color:var(--onsc);font-size:13px;font-weight:600}
.mav{display:inline-block;width:20px;height:20px;border-radius:10px;background-size:cover;background-position:center;margin-right:6px;vertical-align:middle}
.who small{opacity:.7;font-weight:500}
.pav{background-size:cover;background-position:center;cursor:pointer}
.set small{display:block;font-size:13px;color:var(--onv);font-weight:400;margin-top:2px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chead .mid{cursor:pointer}
.rq{border-left:3px solid var(--p);padding:2px 8px;margin-bottom:6px;font-size:13px;border-radius:4px;background:rgba(127,127,127,.14);max-height:3.4em;overflow:hidden}.rq b{display:block}
.picker{flex-wrap:wrap;max-width:300px}.picker .acts{display:flex;width:100%;gap:2px;border-top:1px solid var(--out);margin-top:4px;padding-top:4px}
.picker .acts button{flex:1;width:auto;height:auto;font-size:13px;font-weight:600;padding:9px 4px;border-radius:14px}
.rbar{display:flex;align-items:center;gap:8px;margin:0 12px;padding:8px 8px 8px 12px;border-left:3px solid var(--p);background:var(--surf3);border-radius:12px;font-size:13px}
.rbar[hidden]{display:none}.rbar>div{flex:1;min-width:0}.rbar b{display:block;color:var(--p)}
.rbar span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--onv)}.rbar button{width:32px;height:32px;border-radius:16px}
.b a{color:inherit;text-decoration:underline}
.auth.call{z-index:60}.cbtns{display:flex;gap:28px;margin-top:48px}
.cb{width:72px;height:72px;border-radius:50%;font-size:30px;display:grid;place-items:center;background:var(--surf4);color:var(--on)}
.cb[hidden]{display:none}.cb.ok{background:#2e7d32;color:#fff}.cb.end{background:#ba1a1a;color:#fff}.cb.muted{background:var(--p)}
</style>
</head>
<body>
<div id="app">
  <section class="screen" id="list">
    <div class="top">
      <div class="title"><span id="ttl">Чаты</span>
        <button class="icon-btn press" id="themeBtn" aria-label="Тема"><svg viewBox="0 -960 960 960"><path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.500 1t26.500 3q-41 29-65.500 75.500T444-660q0 90 63 153t153 63q55 0 101-24.500t75-65.500q2 13 3 26.500t1 27.500q0 150-105 255T480-120Z"/></svg></button>
      </div>
      <label class="search"><svg viewBox="0 -960 960 960"><path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.500-75.500T120-580q0-109 75.500-184.500T380-840q109 0 184.500 75.500T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.500-52.500T560-580q0-75-52.500-127.500T380-760q-75 0-127.500 52.500T200-580q0 75 52.500 127.500T380-400Z"/></svg><input id="q" placeholder="Поиск по чатам"></label>
    </div>
    <div class="chips" id="chips"></div>
    <div class="rows" id="rows"></div>
    <button class="fab press" id="fab"><svg viewBox="0 -960 960 960"><path d="M200-200h57l391-391-57-57-391 391v57Zm-80 80v-170l528-527q12-11 26.500-17t30.500-6q16 0 31 6t26 18l55 56q12 11 17.500 26t5.500 30q0 16-5.500 30.500T817-647L290-120H120Zm640-584-56-56 56 56Zm-141 85-28-29 57 57-29-28Z"/></svg>Написать</button>
    <div class="prof" id="prof"><div class="pav" id="pav">Я</div><div class="pn" id="pn">Вы</div><div class="pu" id="pu">@you</div>
<div class="pst"><div><b id="s1"></b>чатов</div><div><b id="s2"></b>групп</div><div><b id="s3"></b>закреплено</div></div>
<button class="set press" id="rAbout"><span>О себе<small id="pab"></small></span><span>✎</span></button>
<button class="set press" id="rUn"><span>Ник и @username</span><span>✎</span></button>
<button class="set press" id="rAcc"><span>Почта и аккаунт<small id="pem"></small></span><span>›</span></button>
<button class="set press" id="swT"><span>Тёмная тема</span><span class="sw" id="sw"><i></i></span></button>
<button class="set press"><span>Уведомления</span><span class="sw on"><i></i></span></button>
<button class="set press"><span>Звуки сообщений</span><span class="sw"><i></i></span></button>
<button class="set press" id="logout"><span>Выйти из аккаунта</span><span>↪</span></button></div>
<nav class="nav" id="nav"></nav>
  </section>

  <section class="screen" id="chat">
    <div class="chead">
      <button class="icon-btn press" id="back" aria-label="Назад"><svg viewBox="0 -960 960 960"><path d="m313-440 224 224-57 56-320-320 320-320 57 56-224 224h487v80H313Z"/></svg></button>
      <div class="av" id="cav"></div>
      <div class="mid"><div class="nm" id="cnm"></div><div class="ls" id="cst"></div></div>
      <button class="icon-btn press" id="callBtn" aria-label="Звонок"><svg viewBox="0 -960 960 960"><path d="M798-120q-125 0-247-54.500T329-329Q229-429 174.500-551T120-798q0-18 12-30t30-12h162q14 0 25 9.500t13 22.500l26 140q2 16-1 27t-11 19l-97 98q20 37 47.500 71.500T387-386q31 31 65 57.500t72 48.500l94-94q9-9 23.500-13.500T670-390l138 28q14 4 23 14.500t9 23.500v162q0 18-12 30t-30 12Z"/></svg></button>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="rbar" id="rbar" hidden><div><b id="rbn"></b><span id="rbt"></span></div><button id="rbx" aria-label="Отмена">✕</button></div>
<div class="bar">
      <div class="field"><textarea id="inp" rows="1" placeholder="Сообщение"></textarea><div class="recbar" id="rec"><i class="rd"></i><span id="rt">0:00</span><button class="rcx" id="rc">Отмена</button></div></div>
      <button class="send" id="send" aria-label="Отправить">
        <svg class="ic-mic" viewBox="0 -960 960 960"><path d="M480-400q-50 0-85-35t-35-85v-240q0-50 35-85t85-35q50 0 85 35t35 85v240q0 50-35 85t-85 35Zm-40 280v-123q-104-14-172-93t-68-184h80q0 83 58.500 141.500T480-320q83 0 141.500-58.500T680-520h80q0 105-68 184t-172 93v123h-80Z"/></svg>
        <svg class="ic-send" viewBox="0 -960 960 960"><path d="M120-160v-640l760 320-760 320Zm80-120 474-200-474-200v140l240 60-240 60v140Z"/></svg>
      </button>
    </div>
  </section>
  <div class="auth" id="auth" hidden><div class="card">
<div class="logo">💬</div><h1 id="ah">Вход</h1>
<button class="pick" id="apick" hidden>+ фото</button><input type="file" id="afile" accept="image/*" hidden>
<label class="tf" id="fn" hidden><input id="aname" placeholder="Ник (имя)" maxlength="24"></label>
<label class="tf" id="fu" hidden><span>@</span><input id="aun" placeholder="username" maxlength="20" autocapitalize="none" autocomplete="off"></label>
<label class="tf"><input id="aem" type="email" placeholder="Почта" autocomplete="email"></label>
<label class="tf"><input id="apw" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password"></label>
<div class="err" id="aerr"></div>
<button class="btn press" id="ago">Войти</button>
<button class="txt" id="asw">Нет аккаунта? Регистрация</button></div></div>
<div class="auth" id="dlg" hidden><div class="card"><h1>Новый чат</h1>
<label class="tf"><span>@</span><input id="dun" placeholder="username собеседника" autocapitalize="none" autocomplete="off"></label>
<div class="err" id="derr"></div>
<button class="btn press" id="dgo">Найти и написать</button><button class="txt" id="dcx">Отмена</button></div></div>
<div class="auth" id="edit" hidden><div class="card"><h1>Профиль</h1>
<label class="tf"><input id="ename" placeholder="Ник" maxlength="24"></label>
<label class="tf"><span>@</span><input id="eun" placeholder="username" maxlength="20" autocapitalize="none" autocomplete="off"></label>

  $('#chat').classList.add('open');$('#list').classList.add('back');

function send(){
  const v=$('#inp').value.trim();
  if(rec){stopRec(1);return}if(!v){startRec();return}
  $('#inp').value='';sync();if(window.fb){fb.send(cur.id,v);return}add(['out',v.replace(/</g,'&lt;'),now()]);

  setTimeout(()=>{if(cur!==c)return;$('#msgs').insertAdjacentHTML('beforeend','<div class="typing" id="ty"><i></i><i></i><i></i></div>');$('#msgs').scrollTop=1e6},500);
  setTimeout(()=>{const t=$('#ty');if(t)t.remove();if(cur===c)add(['in',replies[Math.random()*replies.length|0],now(),c.g?'Макс':undefined])},1900);

const PIN='<svg class="pin" viewBox="0 -960 960 960"><path d="m640-480 80 80v80H520v240l-40 40-40-40v-240H240v-80l80-80v-280h-40v-80h400v80h-40v280Z"/></svg>';
let lpT,lpF=0,rec=null;

['pointerup','pointercancel','pointerleave'].forEach(t=>root.addEventListener(t,()=>clearTimeout(lpT)));
root.addEventListener('contextmenu',e=>e.preventDefault())}
const fmt=s=>(s/60|0)+':'+String(s%60).padStart(2,'0');
function voice(m){let h='';for(let k=0;k<26;k++)h+=`<i style="height:${6+Math.abs(Math.sin(k*1.7+m.v))*20|0}px"></i>`;

function playV(btn){clearInterval(btn._t);const w=btn.nextElementSibling.children;[...w].forEach(b=>b.classList.remove('f'));let k=0;btn._t=setInterval(()=>{if(k>=w.length){clearInterval(btn._t);return}w[k++].classList.add('f')},120)}
function startRec(){rec={s:0,t:setInterval(()=>{rec.s++;$('#rt').textContent=fmt(rec.s)},1000)};$('#rt').textContent='0:00';$('#rec').style.display='flex';$('#inp').style.display='none';$('#send').classList.add('has')}

if(ok){window.fb?fb.send(c.id,'',Math.max(s,1)):add(Object.assign(['out','',now()],{v:Math.max(s,1)}));setTimeout(()=>{if(cur===c&&!window.fb)add(['in','Послушал 🎧 Отвечу чуть позже',now(),c.g?'Макс':undefined])},1800)}}
let replyTo=null;
function setReply(m){if(m.del)return;const t=String(m.v?'🎤 Голосовое сообщение':(m.raw||m[1])).slice(0,80);
replyTo={k:m.k,n:(m[3]||'').replace(/<[^>]+>/g,'')||(m[0]==='out'?'Вы':cur.n),t};
$('#rbn').textContent=replyTo.n;$('#rbt').textContent=t;$('#rbar').hidden=false;$('#inp').focus()}
function clearReply(){replyTo=null;$('#rbar').hidden=true}
function hidePicker(){const p=$('#pk');if(p)p.remove()}
function showPicker(bEl){hidePicker();const r=bEl.getBoundingClientRect(),a=$('#app').getBoundingClientRect(),p=document.createElement('div');p.className='picker';p.id='pk';
p.innerHTML=['❤️','👍','😂','🔥','😮','😢'].map(e=>`<button>${e}</button>`).join('')+`<div class="acts"><button data-a="r">↩ Ответить</button><button data-a="c">Копировать</button>${bEl.classList.contains('out')?'<button data-a="d">Удалить</button>':''}</div>`;
p.style.top=Math.max(80,r.top-a.top-112)+'px';p.style[bEl.classList.contains('out')?'right':'left']='12px';
p.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;const m=cur.m[+bEl.dataset.i],a=b.dataset.a;hidePicker();
if(a==='r'){setReply(m);return}
if(a==='c'){navigator.clipboard&&navigator.clipboard.writeText(m.raw||m[1].replace(/&lt;/g,'<'));toast('Скопировано');return}
if(a==='d'){window.fb&&m.k&&fb.del(m);return}
if(window.fb&&m.k){fb.react(m,b.textContent);return}
m.r=m.r===b.textContent?undefined:b.textContent;bEl.outerHTML=bubble(m,cur)};
$('#app').appendChild(p)}
const isDark=()=>getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()==='#141218';
function syncSw(){$('#sw').classList.toggle('on',isDark())}
function sync(){const i=$('#inp');i.style.height='24px';i.style.height=Math.min(i.scrollHeight,96)+'px';$('#send').classList.toggle('has',!!i.value.trim()||!!rec)}

$('#rows').onclick=e=>{const r=e.target.closest('.row');if(r&&!lpF)openChat(r.dataset.id)};
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(b){filter=b.dataset.k;renderChips();renderList()}};
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;const nt=+b.dataset.t;if(nt===1||nt===2){toast('Раздел «'+b.textContent.replace(/\d+$/,'')+'» в разработке');return}tab=nt;renderNav();
  $('#prof').classList.toggle('show',tab===3);$('#fab').style.display=tab===0?'':'none';};
$('#q').oninput=renderList;
$('#back').onclick=closeChat;
$('#send').onclick=send;
$('#inp').oninput=sync;
$('#fab').onclick=()=>window.fb?fb.dlg():toast('Войдите в аккаунт');
$('#themeBtn').onclick=()=>{const d=document.documentElement,dark=getComputedStyle(d).getPropertyValue('--bg').trim()==='#141218';
  d.dataset.theme=dark?'light':'dark';syncSw()};
renderChips();renderList();syncSw();
lp($('#rows'),'.row',el=>{const c=chats.find(c=>c.id==el.dataset.id);c.pin=!c.pin;toast(c.pin?'Чат закреплён':'Чат откреплён');renderList()});
lp($('#msgs'),'.b',showPicker);
$('#msgs').onclick=e=>{if(lpF)return;const p=e.target.closest('.play');if(p)playV(p)};
$('#msgs').ondblclick=e=>{const b=e.target.closest('.b');if(!b)return;const m=cur.m[+b.dataset.i];if(window.fb&&m.k){fb.react(m,'❤️');return}m.r=m.r==='❤️'?undefined:'❤️';b.outerHTML=bubble(m,cur)};
$('#rc').onclick=()=>rec&&stopRec(0);
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#pk'))hidePicker()});
$('#prof').onclick=e=>{const b=e.target.closest('.set');if(!b)return;if(b.id==='swT')$('#themeBtn').click();else{const s=b.querySelector('.sw');if(s)s.classList.toggle('on')}};
</script>
<script type="module">

let me=null,uid=null,reg=false,avData=null,picking='reg',offs=[],seen=new Set(),chain=Promise.resolve(),stopP=null,entered=false;

function setReg(v){reg=v;g('ah').textContent=v?'Регистрация':'Вход';g('ago').textContent=v?'Создать аккаунт':'Войти';g('asw').textContent=v?'Уже есть аккаунт? Войти':'Нет аккаунта? Регистрация';['fn','fu','apick'].forEach(i=>g(i).hidden=!v);g('aerr').textContent=''}

function paint(){g('pn').textContent=me.name;g('pu').textContent='@'+me.un;g('pab').textContent=me.about||'Расскажите о себе';g('pem').textContent=auth.currentUser?auth.currentUser.email:'';const p=g('pav');p.style.backgroundImage=me.av?`url(${me.av})`:'';p.textContent=me.av?'':me.name[0].toUpperCase()}

  if(!chats.some(c=>c.id==id))chats.unshift({id,peer:pid,n:p.name||'Пользователь',pun:p.un,av:okAv(p.av),c:[...pid].reduce((a,ch)=>a+ch.charCodeAt(0),0)%7,last:'@'+(p.un||''),tm:'',un:0,g:0,on:1,m:[]}),watch(chats[0]);

function watch(c){onChildAdded(query(ref(db,'chats/'+c.id+'/msgs'),limitToLast(1)),s=>{

  c.last=(mine?'Вы: ':'')+(d.v?'🎤 Голосовое сообщение':String(d.t).slice(0,60));c.tm=d.tm||'';c.ts=typeof d.ts==='number'?d.ts:Date.now();
  if(open||mine){localStorage.setItem('rd_'+c.id,s.key);c.un=0}
  else if(localStorage.getItem('rd_'+c.id)!==s.key){c.un=(c._w?c.un:0)+1}
  c._w=1;renderList()})}
let pc=null,stream=null,callId=null,peerId=null,offs2=[],timer=null,ringT=null,pend=[],ring=null,inCall=false,muted=false,icq=[],icOk=true;
const ICE={iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]};
function callUI(o){g('call').hidden=!o;if(!o)return;g('cn').textContent=o.name||'';g('cs').textContent=o.status;
  const a=okAv(o.av),e=g('cav2');e.style.backgroundImage=a?`url(${a})`:'';e.textContent=a?'':(o.name||'?')[0].toUpperCase();
  g('cok').hidden=!o.ring;g('cmute').hidden=!!o.ring;g('cmute').textContent='🎤';g('cmute').classList.remove('muted');muted=false}
async function pcInit(chat,ready){inCall=true;icOk=ready;icq=[];
  stream=await navigator.mediaDevices.getUserMedia({audio:true});
  pc=new RTCPeerConnection(ICE);stream.getTracks().forEach(t=>pc.addTrack(t,stream));
  pc.ontrack=e=>{g('ra').srcObject=e.streams[0];g('ra').play().catch(()=>{})};
  pc.onicecandidate=e=>{if(!e.candidate)return;const j=JSON.stringify(e.candidate);
    if(icOk)push(ref(db,'calls/'+chat+'/ice/'+uid),j);else icq.push(j)};
  pc.onconnectionstatechange=()=>{if(!pc)return;if(pc.connectionState==='connected')started();
    if(pc.connectionState==='failed'){toast('Не удалось соединиться');hang(false)}}}
function started(){if(timer)return;clearTimeout(ringT);const t0=Date.now();g('cs').textContent='0:00';
  timer=setInterval(()=>g('cs').textContent=fmt(Math.floor((Date.now()-t0)/1000)),1000)}
const flush=()=>{pend.forEach(c=>pc&&pc.addIceCandidate(c).catch(()=>{}));pend=[]};
function listenCall(chat,peer){offs2=[
  onChildAdded(ref(db,'calls/'+chat+'/ice/'+peer),s=>{const c=JSON.parse(s.val());if(pc&&pc.remoteDescription)pc.addIceCandidate(c).catch(()=>{});else pend.push(c)}),
  onValue(ref(db,'calls/'+chat),async s=>{const d=s.val();if(!d||!pc)return;
    if(d.answer&&uid===d.from&&!pc.currentRemoteDescription){await pc.setRemoteDescription(d.answer);flush()}
    if(d.state==='ended'||d.state==='declined'){toast(d.state==='declined'?'Вызов отклонён':'Звонок завершён');hang(true)}})]}
function cleanup(){offs2.forEach(f=>f());offs2=[];clearTimeout(ringT);clearInterval(timer);timer=null;
  if(pc){pc.close();pc=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  g('ra').srcObject=null;inCall=false;callId=peerId=null;pend=[];icq=[];callUI(false)}
function hang(remote){const chat=callId,peer=peerId;
  if(!remote&&chat){update(ref(db,'calls/'+chat),{state:'ended'}).catch(()=>{});if(peer)set(ref(db,'incoming/'+peer),null).catch(()=>{})}
  cleanup()}
async function callOut(){if(inCall)return;if(!cur||!cur.peer)return toast('Звонки доступны в личных чатах');
  const chat=String(cur.id),peer=cur.peer;callId=chat;peerId=peer;
  try{await pcInit(chat,false);pend=[];const o=await pc.createOffer();await pc.setLocalDescription(o);
    await set(ref(db,'calls/'+chat),{from:uid,to:peer,state:'ringing',offer:{type:o.type,sdp:o.sdp},ts:Date.now()});
    icOk=true;icq.forEach(j=>push(ref(db,'calls/'+chat+'/ice/'+uid),j));icq=[];
    await set(ref(db,'incoming/'+peer),{chat,from:uid,name:me.name,ts:Date.now()});
    callUI({name:cur.n,av:cur.av,status:'Вызов…'});listenCall(chat,peer);
    ringT=setTimeout(()=>{if(!timer){toast('Нет ответа');hang(false)}},45000);
  }catch(e){toast(e.name==='NotAllowedError'?'Разрешите доступ к микрофону':'Ошибка звонка: '+(e.code||e.name||e));cleanup()}}
async function inc(s){const d=s.val();
  if(!d){if(ring&&!inCall){ring=null;callUI(false)}return}
  if(Date.now()-d.ts>60000){set(ref(db,'incoming/'+uid),null);return}
  if(inCall||ring){update(ref(db,'calls/'+d.chat),{state:'declined'}).catch(()=>{});set(ref(db,'incoming/'+uid),null);return}
  const p=await getP(d.from);ring={...d,name:p.name||d.name,av:okAv(p.av)};
  callUI({name:ring.name,av:ring.av,status:'Входящий звонок…',ring:true});navigator.vibrate&&navigator.vibrate([300,200,300,200,300])}
async function accept(){const d=ring;if(!d)return;ring=null;callId=d.chat;peerId=d.from;
  try{const c=(await get(ref(db,'calls/'+d.chat))).val();if(!c||c.state!=='ringing')throw 'Звонок уже завершён';
    await pcInit(d.chat,true);pend=[];listenCall(d.chat,d.from);
    await pc.setRemoteDescription(c.offer);flush();
    const a=await pc.createAnswer();await pc.setLocalDescription(a);
    await update(ref(db,'calls/'+d.chat),{answer:{type:a.type,sdp:a.sdp},state:'active'});
    set(ref(db,'incoming/'+uid),null);callUI({name:d.name,av:d.av,status:'Соединение…'});
  }catch(e){toast(typeof e==='string'?e:e.name==='NotAllowedError'?'Разрешите доступ к микрофону':'Ошибка звонка');
    update(ref(db,'calls/'+d.chat),{state:'ended'}).catch(()=>{});set(ref(db,'incoming/'+uid),null).catch(()=>{});cleanup()}}
function decline(){const d=ring;ring=null;if(d){update(ref(db,'calls/'+d.chat),{state:'declined'}).catch(()=>{});set(ref(db,'incoming/'+uid),null).catch(()=>{})}callUI(false)}
g('callBtn').onclick=()=>window.fb?callOut():toast('Войдите в аккаунт');
g('cok').onclick=accept;
g('cend').onclick=()=>ring?decline():hang(false);
g('cmute').onclick=()=>{muted=!muted;if(stream)stream.getAudioTracks().forEach(t=>t.enabled=!muted);g('cmute').classList.toggle('muted',muted);g('cmute').textContent=muted?'🔇':'🎤'};
const fb={
  send(id,text,v){const r=push(ref(db,'chats/'+id+'/msgs')),d={u:uid,n:me.name,un:me.un,t:text,tm:now(),v:v||null,ts:serverTimestamp()};
    if(replyTo){d.rp={n:replyTo.n.slice(0,24),t:replyTo.t.slice(0,80)};clearReply()}
    set(r,d).catch(e=>toast('Firebase: '+e.code))},
  sub(id){fb.unsub();seen=new Set();
    const mq=()=>query(ref(db,'chats/'+id+'/msgs'),limitToLast(50)),here=()=>cur&&String(cur.id)===String(id),
      idx=k=>here()?cur.m.findIndex(x=>x.k===k):-1,
      redraw=i=>{const el=document.querySelector('.b[data-i="'+i+'"]');if(el)el.outerHTML=bubble(cur.m[i],cur)};
    offs=[onChildAdded(mq(),s=>{if(seen.has(s.key))return;seen.add(s.key);localStorage.setItem('rd_'+id,s.key);const d=s.val();
        chain=chain.then(async()=>{if(!here())return;const m=await mk(d,s.key);if(here()&&!cur.m.some(x=>x.k===m.k))add(m)}).catch(()=>{})},e=>toast('Firebase: '+e.code)),
      onChildChanged(mq(),s=>{const i=idx(s.key);if(i<0)return;const m=cur.m[i];m.rs=s.val().r||{};m.r=rx(m.rs);redraw(i)}),
      onChildRemoved(mq(),s=>{const i=idx(s.key);if(i<0)return;cur.m[i].del=1;redraw(i)})]},
  react(m,e){set(ref(db,'chats/'+cur.id+'/msgs/'+m.k+'/r/'+uid),m.rs[uid]===e?null:e).catch(x=>toast('Firebase: '+x.code))},
  del(m){set(ref(db,'chats/'+cur.id+'/msgs/'+m.k),null).catch(x=>toast('Firebase: '+x.code))},
  unsub(){offs.forEach(f=>f());offs=[]},
  dlg(){g('dun').value='';g('derr').textContent='';g('dlg').hidden=false}
};
g('dcx').onclick=()=>g('dlg').hidden=true;
g('dgo').onclick=async()=>{try{
  const un=g('dun').value.trim().toLowerCase().replace(/^@/,'');
  const s=await get(ref(db,'usernames/'+un));if(!s.exists())throw 'Пользователь @'+un+' не найден';
  const pid=s.val();if(pid===uid)throw 'Это вы 🙂';
  const id='dm_'+[uid,pid].sort().join('_');
  await Promise.all([set(ref(db,'userChats/'+uid+'/'+id),pid),set(ref(db,'userChats/'+pid+'/'+id),uid)]);
  await addDM(id,pid);g('dlg').hidden=true;openChat(id)}catch(e){g('derr').textContent=errT(e)}};
g('logout').onclick=async()=>{await signOut(auth);location.reload()};
g('rAbout').onclick=g('rUn').onclick=()=>{g('ename').value=me.name;g('eun').value=me.un;g('eab').value=me.about;g('eerr').textContent='';g('edit').hidden=false};
g('ecx').onclick=()=>g('edit').hidden=true;
g('esv').onclick=async()=>{try{
  const name=g('ename').value.replace(/[<>&"']/g,'').trim(),un=g('eun').value.trim().toLowerCase().replace(/^@/,''),about=g('eab').value.replace(/[<>]/g,'').trim().slice(0,140);
  if(!name)throw 'Введите ник';
  if(!/^[a-z0-9_]{3,20}$/.test(un))throw '@username: 3–20 символов, латиница, цифры и _';
  const up={['users/'+uid+'/name']:name,['users/'+uid+'/un']:un,['users/'+uid+'/about']:about||null};
  if(un!==me.un){up['usernames/'+un]=uid;up['usernames/'+me.un]=null}
  await update(ref(db),up);g('edit').hidden=true;toast('Профиль обновлён');
}catch(e){g('eerr').textContent=e.code==='PERMISSION_DENIED'?'Этот @username занят или нет прав':errT(e)}};
g('rAcc').onclick=()=>{g('aem2').textContent=auth.currentUser.email;g('cpw').value='';g('nem').value='';g('cerr').textContent='';g('acc').hidden=false};
g('ccx').onclick=()=>g('acc').hidden=true;
const reauth=async()=>{const u=auth.currentUser;if(!g('cpw').value)throw 'Введите текущий пароль';
  await reauthenticateWithCredential(u,EmailAuthProvider.credential(u.email,g('cpw').value));return u};
g('cem').onclick=async()=>{g('cerr').style.color='';try{
  const ne=g('nem').value.trim();if(!ne)throw 'Введите новую почту';
  await verifyBeforeUpdateEmail(await reauth(),ne);
  g('cerr').style.color='var(--p)';g('cerr').textContent='Письмо отправлено на '+ne+'. Перейдите по ссылке в нём, и почта сменится.';
}catch(e){g('cerr').textContent=errT(e)}};
g('cdel').onclick=async()=>{g('cerr').style.color='';try{
  if(!confirm('Удалить аккаунт безвозвратно?'))return;
  const u=await reauth();
  await update(ref(db),{['users/'+uid]:null,['avatars/'+uid]:null,['usernames/'+me.un]:null,['userChats/'+uid]:null});
  await deleteUser(u);location.reload();
}catch(e){g('cerr').textContent=errT(e)}};
document.querySelector('.chead .mid').onclick=async()=>{if(!cur||!cur.peer)return;delete cache[cur.peer];const d=await getP(cur.peer),a=okAv(d.av);
  g('piav').style.backgroundImage=a?`url(${a})`:'';g('piav').textContent=a?'':(d.name||'?')[0].toUpperCase();
  g('pin').textContent=d.name||'';g('piu').textContent=d.un?'@'+d.un:'';g('pia').textContent=d.about||'О себе ничего не написано';g('pi').hidden=false};
g('pic').onclick=()=>g('pi').hidden=true;g('rbx').onclick=clearReply;
onAuthStateChanged(auth,u=>{
  if(stopP){stopP();stopP=null}
  if(!u){uid=null;me=null;window.fb=undefined;g('auth').hidden=false;return}
  uid=u.uid;
  let uv=null,av='';const upd=()=>{if(!uv)return;me={name:uv.name,un:uv.un,about:uv.about||'',av:okAv(av||uv.av)};paint();enter()};
  const a=onValue(ref(db,'users/'+uid),s=>{uv=s.exists()?s.val():null;upd()}),b=onValue(ref(db,'avatars/'+uid),s=>{av=s.val()||'';upd()});
  stopP=()=>{a();b()};
});
