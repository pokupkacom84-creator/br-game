<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BR 2D</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0f14;
    touch-action:none;user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;font-family:system-ui,sans-serif;color:#fff}
  canvas{position:absolute;inset:0;display:block}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:12px;padding:20px;
    background:radial-gradient(circle at 50% 30%,#1b2a3a,#0a0f14 70%);z-index:10}
  .hidden{display:none!important}
  h1{font-size:30px;letter-spacing:2px;color:#4cc9f0;text-shadow:0 0 20px #4cc9f055}
  .sub{color:#8aa;font-size:13px;margin-top:-6px}
  input{width:280px;padding:14px;border-radius:10px;border:1px solid #2a3b4d;
    background:#0f1922;color:#fff;font-size:16px;outline:none;text-align:center;letter-spacing:2px}
  input:focus{border-color:#4cc9f0}
  button{width:280px;padding:14px;border:none;border-radius:10px;font-size:15px;
    font-weight:700;letter-spacing:1px;background:#4cc9f0;color:#04202e;cursor:pointer}
  button:active{transform:scale(.97)}
  button.sec{background:#1b2a3a;color:#8ecae6;border:1px solid #2a3b4d}
  button:disabled{opacity:.4}
  .players-list{width:280px;max-height:180px;overflow-y:auto;
    background:#0f1922;border-radius:10px;padding:8px;font-size:14px}
  .players-list div{padding:6px 8px;border-bottom:1px solid #1b2a3a}
  .players-list div:last-child{border:none}
  .code{font-family:monospace;font-size:30px;letter-spacing:8px;color:#ffd166;
    padding:12px 24px;background:#0f1922;border-radius:10px;border:1px dashed #2a3b4d}
  .hint{font-size:12px;color:#667;text-align:center;max-width:280px}
  .err{color:#ef476f;font-size:13px;min-height:18px;text-align:center}
  .countdown{font-size:80px;color:#ffd166;font-weight:800;text-align:center;line-height:1}
  .conn-status{position:fixed;bottom:8px;right:10px;font-size:11px;color:#667;z-index:20}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="conn-status" id="connStatus">соединение…</div>

<!-- МЕНЮ -->
<div id="menu" class="screen">
  <h1>BR 2D ONLINE</h1>
  <div class="sub">Battle Royale на 10 игроков</div>
  <input id="nameInput" maxlength="12" placeholder="ТВОЙ НИК">
  <button id="btnCreate">СОЗДАТЬ КОМНАТУ</button>
  <button id="btnJoin" class="sec">ВОЙТИ ПО КОДУ</button>
  <input id="codeInput" maxlength="5" placeholder="КОД" class="hidden" style="text-transform:uppercase">
  <button id="btnJoinGo" class="hidden">ВОЙТИ</button>
  <div id="menuErr" class="err"></div>
</div>

<!-- ЛОББИ -->
<div id="lobby" class="screen hidden">
  <h1>ЛОББИ</h1>
  <div class="code" id="roomCode">-----</div>
  <div class="sub">Скинь код другу</div>
  <div class="players-list" id="playersList"></div>
  <div id="lobbyStatus" class="hint">Ожидание игроков…</div>
  <button id="btnStart" disabled>НАЧАТЬ МАТЧ</button>
  <button id="btnLeave" class="sec">ВЫЙТИ</button>
</div>

<!-- СЧЁТ ДО СТАРТА -->
<div id="countdown" class="screen hidden">
  <div class="countdown" id="cdNum">5</div>
  <div class="sub">Приготовься!</div>
</div>

<!-- КОНЕЦ -->
<div id="result" class="screen hidden">
  <h1 id="resultTitle">—</h1>
  <div id="resultStats" class="hint"></div>
  <button id="btnBack">В ЛОББИ</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
'use strict';

/* =========================
   КОНСТАНТЫ
   ========================= */
const WORLD = 3200;
const JOY_R = 80;
const PLAYER_SPEED = 200;
const INTERP_DELAY = 100;   // мс — буфер для интерполяции
const SEND_HZ = 20;
const SEND_MS = 1000/SEND_HZ;

const WEAPONS = {
  pistol:  {name:'PISTOL', dmg:12, rate:0.28, spread:0.06, speed:750, ammo:12, reload:1.1, color:'#ffd166', pellets:1},
  smg:     {name:'SMG',    dmg:9,  rate:0.09, spread:0.11, speed:820, ammo:30, reload:1.4, color:'#06d6a0', pellets:1},
  shotgun: {name:'SHOTGUN',dmg:8,  rate:0.85, spread:0.30, speed:650, ammo:6,  reload:1.8, color:'#ef476f', pellets:6},
  rifle:   {name:'RIFLE',  dmg:24, rate:0.50, spread:0.02, speed:1050,ammo:15, reload:1.6, color:'#4cc9f0', pellets:1}
};
const WKEYS = Object.keys(WEAPONS);
const rand = (a,b) => a + Math.random()*(b-a);

/* =========================
   СОСТОЯНИЕ
   ========================= */
const socket = io({ transports:['websocket'] });
let myId = null;
let myName = 'Player';
let roomState = 'menu';       // menu | lobby | countdown | playing | ended
let playersById = {};         // id -> { buffer, ... }
let player = null;            // локальный
let bullets = [];
let particles = [];
let killFeed = [];
let zone = { x: WORLD/2, y: WORLD/2, r: 1500 };
let cam = { x:0, y:0 };
let time = 0;
let countdownEnds = 0;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = Math.min(devicePixelRatio||1, 2);
function resize(){
  W = innerWidth; H = innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize', resize); resize();

const $ = id => document.getElementById(id);
const screens = ['menu','lobby','countdown','result'];
function showScreen(id){
  screens.forEach(s => $(s).classList.toggle('hidden', s !== id));
}

/* =========================
   UI
   ========================= */
$('btnCreate').onclick = () => {
  const n = ($('nameInput').value.trim() || 'Player'+Math.floor(Math.random()*999)).slice(0,12);
  myName = n;
  socket.emit('create-room', { name: n }, res => {
    if (res.error){ $('menuErr').textContent = res.error; return; }
    myId = res.you;
    $('roomCode').textContent = res.code;
    roomState = 'lobby';
    showScreen('lobby');
  });
};

$('btnJoin').onclick = () => {
  $('codeInput').classList.remove('hidden');
  $('btnJoinGo').classList.remove('hidden');
  $('btnJoin').classList.add('hidden');
  $('codeInput').focus();
};

$('btnJoinGo').onclick = () => {
  const n = ($('nameInput').value.trim() || 'Player'+Math.floor(Math.random()*999)).slice(0,12);
  const code = ($('codeInput').value.trim()).toUpperCase();
  if (code.length !== 5){ $('menuErr').textContent = 'Код из 5 символов'; return; }
  myName = n;
  socket.emit('join-room', { name: n, code }, res => {
    if (res.error){ $('menuErr').textContent = res.error; return; }
    myId = res.you;
    $('roomCode').textContent = res.code;
    roomState = 'lobby';
    showScreen('lobby');
  });
};

$('btnStart').onclick = () => socket.emit('start-match');
$('btnLeave').onclick = () => { socket.emit('leave'); location.reload(); };
$('btnBack').onclick = () => showScreen('lobby');

/* =========================
   СОКЕТ-СОБЫТИЯ
   ========================= */
socket.on('connect', () => {
  $('connStatus').textContent = 'онлайн';
  $('connStatus').style.color = '#06d6a0';
});
socket.on('disconnect', () => {
  $('connStatus').textContent = 'отключён';
  $('connStatus').style.color = '#ef476f';
});
socket.on('connect_error', () => {
  $('connStatus').textContent = 'нет связи';
  $('connStatus').style.color = '#ef476f';
});

socket.on('room-destroyed', () => {
  alert('Комната закрыта');
  location.reload();
});

socket.on('room', r => {
  // обновляем лобби-UI
  const wasState = roomState;
  roomState = r.state;

  if (r.state === 'lobby'){
    if (wasState !== 'lobby') showScreen('lobby');
    $('roomCode').textContent = r.code;
    $('btnStart').classList.toggle('hidden', r.hostId !== myId);
    $('btnStart').disabled = r.players.length < 2;
    $('lobbyStatus').textContent = r.players.length < 2
      ? 'Нужно минимум 2 игрока'
      : 'Игроков: ' + r.players.length;

    $('playersList').innerHTML = r.players.map(p =>
      `<div>${p.name}${p.id===myId?' <span style="color:#4cc9f0">(вы)</span>':''}${p.id===r.hostId?' 👑':''}</div>`
    ).join('');
  }

  if (r.state === 'countdown' && wasState !== 'countdown'){
    countdownEnds = r.countdownEnds;
    showScreen('countdown');
    startLocalGame(r);
  }

  if (r.state === 'playing' && wasState !== 'playing'){
    // скрыть все оверлеи
    screens.forEach(s => $(s).classList.add('hidden'));
    if (!player) startLocalGame(r);
  }

  if (r.state === 'ended'){
    // показать результат
    const me = r.players.find(p => p.id === myId);
    const isWinner = me && me.alive;
    $('resultTitle').textContent = isWinner ? 'ПОБЕДА' : 'ПОРАЖЕНИЕ';
    $('resultTitle').style.color = isWinner ? '#06d6a0' : '#ef476f';
    $('resultStats').textContent = me ? ('Убийств: ' + me.kills) : '';
    showScreen('result');
  }

  // обновление удалённых игроков
  const seen = new Set();
  const now = performance.now();
  r.players.forEach(p => {
    seen.add(p.id);
    if (p.id === myId) return;      // локального не трогаем
    if (!playersById[p.id]) playersById[p.id] = { buffer: [], hp: 100, alive: true, name: p.name, weapon: 'pistol', kills: 0, x: 0, y: 0, angle: 0 };
    const rp = playersById[p.id];
    rp.hp = p.hp;
    rp.name = p.name;
    rp.weapon = p.weapon;
    rp.kills = p.kills;
    rp.alive = p.alive;
    rp.buffer.push({ x: p.x, y: p.y, angle: p.angle, t: now });
    while (rp.buffer.length > 8) rp.buffer.shift();
  });
  // убираем отключившихся
  for (const id in playersById) if (!seen.has(id)) delete playersById[id];

  if (r.zone) zone = r.zone;
});

socket.on('shot', s => {
  const w = WEAPONS[s.weapon] || WEAPONS.pistol;
  const p = w.pellets || 1;
  for (let i=0;i<p;i++){
    const a = s.angle + rand(-w.spread, w.spread);
    bullets.push({
      x: s.x + Math.cos(s.angle)*22,
      y: s.y + Math.sin(s.angle)*22,
      vx: Math.cos(a)*w.speed, vy: Math.sin(a)*w.speed,
      dmg: w.dmg, owner: s.owner, life: 1.2, color: w.color
    });
  }
});

socket.on('kill', k => {
  const text = (k.killerName || 'ZONE') + ' → ' + (k.victimName || '?');
  killFeed.push({ text, t: 4 });
  if (killFeed.length > 4) killFeed.shift();
});

/* =========================
   ЛОКАЛЬНАЯ ИНИЦИАЛИЗАЦИЯ МАТЧА
   ========================= */
function startLocalGame(room){
  const me = room.players.find(p => p.id === myId);
  player = {
    x: me ? me.x : WORLD/2, y: me ? me.y : WORLD/2,
    r: 16, hp: me ? me.hp : 100, maxHp: 100, angle: 0,
    weapon: WEAPONS.pistol, weaponKey: 'pistol',
    ammo: WEAPONS.pistol.ammo, reloading: 0, fireCd: 0,
    kills: 0, alive: true, name: myName
  };
  bullets = []; particles = []; killFeed = [];
  playersById = {};

  if (window._sendInterval) clearInterval(window._sendInterval);
  window._sendInterval = setInterval(sendState, SEND_MS);
}

function sendState(){
  if (!player || !player.alive) return;
  socket.emit('state', {
    x: Math.round(player.x),
    y: Math.round(player.y),
    angle: +player.angle.toFixed(2)
  });
}

/* =========================
   ВВОД
   ========================= */
const joyL = { active:false, id:null, ox:0, oy:0, x:0, y:0 };
const joyR = { active:false, id:null, ox:0, oy:0, x:0, y:0 };
const keys = {};
const mouse = { x:0, y:0, down:false };

function touch(e, phase){
  e.preventDefault();
  if (roomState !== 'playing') return;
  for (const t of e.changedTouches){
    if (phase === 'start'){
      if (t.clientX < W/2 && joyL.id === null){
        joyL.id=t.identifier; joyL.ox=t.clientX; joyL.oy=t.clientY;
        joyL.x=t.clientX; joyL.y=t.clientY; joyL.active=true;
      } else if (t.clientX >= W/2 && joyR.id === null){
        joyR.id=t.identifier; joyR.ox=t.clientX; joyR.oy=t.clientY;
        joyR.x=t.clientX; joyR.y=t.clientY; joyR.active=true;
      }
    } else if (phase === 'move'){
      if (t.identifier === joyL.id){ joyL.x=t.clientX; joyL.y=t.clientY; }
      if (t.identifier === joyR.id){ joyR.x=t.clientX; joyR.y=t.clientY; }
    } else {
      if (t.identifier === joyL.id){ joyL.active=false; joyL.id=null; }
      if (t.identifier === joyR.id){ joyR.active=false; joyR.id=null; }
    }
  }
}
canvas.addEventListener('touchstart', e=>touch(e,'start'), {passive:false});
canvas.addEventListener('touchmove',  e=>touch(e,'move'),  {passive:false});
canvas.addEventListener('touchend',   e=>touch(e,'end'),   {passive:false});
canvas.addEventListener('touchcancel',e=>touch(e,'end'),   {passive:false});

addEventListener('keydown', e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',   e=>keys[e.key.toLowerCase()]=false);
canvas.addEventListener('mousemove', e=>{mouse.x=e.clientX; mouse.y=e.clientY;});
canvas.addEventListener('mousedown', ()=>mouse.down=true);
canvas.addEventListener('mouseup',   ()=>mouse.down=false);

/* =========================
   ОБНОВЛЕНИЕ
   ========================= */
function updateLocal(dt){
  if (!player || !player.alive) return;

  let dx=0, dy=0;
  if (joyL.active){
    const jx=joyL.x-joyL.ox, jy=joyL.y-joyL.oy;
    const d=Math.hypot(jx,jy);
    if (d>8){ const k=Math.min(1,d/JOY_R); dx=jx/d*k; dy=jy/d*k; }
  }
  if (keys['w']||keys['arrowup'])    dy-=1;
  if (keys['s']||keys['arrowdown'])  dy+=1;
  if (keys['a']||keys['arrowleft'])  dx-=1;
  if (keys['d']||keys['arrowright']) dx+=1;
  const m = Math.hypot(dx,dy);
  if (m>1){ dx/=m; dy/=m; }
  player.x += dx * PLAYER_SPEED * dt;
  player.y += dy * PLAYER_SPEED * dt;
  player.x = Math.max(player.r, Math.min(WORLD-player.r, player.x));
  player.y = Math.max(player.r, Math.min(WORLD-player.r, player.y));

  let wantFire = false;
  if (joyR.active){
    const jx=joyR.x-joyR.ox, jy=joyR.y-joyR.oy;
    const d=Math.hypot(jx,jy);
    if (d>15){ player.angle = Math.atan2(jy,jx); wantFire = true; }
  }
  if (mouse.down){
    const sx = player.x - cam.x, sy = player.y - cam.y;
    player.angle = Math.atan2(mouse.y-sy, mouse.x-sx);
    wantFire = true;
  }
  if (wantFire) fireLocal();

  if (player.fireCd > 0) player.fireCd -= dt;
  if (player.reloading > 0){
    player.reloading -= dt;
    if (player.reloading <= 0) player.ammo = player.weapon.ammo;
  }

  // урон от зоны (локально тоже)
  const zd = Math.hypot(player.x - zone.x, player.y - zone.y);
  if (zd > zone.r){
    player.hp -= 7 * dt;
    if (player.hp <= 0){ player.hp = 0; player.alive = false; }
  }
}

function fireLocal(){
  if (player.fireCd > 0 || player.reloading > 0) return;
  if (player.ammo <= 0){ player.reloading = player.weapon.reload; return; }
  const w = player.weapon;
  const p = w.pellets || 1;
  for (let i=0;i<p;i++){
    const a = player.angle + rand(-w.spread, w.spread);
    bullets.push({
      x: player.x + Math.cos(player.angle)*(player.r+6),
      y: player.y + Math.sin(player.angle)*(player.r+6),
      vx: Math.cos(a)*w.speed, vy: Math.sin(a)*w.speed,
      dmg: w.dmg, owner: myId, life: 1.2, color: w.color
    });
  }
  player.ammo--;
  player.fireCd = w.rate;

  socket.emit('shot', {
    x: player.x, y: player.y, angle: player.angle, weapon: player.weaponKey
  });

  for (let i=0;i<3;i++) particles.push({
    x: player.x + Math.cos(player.angle)*20,
    y: player.y + Math.sin(player.angle)*20,
    vx: Math.cos(player.angle)*rand(50,150)+rand(-40,40),
    vy: Math.sin(player.angle)*rand(50,150)+rand(-40,40),
    life:0.15, color: w.color
  });
}

function updateBullets(dt){
  for (let i=bullets.length-1;i>=0;i--){
    const b = bullets[i];
    b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
    if (b.life <= 0 || b.x < 0 || b.x > WORLD || b.y < 0 || b.y > WORLD){
      bullets.splice(i,1); continue;
    }
    let hit = false;

    // попадание в локального
    if (player && player.alive && b.owner !== myId &&
        Math.hypot(player.x-b.x, player.y-b.y) < player.r+4){
      // по локальному считает сам клиент, но урон подтвердит shooter через 'hit'
      // чтобы не было двойного урона — только визуал
      for (let k=0;k<4;k++) particles.push({
        x:b.x,y:b.y,vx:rand(-100,100),vy:rand(-100,100),life:.3,color:'#ffd166'
      });
      hit = true;
    }

    // попадание в удалённого
    if (!hit){
      for (const id in playersById){
        const rp = playersById[id];
        if (!rp.alive || b.owner === id) continue;
        // берём текущую интерполированную позицию
        const pos = getInterp(rp) || rp;
        if (Math.hypot(pos.x-b.x, pos.y-b.y) < 16+4){
          hit = true;
          for (let k=0;k<4;k++) particles.push({
            x:b.x,y:b.y,vx:rand(-100,100),vy:rand(-100,100),life:.3,color:'#ffd166'
          });
          // я (стрелявший) сообщаю серверу о попадании
          if (b.owner === myId){
            socket.emit('hit', { targetId: id, dmg: b.dmg });
          }
          break;
        }
      }
    }

    if (hit) bullets.splice(i,1);
  }
}

function updateParticles(dt){
  for (let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= 0.92; p.vy *= 0.92;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i,1);
  }
  for (let i=killFeed.length-1;i>=0;i--){
    killFeed[i].t -= dt;
    if (killFeed[i].t <= 0) killFeed.splice(i,1);
  }
}

/* =========================
   ИНТЕРПОЛЯЦИЯ
   ========================= */
function getInterp(rp){
  if (!rp.buffer.length) return null;
  const target = performance.now() - INTERP_DELAY;
  const buf = rp.buffer;
  // найти два сэмпла вокруг target
  let a = buf[0], b = buf[buf.length-1];
  for (let i=0;i<buf.length-1;i++){
    if (buf[i].t <= target && buf[i+1].t >= target){ a = buf[i]; b = buf[i+1]; break; }
  }
  const span = b.t - a.t;
  const k = span > 0 ? Math.max(0, Math.min(1, (target - a.t) / span)) : 1;
  return {
    x: a.x + (b.x - a.x) * k,
    y: a.y + (b.y - a.y) * k,
    angle: a.angle + (b.angle - a.angle) * k
  };
}

/* =========================
   КАМЕРА
   ========================= */
function updateCamera(){
  const focus = (player && player.alive) ? player : { x: zone.x, y: zone.y };
  cam.x = focus.x - W/2;
  cam.y = focus.y - H/2;
  cam.x = Math.max(0, Math.min(WORLD - W, cam.x));
  cam.y = Math.max(0, Math.min(WORLD - H, cam.y));
}

/* =========================
   РЕНДЕР
   ========================= */
function drawGrid(){
  const step = 100;
  const x0 = Math.floor(cam.x/step)*step;
  const y0 = Math.floor(cam.y/step)*step;
  ctx.strokeStyle = 'rgba(255,255,255,0.045)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x=x0; x<cam.x+W+step; x+=step){
    ctx.moveTo(x-cam.x, 0); ctx.lineTo(x-cam.x, H);
  }
  for (let y=y0; y<cam.y+H+step; y+=step){
    ctx.moveTo(0, y-cam.y); ctx.lineTo(W, y-cam.y);
  }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,80,80,0.5)';
  ctx.lineWidth = 4;
  ctx.strokeRect(-cam.x, -cam.y, WORLD, WORLD);
}

function drawZone(){
  const sx = zone.x - cam.x, sy = zone.y - cam.y;
  ctx.save();
  ctx.beginPath();
  ctx.rect(-100,-100,W+200,H+200);
  ctx.arc(sx, sy, zone.r, 0, Math.PI*2, true);
  ctx.fillStyle = 'rgba(120,20,30,0.28)';
  ctx.fill();
  ctx.restore();
  ctx.beginPath();
  ctx.arc(sx, sy, zone.r, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(255,80,120,0.85)';
  ctx.lineWidth = 3;
  ctx.stroke();
}

function drawEntity(x, y, angle, color, hp, maxHp, name, weaponColor){
  const sx = x - cam.x, sy = y - cam.y;
  if (sx < -60 || sx > W+60 || sy < -60 || sy > H+60) return;
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(angle);
  ctx.beginPath();
  ctx.arc(0,0,16,0,Math.PI*2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#0a0f14';
  ctx.stroke();
  ctx.fillStyle = '#111';
  ctx.fillRect(12,-3,20,6);
  ctx.fillStyle = weaponColor || '#ffd166';
  ctx.fillRect(26,-2,4,4);
  ctx.restore();

  if (hp < maxHp){
    const bw = 34;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(sx-bw/2, sy-29, bw, 5);
    const ratio = Math.max(0, hp/maxHp);
    ctx.fillStyle = ratio > 0.5 ? '#06d6a0' : ratio > 0.25 ? '#ffd166' : '#ef476f';
    ctx.fillRect(sx-bw/2, sy-29, bw*ratio, 5);
  }
  if (name){
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(name, sx, sy-34);
  }
}

function drawBullets(){
  for (const b of bullets){
    const sx = b.x - cam.x, sy = b.y - cam.y;
    if (sx < -10 || sx > W+10 || sy < -10 || sy > H+10) continue;
    ctx.beginPath();
    ctx.arc(sx, sy, 3, 0, Math.PI*2);
    ctx.fillStyle = b.color;
    ctx.fill();
  }
}

function drawParticles(){
  for (const p of particles){
    const sx = p.x - cam.x, sy = p.y - cam.y;
    if (sx < -20 || sx > W+20 || sy < -20 || sy > H+20) continue;
    ctx.globalAlpha = Math.max(0, p.life*2);
    ctx.fillStyle = p.color;
    ctx.fillRect(sx-2, sy-2, 4, 4);
  }
  ctx.globalAlpha = 1;
}

function drawJoystick(joy){
  if (!joy.active) return;
  ctx.beginPath();
  ctx.arc(joy.ox, joy.oy, JOY_R, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fill();
  let dx=joy.x-joy.ox, dy=joy.y-joy.oy;
  const d = Math.hypot(dx,dy);
  if (d>JOY_R){ dx=dx/d*JOY_R; dy=dy/d*JOY_R; }
  ctx.beginPath();
  ctx.arc(joy.ox+dx, joy.oy+dy, 30, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fill();
}

function drawHUD(){
  if (!player) return;
  // HP
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(16,16,200,26);
  const hp = Math.max(0, player.hp)/player.maxHp;
  ctx.fillStyle = hp>0.5?'#06d6a0':hp>0.25?'#ffd166':'#ef476f';
  ctx.fillRect(18,18,196*hp,22);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('HP ' + Math.max(0, Math.round(player.hp)), 24, 34);

  // Alive
  const alive = Object.values(playersById).filter(p => p.alive).length + (player.alive?1:0);
  ctx.textAlign = 'center';
  ctx.font = 'bold 22px sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText('ALIVE: ' + alive, W/2, 36);

  // Ammo
  ctx.textAlign = 'right';
  ctx.font = 'bold 16px sans-serif';
  ctx.fillStyle = player.weapon.color;
  ctx.fillText(player.weapon.name, W-20, H-60);
  ctx.font = 'bold 20px sans-serif';
  ctx.fillStyle = '#fff';
  if (player.reloading > 0) ctx.fillText('RELOAD...', W-20, H-32);
  else ctx.fillText(player.ammo + ' / ' + player.weapon.ammo, W-20, H-32);

  // Kill feed
  ctx.textAlign = 'right';
  ctx.font = '12px sans-serif';
  killFeed.forEach((k,i)=>{
    ctx.globalAlpha = Math.min(1, k.t);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillText(k.text, W-16, 100 + i*18);
  });
  ctx.globalAlpha = 1;

  // Minimap
  const mm = 90, mx = W-mm-16, my = 16;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(mx, my, mm, mm);
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.strokeRect(mx, my, mm, mm);
  const k = mm / WORLD;
  ctx.beginPath();
  ctx.arc(mx+zone.x*k, my+zone.y*k, zone.r*k, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(255,80,120,0.8)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  for (const id in playersById){
    const p = playersById[id];
    if (!p.alive) continue;
    const pos = getInterp(p) || p;
    ctx.fillStyle = '#e63946';
    ctx.fillRect(mx+pos.x*k-1, my+pos.y*k-1, 3, 3);
  }
  if (player.alive){
    ctx.fillStyle = '#4895ef';
    ctx.fillRect(mx+player.x*k-2, my+player.y*k-2, 5, 5);
  }

  // Death overlay
  if (!player.alive){
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0,0,W,H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ef476f';
    ctx.font = 'bold 42px sans-serif';
    ctx.fillText('ВЫ МЕРТВЫ', W/2, H/2);
    ctx.fillStyle = '#fff';
    ctx.font = '16px sans-serif';
    ctx.fillText('Наблюдение за матчем…', W/2, H/2 + 34);
  }
}

/* =========================
   ОСНОВНОЙ ЦИКЛ
   ========================= */
let last = performance.now();
function loop(now){
  let dt = (now - last)/1000;
  last = now;
  if (dt > 0.05) dt = 0.05;

  if (roomState === 'countdown'){
    const left = Math.max(0, Math.ceil((countdownEnds - Date.now())/1000));
    $('cdNum').textContent = left;
  }

  if (roomState === 'playing' || roomState === 'countdown' || roomState === 'ended'){
    time += dt;
    if (player) updateLocal(dt);
    updateBullets(dt);
    updateParticles(dt);
    updateCamera();
  }

  // рендер
  ctx.fillStyle = '#0d141c';
  ctx.fillRect(0,0,W,H);
  if (roomState === 'playing' || roomState === 'countdown' || roomState === 'ended'){
    drawGrid();
    drawZone();
    for (const id in playersById){
      const rp = playersById[id];
      if (!rp.alive) continue;
      const pos = getInterp(rp) || rp;
      drawEntity(pos.x, pos.y, pos.angle, '#e63946',
        100, 100, rp.name, (WEAPONS[rp.weapon]||WEAPONS.pistol).color);
    }
    if (player && player.alive){
      drawEntity(player.x, player.y, player.angle, '#4895ef',
        player.hp, player.maxHp, null, player.weapon.color);
    }
    drawBullets();
    drawParticles();
    if (roomState === 'playing'){
      drawJoystick(joyL);
      drawJoystick(joyR);
      drawHUD();
    }
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
