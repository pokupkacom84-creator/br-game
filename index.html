<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#517da2"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>YouGram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════
   YouGram — Telegram-accurate design system
   Light palette  exact match to TG iOS/Android
   ═══════════════════════════════════════════════ */
:root{
  /* Accent */
  --ac:#2AABEE;        /* TG blue */
  --ac2:#229ED9;       /* hover */
  --acs:#EBF5FD;
  /* Header */
  --hd:#2AABEE;
  --hdt:#fff;
  /* Surfaces */
  --bg:#F5F5F5;        /* chat list bg — TG grey */
  --sf:#FFFFFF;        /* cards / sheets */
  --tx:#000000DE;
  --sub:#707579;       /* secondary text */
  --ln:#E8E8E8;        /* divider */
  /* Bubbles */
  --out:#EFFDDE;       /* sent   — classic TG green */
  --out-tick:#4FAE4E;
  --in:#FFFFFF;        /* received */
  /* Misc */
  --g:#F1F1F1;
  --fs:15px;
  --r:18px;            /* bubble radius */
  /* Shadows */
  --bs:0 1px 2px rgba(0,0,0,.13);
}
[data-theme=dark]{
  --hd:#1C2733;
  --bg:#0E1621;
  --sf:#17212B;
  --tx:#F5F5F5;
  --sub:#7F8C8D;
  --ac:#2AABEE;
  --ac2:#229ED9;
  --acs:#1E3448;
  --ln:#0E1621;
  --out:#2B5278;
  --out-tick:#8BAFD3;
  --in:#182533;
  --g:#0E1621;
  --bs:0 1px 2px rgba(0,0,0,.35);
}

/* ── Reset & base ── */
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  font:var(--fs)/1.4 'Inter',system-ui,-apple-system,sans-serif;
  background:#1C1C1E;color:var(--tx);
  display:flex;justify-content:center;
  -webkit-user-select:none;user-select:none;
}
input,textarea{-webkit-user-select:text;user-select:text}
#app{
  width:100%;max-width:480px;height:100%;
  position:relative;overflow:hidden;
  background:var(--bg);display:flex;flex-direction:column;
}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;position:relative;overflow:hidden}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
::-webkit-scrollbar{display:none}

/* ── Ripple ── */
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.12;transform:scale(0);animation:rp .5s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
.row,.ch{position:relative;overflow:hidden}

/* ── Header — exact TG blue ── */
.hd{
  background:var(--hd);color:var(--hdt);
  display:flex;align-items:center;gap:4px;
  padding:calc(4px + env(safe-area-inset-top)) 4px 4px;
  min-height:calc(56px + env(safe-area-inset-top));
  flex:none;z-index:3;
  box-shadow:0 1px 0 rgba(0,0,0,.12);
}
.hd h1{font-size:1.1em;font-weight:600;flex:1;padding-left:4px;letter-spacing:.01em}
.hd>button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:rgba(255,255,255,.9)}
.hd>button:active{background:rgba(255,255,255,.18)}

/* ── Chat list ── */
.body{flex:1;overflow-y:auto;background:var(--bg);animation:fi .18s}
@keyframes fi{from{opacity:.5}}
.ch{display:flex;gap:11px;padding:9px 16px;width:100%;text-align:left;align-items:center;background:var(--sf)}
.ch:active{background:var(--g)}
/* Divider under each chat row except last */
.ch + .ch{border-top:1px solid var(--ln);margin-left:72px;padding-left:0}
.ch + .ch{margin-left:0;border-top:0;position:relative}
.ch + .ch::after{content:'';position:absolute;left:72px;right:0;top:0;height:1px;background:var(--ln)}
.ch .t{flex:1;min-width:0}
.l1,.l2{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.l1 b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.97em}
.tm{font-size:.76em;color:var(--sub);flex:none}
.l2 span{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.88em}

/* Unread badge — TG style */
.ub{
  background:var(--ac);color:#fff;font-style:normal;
  font-size:.72em;font-weight:600;
  min-width:20px;height:20px;border-radius:10px;
  display:grid;place-items:center;padding:0 5px;
  animation:bump .25s cubic-bezier(.3,1.6,.5,1);flex:none;
}

/* ── Avatars ── */
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;object-fit:cover;flex:none;letter-spacing:-.01em}
.avw{position:relative;flex:none;display:inline-block;line-height:0}
.hero .avw,.dr .top .avw{display:block;margin:0 auto 10px;width:max-content}
.dr .top .avw{margin:0}
/* Online dot */
.avw.on:after{
  content:"";position:absolute;right:1px;bottom:1px;
  width:12px;height:12px;border-radius:50%;
  background:#3DDB69;border:2px solid var(--sf);
}

/* ── FAB ── */
.fab{
  position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));
  width:56px;height:56px;border-radius:50%;
  background:var(--ac);color:#fff;
  display:grid;place-items:center;
  box-shadow:0 4px 16px rgba(42,171,238,.5);z-index:4;
}
.fab:active{transform:scale(.93)}

/* ── Message list ── */
.ml{
  flex:1;overflow-y:auto;
  padding:6px 10px 8px;
  display:flex;flex-direction:column;gap:1px;
  background-size:cover;
}
/* Date separator */
.dc{
  align-self:center;
  background:rgba(0,0,0,.28);
  color:#fff;font-size:.75em;font-weight:500;
  padding:4px 14px;border-radius:14px;
  margin:10px 0 6px;letter-spacing:.01em;
}
[data-theme=dark] .dc{background:rgba(255,255,255,.12)}

/* ── Bubbles — the heart of TG design ── */
.b{
  max-width:82%;
  padding:7px 10px 6px;
  border-radius:var(--r);
  position:relative;
  word-break:break-word;
  animation:msgIn .18s cubic-bezier(.2,1.1,.4,1) both;
  background:var(--in);
  color:var(--tx);
  align-self:flex-start;
  border-bottom-left-radius:4px;
  box-shadow:var(--bs);
  /* Tail via pseudo — incoming */
}
.b::before{
  content:'';position:absolute;
  bottom:0;left:-6px;
  width:10px;height:12px;
  background:var(--in);
  clip-path:polygon(0 100%,100% 0,100% 100%);
}
.b.out{
  background:var(--out);
  align-self:flex-end;
  border-radius:var(--r);
  border-bottom-right-radius:4px;
}
.b.out::before{
  left:auto;right:-6px;
  background:var(--out);
  clip-path:polygon(100% 100%,0 0,0 100%);
}
/* No tail if same sender groups */
.b p{white-space:pre-wrap;line-height:1.45;font-size:.97em}

/* Timestamp + ticks */
.mt{
  float:right;margin:3px 0 -3px 8px;
  font-size:.7em;color:var(--sub);
  display:flex;gap:2px;align-items:center;
  letter-spacing:.01em;
}
.out .mt{color:var(--out-tick)}
.mt svg{width:15px;height:15px;stroke-width:2.4}

/* Quote / reply block */
.q{
  border-left:3px solid var(--ac);
  padding:3px 8px;margin-bottom:5px;
  font-size:.85em;
  background:rgba(42,171,238,.08);
  border-radius:0 6px 6px 0;
}
.q b{color:var(--ac);display:block;font-weight:600;margin-bottom:1px}
[data-theme=dark] .q{background:rgba(42,171,238,.12)}

/* Image in bubble */
.mi{width:260px;max-width:100%;border-radius:12px;display:block;margin-bottom:4px}

/* ── Reactions ── */
.rxs{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;clear:both}
.rx{
  display:flex;align-items:center;gap:3px;
  padding:3px 9px 3px 6px;border-radius:14px;
  background:rgba(0,0,0,.07);
  font-size:.8em;font-weight:600;
  animation:bump .25s cubic-bezier(.3,1.8,.5,1);
  transition:transform .1s;
}
.rx:active{transform:scale(1.15)}
.rx.me{background:rgba(42,171,238,.18);color:var(--ac)}
[data-theme=dark] .rx{background:rgba(255,255,255,.1)}
[data-theme=dark] .rx.me{background:rgba(42,171,238,.22)}
.rx span{font-size:1.1em;line-height:1}

@keyframes msgIn{from{transform:scale(.88) translateY(6px);opacity:0}}
@keyframes bump{0%{transform:scale(.55);opacity:.2}100%{transform:none;opacity:1}}

/* ── Input bar ── */
.ib{
  display:flex;align-items:flex-end;gap:4px;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  background:var(--sf);flex:none;
  border-top:1px solid var(--ln);
}
/* Textarea wrapper pill */
.ib-inner{
  flex:1;
  display:flex;align-items:flex-end;gap:0;
  background:var(--bg);
  border-radius:22px;
  border:1px solid var(--ln);
  padding:4px 6px 4px 10px;
  min-height:42px;
}
.ib-inner textarea{
  flex:1;border:0;outline:0;background:none;resize:none;
  max-height:120px;padding:5px 0;line-height:1.4;font-size:.97em;
}
.ib button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--sub);flex:none}
.ib .snd{
  color:#fff;background:var(--ac);
  transform:scale(0);width:0;
  transition:.2s cubic-bezier(.3,1.4,.5,1);
  flex:none;border-radius:50%;
  box-shadow:0 2px 8px rgba(42,171,238,.4);
}
.ib .snd.on{transform:none;width:40px;margin-left:4px}

/* Reply preview */
.rp{
  background:var(--sf);padding:7px 14px;
  border-top:1px solid var(--ln);
  display:flex;align-items:center;gap:10px;font-size:.88em;
}
.rp div{flex:1;border-left:3px solid var(--ac);padding-left:8px;min-width:0}
.rp b{color:var(--ac);display:block;font-weight:600;margin-bottom:1px}
.rp span{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

/* ── Context menu ── */
.cxb{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:20;animation:fi .12s;backdrop-filter:blur(2px)}
.cxb.closing{animation:fo .16s forwards}
@keyframes fo{to{opacity:0}}

.rbar{
  position:absolute;
  background:var(--sf);
  border-radius:28px;padding:6px 8px;
  display:flex;gap:1px;
  box-shadow:0 8px 32px rgba(0,0,0,.22);
  animation:pop .2s cubic-bezier(.25,1.4,.4,1);
  transform-origin:bottom center;
}
.rbar.closing{animation:popout .15s forwards}
@keyframes pop{from{transform:scale(.4) translateY(8px);opacity:0}}
@keyframes popout{to{transform:scale(.4) translateY(8px);opacity:0}}
.rbar button{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;animation:bump .3s backwards;font-size:1.65em;padding:0}
.rbar button:nth-child(2){animation-delay:.03s}.rbar button:nth-child(3){animation-delay:.06s}
.rbar button:nth-child(4){animation-delay:.09s}.rbar button:nth-child(5){animation-delay:.12s}
.rbar button:nth-child(6){animation-delay:.15s}
.rbar button:active{transform:scale(1.3) translateY(-4px)}

/* Context menu actions */
.menu{
  position:absolute;background:var(--sf);
  border-radius:16px;
  box-shadow:0 8px 32px rgba(0,0,0,.22);
  min-width:200px;padding:4px 0;
  animation:pop .18s cubic-bezier(.25,1.4,.4,1);
  transform-origin:top left;overflow:hidden;
}
.menu.closing{animation:menuout .15s forwards}
@keyframes menuout{to{transform:scale(.88) translateY(-4px);opacity:0}}
.menu button{
  display:flex;gap:12px;align-items:center;
  padding:12px 18px;width:100%;text-align:left;
  font-size:.95em;
}
.menu button:active{background:var(--g)}
.menu button svg.i{color:var(--sub)}
/* Divider between menu sections */
.menu .mdiv{height:1px;background:var(--ln);margin:4px 0}

/* ── Drawer ── */
.dr-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:30;animation:fi .2s}
.dr{
  position:absolute;top:0;bottom:0;left:0;
  width:82%;max-width:320px;
  background:var(--sf);z-index:31;
  animation:sl .24s cubic-bezier(.2,.9,.3,1);
  display:flex;flex-direction:column;
  box-shadow:4px 0 24px rgba(0,0,0,.2);
}
@keyframes sl{from{transform:translateX(-100%)}}
.dr .top{
  padding:calc(16px + env(safe-area-inset-top)) 16px 16px;
  background:linear-gradient(150deg,var(--c1),var(--c2));color:#fff;
}
.dr .top b{display:block;font-size:1.05em;font-weight:600;margin-top:12px}
.dr .top small{opacity:.82;font-size:.85em}
.row{display:flex;align-items:center;gap:16px;padding:14px 18px;width:100%;text-align:left}
.row .t{flex:1;min-width:0;font-size:.97em}
.row .s{font-size:.8em;color:var(--sub);margin-top:1px}
.row svg.i{color:var(--sub);flex:none}
.hs{padding:14px 18px 4px;color:var(--ac);font-weight:600;font-size:.82em;text-transform:uppercase;letter-spacing:.06em}
.gap{height:8px;background:var(--g)}

/* ── Toggle ── */
.tg{
  width:50px;height:28px;border-radius:14px;
  background:#C4C4C4;position:relative;
  transition:.22s;flex:none;
}
.tg:after{
  content:"";position:absolute;
  top:3px;left:3px;width:22px;height:22px;
  border-radius:50%;background:#fff;
  transition:.22s;
  box-shadow:0 1px 4px rgba(0,0,0,.2);
}
.tg.on{background:var(--ac)}
.tg.on:after{left:25px}

/* ── Bottom sheet ── */
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:40;animation:fi .2s}
.sheet{
  position:absolute;left:0;right:0;bottom:0;max-height:88%;
  background:var(--sf);border-radius:20px 20px 0 0;
  z-index:41;overflow-y:auto;padding:20px;
  animation:up .24s cubic-bezier(.2,.9,.3,1);
}
@keyframes up{from{transform:translateY(100%)}}
/* Sheet handle */
.sheet::before{
  content:'';display:block;width:36px;height:4px;
  border-radius:2px;background:var(--ln);
  margin:-8px auto 16px;
}

/* ── Forms ── */
.inp{
  width:100%;padding:12px 2px;border:0;
  border-bottom:1.5px solid var(--ln);
  background:none;outline:0;margin-bottom:4px;
  font-size:.97em;
}
.inp:focus{border-color:var(--ac)}
label.f{display:block;font-size:.78em;color:var(--ac);margin-top:14px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.pri{
  background:var(--ac);color:#fff;
  padding:14px;border-radius:12px;
  font-weight:600;width:100%;margin-top:16px;
  font-size:.97em;letter-spacing:.01em;
  box-shadow:0 2px 10px rgba(42,171,238,.35);
  transition:opacity .15s,transform .1s;
}
.pri:active{opacity:.88;transform:scale(.98)}

/* Segment */
.seg{display:flex;margin:6px 18px;border:1.5px solid var(--ac);border-radius:12px;overflow:hidden}
.seg button{flex:1;padding:9px;color:var(--ac);font-weight:500}
.seg .on{background:var(--ac);color:#fff}

/* Color swatches */
.sw{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.sw button{width:46px;height:46px;border-radius:50%;border:3px solid transparent;transition:.15s}
.sw .on{border-color:var(--ac);transform:scale(1.08)}

/* ── Profile hero ── */
.hero{padding:0;color:#fff;position:relative;overflow:hidden}
.hero-bg{
  width:100%;min-height:220px;
  display:flex;flex-direction:column;
  align-items:flex-start;justify-content:flex-end;
  padding:16px 20px 0;position:relative;
}
.hero-bg::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.08) 40%,rgba(0,0,0,.45));
}
.hero-info{position:relative;z-index:1;padding-bottom:0;text-align:left;width:100%}
.hero-info h2{font-size:1.3em;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.3)}
.hero-info .hsub{font-size:.88em;opacity:.9}
.acts{display:flex;border-bottom:8px solid var(--g)}
.acts button{flex:1;padding:13px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.78em;color:var(--ac);font-weight:500}

/* Profile sheet */
.psheet-hero{padding:0;position:relative;overflow:hidden}
.psheet-bg{
  min-height:190px;
  display:flex;flex-direction:column;align-items:flex-start;
  justify-content:flex-end;padding:16px 18px 14px;position:relative;
}
.psheet-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent 30%,rgba(0,0,0,.45))}
.psheet-info{position:relative;z-index:1;color:#fff}
.psheet-info h2{font-size:1.2em;font-weight:700}
.psheet-info .st{font-size:.84em;opacity:.88}

/* ── Toast ── */
.toast{
  position:absolute;left:16px;right:16px;
  bottom:calc(76px + env(safe-area-inset-bottom));
  background:#1C1C1E;color:#fff;
  padding:12px 18px;border-radius:12px;
  z-index:60;animation:up .18s;
  font-size:.9em;font-weight:500;
  box-shadow:0 4px 20px rgba(0,0,0,.3);
}
[data-theme=dark] .toast{background:#3A3A3C}

/* ── Empty state ── */
.empty{text-align:center;color:var(--sub);padding:60px 30px;line-height:1.6}

/* ── Login gate ── */
.gate{flex:1;overflow-y:auto;padding:40px 24px;background:var(--sf)}
.gate h1{font-weight:700;margin:16px 0 6px;text-align:center;font-size:1.4em}
.gate p{color:var(--sub);text-align:center;margin-bottom:12px;line-height:1.6}
.logo{
  width:100px;height:100px;border-radius:50%;
  background:linear-gradient(145deg,var(--ac),#229ED9);
  color:#fff;display:grid;place-items:center;
  margin:0 auto;
  box-shadow:0 6px 24px rgba(42,171,238,.4);
}
.logo svg{width:52px;height:52px;stroke-width:1.6}

/* Google button */
.gbtn{
  display:flex;align-items:center;justify-content:center;gap:12px;
  width:100%;padding:14px;border-radius:12px;
  background:#fff;color:#3C4043;
  border:1.5px solid #DADCE0;font-weight:600;margin-top:28px;
  box-shadow:0 1px 4px rgba(0,0,0,.08);
  transition:.15s;
}
.gbtn:active{opacity:.85}
.gbtn svg{width:22px;height:22px}
.lnk{display:block;margin:16px auto 0;color:var(--ac);padding:8px;font-weight:500}
.ok{font-size:.8em;min-height:18px;margin-top:3px}

/* ── Disable animations flag ── */
.na *{animation:none!important;transition:none!important}

/* ── Desktop frame ── */
@media(min-width:520px){
  #app{max-height:860px;margin:auto;border-radius:16px;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 24px 80px rgba(0,0,0,.7)}
  body{background:#1A1A2E}
}

/* ════════════════════════
   NEW FEATURES (v3→v4)
   ════════════════════════ */

/* Edited badge */
.edited{font-size:.68em;color:var(--sub);margin-left:4px;font-style:italic;opacity:.8}

/* Pinned bar */
.pin-bar{
  background:var(--sf);border-bottom:1px solid var(--ln);
  padding:8px 14px;display:flex;align-items:center;gap:10px;
  cursor:pointer;flex:none;animation:fi .2s;position:relative;
}
.pin-bar::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ac);border-radius:0 2px 2px 0}
.pin-bar .pin-txt{flex:1;min-width:0}
.pin-bar .pin-title{font-size:.76em;color:var(--ac);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.pin-bar .pin-msg{font-size:.88em;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Search bar */
.srch-bar{
  background:var(--sf);display:flex;align-items:center;gap:6px;
  padding:6px 10px;border-bottom:1px solid var(--ln);flex:none;animation:fi .15s;
}
.srch-bar input{flex:1;border:0;outline:0;background:none;padding:7px 6px;border-radius:8px;font-size:.95em}
.srch-bar .srch-nav{display:flex;align-items:center;gap:2px;color:var(--sub);font-size:.82em;white-space:nowrap}
.srch-bar button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--sub)}
.srch-hl{background:#FFE066;color:#000;border-radius:3px;padding:0 1px}
[data-theme=dark] .srch-hl{background:#9A7D0A;color:#fff}
.srch-cur{background:var(--ac);color:#fff;border-radius:3px;padding:0 1px}

/* Swipe to reply */
.b{transition:transform .15s,box-shadow .15s;touch-action:pan-y}
.b.swiping{transition:none}
.swipe-hint{

// ── Text formatting: **bold**, _italic_, ~~strike~~, `code`
function fmtText(raw){
  if(!raw)return '';
  let s=esc(raw);
  s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(?<!\w)_(.+?)_(?!\w)/g,'<em>$1</em>');
  s=s.replace(/~~(.+?)~~/g,'<del>$1</del>');
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  return s;}

// ── URL detection for link preview
const URL_RE=/https?:\/\/[^\s<>"']+/;
function extractUrl(t){if(!t)return null;const m=t.match(URL_RE);return m?m[0]:null}

function drawMsgs(first){const ml=$('#ml');if(!ml)return;
  const near=first||ml.scrollHeight-ml.scrollTop-ml.clientHeight<140;
  let day='',h='';
  const q=srchMode&&srchQ.length>1?srchQ.toLowerCase():'';
  srchHits=[];
  MS.forEach((m,idx)=>{
    const d=dl(m.ts||Date.now());if(d!=day){day=d;h+=`<div class="dc">${d}</div>`}
    const me=m.from==uid,rx={};Object.values(m.rx||{}).forEach(k=>rx[k]=(rx[k]||0)+1);
    const cr=me?`border-radius:${S.s.corner}px ${S.s.corner}px 4px ${S.s.corner}px`:`border-radius:${S.s.corner}px ${S.s.corner}px ${S.s.corner}px 4px`;
    // Search highlight
    let isHit=false;
    if(q&&m.t&&m.t.toLowerCase().includes(q)){isHit=true;srchHits.push(m.id)}
    // Swipe hint arrow
    const hint=`<div class="swipe-hint" id="sh_${m.id}">${ic('reply','')}</div>`;
    // Formatted text with optional search highlight
    let textHtml='';
    if(m.t){
      let ft=fmtText(m.t);
      if(isHit){
        const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
        const cls=srchHits.indexOf(m.id)===srchIdx-1?'srch-cur':'srch-hl';
        ft=ft.replace(re,`<mark class="${cls}">$1</mark>`);
      }
      textHtml=`<p>${ft}</p>`;}
    // Link preview (inline, loaded async)
    const url=!m.img?extractUrl(m.t):null;
    const lpHtml=url?`<div class="lp-slot" data-url="${esc(url)}" data-mid="${m.id}">${lpCache[url]||''}</div>`:'';
    h+=`<div class="b ${me?'out':''} ${isHit?'srch-match':''}" data-id="${m.id}" data-idx="${idx}" style="${cr};position:relative">
    ${hint}
    ${m.re?`<div class="q"><b>${m.re.from==uid?'Вы':esc((CU[m.re.from]||{}).name||'')}</b>${esc(m.re.t)}</div>`:''}
    ${m.img?`<img class="mi" src="${m.img}" loading="lazy">`:''}
    ${lpHtml}${textHtml}
    <span class="mt">${tm(m.ts)}${m.edited?`<span class="edited">изм.</span>`:''} ${me?ic(RD>=m.ts?'check2':'check'):''}</span>
    ${Object.keys(rx).length?`<div class="rxs">${Object.keys(rx).map(k=>`<button class="rx ${(m.rx||{})[uid]==k?'me':''}" data-rk="${k}">${rsvg(k)}${rx[k]}</button>`).join('')}</div>`:''}</div>`;});
  h=h||`<div class="dc">Напишите первое сообщение</div>`;
  if(h===ml._h&&!first)return;ml._h=h;
  const sc=ml.scrollTop;ml.innerHTML=h;
  ml.scrollTop=near?ml.scrollHeight:sc;
  // Load link previews async
  ml.querySelectorAll('.lp-slot[data-url]').forEach(slot=>{
    const url=slot.dataset.url;
    if(lpCache[url]){slot.innerHTML=lpCache[url];return}
    fetchLp(url).then(html=>{if(html){lpCache[url]=html;slot.innerHTML=html}});});
  // Update search counter
  updSrchCounter();}

// ── Link preview fetcher (uses allorigins proxy to avoid CORS)
async function fetchLp(url){
  try{
    const host=new URL(url).hostname.replace('www.','');
    // Minimal preview: just domain card (no CORS needed)
    const html=`<div class="lp"><div class="lp-info"><div class="lp-host">${esc(host)}</div><div class="lp-title">${esc(url.length>60?url.slice(0,60)+'…':url)}</div></div></div>`;
    return html;
  }catch(e){return ''}}

// ── Apply markdown formatting to selected text in textarea
function applyFmt(type){const ti=$('#ti');if(!ti)return;
  const s=ti.selectionStart,e=ti.selectionEnd,v=ti.value,sel=v.slice(s,e)||'текст';
  const wrap={bold:'**',italic:'_',strike:'~~',code:'`'};const w=wrap[type];
  const ins=w+sel+w;ti.value=v.slice(0,s)+ins+v.slice(e);
  ti.selectionStart=s+w.length;ti.selectionEnd=s+w.length+sel.length;
  ti.focus();ti.oninput({target:ti});}

function resize(f,max,q,cb){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',q))};im.src=r.result};r.readAsDataURL(f)}
