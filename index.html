<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#517da2">
<title>Telegram</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#fff;--bg-2:#f4f4f5;--text:#000;--text-2:#707579;--border:#e4e4e5;--accent:#3390ec;--accent-2:#2481d7;--bubble-out:#eeffde;--bubble-in:#fff;--chat-bg:#e6ebee;--header-bg:#517da2;--header-text:#fff;--unread-bg:#3390ec;--unread-text:#fff;--nav-bg:#fff;--time-out:#62a03f}
body.dark{--bg:#17212b;--bg-2:#0e1621;--text:#fff;--text-2:#7f91a4;--border:#101921;--accent:#5288c1;--accent-2:#6da0d6;--bubble-out:#2b5278;--bubble-in:#182533;--chat-bg:#0e1621;--header-bg:#17212b;--unread-bg:#5288c1;--nav-bg:#17212b;--time-out:#7aab5a}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;transition:background .2s,color .2s;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text;font-family:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;outline:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);z-index:1}
.screen.active{display:flex;z-index:2}
.hidden{display:none!important}
.auth-container{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;gap:12px;max-width:400px;margin:0 auto;width:100%}
.auth-logo{margin-bottom:8px}
.auth-title{font-size:28px;font-weight:600;margin-bottom:4px}
.auth-subtitle{color:var(--text-2);font-size:14px;margin-bottom:24px}
.auth-form{width:100%;display:flex;flex-direction:column;gap:10px}
.auth-form input{width:100%;padding:14px 16px;border:1.5px solid var(--border);border-radius:10px;background:var(--bg-2);color:var(--text);font-size:16px;outline:none;transition:border-color .15s}
.auth-form input:focus{border-color:var(--accent)}
.btn-primary{width:100%;padding:14px;border-radius:10px;background:var(--accent);color:#fff;font-size:16px;font-weight:500;transition:background .15s}
.btn-primary:active{background:var(--accent-2)}
.btn-primary:disabled{opacity:.6}
.btn-link{color:var(--accent);font-size:14px;padding:10px}
.avatar-upload{position:relative;width:120px;height:120px;margin-bottom:16px;cursor:pointer}
.avatar-preview{width:100%;height:100%;border-radius:50%;background:var(--bg-2);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:var(--text-2);overflow:hidden}
.avatar-camera{position:absolute;bottom:0;right:0;width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff}
.onb-title{font-size:22px;font-weight:600;margin-bottom:16px}
.onb-input{width:100%;padding:14px 16px;border:1.5px solid var(--border);border-radius:10px;background:var(--bg-2);color:var(--text);font-size:16px;outline:none;margin-bottom:10px}
.onb-input:focus{border-color:var(--accent)}
.main-body{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}
.tab-content{display:none;flex-direction:column;flex:1;overflow:hidden;position:relative}
.tab-content.active{display:flex}
.header{display:flex;align-items:center;padding:12px 16px;background:var(--header-bg);color:var(--header-text);min-height:56px;gap:12px;padding-top:calc(12px + env(safe-area-inset-top))}
.header-title{font-size:18px;font-weight:600;flex:1}
.header-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--header-text);flex-shrink:0}
.header-btn:active{background:rgba(255,255,255,.12)}
.list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.list::-webkit-scrollbar{display:none}
.chat-item{display:flex;align-items:center;padding:10px 16px;gap:12px;cursor:pointer;transition:background .1s}
.chat-item:active{background:var(--bg-2)}
.avatar{width:54px;height:54px;border-radius:50%;background:var(--accent);background-size:cover;background-position:center;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:500;overflow:hidden}
.avatar.saved{background:#3390ec}
.chat-item-info{flex:1;min-width:0}
.chat-item-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.chat-item-name{font-size:16px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item-time{font-size:12px;color:var(--text-2);flex-shrink:0}
.chat-item-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:3px}
.chat-item-msg{font-size:14px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.chat-item-unread{min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--unread-bg);color:var(--unread-text);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.fab{position:absolute;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:10}
.fab:active{background:var(--accent-2)}
.bottom-nav{display:flex;background:var(--nav-bg);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;color:var(--text-2);font-size:11px;transition:color .15s;cursor:pointer}
.nav-item.active{color:var(--accent)}
.search-bar{padding:8px 16px;background:var(--bg)}
.search-bar input{width:100%;padding:10px 14px;border-radius:10px;border:none;background:var(--bg-2);color:var(--text);font-size:15px;outline:none}
.chat-header{display:flex;align-items:center;padding:8px 8px 8px 4px;background:var(--header-bg);color:var(--header-text);gap:6px;min-height:56px;padding-top:calc(8px + env(safe-area-inset-top))}
.chat-header .avatar{width:42px;height:42px;font-size:16px}
.chat-header-info{flex:1;min-width:0}
.chat-header-name{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-header-status{font-size:13px;opacity:.85}
.messages{flex:1;overflow-y:auto;padding:10px 10px 6px;background:var(--chat-bg);display:flex;flex-direction:column;gap:3px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.messages::-webkit-scrollbar{display:none}
.msg{max-width:82%;padding:7px 11px;border-radius:16px;font-size:15px;line-height:1.35;animation:msgIn .18s ease-out;position:relative;word-wrap:break-word;overflow-wrap:break-word}
@keyframes msgIn{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.msg.out{align-self:flex-end;background:var(--bubble-out);border-bottom-right-radius:5px}
.msg.in{align-self:flex-start;background:var(--bubble-in);border-bottom-left-radius:5px}
.msg.media-msg{padding:4px;overflow:hidden}
.msg-text{white-space:pre-wrap;display:block;word-break:break-word}
.msg-caption{padding:4px 7px 2px}
.msg-time{float:right;margin:5px -2px -2px 8px;font-size:11px;opacity:.7;white-space:nowrap;display:inline-flex;align-items:center;gap:3px;color:var(--text-2)}
.msg.out .msg-time{color:var(--time-out)}
.msg.media-msg .msg-time{margin:5px 3px 2px 8px}
.msg-check{display:inline-flex;align-items:center}
.msg-check svg{width:14px;height:10px}
.msg-date{align-self:center;background:rgba(0,0,0,.18);color:#fff;padding:4px 12px;border-radius:12px;font-size:12px;margin:8px 0;font-weight:500}
.chat-input-bar{display:flex;align-items:center;gap:6px;padding:8px 8px;background:var(--bg);border-top:1px solid var(--border);padding-bottom:calc(8px + env(safe-area-inset-bottom));position:relative}
.chat-input-bar input[type=text]{flex:1;padding:11px 14px;border-radius:20px;border:none;background:var(--bg-2);color:var(--text);font-size:16px;outline:none;min-width:0}
.icon-btn{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-2);transition:background .15s,color .15s}
.icon-btn:active{background:var(--bg-2)}
#send-btn{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#send-btn:active{background:var(--accent-2)}
#send-btn:disabled{opacity:.5}
.attach-menu{position:absolute;bottom:calc(100% + 8px);left:8px;background:var(--bg);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.2);padding:6px 0;min-width:220px;opacity:0;transform:translateY(8px) scale(.95);transform-origin:bottom left;pointer-events:none;transition:opacity .15s,transform .15s;z-index:50;overflow:hidden}
.attach-menu.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.attach-item{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer;font-size:15px;color:var(--text)}
.attach-item:active{background:var(--bg-2)}
.attach-item svg{width:22px;height:22px;color:var(--text-2);flex-shrink:0}
.attach-overlay{position:fixed;inset:0;z-index:40;display:none}
.attach-overlay.show{display:block}
.msg-media{border-radius:14px;overflow:hidden;background:#000;position:relative;max-width:100%;margin-bottom:2px}
.msg-media img,.msg-media video{display:block;max-width:100%;max-height:340px;width:auto;height:auto;object-fit:cover;cursor:pointer;background:#000}
.msg-media video{width:280px}
.msg-file{display:flex;align-items:center;gap:10px;padding:8px 6px;text-decoration:none;color:inherit;border-radius:10px}
.msg-file:active{background:rgba(0,0,0,.05)}
body.dark .msg-file:active{background:rgba(255,255,255,.05)}
.msg-file-icon{width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px}
.msg-file-info{flex:1;min-width:0}
.msg-file-name{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg-file-size{font-size:12px;color:var(--text-2);margin-top:2px}
.msg-voice{display:flex;align-items:center;gap:10px;padding:4px 2px;min-width:180px}
.voice-play{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;transition:background .15s}
.voice-play:active{background:var(--accent-2)}
.voice-wave{flex:1;height:22px;display:flex;align-items:center;gap:2px;overflow:hidden}
.voice-wave span{width:3px;background:var(--accent);border-radius:2px;opacity:.55;flex-shrink:0;transition:opacity .1s linear}
.voice-dur{font-size:12px;color:var(--text-2);flex-shrink:0;font-variant-numeric:tabular-nums}
.msg-circle{width:200px;height:200px;border-radius:50%;overflow:hidden;background:#000;position:relative;margin:2px}
.msg-circle video{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.media-viewer{position:fixed;inset:0;background:#000;z-index:9998;display:none;align-items:center;justify-content:center;flex-direction:column}
.media-viewer.show{display:flex}
.media-viewer img,.media-viewer video{max-width:100%;max-height:100%;object-fit:contain}
.media-viewer-close{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;display:flex;align-items:center;justify-content:center;z-index:2}
.upload-progress{position:absolute;left:8px;right:8px;bottom:calc(100% + 8px);background:var(--bg);border-radius:12px;padding:10px 14px;box-shadow:0 4px 16px rgba(0,0,0,.15);display:none;z-index:45;font-size:13px;color:var(--text)}
.upload-progress.show{display:block}
.upload-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:6px}
.upload-bar-fill{height:100%;background:var(--accent);width:0%;transition:width .2s;border-radius:2px}
.recording-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9997;display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;color:#fff}
.recording-overlay.show{display:flex}
.recording-timer{font-size:42px;font-weight:300;font-variant-numeric:tabular-nums}
.recording-hint{font-size:14px;color:rgba(255,255,255,.7);text-align:center;padding:0 24px}
.recording-stop{width:70px;height:70px;border-radius:50%;background:#e53935;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px}
.recording-preview{width:220px;height:220px;border-radius:50%;overflow:hidden;background:#000;border:3px solid #fff}
.recording-preview video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.settings-body{flex:1;overflow-y:auto;padding:8px 0}
.settings-profile{display:flex;align-items:center;gap:14px;padding:16px;cursor:pointer}
.settings-profile:active{background:var(--bg-2)}
.settings-profile .avatar{width:64px;height:64px;font-size:24px}
.settings-info{flex:1;min-width:0}
.settings-name{font-size:18px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.settings-username{font-size:14px;color:var(--text-2);margin-top:2px}
.settings-item{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;border-top:1px solid var(--border);font-size:15px}
.settings-item:active{background:var(--bg-2)}
.settings-item svg{width:22px;height:22px;color:var(--text-2);flex-shrink:0}
.settings-item span{flex:1}
.settings-item.danger{color:#e53935}
.settings-item.danger svg{color:#e53935}
.toggle{width:42px;height:24px;border-radius:12px;background:var(--border);position:relative;transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on::after{transform:translateX(18px)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,.9);color:#fff;padding:12px 18px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9999;max-width:88%;text-align:center;line-height:1.4;word-break:break-word}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{padding:40px 20px;text-align:center;color:var(--text-2);font-size:14px}
.spinner{width:28px;height:28px;border:3px solid rgba(51,144,236,.25);border-top-color:#3390ec;border-radius:50%;animation:spin .8s linear infinite;margin-top:16px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="toast" class="toast"></div>

<div id="splash-screen" class="screen active">
<div class="auth-container">
<div class="auth-logo"><svg viewBox="0 0 24 24" width="76" height="76" fill="#3390ec"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg></div>
<h1 class="auth-title">Telegram</h1>
<div class="spinner"></div>
</div>
</div>

<div id="auth-screen" class="screen">
<div class="auth-container">
<div class="auth-logo"><svg viewBox="0 0 24 24" width="76" height="76" fill="#3390ec"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg></div>
<h1 class="auth-title">Telegram</h1>
<p class="auth-subtitle" id="auth-subtitle">Войдите, чтобы продолжить</p>
<div class="auth-form" id="login-form">
<input id="login-email" type="email" placeholder="Email">
<input id="login-password" type="password" placeholder="Пароль">
<button id="login-btn" class="btn-primary">Войти</button>
<button id="go-register" class="btn-link">Создать аккаунт</button>
</div>
<div class="auth-form hidden" id="register-form">
<input id="reg-email" type="email" placeholder="Email">
<input id="reg-password" type="password" placeholder="Пароль">
<input id="reg-password2" type="password" placeholder="Повторите пароль">
<button id="register-btn" class="btn-primary">Зарегистрироваться</button>
<button id="go-login" class="btn-link">У меня уже есть аккаунт</button>
</div>
</div>
</div>

<div id="onboarding-screen" class="screen">
<div class="auth-container">
<div class="avatar-upload" id="onb-avatar">
<div class="avatar-preview" id="onb-avatar-preview"><svg viewBox="0 0 24 24" width="56" height="56" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div>
<div class="avatar-camera"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 15.2c1.77 0 3.2-1.43 3.2-3.2s-1.43-3.2-3.2-3.2-3.2 1.43-3.2 3.2 1.43 3.2 3.2 3.2zm7-9.2h-3.17l-1.24-1.35c-.37-.41-.91-.65-1.47-.65H10.88c-.56 0-1.1.24-1.47.65L8.17 6H5c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/></svg></div>
<input type="file" id="onb-avatar-input" accept="image/*" hidden>
</div>
<h2 class="onb-title">Ваш профиль</h2>
<input id="onb-name" class="onb-input" placeholder="Имя" maxlength="32">
<input id="onb-username" class="onb-input" placeholder="@username" maxlength="32">
<button id="onb-continue" class="btn-primary">Продолжить</button>
</div>
</div>

<div id="main-screen" class="screen">
<div class="main-body">
<div id="tab-chats" class="tab-content active">
<div class="header">
<div class="header-title">Telegram</div>
<button class="header-btn" id="search-toggle"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button>
</div>
<div class="search-bar hidden" id="search-bar"><input id="chat-search" placeholder="Поиск"></div>
<div class="list" id="chats-list"></div>
<button class="fab" id="fab-new"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>
</div>
<div id="tab-contacts" class="tab-content">
<div class="header"><div class="header-title">Контакты</div></div>
<div class="list" id="contacts-list"></div>
</div>
<div id="tab-settings" class="tab-content">
<div class="header"><div class="header-title">Настройки</div></div>
<div class="settings-body">
<div class="settings-profile" id="settings-profile">
<div class="avatar" id="settings-avatar"></div>
<div class="settings-info">
<div class="settings-name" id="settings-name"></div>
<div class="settings-username" id="settings-username"></div>
</div>
</div>
<div class="settings-item" id="btn-theme">
<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
<span>Тёмная тема</span>
<div class="toggle" id="theme-toggle"></div>

function $(id){ return document.getElementById(id); }

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function escAttr(s){ return esc(s); }

function initials(name){
  if(!name) return '?';
  var p = name.trim().split(/\s+/);
  return ((p[0]?p[0][0]:'') + (p[1]?p[1][0]:'')).toUpperCase();
}

/**
 * Безопасный avatar HTML: URL передаём через data-атрибут,
 * а сам URL применяем через element.style (нет инъекции в HTML).
 */
function avatarHtml(user){
  if(!user) return '<div class="avatar">?</div>';
  var url = user.photoURL || '';
  if(url){
    return '<div class="avatar" data-avatar-url="' + escAttr(url) + '"></div>';
  }
  return '<div class="avatar">' + esc(initials(user.name || user.username || '?')) + '</div>';
}
function applyAvatarUrls(root){
  (root || document).querySelectorAll('[data-avatar-url]').forEach(function(el){
    try { el.style.backgroundImage = 'url("' + el.dataset.avatarUrl + '")'; } catch(e){}
  });
}

function pad(n){ return n < 10 ? '0' + n : '' + n; }
function formatTime(ts){
  if(!ts) return '';
  var d = new Date(ts), now = new Date();
  if(d.toDateString() === now.toDateString()) return pad(d.getHours()) + ':' + pad(d.getMinutes());
  var diff = (now - d) / 86400000;
  if(diff < 7){ var days = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб']; return days[d.getDay()]; }
  return pad(d.getDate()) + '.' + pad(d.getMonth()+1) + '.' + String(d.getFullYear()).slice(2);
}
function formatFullTime(ts){
  if(!ts) return '';
  var d = new Date(ts);
  return pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function formatLastSeen(ts){
  if(!ts) return 'был(а) недавно';
  var d = new Date(ts), now = new Date(), diff = (now - d) / 1000;
  if(diff < 60) return 'был(а) только что';
  if(diff < 3600) return 'был(а) ' + Math.floor(diff/60) + ' мин назад';
  if(d.toDateString() === now.toDateString()) return 'был(а) в ' + formatFullTime(ts);
  return 'был(а) ' + pad(d.getDate()) + '.' + pad(d.getMonth()+1) + '.' + d.getFullYear();
}
function formatSize(bytes){
  if(!bytes) return '0 Б';
  if(bytes < 1024) return bytes + ' Б';
  if(bytes < 1048576) return (bytes/1024).toFixed(1) + ' КБ';
  if(bytes < 1073741824) return (bytes/1048576).toFixed(1) + ' МБ';
  return (bytes/1073741824).toFixed(2) + ' ГБ';
}
function formatDur(sec){
  sec = Math.max(0, Math.round(sec || 0));
  return Math.floor(sec/60) + ':' + pad(sec % 60);
}
function cleanMime(t){
  if(!t) return 'application/octet-stream';
  var c = String(t).split(';')[0].trim();
  return c || 'application/octet-stream';
}
function truncate(s, n){
  s = String(s == null ? '' : s);
  return s.length > n ? s.slice(0, n - 1) + '…' : s;
}
function isSavedChat(chatId){ return !!(chatId && chatId.indexOf(SAVED_CHAT_PREFIX) === 0); }

function toast(msg){
  var t = $('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(function(){ t.classList.remove('show'); }, 3500);
}

/* =========================================================================
   Navigation (history stack)
   ========================================================================= */
const screenHistory = ['splash-screen'];
let currentScreenId = 'splash-screen';

function showScreen(id){
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  var el = $(id);
  if(el) el.classList.add('active');
}
function goScreen(id, replace){
  if(currentScreenId === id) return;
  if(currentScreenId === 'chat-screen' && id !== 'chat-screen') leaveChat();
  if(replace || currentScreenId === null || currentScreenId === 'splash-screen'){
    screenHistory.length = 0;
    screenHistory.push(id);
    try { history.replaceState({s:id}, ''); } catch(e){}
  } else {
    screenHistory.push(id);
    try { history.pushState({s:id}, ''); } catch(e){}
  }
  currentScreenId = id;
  showScreen(id);
  if(id === 'main-screen') scheduleRenderChats();
}

window.addEventListener('popstate', function(){
  if(screenHistory.length > 1){
    screenHistory.pop();
    var prev = screenHistory[screenHistory.length - 1];
    if(prev === 'splash-screen'){
      try { history.pushState({s:currentScreenId}, ''); } catch(e){}
      return;
    }
    if(currentScreenId === 'chat-screen' && prev !== 'chat-screen') leaveChat();
    currentScreenId = prev;
    showScreen(prev);
    if(prev === 'main-screen') scheduleRenderChats();
    try { history.pushState({s:prev}, ''); } catch(e){}
  } else {
    try { history.pushState({s:currentScreenId}, ''); } catch(e){}
  }
});
try { history.replaceState({s:'splash-screen'}, ''); } catch(e){}

}

/* =========================================================================
   Auth state
   ========================================================================= */
auth.onAuthStateChanged(async function(user){
  if(!user){
    if(currentScreenId === 'chat-screen') leaveChat();
    cleanupListeners();
    currentUser = null;
    currentUserData = null;
    Object.keys(userCache).forEach(function(k){ delete userCache[k]; });
    goScreen('auth-screen', true);
    return;
  }
  if(currentUser && currentUser.uid === user.uid) return;
  currentUser = user;
  let snap;
  try { snap = await db.ref('users/' + user.uid).once('value'); }
  catch(e){ toast('Ошибка соединения с базой'); return; }
  var data = snap.val();
  if(!data || !data.name){
    goScreen('onboarding-screen', true);
  } else {
    currentUserData = Object.assign({uid:user.uid}, data);
    userCache[user.uid] = currentUserData;
    goScreen('main-screen', true);
    startSelfListener();
    startUserChatsListener();
    startSavedMetaListener();
    updateSettingsUI();
  }
});

function cleanupListeners(){
  try {
    if(unsubUserChats && unsubUserChats.off) unsubUserChats.off();
    if(unsubSelfDoc && unsubSelfDoc.off) unsubSelfDoc.off();
    if(unsubSavedMeta && unsubSavedMeta.off) unsubSavedMeta.off();
    if(unsubChatMeta && unsubChatMeta.off) unsubChatMeta.off();
    if(unsubMessages && unsubMessages.off) unsubMessages.off();
    if(unsubChatUser && unsubChatUser.off) unsubChatUser.off();
  } catch(e){}
  unsubUserChats = unsubSelfDoc = unsubSavedMeta = unsubChatMeta = unsubMessages = unsubChatUser = null;

  if(visibilityHandler){
    document.removeEventListener('visibilitychange', visibilityHandler);
    visibilityHandler = null;
  }
  if(beforeUnloadHandler){
    window.removeEventListener('beforeunload', beforeUnloadHandler);
    beforeUnloadHandler = null;
  }
  chatsData = {};
  lastMessages = [];
  currentChatMeta = null;
}

/* =========================================================================
   Self listener (online / lastSeen)
   ========================================================================= */
function startSelfListener(){
  if(unsubSelfDoc && unsubSelfDoc.off) unsubSelfDoc.off();

  var ref = db.ref('users/' + currentUser.uid);
  ref.update({ online: true, lastSeen: TS }).catch(function(){});

  unsubSelfDoc = ref.on('value', function(s){
    var v = s.val();
    if(v){
      currentUserData = Object.assign({uid:currentUser.uid}, v);
      userCache[currentUser.uid] = currentUserData;
      updateSettingsUI();
    }
  });

  // FIX: убираем утечку обработчиков — храним ссылки
  visibilityHandler = function(){
    var r = db.ref('users/' + currentUser.uid);
    if(document.hidden) r.update({ online: false, lastSeen: TS }).catch(function(){});
    else r.update({ online: true }).catch(function(){});
  };
  beforeUnloadHandler = function(){
    try { db.ref('users/' + currentUser.uid).update({ online: false, lastSeen: TS }).catch(function(){}); } catch(e){}
  };
  document.addEventListener('visibilitychange', visibilityHandler);
  window.addEventListener('beforeunload', beforeUnloadHandler);
}

async function fetchUser(uid){
  if(userCache[uid]) return userCache[uid];
  try {
    var s = await db.ref('users/' + uid).once('value');
    if(s.exists()){
      var v = s.val();
      if(v && v.name){
        userCache[uid] = Object.assign({uid:uid}, v);
        return userCache[uid];
      }
    }
  } catch(e){}
  return { uid: uid, name: '', username: '' };
}

function renderSavedItem(){
  var hasMessage = !!(savedLastMessage && savedLastMessage.length);
  var msg = hasMessage ? truncate(savedLastMessage, 60) : 'сохранённые сообщения';
  var prefix = hasMessage ? 'Вы: ' : '';
  var time = savedLastTime ? formatTime(savedLastTime) : '';
  return '<div class="chat-item saved-item" data-saved="1">' +
    '<div class="avatar saved"><svg viewBox="0 0 24 24" width="26" height="26" fill="#ffffff"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg></div>' +
    '<div class="chat-item-info">' +
      '<div class="chat-item-top"><div class="chat-item-name">Избранное</div><div class="chat-item-time">' + esc(time) + '</div></div>' +
      '<div class="chat-item-bottom"><div class="chat-item-msg">' + esc(prefix + msg) + '</div></div>' +
    '</div>' +
  '</div>';
}

async function renderChats(){
  var list = $('chats-list');
  if(!list || !currentUser) return;

  var q = searchQuery.toLowerCase();
  var savedHtml = '';
  if(!q || 'избранное'.indexOf(q) !== -1 || 'сохранённые сообщения'.indexOf(q) !== -1){
    savedHtml = renderSavedItem();
  }

  var ids = Object.keys(chatsData);
  var arr = ids.map(function(id){ return {id:id, data:chatsData[id]}; })
               .filter(function(x){ return x.data && x.data.otherUid; });

  await Promise.all(arr.map(function(x){ return fetchUser(x.data.otherUid); }));

  arr = arr.filter(function(x){
    var u = userCache[x.data.otherUid];
    return u && u.name;
  });
  arr.sort(function(a,b){ return (b.data.lastMessageTime || 0) - (a.data.lastMessageTime || 0); });

  var html = savedHtml;
  arr.forEach(function(x){
    var u = userCache[x.data.otherUid];
    var unread = x.data.unread || 0;
    var time = formatTime(x.data.lastMessageTime);
    var last = truncate(x.data.lastMessage || '', 60) || 'Нет сообщений';
    var prefix = (x.data.lastSender === currentUser.uid && x.data.lastMessage) ? 'Вы: ' : '';
    if(q){
      var hay = ((u.name||'') + ' ' + (u.username||'') + ' ' + last).toLowerCase();
      if(hay.indexOf(q) === -1) return;
    }
    html += '<div class="chat-item" data-chat="' + escAttr(x.id) + '" data-user="' + escAttr(x.data.otherUid) + '">' +
      avatarHtml(u) +
      '<div class="chat-item-info">' +
        '<div class="chat-item-top"><div class="chat-item-name">' + esc(u.name) + '</div><div class="chat-item-time">' + esc(time) + '</div></div>' +
        '<div class="chat-item-bottom">' +
          '<div class="chat-item-msg">' + esc(prefix + last) + '</div>' +
          (unread > 0 ? '<div class="chat-item-unread">' + unread + '</div>' : '') +
        '</div>' +
      '</div>' +
    '</div>';
  });
  if(!html) html = '<div class="empty">Нет чатов. Начните новую переписку.</div>';
  list.innerHTML = html;
  applyAvatarUrls(list);

  var savedEl = list.querySelector('.saved-item');
  if(savedEl) savedEl.onclick = openSavedMessages;

  list.querySelectorAll('.chat-item').forEach(function(el){
    if(el.classList.contains('saved-item')) return;
    el.onclick = function(){ openChat(el.dataset.chat, el.dataset.user); };
  });
}

/* =========================================================================
   Message rendering
   ========================================================================= */
function formatDateLabel(d){
  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var dd = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var diff = Math.round((today - dd) / 86400000);
  if(diff === 0) return 'Сегодня';
  if(diff === 1) return 'Вчера';
  return d.getDate() + ' ' + ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'][d.getMonth()];
}
function checkSingle(){
  return '<span class="msg-check"><svg viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 5.5L5.5 10L14 1"/></svg></span>';
}
function checkDouble(){
  return '<span class="msg-check double"><svg viewBox="0 0 19 11" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 5.5L5.5 10L14 1"/><path d="M6 5.5L10.5 10L19 1"/></svg></span>';
}

function waveBars(seed){
  var s = 0, str = String(seed || 'x');
  for(var i = 0; i < str.length; i++) s = (s * 31 + str.charCodeAt(i)) >>> 0;
  var html = '';
  for(var j = 0; j < 26; j++){
    s = (s * 1103515245 + 12345) >>> 0;
    var h = 6 + (s % 15);
    html += '<span style="height:' + h + 'px"></span>';
  }
  return html;
}

function renderMessageInner(m){
  var type = m.type || 'text';
  if(type === 'photo'){
    return '<div class="msg-media" data-media-url="' + escAttr(m.fileURL||'') + '" data-media-type="photo"><img src="' + escAttr(m.fileURL||'') + '" loading="lazy" alt=""></div>' +
      (m.text ? '<div class="msg-text msg-caption">' + esc(m.text) + '</div>' : '');
  }
  if(type === 'video'){
    return '<div class="msg-media"><video src="' + escAttr(m.fileURL||'') + '" controls preload="metadata" playsinline webkit-playsinline></video></div>' +
      (m.text ? '<div class="msg-text msg-caption">' + esc(m.text) + '</div>' : '');
  }
  if(type === 'file'){
    return '<a class="msg-file" href="' + escAttr(m.fileURL||'') + '" target="_blank" rel="noopener" download="' + escAttr(m.fileName || 'file') + '">' +
      '<div class="msg-file-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="#fff"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13z"/></svg></div>' +
      '<div class="msg-file-info"><div class="msg-file-name">' + esc(m.fileName || 'Файл') + '</div>' +
      '<div class="msg-file-size">' + formatSize(m.fileSize || 0) + '</div></div>' +
    '</a>' + (m.text ? '<div class="msg-text msg-caption">' + esc(m.text) + '</div>' : '');
  }
  if(type === 'voice'){
    return '<div class="msg-voice">' +
      '<button class="voice-play" data-audio-url="' + escAttr(m.fileURL||'') + '">' + PLAY_ICON + '</button>' +
      '<div class="voice-wave">' + waveBars(m.id) + '</div>' +
      '<span class="voice-dur">' + formatDur(m.duration || 0) + '</span>' +
    '</div>';
  }
  if(type === 'circle'){
    return '<div class="msg-circle"><video src="' + escAttr(m.fileURL||'') + '" controls playsinline webkit-playsinline preload="metadata"></video></div>';
  }
  return '<span class="msg-text">' + esc(m.text || '') + '</span>';
}

function renderMessages(msgs){
  lastMessages = msgs;
  var box = $('messages');
  if(!box || !currentUser) return;
  var atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;

  var savedMode = isSavedChat(currentChatId);
  var otherUid = currentChatUser ? currentChatUser.uid : null;
  var otherReadTs = (currentChatMeta && currentChatMeta.readBy && otherUid)
    ? (currentChatMeta.readBy[otherUid] || 0) : 0;

  var html = '';
  var lastDate = '';
  msgs.forEach(function(m){
    var d = new Date(m.timestamp || Date.now());
    var key = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
    if(key !== lastDate){
      lastDate = key;
      html += '<div class="msg-date">' + formatDateLabel(d) + '</div>';
    }
    var isOut = m.senderId === currentUser.uid;
    var time = formatFullTime(m.timestamp);
    var check = '';
    if(isOut && !savedMode){
      var isRead = otherReadTs && m.timestamp <= otherReadTs;
      check = isRead ? checkDouble() : checkSingle();
    }
    var mediaClass = (m.type && m.type !== 'text') ? ' media-msg' : '';
    html += '<div class="msg ' + (isOut?'out':'in') + mediaClass + '" data-ts="' + (m.timestamp||0) + '">' +
      renderMessageInner(m) +
      '<span class="msg-time">' + time + check + '</span>' +
    '</div>';
  });
  box.innerHTML = html;
  if(atBottom) box.scrollTop = box.scrollHeight;

  box.querySelectorAll('.msg-media[data-media-type="photo"]').forEach(function(el){
    el.onclick = function(){ openMediaViewer(el.dataset.mediaUrl, 'photo'); };
  });
  box.querySelectorAll('.voice-play').forEach(function(btn){
    btn.onclick = function(e){ e.stopPropagation(); toggleAudio(btn, btn.dataset.audioUrl); };
  });
}

/**
 * Обновляет только галочки в уже отрендеренных исходящих сообщениях,
 * без полного ререндера списка.
 */
function updateMessageChecks(){
  if(!currentChatUser || isSavedChat(currentChatId)) return;
  var box = $('messages');
  if(!box) return;
  var otherUid = currentChatUser.uid;
  var otherReadTs = (currentChatMeta && currentChatMeta.readBy && currentChatMeta.readBy[otherUid]) || 0;

  box.querySelectorAll('.msg.out[data-ts]').forEach(function(el){
    var ts = +el.dataset.ts;
    var shouldDouble = otherReadTs && ts <= otherReadTs;
    var checkEl = el.querySelector('.msg-check');
    if(!checkEl) return;
    var isDouble = checkEl.classList.contains('double');
    if(shouldDouble !== isDouble){
      checkEl.outerHTML = shouldDouble ? checkDouble() : checkSingle();
    }
  });
}

/* =========================================================================
   Voice playback
   ========================================================================= */
function resetWave(btn){
  if(!btn || !btn.parentNode) return;
  var wave = btn.parentNode.querySelector('.voice-wave');
  if(!wave) return;
  wave.querySelectorAll('span').forEach(function(b){ b.style.opacity = '.55'; });
}
function stopAudio(){
  if(currentAudio){
    try { currentAudio.pause(); } catch(e){}
    currentAudio.onended = currentAudio.onerror = currentAudio.ontimeupdate = null;
    currentAudio = null;
  }
  if(currentAudioBtn){
    currentAudioBtn.innerHTML = PLAY_ICON;
    resetWave(currentAudioBtn);
    currentAudioBtn = null;
  }
}
function toggleAudio(btn, url){
  if(!url){ toast('Файл недоступен'); return; }
  if(currentAudioBtn === btn && currentAudio && !currentAudio.paused){ stopAudio(); return; }
  stopAudio();
  currentAudioBtn = btn;
  var audio = new Audio();
  audio.preload = 'auto';
  audio.src = url;
  currentAudio = audio;
  var wave = btn.parentNode ? btn.parentNode.querySelector('.voice-wave') : null;
  var bars = wave ? wave.querySelectorAll('span') : [];
  var setProgress = function(p){
    if(!bars.length) return;
    var n = Math.round(bars.length * Math.max(0, Math.min(1, p)));
    for(var i = 0; i < bars.length; i++) bars[i].style.opacity = i < n ? '1' : '.55';
  };
  audio.ontimeupdate = function(){
    if(audio.duration && isFinite(audio.duration) && audio.duration > 0)
      setProgress(audio.currentTime / audio.duration);
  };
  audio.onended = function(){ setProgress(0); stopAudio(); };
  audio.onerror = function(){ toast('Не удалось воспроизвести'); stopAudio(); };
  audio.play().then(function(){ btn.innerHTML = PAUSE_ICON; }).catch(function(){
    toast('Не удалось воспроизвести'); stopAudio();
  });
}

/* =========================================================================
   Sending messages
   ========================================================================= */
async function markAsRead(){
  if(!currentChatId || !currentUser || isSavedChat(currentChatId)) return;
  try {
    db.ref('chats/' + currentChatId + '/meta/readBy/' + currentUser.uid).set(TS).catch(function(){});
    db.ref('userChats/' + currentUser.uid + '/' + currentChatId + '/unread').set(0).catch(function(){});
  } catch(e){}
}

async function sendMessage(){
  var inp = $('msg-input');
  var text = inp.value.trim();
  if(!text || !currentChatId) return;
  inp.value = '';
  if(!isSavedChat(currentChatId)){
    db.ref('chats/' + currentChatId + '/meta/typing/' + currentUser.uid).remove().catch(function(){});
  }
  await pushMessage({ type:'text', text:text });
}

function previewFromMsg(msg){
  var s;
  if(msg.type === 'photo') s = '📷 Фото' + (msg.text ? ': ' + msg.text : '');
  else if(msg.type === 'video') s = '🎬 Видео' + (msg.text ? ': ' + msg.text : '');
  else if(msg.type === 'file') s = '📎 ' + (msg.fileName || 'Файл');
  else if(msg.type === 'voice') s = '🎤 Голосовое сообщение';
  else if(msg.type === 'circle') s = '⭕ Видеосообщение';
  else s = msg.text || '';
  return truncate(s, 60);
}

async function pushMessage(msgExtra, opts){
  opts = opts || {};
  var chatId = opts.chatId || currentChatId;
  if(!chatId || !currentUser) return;

  var msg = Object.assign({
    senderId: currentUser.uid,
    timestamp: TS,
    type: 'text'
  }, msgExtra);

  /* --- Saved messages --- */
  if(isSavedChat(chatId)){
    try {
      var ref = db.ref('chats/' + chatId + '/messages').push();
      await ref.set(msg);
      await db.ref('saved/' + currentUser.uid).update({
        lastMessage: previewFromMsg(msg),
        lastTime: TS
      });
    } catch(e){ toast('Ошибка сохранения'); }
    return;
  }

  var otherUid = resolveOtherUid(chatId, opts);
  if(!otherUid){ toast('Ошибка: получатель не найден'); return; }

  try {
    var msgRef = db.ref('chats/' + chatId + '/messages').push();
    var preview = previewFromMsg(msg);
    var updates = {};

    updates['chats/' + chatId + '/messages/' + msgRef.key] = msg;

    // Fan-out: обновляем preview у обоих пользователей
    [currentUser.uid, otherUid].forEach(function(uid){
      var base = 'userChats/' + uid + '/' + chatId;
      updates[base + '/otherUid'] = uid === currentUser.uid ? otherUid : currentUser.uid;
      updates[base + '/lastMessage'] = preview;
      updates[base + '/lastMessageTime'] = TS;
      updates[base + '/lastSender'] = currentUser.uid;
      updates[base + '/lastType'] = msg.type;
    });
    // Себе unread=0
    updates['userChats/' + currentUser.uid + '/' + chatId + '/unread'] = 0;

    // Собеседнику: атомарный инкремент
    if(INCR){
      updates['userChats/' + otherUid + '/' + chatId + '/unread'] = INCR(1);
    }

    // Убираем typing
    updates['chats/' + chatId + '/meta/typing/' + currentUser.uid] = null;

    await db.ref().update(updates);

    // Fallback: если ServerValue.increment недоступен — transaction
    if(!INCR){
      await db.ref('userChats/' + otherUid + '/' + chatId + '/unread')
        .transaction(function(v){ return (v || 0) + 1; });
    }
  } catch(e){
    toast('Ошибка отправки');
    console.error(e);
  }
}

function resolveOtherUid(chatId, opts){
  if(opts && opts.otherUid) return opts.otherUid;
  if(currentChatUser && currentChatUser.uid && chatId === currentChatId) return currentChatUser.uid;
  var c = chatsData[chatId];
  if(c && c.otherUid) return c.otherUid;
  return null;
}

/* =========================================================================
   Uploading media
   ========================================================================= */
function showUploadProgress(text){
  var p = $('upload-progress');
  if(!p) return;
  $('upload-text').textContent = text || 'Загрузка...';
  $('upload-fill').style.width = '0%';
  p.classList.add('show');
}
function setUploadProgress(percent){
  var f = $('upload-fill');
  if(f) f.style.width = Math.min(100, Math.max(0, percent)) + '%';
}
function hideUploadProgress(){
  var p = $('upload-progress');
  if(p) p.classList.remove('show');
  setUploadProgress(0);
}

function uploadFileAndGetURL(file, folder){
  var safeName = (file.name || 'file').replace(/[^a-zA-Z0-9._-]/g, '_').slice(-60);
  var path = folder + '/' + currentUser.uid + '_' + Date.now() + '_' + safeName;
  var ref = storage.ref(path);
  var task = ref.put(file, { contentType: cleanMime(file.type), cacheControl: 'public,max-age=31536000' });

  // FIX: без гонки resolve/reject
  return new Promise(function(resolve, reject){
    var settled = false;
    task.on('state_changed', function(snap){
      var pct = snap.totalBytes ? (snap.bytesTransferred / snap.totalBytes) * 100 : 0;
      setUploadProgress(pct);
      var txt = $('upload-text');
      if(txt) txt.textContent = 'Загрузка ' + Math.round(pct) + '%';
    }, function(err){
      if(settled) return;
      settled = true;
      reject(err);
    }, function(){
      if(settled) return;
      settled = true;
      task.snapshot.ref.getDownloadURL().then(resolve, reject);
    });
  });
}

async function handleMediaFile(file, forceType, extra, ctx){
  if(!file) return;
  if(!currentUser){ toast('Нет авторизации'); return; }
  var chatId = (ctx && ctx.chatId) || currentChatId;
  if(!chatId){ toast('Откройте чат'); return; }
  var otherUid = (ctx && ctx.otherUid) || (currentChatUser ? currentChatUser.uid : null);

  if(file.size > MAX_FILE_SIZE){
    toast('Файл слишком большой (макс. ' + formatSize(MAX_FILE_SIZE) + ')');
    return;
  }
  if(file.size === 0){ toast('Файл пустой'); return; }

  var type = forceType;
  if(!type){
    if(file.type.indexOf('image/') === 0) type = 'photo';
    else if(file.type.indexOf('video/') === 0) type = 'video';
    else type = 'file';
  }

  showUploadProgress('Подготовка...');
  try {
    var url = await uploadFileAndGetURL(file, 'media/' + chatId);
    setUploadProgress(100);
    hideUploadProgress();

    var msgExtra = Object.assign({ type:type, fileURL:url }, extra || {});
    if(type === 'file'){
      msgExtra.fileName = file.name || 'Файл';
      msgExtra.fileSize = file.size;
      msgExtra.mimeType = cleanMime(file.type);
    } else {
      msgExtra.mimeType = cleanMime(file.type);
    }
    await pushMessage(msgExtra, { chatId:chatId, otherUid:otherUid });
  } catch(e){
    hideUploadProgress();
    var m = (e && (e.message || e.code)) ? (e.message || e.code) : 'неизвестная ошибка';
    toast('Ошибка загрузки: ' + m);
    console.error('upload error', e);
  }
}

/* =========================================================================
   Recording
   ========================================================================= */
function pickMimeType(list){
  if(typeof MediaRecorder === 'undefined') return '';
  if(!MediaRecorder.isTypeSupported) return '';
  for(var i = 0; i < list.length; i++){
    try { if(MediaRecorder.isTypeSupported(list[i])) return list[i]; } catch(e){}
  }
  return '';
}

function stopRecordingSilently(){
  try {
    if(mediaRecorder && mediaRecorder.state !== 'inactive'){
      mediaRecorder.onstop = null;
      mediaRecorder.stop();
    }
  } catch(e){}
  mediaRecorder = null;
  mediaChunks = [];
  stopMediaStream();
  closeRecordingOverlay();
}

async function startRecording(mode){
  if(!currentChatId){ toast('Откройте чат'); return; }
  if(!currentUser){ toast('Нет авторизации'); return; }
  if(!CAN_RECORD){
    if(!IS_SECURE_CTX) toast('⚠ Нужен https-контекст (WebViewAssetLoader)');
    else if(!HAS_MEDIARECORDER) toast('WebView не поддерживает MediaRecorder');
    else if(!HAS_USERMEDIA) toast('WebView не даёт доступ к медиа');
    else toast('Запись недоступна');
    return;
  }
  if(mediaRecorder){ toast('Запись уже идёт'); return; }

  recordMode = mode;
  var ctx = {
    chatId: currentChatId,
    otherUid: currentChatUser ? currentChatUser.uid : null
  };

  try {
    var constraints = (mode === 'circle')
      ? { audio:{ echoCancellation:true, noiseSuppression:true },
          video:{ facingMode:'user', width:{ideal:480}, height:{ideal:480} } }
      : { audio:{ echoCancellation:true, noiseSuppression:true } };

    mediaStream = await navigator.mediaDevices.getUserMedia(constraints);

    var mimeType = (mode === 'circle')
      ? pickMimeType(['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'])
      : pickMimeType(['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/ogg','audio/mp4','audio/mpeg']);

    var opts = {};
    if(mimeType) opts.mimeType = mimeType;
    if(mode === 'circle') opts.videoBitsPerSecond = 900000;

    try { mediaRecorder = new MediaRecorder(mediaStream, opts); }
    catch(err){ mediaRecorder = new MediaRecorder(mediaStream); }

    mediaChunks = [];
    mediaRecorder.ondataavailable = function(e){
      if(e.data && e.data.size > 0) mediaChunks.push(e.data);
    };
    mediaRecorder.onerror = function(e){
      console.error('MediaRecorder error', e);
      toast('Ошибка записи');
      stopRecordingSilently();
    };
    mediaRecorder.onstop = async function(){
      var mode2 = recordMode;
      var chunks = mediaChunks.slice();
      mediaChunks = [];
      var fallbackType = mode2 === 'circle' ? 'video/webm' : 'audio/webm';
      var rawType = (chunks[0] && chunks[0].type) ? chunks[0].type : fallbackType;
      var blob = new Blob(chunks, { type: rawType });
      var duration = Math.max(1, Math.round((Date.now() - recordStart) / 1000));

      closeRecordingOverlay();
      stopMediaStream();
      mediaRecorder = null;
      recordMode = null;

      if(blob.size < 200){ toast('Запись не удалась'); return; }

      var mime = cleanMime(rawType);
      var ext = 'webm';
      if(mime.indexOf('mp4') !== -1) ext = 'mp4';
      else if(mime.indexOf('ogg') !== -1) ext = 'ogg';

      var name = (mode2 === 'circle' ? 'circle_' : 'voice_') + Date.now() + '.' + ext;
      var file = new File([blob], name, { type: mime });
      await handleMediaFile(file, mode2, { duration:duration, mimeType:mime }, ctx);
    };

    // FIX: без timeslice — надёжнее на Android WebView
    mediaRecorder.start();
    recordStart = Date.now();
    showRecordingOverlay(mode);
    updateRecordingTimer();
  } catch(e){
    var msg = (e && e.name) ? e.name : 'ошибка';
    if(msg === 'NotAllowedError' || msg === 'PermissionDeniedError')
      toast('Доступ к ' + (mode === 'circle' ? 'камере' : 'микрофону') + ' запрещён');
    else if(msg === 'NotFoundError' || msg === 'DevicesNotFoundError')
      toast('Устройство не найдено');
    else toast('Не удалось начать запись: ' + msg);
    stopRecordingSilently();
  }
}

function stopMediaStream(){
  if(mediaStream){
    try { mediaStream.getTracks().forEach(function(t){ t.stop(); }); } catch(e){}
    mediaStream = null;
  }
}

function showRecordingOverlay(mode){
  var overlay = $('recording-overlay'), preview = $('recording-preview'), hint = $('recording-hint');
  if(mode === 'circle'){
    preview.style.display = 'block';
    preview.innerHTML = '';
    if(mediaStream){
      var v = document.createElement('video');
      v.autoplay = true; v.muted = true; v.playsInline = true;
      v.setAttribute('playsinline','');
      v.srcObject = mediaStream;
      preview.appendChild(v);
    }
    hint.textContent = 'Запись видеокружка. Нажмите стоп, чтобы отправить.';
  } else {
    preview.style.display = 'none';
    preview.innerHTML = '';
    hint.textContent = 'Запись голосового сообщения. Нажмите стоп, чтобы отправить.';
  }
  overlay.classList.add('show');
}

function closeRecordingOverlay(){
  var overlay = $('recording-overlay');
  if(overlay) overlay.classList.remove('show');
  var preview = $('recording-preview');
  if(preview) preview.innerHTML = '';
  if(recordTimer){ clearInterval(recordTimer); recordTimer = null; }
}

function updateRecordingTimer(){
  if(recordTimer) clearInterval(recordTimer);
  var el = $('recording-timer');
  if(!el) return;
  var update = function(){
    var sec = Math.floor((Date.now() - recordStart) / 1000);
    el.textContent = pad(Math.floor(sec/60)) + ':' + pad(sec % 60);
    if(sec >= 60) stopRecording();
  };
  update();
  recordTimer = setInterval(update, 250);
}

function stopRecording(){
  if(recordTimer){ clearInterval(recordTimer); recordTimer = null; }
  try {
    if(mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    else stopRecordingSilently();
  } catch(e){ stopRecordingSilently(); }
}

async function loadContacts(){
  var list = $('contacts-list');
  list.innerHTML = '<div class="empty">Загрузка...</div>';
  try {
    var snap = await db.ref('users').limitToFirst(200).once('value');
    var arr = [];
    snap.forEach(function(child){
      if(child.key === currentUser.uid) return;
      var v = child.val();
      if(!v || !v.name || !v.name.trim()) return;
      if(!v.username || !v.username.trim()) return;
      var u = Object.assign({uid:child.key}, v);
      userCache[child.key] = u;
      arr.push(u);
    });
    arr.sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); });
    var html = '';
    arr.forEach(function(u){
      html += '<div class="chat-item" data-uid="' + escAttr(u.uid) + '">' +
        avatarHtml(u) +
        '<div class="chat-item-info">' +
          '<div class="chat-item-top"><div class="chat-item-name">' + esc(u.name) + '</div></div>' +
          '<div class="chat-item-bottom"><div class="chat-item-msg">' + (u.online ? 'в сети' : formatLastSeen(u.lastSeen)) + '</div></div>' +
        '</div>' +
      '</div>';
    });
    if(!html) html = '<div class="empty">Нет пользователей</div>';
    list.innerHTML = html;
    applyAvatarUrls(list);
    list.querySelectorAll('.chat-item').forEach(function(el){
      el.onclick = function(){ startChatWith(el.dataset.uid); };
    });
  } catch(e){
    list.innerHTML = '<div class="empty">Ошибка загрузки</div>';
  }
}

var newChatTimer = null;
$('newchat-search').addEventListener('input', function(){
  var q = this.value.trim().replace(/^@/,'').toLowerCase();
  clearTimeout(newChatTimer);
  var list = $('newchat-list');
  if(q.length < 1){ list.innerHTML = '<div class="empty">Введите @username</div>'; return; }
  newChatTimer = setTimeout(async function(){
    try {
      var snap = await db.ref('usernames').orderByKey()
        .startAt(q).endAt(q + '\uf8ff').limitToFirst(30).once('value');
      var uids = [];
      snap.forEach(function(child){ uids.push(child.val()); });
      var users = await Promise.all(uids.filter(function(u){ return u !== currentUser.uid; }).map(fetchUser));
      var html = '';
      users.forEach(function(u){
        if(!u || !u.uid || !u.name) return;
        html += '<div class="chat-item" data-uid="' + escAttr(u.uid) + '">' +
          avatarHtml(u) +
          '<div class="chat-item-info">' +
            '<div class="chat-item-top"><div class="chat-item-name">' + esc(u.name) + '</div></div>' +
            '<div class="chat-item-bottom"><div class="chat-item-msg">@' + esc(u.username||'') + '</div></div>' +
          '</div>' +
        '</div>';
      });
      if(!html) html = '<div class="empty">Ничего не найдено</div>';
      list.innerHTML = html;
      applyAvatarUrls(list);
      list.querySelectorAll('.chat-item').forEach(function(el){
        el.onclick = function(){ startChatWith(el.dataset.uid); };
      });
    } catch(e){
      list.innerHTML = '<div class="empty">Ошибка поиска</div>';
    }
  }, 300);
});

async function startChatWith(uid){
  if(!uid || uid === currentUser.uid) return;
  var chatId = [currentUser.uid, uid].sort().join('_');
  try {
    var ref = db.ref('chats/' + chatId + '/meta');
    var s = await ref.once('value');
    if(!s.exists()){
      var members = {};
      members[currentUser.uid] = true;
      members[uid] = true;

      var updates = {};
      updates['chats/' + chatId + '/meta/members'] = members;

      // Fan-out: создаём/инициализируем userChats у обоих
      [currentUser.uid, uid].forEach(function(u){
        var base = 'userChats/' + u + '/' + chatId;
        updates[base + '/otherUid'] = u === currentUser.uid ? uid : currentUser.uid;
        updates[base + '/lastMessage'] = '';
        updates[base + '/lastMessageTime'] = TS;
        updates[base + '/lastSender'] = '';
        updates[base + '/unread'] = 0;
      });
      await db.ref().update(updates);
    }
    openChat(chatId, uid);
  } catch(e){
    toast('Ошибка: ' + (e.message || e.code));
  }
}
