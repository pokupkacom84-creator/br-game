<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17212b">
<title>Telegram</title>
<style>
/* ============ THEME ============ */
:root{
  --bg:#0e1621; --panel:#17212b; --panel2:#1c2733; --hover:#202b36;
  --active:#2b5278; --text:#ffffff; --text2:#8b9aa8; --text3:#6c7883;
  --accent:#5288c1; --accent2:#64b5ef;
  --bubble-out:#2b5278; --bubble-in:#182533;
  --border:#0b1219; --shadow:0 2px 8px rgba(0,0,0,.35);
  --menu:#1c2733; --scroll:#2b3844;
}
body.light{
  --bg:#ffffff; --panel:#ffffff; --panel2:#f4f4f5; --hover:#f0f0f0;
  --active:#e8f1fb; --text:#000000; --text2:#707579; --text3:#9aa0a6;
  --accent:#3390ec; --accent2:#3390ec;
  --bubble-out:#effdde; --bubble-in:#ffffff;
  --border:#e4e6e8; --shadow:0 2px 8px rgba(0,0,0,.1);
  --menu:#ffffff; --scroll:#c9ced3;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg); color:var(--text); font-size:15px;
  transition:background .25s,color .25s;
}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
button{cursor:pointer}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

/* ============ LAYOUT ============ */
#app{display:flex;height:100vh;height:100dvh;overflow:hidden}
#sidebar{
  width:380px;min-width:320px;background:var(--panel);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  position:relative;z-index:20;transition:background .25s;
}
#chatPanel{
  flex:1;display:flex;flex-direction:column;position:relative;
  background:var(--bg);min-width:0;
}
@media(max-width:820px){
  #sidebar{width:100%;min-width:0;border-right:none}
  #chatPanel{position:fixed;inset:0;z-index:60;transform:translateX(100%);
    transition:transform .26s cubic-bezier(.4,0,.2,1);will-change:transform}
  #chatPanel.open{transform:translateX(0)}
}

/* ============ SIDEBAR HEADER ============ */
.side-head{
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;
  padding-top:calc(8px + env(safe-area-inset-top,0));
}
.icon-btn{
  width:40px;height:40px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;color:var(--text2);flex-shrink:0;transition:background .15s;
}
.icon-btn:hover{background:var(--hover)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.search-wrap{flex:1;position:relative}
.search-wrap input{
  width:100%;background:var(--panel2);border-radius:20px;padding:9px 16px 9px 40px;
  font-size:14px;color:var(--text);transition:background .2s;
}
.search-wrap input::placeholder{color:var(--text3)}
.search-wrap svg{
  position:absolute;left:13px;top:50%;transform:translateY(-50%);
  width:17px;height:17px;stroke:var(--text3);fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;pointer-events:none
}

/* ============ CHAT LIST ============ */
#chatList{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 0}
.chat-item{
  display:flex;align-items:center;gap:12px;padding:9px 12px;margin:0 6px;
  border-radius:12px;cursor:pointer;position:relative;transition:background .12s;
  user-select:none;
}
.chat-item:hover{background:var(--hover)}
.chat-item.active{background:var(--accent);color:#fff}
.chat-item.active .ci-time,.chat-item.active .ci-preview,.chat-item.active .ci-name{color:#fff}
.chat-item.active .ci-preview{opacity:.85}
.avatar{
  width:54px;height:54px;border-radius:50%;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;font-weight:600;color:#fff;
  font-size:20px;overflow:hidden;position:relative;background-size:cover;
  background-position:center;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.sm{width:42px;height:42px;font-size:16px}
.avatar.xs{width:34px;height:34px;font-size:14px}
.avatar.lg{width:110px;height:110px;font-size:42px}
.ci-body{flex:1;min-width:0}
.ci-top{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.ci-name{
  font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;flex:1;display:flex;align-items:center;gap:5px;
}
.ci-time{font-size:12px;color:var(--text3);flex-shrink:0}
.ci-bot{display:flex;align-items:center;gap:4px;margin-top:1px}
.ci-preview{
  font-size:14px;color:var(--text2);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;flex:1;line-height:1.3;
}
.badge{
  background:var(--accent);color:#fff;font-size:12px;font-weight:600;
  min-width:22px;height:22px;border-radius:11px;display:flex;align-items:center;
  justify-content:center;padding:0 6px;flex-shrink:0;
}
body.light .badge{background:#3390ec}
.chat-item.active .badge{background:#fff;color:var(--accent)}
.pin-ico,.mute-ico{width:15px;height:15px;stroke:var(--text3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.chat-item.active .pin-ico,.chat-item.active .mute-ico{stroke:#fff}
.ci-check{width:17px;height:17px;stroke:var(--accent2);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.chat-item.active .ci-check{stroke:#fff}

/* FAB */
#fab{
  position:absolute;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;
  background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(0,0,0,.35);z-index:15;transition:transform .15s,background .2s;
}
#fab:active{transform:scale(.9)}
#fab svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* ============ EMPTY STATE ============ */
#emptyState{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;color:var(--text3);text-align:center;padding:20px;
}
#emptyState .pill{
  background:var(--panel2);color:var(--text2);font-size:13px;padding:6px 14px;
  border-radius:14px;
}
#emptyState svg{width:70px;height:70px;stroke:var(--text3);fill:none;stroke-width:1.2;opacity:.5}

/* ============ CHAT VIEW ============ */
#chatView{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
#chatView.show{display:flex}
.chat-head{
  display:flex;align-items:center;gap:10px;padding:7px 10px;background:var(--panel);
  border-bottom:1px solid var(--border);flex-shrink:0;z-index:10;
  padding-top:calc(7px + env(safe-area-inset-top,0));
}
.chat-head-info{flex:1;min-width:0;cursor:pointer;padding:2px 0}
.chat-head-name{
  font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;display:flex;align-items:center;gap:6px;
}
.chat-head-sub{font-size:13px;color:var(--text2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head-sub.typing{color:var(--accent2);font-style:italic}
.back-btn{display:none}
@media(max-width:820px){.back-btn{display:flex}}

/* Messages area */
#messages{
  flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 14px 8px;
  display:flex;flex-direction:column;gap:2px;scroll-behavior:smooth;
  background-image:
    radial-gradient(circle at 15% 25%, rgba(82,136,193,.05) 0, transparent 45%),
    radial-gradient(circle at 85% 75%, rgba(100,181,239,.05) 0, transparent 45%);
}
.date-sep{
  align-self:center;background:rgba(0,0,0,.28);color:#fff;font-size:12px;
  padding:4px 12px;border-radius:12px;margin:10px 0 8px;font-weight:500;
  backdrop-filter:blur(4px);
}
body.light .date-sep{background:rgba(0,0,0,.14);color:#fff}

.msg{display:flex;gap:8px;max-width:78%;animation:msgIn .18s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.out{align-self:flex-end;flex-direction:row-reverse}
.msg.in{align-self:flex-start}
.msg.grouped{margin-top:0}
.msg-avatar{width:34px;flex-shrink:0;display:flex;align-items:flex-end}
.msg-avatar .avatar{width:34px;height:34px;font-size:14px}
.msg-avatar.hidden{visibility:hidden}

.bubble{
  position:relative;border-radius:14px;padding:7px 11px 6px;
  max-width:100%;word-break:break-word;box-shadow:var(--shadow);
  min-width:64px;
}
.msg.in .bubble{background:var(--bubble-in);border-bottom-left-radius:5px}
.msg.out .bubble{background:var(--bubble-out);border-bottom-right-radius:5px}
body.light .msg.out .bubble{color:#000}
.msg.grouped .bubble{border-radius:14px}
.msg.grouped.in .bubble{border-bottom-left-radius:14px;border-top-left-radius:14px}
.msg.grouped.out .bubble{border-bottom-right-radius:14px;border-top-right-radius:14px}

.bubble-author{font-size:13.5px;font-weight:600;color:var(--accent2);margin-bottom:2px}
.bubble-text{font-size:15px;line-height:1.35;white-space:pre-wrap;word-wrap:break-word}
.bubble-text a{color:var(--accent2);text-decoration:none}
.bubble-text a:hover{text-decoration:underline}
.bubble-meta{
  display:flex;align-items:center;gap:4px;justify-content:flex-end;
  float:right;margin:6px 0 -2px 10px;font-size:11.5px;color:var(--text3);
  line-height:1;user-select:none;
}
.msg.out .bubble-meta{color:rgba(255,255,255,.55)}
body.light .msg.out .bubble-meta{color:#6fb56f}
.bubble-meta .edited{font-style:italic;opacity:.8}
.ticks{width:16px;height:11px;display:inline-block}
.ticks svg{width:16px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.msg.out .ticks.read{color:#61c9f5}
body.light .msg.out .ticks.read{color:#4fae4e}

/* reply quote inside bubble */
.reply-quote{
  border-left:2.5px solid var(--accent2);padding:3px 8px;margin-bottom:5px;
  background:rgba(0,0,0,.15);border-radius:5px;cursor:pointer;
}
body.light .reply-quote{background:rgba(0,0,0,.045)}
.reply-quote .rq-name{font-size:12.5px;font-weight:600;color:var(--accent2);margin-bottom:1px}
.reply-quote .rq-text{
  font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:240px;
}
.msg.out .reply-quote .rq-name{color:#a8d8ff}
body.light .msg.out .reply-quote .rq-name{color:#3390ec}

/* media */
.bubble-media{margin:-3px -7px 4px;border-radius:11px;overflow:hidden;position:relative;cursor:pointer}
.bubble-media img{display:block;width:100%;max-width:340px;max-height:380px;object-fit:cover}
.bubble-media video{display:block;width:100%;max-width:340px;border-radius:11px;background:#000}
.file-row{display:flex;align-items:center;gap:10px;padding:4px 0;min-width:200px;cursor:pointer}
.file-ico{
  width:42px;height:42px;border-radius:50%;background:var(--accent);display:flex;
  align-items:center;justify-content:center;flex-shrink:0;
}
.file-ico svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.file-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.file-size{font-size:12.5px;color:var(--text2);margin-top:2px}

/* voice */
.voice-row{display:flex;align-items:center;gap:10px;min-width:190px;padding:2px 0}
.voice-play{
  width:38px;height:38px;border-radius:50%;background:var(--accent);display:flex;
  align-items:center;justify-content:center;flex-shrink:0;transition:transform .12s;
}
.voice-play:active{transform:scale(.92)}
.voice-play svg{width:15px;height:15px;fill:#fff;stroke:none}
.voice-wave{flex:1;display:flex;align-items:center;gap:2px;height:26px}
.voice-wave i{
  width:2.5px;background:var(--text3);border-radius:2px;display:block;
  transition:background .1s;
}
.voice-wave i.played{background:var(--accent2)}
.msg.out .voice-wave i{background:rgba(255,255,255,.35)}
.msg.out .voice-wave i.played{background:#fff}
body.light .msg.out .voice-wave i{background:#b6d8b0}
body.light .msg.out .voice-wave i.played{background:#4fae4e}
.voice-dur{font-size:12.5px;color:var(--text2);flex-shrink:0;min-width:34px;text-align:right}
.msg.out .voice-dur{color:rgba(255,255,255,.65)}
body.light .msg.out .voice-dur{color:#6fb56f}

/* reactions */
.reactions{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.reaction{
  background:rgba(0,0,0,.2);border-radius:11px;padding:2px 8px;font-size:13px;
  display:flex;align-items:center;gap:4px;transition:transform .12s;
}
.reaction:active{transform:scale(.9)}
.reaction.mine{background:var(--accent);color:#fff}
.reaction b{font-size:11.5px;font-weight:600}
body.light .reaction{background:rgba(0,0,0,.06)}

/* pinned bar */
#pinnedBar{
  display:none;align-items:center;gap:10px;padding:7px 14px;background:var(--panel);
  border-bottom:1px solid var(--border);cursor:pointer;flex-shrink:0;
}
#pinnedBar.show{display:flex}
#pinnedBar svg{width:18px;height:18px;stroke:var(--accent2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
#pinnedBar .pb-body{flex:1;min-width:0}
#pinnedBar .pb-title{font-size:12.5px;font-weight:600;color:var(--accent2)}
#pinnedBar .pb-text{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* search bar in chat */
#chatSearchBar{
  display:none;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);
  border-bottom:1px solid var(--border);flex-shrink:0;
}
#chatSearchBar.show{display:flex}
#chatSearchBar input{flex:1;background:var(--panel2);border-radius:18px;padding:8px 14px;font-size:14px}
.hit{background:rgba(255,215,0,.35);border-radius:3px}

/* scroll to bottom */
#scrollDown{
  position:absolute;right:16px;bottom:88px;width:46px;height:46px;border-radius:50%;
  background:var(--panel2);color:var(--text2);display:flex;align-items:center;
  justify-content:center;box-shadow:var(--shadow);opacity:0;visibility:hidden;
  transition:opacity .2s,visibility .2s,transform .2s;z-index:12;transform:translateY(10px);
}
#scrollDown.show{opacity:1;visibility:visible;transform:translateY(0)}
#scrollDown svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ============ COMPOSER ============ */
#composer{
  flex-shrink:0;background:var(--panel);border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom,0);position:relative;
}
#replyPreview{
  display:none;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--border);
}
#replyPreview.show{display:flex}
#replyPreview .rp-bar{width:3px;align-self:stretch;background:var(--accent2);border-radius:2px}
#replyPreview .rp-body{flex:1;min-width:0}
#replyPreview .rp-name{font-size:13px;font-weight:600;color:var(--accent2)}
#replyPreview .rp-text{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#replyPreview button{color:var(--text3);padding:4px}
#replyPreview button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.composer-row{display:flex;align-items:flex-end;gap:6px;padding:8px 10px}
#msgInput{
  flex:1;background:var(--panel2);border-radius:20px;padding:10px 16px;
  font-size:15px;line-height:1.35;resize:none;max-height:130px;min-height:42px;
  overflow-y:auto;color:var(--text);
}
#msgInput::placeholder{color:var(--text3)}
.send-btn{
  width:46px;height:46px;border-radius:50%;background:var(--accent);display:flex;
  align-items:center;justify-content:center;flex-shrink:0;transition:transform .12s,background .15s;
}
.send-btn:active{transform:scale(.9)}
.send-btn svg{width:21px;height:21px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.send-btn.mic{background:transparent}
.send-btn.mic svg{stroke:var(--text2)}

/* attach menu */
#attachMenu{
  position:absolute;bottom:calc(100% + 4px);left:10px;background:var(--menu);
  border-radius:14px;padding:8px;display:none;flex-direction:column;gap:2px;
  box-shadow:0 8px 28px rgba(0,0,0,.45);min-width:210px;z-index:30;
  animation:popIn .14s ease;
}
#attachMenu.show{display:flex}
@keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
.attach-item{
  display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:9px;
  font-size:14.5px;font-weight:500;text-align:left;width:100%;position:relative;
  overflow:hidden;transition:background .12s;
}
.attach-item:hover{background:var(--hover)}
.attach-item svg{width:20px;height:20px;stroke:var(--accent2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.attach-item input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}

/* emoji picker */
#emojiPicker{
  display:none;position:absolute;bottom:calc(100% + 4px);left:10px;width:min(340px,calc(100vw - 20px));
  max-height:280px;overflow-y:auto;background:var(--menu);border-radius:14px;padding:10px;
  box-shadow:0 8px 28px rgba(0,0,0,.45);z-index:30;animation:popIn .14s ease;
}
#emojiPicker.show{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
#emojiPicker button{
  font-size:23px;padding:5px;border-radius:8px;line-height:1;transition:background .1s,transform .1s;
}
#emojiPicker button:hover{background:var(--hover);transform:scale(1.12)}

/* ============ MENUS / MODALS ============ */
#ctxMenu{
  position:fixed;background:var(--menu);border-radius:12px;padding:6px;display:none;
  min-width:200px;box-shadow:0 10px 34px rgba(0,0,0,.5);z-index:900;
  animation:popIn .13s ease;
}
#ctxMenu.show{display:block}
#ctxMenu button{
  display:flex;align-items:center;gap:12px;width:100%;padding:10px 13px;
  border-radius:8px;font-size:14.5px;font-weight:500;text-align:left;transition:background .1s;
}
#ctxMenu button:hover{background:var(--hover)}
#ctxMenu button.danger{color:#ff6b6b}
#ctxMenu svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ctx-reactions{display:flex;gap:2px;padding:4px 4px 8px;border-bottom:1px solid var(--border);margin-bottom:5px;justify-content:space-between}
.ctx-reactions button{
  width:38px;height:38px;justify-content:center;font-size:22px;border-radius:50%;
  padding:0;transition:transform .12s,background .12s;
}
.ctx-reactions button:hover{transform:scale(1.2)}

.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;
  justify-content:center;z-index:800;padding:20px;backdrop-filter:blur(2px);
}
.overlay.show{display:flex;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--panel);border-radius:16px;padding:22px;width:100%;max-width:400px;
  max-height:86vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);
  animation:modalIn .2s cubic-bezier(.4,0,.2,1);
}
@keyframes modalIn{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.modal h3{font-size:19px;font-weight:600;margin-bottom:6px}
.modal .sub{font-size:13.5px;color:var(--text2);margin-bottom:16px;line-height:1.4}
.field{
  width:100%;background:var(--panel2);border-radius:10px;padding:12px 15px;
  font-size:15px;margin-bottom:10px;border:1.5px solid transparent;transition:border .15s;
}
.field:focus{border-color:var(--accent)}
textarea.field{resize:none;min-height:80px;line-height:1.4}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.btn{
  padding:10px 20px;border-radius:9px;font-size:14.5px;font-weight:600;
  transition:background .15s,transform .1s;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-ghost{color:var(--accent2)}
.btn-ghost:hover{background:var(--hover)}
.btn-danger{background:#e0483d;color:#fff}

/* lightbox */
#lightbox{
  position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:950;display:none;
  align-items:center;justify-content:center;flex-direction:column;
}
#lightbox.show{display:flex;animation:fadeIn .15s}
#lightbox img{max-width:96vw;max-height:88vh;object-fit:contain;border-radius:6px}
#lightbox .close{position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.13);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center}

/* toast */
#toast{
  position:fixed;bottom:26px;left:50%;transform:translate(-50%,80px);
  background:#2b3844;color:#fff;padding:11px 20px;border-radius:10px;font-size:14px;
  z-index:990;opacity:0;transition:all .28s cubic-bezier(.4,0,.2,1);pointer-events:none;
  max-width:88vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.4);
}
body.light #toast{background:#333;color:#fff}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* recording overlay */
#recOverlay{
  position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:920;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:30px;
}
#recOverlay.show{display:flex;animation:fadeIn .15s}
.rec-circle{
  width:120px;height:120px;border-radius:50%;
  background:linear-gradient(135deg,#e0483d,#ff8a65);display:flex;align-items:center;
  justify-content:center;animation:recPulse 1.4s ease-in-out infinite;
}
@keyframes recPulse{0%,100%{box-shadow:0 0 0 0 rgba(224,72,61,.55)}50%{box-shadow:0 0 0 26px rgba(224,72,61,0)}}
.rec-circle svg{width:48px;height:48px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#recTimer{color:#fff;font-size:30px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:1px}
#recLabel{color:rgba(255,255,255,.7);font-size:14px}
.rec-actions{display:flex;gap:16px}
.rec-actions button{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.rec-actions button svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.rec-cancel{background:rgba(255,255,255,.15)}
.rec-send{background:#4caf50}

/* typing indicator */
.typing-dots{display:inline-flex;gap:3px;align-items:center;vertical-align:middle}
.typing-dots i{width:4px;height:4px;border-radius:50%;background:currentColor;display:block;animation:td 1.2s infinite}
.typing-dots i:nth-child(2){animation-delay:.18s}
.typing-dots i:nth-child(3){animation-delay:.36s}
@keyframes td{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* settings rows */
.row{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:14px 4px;border-bottom:1px solid var(--border);
}
.row:last-child{border-bottom:none}
.row .lbl{font-size:15px;font-weight:500}
.row .desc{font-size:13px;color:var(--text2);margin-top:2px}
.switch{position:relative;width:46px;height:27px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0;position:absolute}
.slider{
  position:absolute;inset:0;background:#5b6b7a;border-radius:27px;
  cursor:pointer;transition:.25s;
}
body.light .slider{background:#c9ced3}
.slider:before{
  content:'';position:absolute;height:21px;width:21px;left:3px;bottom:3px;
  background:#fff;border-radius:50%;transition:.25s;box-shadow:0 1px 3px rgba(0,0,0,.3);
}
.switch input:checked+.slider{background:var(--accent)}
.switch input:checked+.slider:before{transform:translateX(19px)}

.color-dots{display:flex;gap:10px;flex-wrap:wrap;padding:6px 0}
.color-dot{width:34px;height:34px;border-radius:50%;border:2.5px solid transparent;transition:transform .12s}
.color-dot.active{border-color:var(--text);transform:scale(1.1)}
.color-dot:active{transform:scale(.9)}

<script>
/* =====================================================================
   TELEGRAM-STYLE MESSENGER — полностью локальное приложение
   ===================================================================== */
'use strict';

/* ------------------------- УТИЛИТЫ ------------------------- */
const $  = s => document.querySelector(s);
const $$ = s => Array.prototype.slice.call(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function fmtTime(ts){
  const d = new Date(ts);
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function fmtDur(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec / 60), s = sec % 60;
  return m + ':' + pad2(s);
}
function fmtSize(b){
  if (b < 1024) return b + ' Б';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' КБ';
  return (b / 1048576).toFixed(1) + ' МБ';
}
function sameDay(a, b){
  const x = new Date(a), y = new Date(b);
  return x.getFullYear() === y.getFullYear() && x.getMonth() === y.getMonth() && x.getDate() === y.getDate();
}
function dayLabel(ts){
  const now = new Date(), d = new Date(ts);
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const target = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const diff = Math.round((today - target) / 86400000);
  if (diff === 0) return 'Сегодня';
  if (diff === 1) return 'Вчера';
  if (diff < 7) return ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'][d.getDay()];
  return d.toLocaleDateString('ru-RU', { day:'numeric', month:'long' });
}
function listTime(ts){
  if (!ts) return '';
  const now = Date.now();
  if (sameDay(ts, now)) return fmtTime(ts);
  if (now - ts < 172800000) return 'Вчера';
  return new Date(ts).toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit' });
}
function linkify(text){
  return esc(text).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}
function toast(msg, ms){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), ms || 2200);
}

/* ------------------------- IndexedDB ------------------------- */
const DB_NAME = 'tg_messenger_db';
const DB_VER  = 1;
const STORE   = 'kv';
let _dbPromise = null;

function openDB(){
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: 'k' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return _dbPromise;
}
async function idbGet(key){
  try{
    const db = await openDB();
    return await new Promise((res, rej) => {
      const r = db.transaction(STORE, 'readonly').objectStore(STORE).get(key);
      r.onsuccess = () => res(r.result ? r.result.v : null);
      r.onerror = () => rej(r.error);
    });
  }catch(e){ return null; }
}
async function idbSet(key, value){
  try{
    const db = await openDB();
    return await new Promise((res, rej) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put({ k: key, v: value });
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  }catch(e){}
}
async function idbDel(key){
  try{
    const db = await openDB();
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(key);
  }catch(e){}
}
async function idbClear(){
  try{
    const db = await openDB();
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).clear();
    return new Promise(r => { tx.oncomplete = r; tx.onerror = r; });
  }catch(e){}
}

/* ------------------------- СОСТОЯНИЕ ------------------------- */

/* ------------------------- СОХРАНЕНИЕ ------------------------- */
let saveChatsTimer = null;
function saveChats(){
  clearTimeout(saveChatsTimer);
  saveChatsTimer = setTimeout(() => idbSet('chats', state.chats), 200);
}
function saveMessages(chatId){
  idbSet('msgs:' + chatId, state.messages[chatId] || []);
}
function saveSettings(){ idbSet('settings', state.settings); }
function saveProfile(){ idbSet('profile', state.profile); }

async function loadMessages(chatId){
  if (state.messages[chatId]) return state.messages[chatId];
  const arr = (await idbGet('msgs:' + chatId)) || [];
  state.messages[chatId] = arr;

/* ------------------------- ЭМОДЗИ ------------------------- */

/* ------------------------- БОТ-ОТВЕТЫ ------------------------- */
const BOT_REPLIES = [

/* =====================================================================
   ИНИЦИАЛИЗАЦИЯ
   ===================================================================== */
async function init(){
  const savedSettings = await idbGet('settings');
  if (savedSettings) state.settings = Object.assign(state.settings, savedSettings);
  const savedProfile = await idbGet('profile');
  if (savedProfile) state.profile = Object.assign(state.profile, savedProfile);
  const savedChats = await idbGet('chats');

  if (savedChats && Array.isArray(savedChats) && savedChats.length){
    state.chats = savedChats;
  } else {
    await seedInitialData();
  }

  applyTheme();
  applyAccent();
  renderChatList();
  buildEmojiPicker();
  bindEvents();

  // Открываем последний чат на десктопе
  if (window.innerWidth > 820 && state.chats.length){
    openChat(state.chats[0].id, true);
  }
}

/* =====================================================================
   ТЕМА
   ===================================================================== */
function applyTheme(){
  document.body.classList.toggle('light', state.settings.theme === 'light');
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', state.settings.theme === 'light' ? '#ffffff' : '#17212b');
}
function applyAccent(){
  document.documentElement.style.setProperty('--accent', state.settings.accent);
  document.documentElement.style.setProperty('--accent2', state.settings.accent);
}
function toggleTheme(){
  state.settings.theme = state.settings.theme === 'light' ? 'dark' : 'light';
  applyTheme(); saveSettings();
}

/* =====================================================================
   АВАТАР
   ===================================================================== */
function avatarHTML(chat, size){
  const cls = size || '';
  if (chat.avatar){
    return `<div class="avatar ${cls}"><img src="${chat.avatar}" alt=""></div>`;
  }
  const bg = chat.color || '#5288c1';
  const letter = chat.emoji || (chat.name || '?').trim().charAt(0).toUpperCase();
  return `<div class="avatar ${cls}" style="background:linear-gradient(135deg,${bg},${shade(bg,-18)})">${esc(letter)}</div>`;
}
function shade(hex, pct){
  const n = parseInt(hex.replace('#',''), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = clamp(Math.round(r + (pct/100)*255), 0, 255);
  g = clamp(Math.round(g + (pct/100)*255), 0, 255);
  b = clamp(Math.round(b + (pct/100)*255), 0, 255);
  return '#' + ((1<<24) + (r<<16) + (g<<8) + b).toString(16).slice(1);
}
function getChat(id){ return state.chats.find(c => c.id === id); }

/* =====================================================================
   СПИСОК ЧАТОВ
   ===================================================================== */
function renderChatList(){
  const q = ($('#searchInput').value || '').trim().toLowerCase();
  let chats = state.chats.slice();
  if (q){
    chats = chats.filter(c => c.name.toLowerCase().includes(q) ||
      (c.lastText || '').toLowerCase().includes(q));
  }
  chats.sort((a, b) => {
    if (!!b.pinned !== !!a.pinned) return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0);
    return (b.lastTs || 0) - (a.lastTs || 0);
  });

  const box = $('#chatList');
  if (!chats.length){
    box.innerHTML = `<div style="text-align:center;padding:50px 20px;color:var(--text3);font-size:14px">
      ${q ? 'Ничего не найдено' : 'Нет чатов'}</div>`;
    return;
  }

  box.innerHTML = chats.map(c => {
    const active = c.id === currentChatId ? ' active' : '';
    const preview = buildPreview(c);
    return `
      <div class="chat-item${active}" data-id="${c.id}">
        ${avatarHTML(c)}
        <div class="ci-body">
          <div class="ci-top">
            <div class="ci-name">
              ${c.pinned ? `<span class="pin-ico">${ICO.pin}</span>` : ''}
              <span style="overflow:hidden;text-overflow:ellipsis">${esc(c.name)}</span>
            </div>
            <div class="ci-time">${listTime(c.lastTs)}</div>
          </div>
          <div class="ci-bot">
            ${c.lastOut ? `<span class="ci-check">${ICO.checks}</span>` : ''}
            <div class="ci-preview">${preview}</div>
            ${c.muted ? `<span class="mute-ico">${ICO.mute}</span>` : ''}
            ${c.unread > 0 && !c.muted ? `<div class="badge">${c.unread > 99 ? '99+' : c.unread}</div>` : ''}
            ${c.unread > 0 && c.muted ? `<div class="badge" style="background:var(--text3)">${c.unread}</div>` : ''}
          </div>
        </div>
      </div>`;
  }).join('');

  box.querySelectorAll('.chat-item').forEach(el => {
    el.addEventListener('click', () => openChat(el.dataset.id));
    el.addEventListener('contextmenu', e => {
      e.preventDefault();
      showChatContext(e.clientX, e.clientY, el.dataset.id);
    });
    bindLongPress(el, (x, y) => showChatContext(x, y, el.dataset.id));
  });
}

function buildPreview(c){
  if (c.draft) return `<span style="color:#e0483d">Черновик:</span> ${esc(c.draft)}`;
  return esc(c.lastText || 'Нет сообщений');
}

/* =====================================================================
   ОТКРЫТИЕ ЧАТА
   ===================================================================== */
async function openChat(id, silent){
  const chat = getChat(id);
  if (!chat) return;
  currentChatId = id;
  chat.unread = 0;
  saveChats();

  await loadMessages(id);

  $('#emptyState').style.display = 'none';
  $('#chatView').classList.add('show');
  $('#chatPanel').classList.add('open');

  $('#headAvatar').outerHTML = avatarHTML(chat, 'sm').replace('class="avatar sm"', 'class="avatar sm" id="headAvatar"');
  $('#headName').textContent = chat.name;
  updateHeadSub(chat);

  $('#msgInput').value = chat.draft || '';
  autoGrow();
  updateSendButton();
  cancelReplyUI();
  editingId = null;

  renderMessages();
  renderChatList();
  closeMenus();

  if (!silent){
    setTimeout(() => $('#msgInput').focus(), 120);
  }
}
function updateHeadSub(chat){
  const sub = $('#headSub');
  if (chat.type === 'saved'){ sub.textContent = 'ваши заметки'; return; }
  if (chat.bot){ sub.textContent = 'бот'; return; }
  if (chat.members){ sub.textContent = chat.members + ' участников'; return; }
  sub.textContent = 'был(а) недавно';
}

/* =====================================================================
   РЕНДЕР СООБЩЕНИЙ
   ===================================================================== */
function renderMessages(){
  const chatId = currentChatId;
  if (!chatId) return;
  const list = state.messages[chatId] || [];
  const box = $('#messages');
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 160;

  if (!list.length){
    box.innerHTML = `<div style="margin:auto;text-align:center;color:var(--text3);font-size:14px;padding:40px">
      Нет сообщений.<br>Напишите первым!</div>`;
    updatePinnedBar();
    return;
  }

  let html = '';
  let lastDay = null;
  for (let i = 0; i < list.length; i++){
    const m = list[i];
    const prev = list[i - 1];
    const next = list[i + 1];

    if (!lastDay || !sameDay(lastDay, m.ts)){
      html += `<div class="date-sep">${dayLabel(m.ts)}</div>`;
      lastDay = m.ts;
    }

    const grouped = prev && prev.out === m.out && (m.ts - prev.ts < 300000) &&
                    sameDay(prev.ts, m.ts) && !m.replyTo && !prev.replyTo;
    html += messageHTML(m, grouped);
  }

  box.innerHTML = html;
  bindMessageEvents();

  if (nearBottom || !box.dataset.init){
    box.dataset.init = '1';
    requestAnimationFrame(() => { box.scrollTop = box.scrollHeight; });
  }
  updatePinnedBar();
  markVisibleRead();
}

function messageHTML(m, grouped){
  const chat = getChat(currentChatId);
  const isOut = m.out;
  const cls = `msg ${isOut ? 'out' : 'in'}${grouped ? ' grouped' : ''}`;

  let inner = '';

  // reply quote
  if (m.replyTo){
    inner += `<div class="reply-quote" data-jump="${m.replyTo.id}">
      <div class="rq-name">${esc(m.replyTo.name)}</div>
      <div class="rq-text">${esc(m.replyTo.text || 'Вложение')}</div>
    </div>`;
  }

  // author name (incoming, not saved, not grouped)
  if (!isOut && !grouped && chat && chat.type !== 'saved' && chat.id !== 'saved'){
    inner += `<div class="bubble-author">${esc(chat.name)}</div>`;
  }

  // content
  if (m.type === 'photo' && m.media && m.media.url){
    inner += `<div class="bubble-media" data-lightbox="${m.id}">
      <img src="${m.media.url}" alt="" loading="lazy">
    </div>`;
  } else if (m.type === 'video' && m.media && m.media.url){
    inner += `<div class="bubble-media"><video src="${m.media.url}" controls preload="metadata"></video></div>`;
  } else if (m.type === 'file'){
    inner += `<div class="file-row" data-download="${m.id}">
      <div class="file-ico">${ICO.file}</div>
      <div style="min-width:0">
        <div class="file-name">${esc(m.media ? m.media.name : 'Файл')}</div>
        <div class="file-size">${fmtSize(m.media ? m.media.size : 0)}</div>
      </div>
    </div>`;
  } else if (m.type === 'voice'){
    const wave = (m.media && m.media.waveform) || genWave(28);
    const bars = wave.map((h, i) => `<i style="height:${Math.max(3, Math.round(h * 22))}px" data-i="${i}"></i>`).join('');
    inner += `<div class="voice-row" data-voice="${m.id}">
      <button class="voice-play" data-play="${m.id}">${ICO.play}</button>
      <div class="voice-wave">${bars}</div>
      <div class="voice-dur">${fmtDur(m.media ? m.media.duration : 0)}</div>
    </div>`;
  }

  if (m.text){
    inner += `<div class="bubble-text">${linkify(m.text)}</div>`;
  }

  // reactions
  const rks = Object.keys(m.reactions || {});
  if (rks.length){
    inner += `<div class="reactions">` + rks.map(e =>
      `<button class="reaction${m.reactions[e].mine ? ' mine' : ''}" data-react="${e}">${e}<b>${m.reactions[e].count}</b></button>`
    ).join('') + `</div>`;
  }

  // meta
  const ticks = isOut
    ? `<span class="ticks${m.read ? ' read' : ''}">${m.read ? ICO.checks : ICO.check}</span>`
    : '';
  inner += `<div class="bubble-meta">
    ${m.edited ? '<span class="edited">изм.</span>' : ''}
    <span>${fmtTime(m.ts)}</span>${ticks}
  </div>`;

  const avatarBlock = (!isOut && !grouped)
    ? `<div class="msg-avatar">${avatarHTML(chat || {name:'?'}, 'xs')}</div>`
    : `<div class="msg-avatar hidden"></div>`;

  return `<div class="${cls}" data-mid="${m.id}" id="m_${m.id}">
    ${!isOut ? avatarBlock : ''}
    <div class="bubble">${inner}</div>
  </div>`;
}

function bindMessageEvents(){
  $$('#messages .msg').forEach(el => {
    const mid = el.dataset.mid;
    el.addEventListener('contextmenu', e => {
      e.preventDefault();
      showMessageContext(e.clientX, e.clientY, mid);
    });
    bindLongPress(el, (x, y) => showMessageContext(x, y, mid));

    el.addEventListener('click', e => {
      const rq = e.target.closest('.reply-quote');
      if (rq){ jumpToMessage(rq.dataset.jump); return; }
      const react = e.target.closest('[data-react]');
      if (react){ toggleReaction(mid, react.dataset.react); return; }
      const lb = e.target.closest('[data-lightbox]');
      if (lb){ openLightbox(mid); return; }
      const dl = e.target.closest('[data-download]');
      if (dl){ downloadMsgFile(mid); return; }
      const pb = e.target.closest('[data-play]');
      if (pb){ toggleVoice(pb.dataset.play, pb); return; }
    });
  });
}

function genWave(n){
  const a = [];
  for (let i = 0; i < n; i++) a.push(0.25 + Math.random() * 0.75);
  return a;
}

function markVisibleRead(){
  const list = state.messages[currentChatId] || [];
  let changed = false;
  for (let i = list.length - 1; i >= 0; i--){
    if (!list[i].out && !list[i].read){ list[i].read = true; changed = true; }
  }
  if (changed) saveMessages(currentChatId);
}

function updatePinnedBar(){
  const chat = getChat(currentChatId);
  const list = state.messages[currentChatId] || [];
  const pinned = list.filter(m => m.pinned).pop();
  const bar = $('#pinnedBar');
  if (pinned){
    bar.classList.add('show');
    $('#pbText').textContent = pinned.text || 'Вложение';
  } else {
    bar.classList.remove('show');
  }
}

/* =====================================================================
   ОТПРАВКА СООБЩЕНИЙ
   ===================================================================== */
function pushMessage(chatId, msg){
  if (!state.messages[chatId]) state.messages[chatId] = [];
  state.messages[chatId].push(msg);
  state.messages[chatId].sort((a, b) => a.ts - b.ts);
  saveMessages(chatId);

  const chat = getChat(chatId);
  if (chat){
    chat.lastTs = msg.ts;
    chat.lastOut = msg.out;
    if (msg.text) chat.lastText = msg.text;
    else if (msg.type === 'photo') chat.lastText = '📷 Фото';
    else if (msg.type === 'video') chat.lastText = '🎬 Видео';
    else if (msg.type === 'file') chat.lastText = '📎 ' + (msg.media ? msg.media.name : 'Файл');
    else if (msg.type === 'voice') chat.lastText = '🎤 Голосовое сообщение';
    else chat.lastText = 'Сообщение';

    if (!msg.out && chatId !== currentChatId){
      chat.unread = (chat.unread || 0) + 1;
      if (!chat.muted) playPop();
    }
    saveChats();
  }
}

function sendText(){
  const inp = $('#msgInput');
  const text = inp.value.trim();
  if (!text) return;

  if (editingId){
    const list = state.messages[currentChatId] || [];
    const m = list.find(x => x.id === editingId);
    if (m){ m.text = text; m.edited = true; saveMessages(currentChatId); }
    editingId = null;
    cancelReplyUI();
    inp.value = '';
    autoGrow();
    renderMessages();
    renderChatList();
    return;
  }

  const msg = {
    id: uid(), out: true, type: 'text', text,
    ts: Date.now(), read: false, reactions: {}
  };
  if (replyTo){
    msg.replyTo = { id: replyTo.id, name: replyTo.name, text: replyTo.text || 'Вложение' };
  }
  replyTo = null;

  saveChats();

function sendMedia(type, media, text){

    id: uid(), out: true, type, media, text: text || '',

  pushMessage(currentChatId, msg);
  renderMessages();
  renderChatList();

/* ---------------- БОТ ---------------- */
function scheduleBotReply(chatId, userMsg){
  const chat = getChat(chatId);
  if (!chat || !chat.bot) return;
  if (chatId !== currentChatId && state.messages[chatId]) return;

  const delay = 900 + Math.random() * 1800;

  // Показываем "печатает"
  if (chatId === currentChatId){
    setTimeout(() => {
      if (chatId !== currentChatId) return;
      const sub = $('#headSub');
      sub.classList.add('typing');
      sub.innerHTML = `печатает<span class="typing-dots"><i></i><i></i><i></i></span>`;
    }, 400);
  }

  setTimeout(async () => {
    await loadMessages(chatId);

    // Иногда бот реагирует на сообщение
    if (Math.random() < 0.25 && chatId === currentChatId){
      const list = state.messages[chatId];
      const target = list.find(x => x.id === userMsg.id);
      if (target){
        const e = BOT_EMOJI_REACTIONS[Math.floor(Math.random() * BOT_EMOJI_REACTIONS.length)];
        target.reactions = target.reactions || {};
        if (!target.reactions[e]) target.reactions[e] = { count: 0, mine: false };
        target.reactions[e].count++;
        saveMessages(chatId);
        if (chatId === currentChatId) renderMessages();
      }
    }

    let text = BOT_REPLIES[Math.floor(Math.random() * BOT_REPLIES.length)];
    if (chatId === 'tg_bot'){
      text = ['Это демо-бот 🙂', 'Попробуйте отправить фото или голосовое!', 'Все данные хранятся локально в вашем браузере.',
              'Кнопка «+» создаёт новый чат.', 'Можно отвечать, редактировать и удалять сообщения.'][Math.floor(Math.random()*5)];
    }

    const reply = {
      id: uid(), out: false, type: 'text', text,
      ts: Date.now(), reactions: {}
    };
    pushMessage(chatId, reply);
    saveMessages(chatId);

    if (chatId === currentChatId){
      const sub = $('#headSub');
      sub.classList.remove('typing');
      updateHeadSub(chat);
      renderMessages();
      scrollToBottom(true);
    }
    renderChatList();
    if (chatId !== currentChatId) playPop();
  }, delay);
}

function openCtxMenu(x, y, html, handler){
  const menu = $('#ctxMenu');
  menu.innerHTML = html;
  menu.classList.add('show');

  const rect = menu.getBoundingClientRect();
  const maxX = window.innerWidth - rect.width - 8;
  const maxY = window.innerHeight - rect.height - 8;
  menu.style.left = clamp(x, 8, maxX) + 'px';
  menu.style.top  = clamp(y, 8, maxY) + 'px';

  const onClick = e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    e.stopPropagation();
    const a = btn.dataset.a;
    const r = btn.dataset.r;
    closeMenus();
    handler(r ? 'r:' + r : a);
  };
  menu.addEventListener('click', onClick, { once: false });
  menu._cleanup = () => menu.removeEventListener('click', onClick);

  setTimeout(() => {
    document.addEventListener('pointerdown', outsideClose, true);
  }, 10);
}
function outsideClose(e){
  const menu = $('#ctxMenu');
  if (menu.classList.contains('show') && !menu.contains(e.target)){
    closeMenus();
  }
}
function closeMenus(){
  const menu = $('#ctxMenu');
  if (menu._cleanup) menu._cleanup();
  menu.classList.remove('show');
  document.removeEventListener('pointerdown', outsideClose, true);
  $('#attachMenu').classList.remove('show');
  $('#emojiPicker').classList.remove('show');
}

function toggleReaction(mid, emoji){
  const list = state.messages[currentChatId] || [];
  const m = list.find(v => v.id === mid);
  if (!m) return;
  m.reactions = m.reactions || {};

  if (r && r.mine){
    r.count--;
    r.mine = false;
    if (r.count <= 0) delete m.reactions[emoji];
  } else {
    if (!m.reactions[emoji]) m.reactions[emoji] = { count: 0, mine: false };

  }

/* -------- VOICE PLAYBACK -------- */
const audioCache = {};
function toggleVoice(mid, btn){
  const list = state.messages[currentChatId] || [];
  const m = list.find(v => v.id === mid);
  if (!m || !m.media || !m.media.url){ toast('Аудио недоступно'); return; }

  let audio = audioCache[mid];
  if (!audio){
    audio = new Audio(m.media.url);
    audioCache[mid] = audio;
  }
  const row = btn.closest('.voice-row');
  const bars = row.querySelectorAll('.voice-wave i');

  if (audio.paused){
    Object.keys(audioCache).forEach(k => { if (k !== mid) audioCache[k].pause(); });
    $$('.voice-play').forEach(b => { if (b !== btn) b.innerHTML = ICO.play; });
    audio.play();
    btn.innerHTML = ICO.pause;
    const upd = () => {
      if (audio.paused) return;
      const p = audio.currentTime / (audio.duration || 1);
      const upto = Math.floor(p * bars.length);
      bars.forEach((b, i) => b.classList.toggle('played', i < upto));
      if (!audio.paused) requestAnimationFrame(upd);
    };
    requestAnimationFrame(upd);
    audio.onended = () => {
      btn.innerHTML = ICO.play;
      bars.forEach(b => b.classList.remove('played'));
    };
  } else {
    audio.pause();
    btn.innerHTML = ICO.play;
  }
}

/* =====================================================================
   ГОЛОСОВАЯ ЗАПИСЬ
   ===================================================================== */
let mediaRecorder = null, recChunks = [], recTimer = null, recSeconds = 0, recStream = null;

async function startRecording(){
  if (!navigator.mediaDevices || !window.MediaRecorder){
    toast('Запись не поддерживается');
    return;
  }
  try{
    recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  }catch(e){
    toast('Нет доступа к микрофону');
    return;
  }
  recChunks = [];
  recSeconds = 0;
  $('#recTimer').textContent = '0:00';
  $('#recOverlay').classList.add('show');

  let mime = 'audio/webm';
  if (!MediaRecorder.isTypeSupported(mime)) mime = '';
  try{
    mediaRecorder = mime ? new MediaRecorder(recStream, { mimeType: mime }) : new MediaRecorder(recStream);
  }catch(e){
    toast('Ошибка записи');
    stopRecordingCleanup();
    return;
  }
  mediaRecorder.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
  mediaRecorder.onstop = onRecordStop;
  mediaRecorder.start();

  recTimer = setInterval(() => {
    recSeconds++;
    $('#recTimer').textContent = fmtDur(recSeconds);
    if (recSeconds >= 300) stopRecording(true);
  }, 1000);
}
function stopRecordingCleanup(){
  if (recTimer){ clearInterval(recTimer); recTimer = null; }
  if (recStream){ recStream.getTracks().forEach(t => t.stop()); recStream = null; }
  $('#recOverlay').classList.remove('show');
}
function cancelRecording(){
  if (mediaRecorder && mediaRecorder.state !== 'inactive'){
    mediaRecorder.onstop = null;
    mediaRecorder.stop();
  }
  mediaRecorder = null;
  recChunks = [];
  stopRecordingCleanup();
}
function stopRecording(send){
  if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
  mediaRecorder._send = !!send;
  mediaRecorder.stop();
}
function onRecordStop(){
  const shouldSend = mediaRecorder && mediaRecorder._send;
  const dur = recSeconds;
  const chunks = recChunks.slice();
  mediaRecorder = null;
  recChunks = [];
  stopRecordingCleanup();

  if (!shouldSend || !chunks.length){ return; }
  const blob = new Blob(chunks, { type: chunks[0].type || 'audio/webm' });
  const reader = new FileReader();
  reader.onload = () => {
    const media = {
      url: reader.result,
      duration: dur,
      size: blob.size,
      waveform: genWave(28)
    };
    sendMedia('voice', media);
    toast('Голосовое отправлено');
  };
  reader.readAsDataURL(blob);
}

/* =====================================================================
   ФАЙЛЫ / ФОТО
   ===================================================================== */
const MAX_FILE = 8 * 1024 * 1024;

function handleFile(file, kind){
  if (!file) return;
  if (file.size > MAX_FILE){ toast('Файл слишком большой (макс. 8 МБ)'); return; }

  const isImage = file.type.startsWith('image/');
  const isVideo = file.type.startsWith('video/');

  if (kind === 'image' && isImage && file.size > 1.2 * 1024 * 1024){
    compressImage(file).then(dataUrl => {
      sendMedia('photo', { url: dataUrl, name: file.name, size: dataUrl.length });
      toast('Фото отправлено');
    }).catch(() => readAndSend(file, 'photo'));
    return;
  }

  if (kind === 'image'){
    if (isImage){ readAndSend(file, 'photo'); return; }
    if (isVideo){ readAndSend(file, 'video'); return; }
    toast('Неподдерживаемый формат');
    return;
  }
  readAndSend(file, 'file');
}

function readAndSend(file, type){
  const reader = new FileReader();
  reader.onload = () => {
    sendMedia(type, {
      url: reader.result,
      name: file.name,
      size: file.size,
      mime: file.type
    });
    toast(type === 'file' ? 'Файл отправлен' : 'Отправлено');
  };
  reader.onerror = () => toast('Ошибка чтения файла');
  reader.readAsDataURL(file);
}

function compressImage(file){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const MAX = 1280;
      let w = img.width, h = img.height;
      if (w > MAX || h > MAX){
        if (w > h){ h = Math.round(h * MAX / w); w = MAX; }
        else { w = Math.round(w * MAX / h); h = MAX; }
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL('image/jpeg', 0.78));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('bad')); };
    img.src = url;
  });
}

    <h3>Новая группа</h3>
    <div class="sub">Создайте групповой чат</div>
    <input class="field" id="ngName" placeholder="Название группы" maxlength="40">
    <input class="field" id="ngDesc" placeholder="Описание (необязательно)" maxlength="80">
    <div class="color-dots" id="ngColors">
      ${ACCENTS.map((c, i) => `<button class="color-dot${i === 2 ? ' active' : ''}" data-c="${c}" style="background:${c}"></button>`).join('')}
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-close>Отмена</button>
      <button class="btn btn-primary" id="ngCreate">Создать</button>
    </div>`);
  let color = ACCENTS[2];
  $$('#ngColors .color-dot').forEach(d => d.addEventListener('click', () => {
    $$('#ngColors .color-dot').forEach(x => x.classList.remove('active'));
    d.classList.add('active'); color = d.dataset.c;
  }));
  $('#ngName').focus();
  $('#ngCreate').addEventListener('click', () => {
    const name = $('#ngName').value.trim();
    if (!name){ toast('Введите название'); return; }
    const desc = $('#ngDesc').value.trim();
    const id = 'g_' + uid();
    const chat = {
      id, type: 'group', name, color, emoji: '👥',
      members: 3, desc, bot: true, pinned: false, muted: false, unread: 0,
      lastText: desc || 'Группа создана', lastTs: Date.now(), createdAt: Date.now()
    };

    state.messages[id] = [{
      id: uid(), out: false, type: 'text',
      text: `Группа «${name}» создана 👥`, ts: Date.now(), reactions: {}
    }];
    saveChats(); saveMessages(id);
    closeModal();
    renderChatList();
    openChat(id);
    toast('Группа создана');
  });
}

/* =====================================================================
   ЗВУК
   ===================================================================== */
let audioCtx = null;
function playPop(){
  if (!state.settings.sound) return;
  try{
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(880, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime + 0.07);
    g.gain.setValueAtTime(0.06, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.16);
    o.start(); o.stop(audioCtx.currentTime + 0.17);
  }catch(e){}
}

function autoGrow(){
  const t = $('#msgInput');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 130) + 'px';
}
function updateSendButton(){
  const has = $('#msgInput').value.trim().length > 0;
  const btn = $('#sendBtn');
  if (has){
    btn.classList.remove('mic');
    btn.innerHTML = '<svg viewBox="0 0 24 24"><line x1="21.5" y1="2.5" x2="11" y2="13"/><polygon points="21.5 2.5 15 21.5 11 13 2.5 9 21.5 2.5"/></svg>';

}
function scrollToBottom(smooth){
  const box = $('#messages');
  if (smooth) box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
  else box.scrollTop = box.scrollHeight;
}

/* =====================================================================
   LONG PRESS
   ===================================================================== */
function bindLongPress(el, cb){
  let timer = null, startX = 0, startY = 0, fired = false;

  const start = e => {
    const t = e.touches ? e.touches[0] : e;
    startX = t.clientX; startY = t.clientY;
    fired = false;
    timer = setTimeout(() => {
      fired = true;
      if (navigator.vibrate) navigator.vibrate(18);
      cb(startX, startY);
    }, 480);
  };
  const move = e => {
    if (!timer) return;
    const t = e.touches ? e.touches[0] : e;
    if (Math.hypot(t.clientX - startX, t.clientY - startY) > 12){
      clearTimeout(timer); timer = null;
    }
  };
  const end = e => {
    if (timer){ clearTimeout(timer); timer = null; }
  };

  el.addEventListener('touchstart', start, { passive: true });
  el.addEventListener('touchmove', move, { passive: true });
  el.addEventListener('touchend', end);
  el.addEventListener('touchcancel', end);
  el.addEventListener('mousedown', e => { if (e.button === 0) start(e); });
  el.addEventListener('mousemove', move);
  el.addEventListener('mouseup', end);
  el.addEventListener('mouseleave', end);
  el.addEventListener('click', e => { if (fired){ e.stopPropagation(); e.preventDefault(); } }, true);
}

/* =====================================================================
   СОБЫТИЯ
   ===================================================================== */
function bindEvents(){
  // Поиск по чатам
  $('#searchInput').addEventListener('input', renderChatList);

  // FAB
  $('#fab').addEventListener('click', showNewChatMenu);

  // Меню в сайдбаре
  $('#menuBtn').addEventListener('click', e => {
    const rect = e.currentTarget.getBoundingClientRect();
    const html = `
      <button data-a="settings">${ICO.gear}Настройки</button>
      <button data-a="theme">${state.settings.theme === 'dark' ? ICO.sun : ICO.moon}${state.settings.theme === 'dark' ? 'Светлая тема' : 'Тёмная тема'}</button>
      <button data-a="profile">${ICO.user}Профиль</button>`;
    openCtxMenu(rect.left, rect.bottom + 6, html, a => {
      if (a === 'settings') openSettings();
      if (a === 'theme') toggleTheme();
      if (a === 'profile') openSettings();
    });
  });

  // Кнопка "назад"
  $('#backBtn').addEventListener('click', () => {
    $('#chatPanel').classList.remove('open');
    currentChatId = null;
    renderChatList();
  });

  // Меню чата
  $('#chatMenuBtn').addEventListener('click', e => {
    if (!currentChatId) return;
    const chat = getChat(currentChatId);
    const rect = e.currentTarget.getBoundingClientRect();
    let html = '';
    if (chat.type !== 'saved'){
      html += `<button data-a="pin">${ICO.pin}${chat.pinned ? 'Открепить' : 'Закрепить'}</button>`;
      html += `<button data-a="mute">${ICO.mute}${chat.muted ? 'Включить звук' : 'Без звука'}</button>`;
    }
    html += `<button data-a="info">${ICO.user}Информация</button>`;
    html += `<button data-a="clear">${ICO.trash}Очистить историю</button>`;
    if (chat.type !== 'saved'){
      html += `<button data-a="delete" class="danger">${ICO.trash}Удалить чат</button>`;
    }
    openCtxMenu(rect.right - 220, rect.bottom + 6, html, a => {
      if (a === 'pin'){ chat.pinned = !chat.pinned; saveChats(); renderChatList(); toast(chat.pinned ? 'Закреплено' : 'Откреплено'); }
      if (a === 'mute'){ chat.muted = !chat.muted; saveChats(); renderChatList(); toast(chat.muted ? 'Без звука' : 'Звук включён'); }
      if (a === 'info') openChatInfo();
      if (a === 'clear'){
        if (confirm('Очистить историю?')){
          state.messages[currentChatId] = [];
          saveMessages(currentChatId);
          chat.lastText = 'Нет сообщений'; chat.lastOut = false;
          saveChats();
          renderMessages(); renderChatList();
          toast('История очищена');
        }
      }
      if (a === 'delete'){
        if (confirm('Удалить чат?')){
          const id = currentChatId;
          state.chats = state.chats.filter(c => c.id !== id);
          delete state.messages[id];
          idbDel('msgs:' + id);
          saveChats();
          currentChatId = null;
          $('#chatView').classList.remove('show');
          $('#chatPanel').classList.remove('open');
          $('#emptyState').style.display = 'flex';
          renderChatList();
          toast('Чат удалён');
        }
      }
    });
  });

  // Клик по заголовку чата → инфо
  $('#headInfo').addEventListener('click', openChatInfo);

  // Поиск внутри чата
  $('#chatSearchBtn').addEventListener('click', toggleChatSearch);
  $('#closeSearchBtn').addEventListener('click', toggleChatSearch);
  $('#inChatSearch').addEventListener('input', e => highlightHits(e.target.value.trim()));

  // Скролл
  const box = $('#messages');
  box.addEventListener('scroll', () => {
    const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 200;
    $('#scrollDown').classList.toggle('show', !nearBottom && box.scrollHeight > box.clientHeight + 100);
  });
  $('#scrollDown').addEventListener('click', () => scrollToBottom(true));

  // Ввод сообщения
  const inp = $('#msgInput');
  inp.addEventListener('input', () => {
    autoGrow();
    updateSendButton();
    if (currentChatId){
      const chat = getChat(currentChatId);
      if (chat){ chat.draft = inp.value; saveChats(); }
    }
  });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter'){
      if (!state.settings.sendByEnter){ return; }
      if (e.shiftKey) return;
      e.preventDefault();
      sendText();
    }
  });
  inp.addEventListener('paste', e => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const it of items){
      if (it.type.indexOf('image') === 0){
        e.preventDefault();
        const f = it.getAsFile();
        handleFile(f, 'image');
        return;
      }
    }
  });

  // Отправка / запись
  $('#sendBtn').addEventListener('click', () => {
    if ($('#msgInput').value.trim()) sendText();
    else startRecording();
  });

  // Отмена ответа/редактирования
  $('#cancelReply').addEventListener('click', () => {
    if (editingId){
      editingId = null;
      $('#msgInput').value = '';
      autoGrow(); updateSendButton();
    }
    cancelReplyUI();
  });

  // Вложения
  $('#attachBtn').addEventListener('click', e => {
    e.stopPropagation();
    $('#emojiPicker').classList.remove('show');
    $('#attachMenu').classList.toggle('show');
  });
  $('#emojiBtn').addEventListener('click', e => {
    e.stopPropagation();
    $('#attachMenu').classList.remove('show');
    $('#emojiPicker').classList.toggle('show');
  });
  $('#fileImage').addEventListener('change', e => {
    const f = e.target.files[0];
    e.target.value = '';
    closeMenus();
    handleFile(f, 'image');
  });
  $('#fileAny').addEventListener('change', e => {
    const f = e.target.files[0];
    e.target.value = '';
    closeMenus();
    handleFile(f, 'file');
  });
  $('#btnVoiceFromMenu').addEventListener('click', () => {
    closeMenus();
    startRecording();
  });

  // Запись
  $('#recCancel').addEventListener('click', cancelRecording);
  $('#recSend').addEventListener('click', () => stopRecording(true));

  // Лайтбокс
  $('#lightbox').addEventListener('click', () => $('#lightbox').classList.remove('show'));

  // Модалка
  $('#modalOverlay').addEventListener('click', e => {
    if (e.target === $('#modalOverlay')) closeModal();
  });

  // Закрытие меню по клику вне
  document.addEventListener('click', e => {
    const am = $('#attachMenu'), ep = $('#emojiPicker');
    if (am.classList.contains('show') && !am.contains(e.target) && e.target !== $('#attachBtn') && !$('#attachBtn').contains(e.target))
      am.classList.remove('show');
    if (ep.classList.contains('show') && !ep.contains(e.target) && e.target !== $('#emojiBtn') && !$('#emojiBtn').contains(e.target))
      ep.classList.remove('show');
  });

  // Escape
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape'){
      closeMenus();
      closeModal();
      $('#lightbox').classList.remove('show');
      if ($('#chatSearchBar').classList.contains('show')) toggleChatSearch();
    }
  });

  // Адаптив: при ресайзе на десктоп
  window.addEventListener('resize', () => {
    if (window.innerWidth > 820){
      $('#chatPanel').classList.add('open');
    } else if (!currentChatId){
      $('#chatPanel').classList.remove('open');
    }
  });
  if (window.innerWidth > 820) $('#chatPanel').classList.add('open');
}

    toast('Ошибка инициализации');
