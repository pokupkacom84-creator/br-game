<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BR 2D Online</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05070b;
      touch-action:none; user-select:none; -webkit-user-select:none;
      -webkit-tap-highlight-color:transparent; }
  canvas { display:block; }

  :root {
    --accent: #ffa726;
    --accent2: #ff6f00;
    --bg: #0a0e14;
    --card: rgba(18,24,33,0.85);
    --card2: rgba(12,17,24,0.9);
    --border: rgba(255,255,255,0.08);
    --text: #eef3f8;
    --muted: #7c8a9c;
    --muted2: #5a6675;
    --success: #10d9a3;
    --danger: #ff4d6d;
    --fs-xs: clamp(9.5px, 1.9vh, 12px);
    --fs-sm: clamp(11px, 2.2vh, 14px);
    --fs-md: clamp(13px, 2.6vh, 16px);
    --fs-lg: clamp(16px, 3.2vh, 22px);
    --fs-xl: clamp(22px, 4.6vh, 34px);
    --g: clamp(6px, 1.4vh, 14px);
    --pad: clamp(10px, 2.2vh, 22px);
    --h: clamp(34px, 8vh, 52px);
    --radius: clamp(10px, 2vh, 16px);
  }

  .screen { position:fixed; inset:0; z-index:20; color:var(--text); overflow:hidden; }
  .hidden { display:none !important; }

  /* ================ AUTH ================ */
  #authScreen {
    display:flex; align-items:center; justify-content:center;
    padding: var(--pad);
    background:
      radial-gradient(1000px 600px at 20% -10%, rgba(255,167,38,0.16), transparent 60%),
      radial-gradient(900px 700px at 110% 110%, rgba(41,121,255,0.14), transparent 60%),
      linear-gradient(180deg, #0c1118 0%, #05070b 100%);
  }
  .authCard {
    width: min(100%, 900px);
    display: grid;
    grid-template-columns: minmax(0,1fr) minmax(0,1fr) auto;
    gap: var(--g);
    padding: calc(var(--pad) * 1.2);
    border-radius: calc(var(--radius) * 1.2);
    background: linear-gradient(180deg, rgba(18,24,33,0.92), rgba(10,14,20,0.96));
    border: 1px solid var(--border);
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
  }
  .brand {
    grid-column: 1 / -1;
    text-align: center;
    font-size: var(--fs-lg);
    font-weight: 900;
    letter-spacing: 6px;
    background: linear-gradient(90deg, #ffa726, #ff6f00);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    padding-bottom: 4px;
  }
  .brandSub {
    grid-column: 1 / -1;
    text-align: center;
    font-size: var(--fs-xs);
    color: var(--muted);
    letter-spacing: 3px;
    margin-top: -8px;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .authTabs {
    grid-column: 1 / -1;
    display: flex;
    background: rgba(0,0,0,0.4);
    border-radius: 12px;
    padding: 4px;
    gap: 4px;
  }
  .authTab {
    flex: 1;
    padding: calc(var(--g)*1.1) calc(var(--g)*0.8);
    border: none;
    background: transparent;
    color: var(--muted);
    font-weight: 800;
    font-size: var(--fs-xs);
    letter-spacing: 2px;
    border-radius: 9px;
    cursor: pointer;
    transition: 0.2s;
  }
  .authTab.active {
    background: linear-gradient(180deg, #2a3444, #1a2230);
    color: var(--text);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .inp {
    height: var(--h);
    padding: 0 calc(var(--g)*1.4);
    border: 1px solid var(--border);
    background: rgba(6,10,15,0.7);
    color: var(--text);
    border-radius: 10px;
    font-size: var(--fs-sm);
    outline: none;
    min-width: 0;
    transition: 0.15s;
    font-weight: 500;
  }
  .inp::placeholder { color: var(--muted2); }
  .inp:focus { border-color: var(--accent); background: rgba(6,10,15,0.95); }
  #authName { grid-column: 1 / -1; }
  #authEmail { grid-column: 1 / 2; }
  #authPass { grid-column: 2 / 3; }
  #authSubmit { grid-column: 3 / 4; min-width: 110px; }

  .btn {
    height: var(--h);
    padding: 0 calc(var(--g)*1.6);
    border-radius: 10px;
    border: none;
    font-size: var(--fs-sm);
    font-weight: 800;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.2s;
    display: inline-flex; align-items: center; justify-content: center;
    white-space: nowrap;
    text-transform: uppercase;
    font-family: inherit;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: linear-gradient(180deg, #ffb74d, #ff8f00);
    color: #1a1206;
    box-shadow: 0 6px 18px rgba(255,143,0,0.35), inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .btn-ghost {
    background: rgba(255,255,255,0.04);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { background: rgba(255,255,255,0.07); }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }

  .authMsg {
    grid-column: 1 / -1;
    text-align: center;
    font-size: var(--fs-xs);
    min-height: 1em;
    color: var(--danger);
    letter-spacing: 0.5px;
  }
  #btnGuest { grid-column: 1 / -1; }

  /* ================ MAIN MENU ================ */
  #mainMenu {
    display: grid;
    grid-template-rows: auto 1fr;
    gap: var(--g);
    padding: var(--pad);
    background:
      radial-gradient(900px 500px at 15% -5%, rgba(255,167,38,0.15), transparent 55%),
      radial-gradient(800px 600px at 110% 105%, rgba(41,121,255,0.1), transparent 55%),
      linear-gradient(180deg, #0c1118 0%, #05070b 100%);
  }
  #mainMenu::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background-image:
      radial-gradient(circle at 25% 25%, rgba(255,167,38,0.05), transparent 40%),
      repeating-linear-gradient(115deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 80px);
  }
  .menuInner {
    max-width: min(1180px, 100%);
    width: 100%;
    margin: 0 auto;
    display: grid;
    grid-template-rows: auto 1fr;
    gap: var(--g);
    min-height: 0;
    position: relative;
    z-index: 1;
  }

  .topBar {
    display: flex;
    align-items: center;
    gap: var(--g);
  }
  .profileCard {
    display: flex; align-items: center; gap: calc(var(--g)*1.2);
    padding: calc(var(--g)*0.5) calc(var(--g)*1.4) calc(var(--g)*0.5) calc(var(--g)*0.5);
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(25,32,44,0.9), rgba(14,19,27,0.9));
    border: 1px solid var(--border);
    height: var(--h);
    flex-shrink: 0;
    box-shadow: 0 4px 20px rgba(0,0,0,0.35);
  }
  .avatar {
    width: calc(var(--h) - 10px); height: calc(var(--h) - 10px);
    border-radius: 50%;
    background: linear-gradient(135deg, #ffb74d, #ff6f00);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900;
    font-size: calc(var(--fs-sm) + 2px);
    color: #1a1206;
    flex-shrink: 0;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .pInfo { display: flex; flex-direction: column; overflow: hidden; }
  .pName {
    font-size: var(--fs-sm); font-weight: 800;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    letter-spacing: 0.4px;
  }
  .pLvl {
    font-size: var(--fs-xs);
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 1px;
  }
  .stats {
    display: flex; gap: 6px; flex: 1; min-width: 0;
  }
  .statCard {
    flex: 1;
    padding: calc(var(--g)*0.5) calc(var(--g)*0.8);
    border-radius: 12px;
    background: linear-gradient(180deg, rgba(25,32,44,0.85), rgba(14,19,27,0.85));
    border: 1px solid var(--border);
    text-align: center;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .statVal {
    font-size: var(--fs-md);
    font-weight: 900;
    color: var(--accent);
    line-height: 1;
    letter-spacing: 0.5px;
  }
  .statLbl {
    font-size: var(--fs-xs);
    color: var(--muted);
    letter-spacing: 1.5px;
    font-weight: 700;
    margin-top: 3px;
  }
  .iconBtn {
    width: var(--h); height: var(--h);
    border-radius: 12px;
    border: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(25,32,44,0.9), rgba(14,19,27,0.9));
    color: var(--text);
    font-size: var(--fs-md);
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: 0.15s;
  }
  .iconBtn:active { transform: scale(0.94); background: rgba(255,255,255,0.08); }

  .modesBlock {
    display: flex; flex-direction: column;
    gap: calc(var(--g)*0.7);
    min-height: 0;
  }
  .sectionTitle {
    font-size: var(--fs-xs);
    color: var(--muted);
    letter-spacing: 3px;
    font-weight: 800;
    text-transform: uppercase;
    padding-left: 4px;
  }
  .modeGrid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: calc(var(--g)*0.7);
  }
  .modeCard {
    padding: calc(var(--g)*0.9);
    border-radius: 12px;
    background: linear-gradient(180deg, rgba(20,26,35,0.85), rgba(11,15,22,0.9));
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.18s;
    display: flex;
    align-items: center;
    gap: calc(var(--g)*0.8);
    text-align: left;
    color: var(--text);
    font-family: inherit;
    min-height: var(--h);
  }
  .modeCard:active { transform: scale(0.98); }
  .modeCard.active {
    background: linear-gradient(180deg, rgba(255,167,38,0.18), rgba(255,111,0,0.08));
    border-color: rgba(255,167,38,0.55);
    box-shadow: 0 6px 24px rgba(255,140,0,0.15);
  }
  .modeIcon {
    font-size: calc(var(--fs-md) + 4px);
    line-height: 1;
    flex-shrink: 0;
  }
  .modeText { display: flex; flex-direction: column; min-width: 0; }
  .modeName {
    font-size: var(--fs-xs);
    font-weight: 900;
    letter-spacing: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-transform: uppercase;
  }
  .modeDesc {
    font-size: calc(var(--fs-xs) - 1px);
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .bottomRow {
    display: grid;
    grid-template-columns: 1fr 1fr 2.2fr;
    gap: var(--g);
    align-items: stretch;
  }
  .playBtn {
    height: calc(var(--h) * 1.35);
    border: none;
    border-radius: 14px;
    background: linear-gradient(180deg, #ffb74d, #ff8f00);
    color: #1a1206;
    font-size: var(--fs-xl);
    font-weight: 900;
    letter-spacing: 5px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    box-shadow: 0 12px 36px rgba(255,143,0,0.45), inset 0 2px 0 rgba(255,255,255,0.45);
    transition: transform 0.12s;
    font-family: inherit;
    text-transform: uppercase;
  }
  .playBtn:active { transform: scale(0.98); }
  .playBtn .ico { font-size: 0.75em; }

  .sideBtn {
    height: calc(var(--h) * 1.35);
    border-radius: 14px;
    border: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(25,32,44,0.9), rgba(14,19,27,0.9));
    color: var(--text);
    font-size: var(--fs-sm);
    font-weight: 800;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition: 0.15s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-family: inherit;
    text-transform: uppercase;
  }
  .sideBtn:active { transform: scale(0.97); background: rgba(255,255,255,0.06); }
  .sideBtn .ico { font-size: 1.1em; }

  /* ================ SERVER BROWSER ================ */
  #serverBrowser {
    display: grid;
    grid-template-rows: auto 1fr;
    gap: var(--g);
    padding: var(--pad);
    background:
      radial-gradient(900px 500px at 50% -10%, rgba(255,167,38,0.12), transparent 55%),
      linear-gradient(180deg, #0c1118 0%, #05070b 100%);
    max-width: min(1180px, 100%);
    margin: 0 auto;
    width: 100%;
  }
  .browserHeader {
    display: flex;
    align-items: center;
    gap: var(--g);
    flex-wrap: wrap;
  }
  .browserTitle {
    font-size: var(--fs-lg);
    font-weight: 900;
    letter-spacing: 3px;
    background: linear-gradient(90deg, #ffa726, #ff6f00);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    flex-shrink: 0;
  }
  .codeInput {
    height: var(--h);
    padding: 0 calc(var(--g)*1.4);
    border: 1px solid var(--border);
    background: rgba(6,10,15,0.7);
    color: var(--text);
    border-radius: 10px;
    font-size: var(--fs-sm);
    outline: none;
    letter-spacing: 3px;
    text-transform: uppercase;
    width: min(28vw, 160px);
    min-width: 110px;
    font-weight: 700;
    text-align: center;
  }
  .codeInput:focus { border-color: var(--accent); }
  .codeInput::placeholder { letter-spacing: 1px; font-weight: 500; }
  .browserSpacer { flex: 1; }

  .serverList {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: calc(var(--g)*0.9);
    overflow-y: auto;
    padding-right: 4px;
    align-content: start;
  }
  .serverCard {
    padding: calc(var(--g)*1.1);
    border-radius: 12px;
    background: linear-gradient(180deg, rgba(22,29,40,0.9), rgba(12,17,24,0.9));
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 0;
  }
  .serverCard:active { transform: scale(0.98); border-color: rgba(255,167,38,0.4); }
  .srvTop {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .srvName {
    font-size: var(--fs-sm);
    font-weight: 900;
    letter-spacing: 0.4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    min-width: 0;
  }
  .srvLock { color: var(--accent); font-size: var(--fs-sm); }
  .srvRow {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    font-size: var(--fs-xs);
    color: var(--muted);
    font-weight: 600;
  }
  .srvPlayers { color: var(--success); font-weight: 800; }
  .srvCode {
    color: var(--muted2);
    font-family: ui-monospace, monospace;
    letter-spacing: 1px;
    font-size: calc(var(--fs-xs) - 1px);
  }
  .emptyList {
    grid-column: 1 / -1;
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: var(--fs-sm);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .emptyList .em { font-size: 36px; opacity: 0.4; }

  /* ================ MODALS ================ */
  .modal {
    position: fixed; inset: 0; z-index: 40;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    padding: var(--pad);
    animation: fadeIn 0.15s ease;
  }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  .modalCard {
    width: min(100%, 400px);
    display: flex;
    flex-direction: column;
    gap: calc(var(--g)*1.1);
    padding: calc(var(--pad)*1.2);
    border-radius: calc(var(--radius)*1.1);
    background: linear-gradient(180deg, rgba(20,26,35,0.98), rgba(10,14,20,0.98));
    border: 1px solid var(--border);
    box-shadow: 0 30px 80px rgba(0,0,0,0.7);
    animation: pop 0.18s ease;
  }
  @keyframes pop {
    from { transform: scale(0.92); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .modalTitle {
    font-size: var(--fs-md);
    font-weight: 900;
    letter-spacing: 3px;
    text-align: center;
    color: var(--accent);
    text-transform: uppercase;
    padding-bottom: 4px;
  }
  .modalSub {
    text-align: center;
    font-size: var(--fs-xs);
    color: var(--muted);
    margin-top: -6px;
  }
  .modalCard .inp { width: 100%; }
  .modalRow {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--g);
  }
  .modalErr {
    color: var(--danger);
    font-size: var(--fs-xs);
    text-align: center;
    min-height: 1em;
    letter-spacing: 0.4px;
  }

  /* ================ CONNECTING / WAITING ================ */
  #connecting, #waiting {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: calc(var(--g)*1.1);
    padding: var(--pad);
    text-align: center;
    background:
      radial-gradient(800px 600px at 50% 30%, rgba(255,167,38,0.1), transparent 55%),
      linear-gradient(180deg, #0c1118 0%, #05070b 100%);
  }
  .spinner {
    width: clamp(32px, 8vh, 52px);
    height: clamp(32px, 8vh, 52px);
    border: 3px solid rgba(255,167,38,0.15);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .waitRoomCode {
    font-size: var(--fs-xl);
    font-weight: 900;
    letter-spacing: 8px;
    background: linear-gradient(180deg, #ffb74d, #ff6f00);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    padding: 4px 0;
  }
  .waitServerName {
    font-size: var(--fs-md);
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--text);
  }
  .waitCount {
    font-size: var(--fs-xl);
    font-weight: 900;
    color: var(--accent);
    letter-spacing: 2px;
    line-height: 1;
  }
  .muted {
    color: var(--muted);
    font-size: var(--fs-xs);
    letter-spacing: 1.5px;
    font-weight: 700;
    text-transform: uppercase;
  }

  /* Scrollbar */
  .serverList::-webkit-scrollbar { width: 6px; }
  .serverList::-webkit-scrollbar-thumb {
    background: rgba(255,167,38,0.3);
    border-radius: 3px;
  }

  /* Portrait fallback */
  @media (orientation: portrait) {
    .authCard {
      grid-template-columns: 1fr;
    }
    #authEmail, #authPass, #authSubmit { grid-column: 1 / -1; }
    .modeGrid { grid-template-columns: repeat(2, 1fr); }
    .bottomRow { grid-template-columns: 1fr 1fr; }
    .bottomRow .playBtn { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- AUTH -->
<div id="authScreen" class="screen">
  <div class="authCard">
    <div class="brand">2D BATTLE ROYALE</div>
    <div class="brandSub">ONLINE · MOBILE · FREE</div>
    <div class="authTabs">
      <button class="authTab active" id="tabLogin">ВХОД</button>
      <button class="authTab" id="tabRegister">РЕГИСТРАЦИЯ</button>
    </div>
    <input id="authName" class="inp hidden" placeholder="НИК (до 14 симв.)" maxlength="14" autocomplete="off">
    <input id="authEmail" class="inp" type="email" placeholder="EMAIL" autocomplete="email">
    <input id="authPass" class="inp" type="password" placeholder="ПАРОЛЬ" autocomplete="current-password">
    <button id="authSubmit" class="btn btn-primary">ВОЙТИ</button>
    <div class="authMsg" id="authError"></div>
    <button id="btnGuest" class="btn btn-ghost">ИГРАТЬ КАК ГОСТЬ</button>
  </div>
</div>

<!-- MAIN MENU -->
<div id="mainMenu" class="screen hidden">
  <div class="menuInner">
    <div class="topBar">
      <div class="profileCard">
        <div class="avatar" id="avatarEl">P</div>
        <div class="pInfo">
          <div class="pName" id="profileNameEl">PLAYER</div>
          <div class="pLvl">УР. <span id="levelEl">1</span></div>
        </div>
      </div>
      <div class="stats">
        <div class="statCard"><div class="statVal" id="statKills">0</div><div class="statLbl">УБИЙСТВ</div></div>
        <div class="statCard"><div class="statVal" id="statWins">0</div><div class="statLbl">ПОБЕД</div></div>
        <div class="statCard"><div class="statVal" id="statMatches">0</div><div class="statLbl">МАТЧЕЙ</div></div>
      </div>
      <button class="iconBtn" id="btnChangeName" title="Сменить ник">✎</button>
      <button class="iconBtn" id="btnLogout" title="Выйти">⏻</button>
    </div>

    <div class="modesBlock">

function hashStr(s){
  let h = 2166136261;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function simpleHash(s){
  let h = 0;
  for (let i = 0; i < s.length; i++){ h = ((h << 5) - h + s.charCodeAt(i)) | 0; }
  return 'h' + Math.abs(h).toString(36);
}

function withTimeout(p, ms, msg){
  return Promise.race([
    p,
    new Promise((_, rej) => setTimeout(() => rej(new Error(msg || 'timeout')), ms))
  ]);
}
function sanitizeName(n){
  n = (n || '').toString().trim();
  n = n.substring(0, 14).replace(/[<>&"]/g, '').replace(/\s+/g, ' ');
  return n || 'PLAYER';
}

  n = (n || '').toString().trim();

}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

/* ===== ENTITY ===== */
function makeEntity(x, y, isBot, name){
  return {
    x, y, r:16, hp:100, maxHp:100, angle:0,
    isBot, name, uid:null,
    speed: PLAYER_SPEED,
    weapon: WEAPONS.pistol, weaponKey: 'pistol',
    ammo: WEAPONS.pistol.ammo, reloading:0, fireCd:0,
    alive:true, kills:0,
    wanderAngle: rand(0, Math.PI*2), wanderTimer:0,
    targetX: x, targetY: y, targetAngle: 0,
    lastServerHp: 100, pendingDamage: 0,
    dmgMul: 1,
  };
}
function spawnPointFor(uid){
  const h = hashStr((roomId || '') + uid);
  const ang = ((h % 1024) / 1024) * Math.PI * 2;
  const rad = 250 + ((h >>> 10) % 700);
  return { x: WORLD/2 + Math.cos(ang)*rad, y: WORLD/2 + Math.sin(ang)*rad };
}

function resetGame(){
  let px, py;
  if (netMode === 'online'){
    const sp = spawnPointFor(myUid);
    px = sp.x; py = sp.y;
  } else {
    px = WORLD/2 + rand(-100,100);
    py = WORLD/2 + rand(-100,100);
  }
  player = makeEntity(px, py, false, myName);
  player.uid = myUid;
  bots = [];
  if (netMode === 'offline'){
    const cfg = BOT_MODES[selectedBotMode] || BOT_MODES.classic;
    for (let i = 0; i < cfg.bots; i++){
      const b = makeEntity(rand(220, WORLD-220), rand(220, WORLD-220), true, 'Bot'+Math.floor(rand(10,999)));
      if (cfg.botSpeed) b.speed = rand(cfg.botSpeed[0], cfg.botSpeed[1]);
      else b.speed = rand(140, 175);
      if (cfg.botDmgMul) b.dmgMul = cfg.botDmgMul;
      const wk = cfg.weapon || WEAPON_KEYS[Math.floor(Math.random()*WEAPON_KEYS.length)];
      b.weapon = WEAPONS[wk]; b.weaponKey = wk; b.ammo = b.weapon.ammo;
      bots.push(b);
    }
    if (cfg.weapon){
      player.weapon = WEAPONS[cfg.weapon];
      player.weaponKey = cfg.weapon;
      player.ammo = player.weapon.ammo;
    }
  }
  bullets = []; loot = []; particles = []; killFeed = [];
  sawOthers = false;
  matchRecorded = false;
  if (netMode === 'offline') spawnLootRandom(55, selectedBotMode);
  else spawnLootSeeded(roomId, LOOT_COUNT);
  zone = { x: WORLD/2, y: WORLD/2, r: ZONE_START_R, targetR: ZONE_END_R };
  time = 0;
  gameState = 'playing';
  updateAlive();
}
function updateAlive(){
  let n = (player && player.alive) ? 1 : 0;
  if (netMode === 'online'){
    for (const e of remotePlayers.values()) if (e.alive) n++;
  } else {
    for (const b of bots) if (b.alive) n++;
  }
  aliveCount = n;
}
function spawnLootRandom(n, mode){
  const cfg = BOT_MODES[mode] || {};
  const forceWeapon = cfg.weapon;
  for (let i = 0; i < n; i++){
    const id = 'L' + i;
    if (Math.random() < 0.22)
      loot.push({ id, x: rand(120,WORLD-120), y: rand(120,WORLD-120), type:'health', r:12 });
    else {
      const wk = forceWeapon || WEAPON_KEYS[Math.floor(Math.random()*WEAPON_KEYS.length)];
      loot.push({ id, x: rand(120,WORLD-120), y: rand(120,WORLD-120), type:'weapon', weaponKey: wk, r:14 });
    }
  }
}
function spawnLootSeeded(seed, n){
  const rnd = mulberry32(hashStr('loot:' + seed));
  for (let i = 0; i < n; i++){
    const id = 'L' + i;
    const roll = rnd();
    const x = 120 + rnd() * (WORLD - 240);
    const y = 120 + rnd() * (WORLD - 240);
    if (takenLoot.has(id)) continue;
    if (roll < 0.22) loot.push({ id, x, y, type:'health', r:12 });
    else {
      const wk = WEAPON_KEYS[Math.floor(rnd()*WEAPON_KEYS.length)];
      loot.push({ id, x, y, type:'weapon', weaponKey: wk, r:14 });
    }
  }
}
function removeLootById(id){
  const s = String(id);
  for (let i = loot.length - 1; i >= 0; i--){
    if (String(loot[i].id) === s) loot.splice(i, 1);
  }
}
function applyLocalDamage(e, dmg){
  if (!e || !e.alive) return;
  e.hp = Math.max(0, e.hp - dmg);
  e.pendingDamage = (e.pendingDamage || 0) + dmg;
  e.localHitAt = performance.now();
}
function killEntity(ent, killer){
  if (!ent || !ent.alive) return;
  ent.alive = false;
  if (killer && killer !== ent) killer.kills = (killer.kills || 0) + 1;
  if (netMode === 'offline'){
    loot.push({ id:'D'+Math.random(), x: ent.x, y: ent.y, type:'weapon', weaponKey: ent.weaponKey, r:14 });
    if (Math.random() < 0.6)
      loot.push({ id:'D'+Math.random(), x: ent.x + rand(-28,28), y: ent.y + rand(-28,28), type:'health', r:12 });
  }
  const kname = killer ? killer.name : 'ZONE';
  killFeed.push({ text: `${kname} → ${ent.name}`, t: 4 });
  if (killFeed.length > 4) killFeed.shift();
  for (let i = 0; i < 12; i++)
    particles.push({ x:ent.x, y:ent.y, vx: rand(-120,120), vy: rand(-120,120), life: 0.6, color:'#ff5a5a' });
  if (netMode === 'online' && ent === player && db && roomId && myUid){
    db.ref(`rooms/${roomId}/players/${myUid}`).update({ alive:false, hp:0 }).catch(()=>{});
  }
}

/* ===== INPUT ===== */
const joyL = { active:false, id:null, ox:0, oy:0, x:0, y:0 };
const joyR = { active:false, id:null, ox:0, oy:0, x:0, y:0 };
const keys = {};
const mouse = { x:0, y:0, down:false };

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (gameState === 'won' || gameState === 'lost'){ backToMainMenu(); return; }
  if (gameState !== 'playing') return;
  for (const t of e.changedTouches){
    if (t.clientX < W/2 && joyL.id === null){
      joyL.id = t.identifier; joyL.ox = t.clientX; joyL.oy = t.clientY;
      joyL.x = t.clientX; joyL.y = t.clientY; joyL.active = true;
    } else if (t.clientX >= W/2 && joyR.id === null){
      joyR.id = t.identifier; joyR.ox = t.clientX; joyR.oy = t.clientY;
      joyR.x = t.clientX; joyR.y = t.clientY; joyR.active = true;
    }
  }
}, { passive:false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches){
    if (t.identifier === joyL.id){ joyL.x = t.clientX; joyL.y = t.clientY; }
    if (t.identifier === joyR.id){ joyR.x = t.clientX; joyR.y = t.clientY; }
  }
}, { passive:false });
function endTouch(e){
  for (const t of e.changedTouches){
    if (t.identifier === joyL.id){ joyL.active=false; joyL.id=null; }
    if (t.identifier === joyR.id){ joyR.active=false; joyR.id=null; }
  }
}
canvas.addEventListener('touchend', endTouch);
canvas.addEventListener('touchcancel', endTouch);
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
addEventListener('keyup',   e => { keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mousedown', () => {
  if (gameState === 'won' || gameState === 'lost'){ backToMainMenu(); return; }
  if (gameState === 'playing') mouse.down = true;
});
canvas.addEventListener('mouseup', () => { mouse.down = false; });

/* ===== AUTH UI ===== */
const authName = document.getElementById('authName');
const authEmail = document.getElementById('authEmail');

const authError = document.getElementById('authError');

let authMode = 'login';
function setAuthMode(mode){
  authMode = mode;
  tabLogin.classList.toggle('active', mode === 'login');
  tabRegister.classList.toggle('active', mode === 'register');
  authName.classList.toggle('hidden', mode === 'login');
  authSubmit.textContent = (mode === 'login') ? 'ВОЙТИ' : 'СОЗДАТЬ';
  authError.textContent = '';
}
tabLogin.onclick = () => setAuthMode('login');

authSubmit.onclick = doAuthSubmit;
[authEmail, authPass, authName].forEach(el => {
  el.addEventListener('keydown', e => { if (e.key === 'Enter') doAuthSubmit(); });
});

async function doAuthSubmit(){
  authError.textContent = '';
  const email = (authEmail.value || '').trim();
  const pass  = (authPass.value || '').trim();
  const name  = sanitizeName(authName.value);

  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    authError.textContent = 'Введи корректный email'; return;
  }
  if (pass.length < 6){
    authError.textContent = 'Пароль минимум 6 символов'; return;
  }
  authSubmit.disabled = true;
  const oldLabel = authSubmit.textContent;
  authSubmit.textContent = '...';
  try {
    if (!db) initFirebase();
    if (authMode === 'login'){
      await auth.signInWithEmailAndPassword(email, pass);
    } else {
      const cred = await auth.createUserWithEmailAndPassword(email, pass);
      await cred.user.updateProfile({ displayName: name });
      await db.ref('users/' + cred.user.uid).set({
        name, email,
        kills: 0, wins: 0, matches: 0,
        createdAt: firebase.database.ServerValue.TIMESTAMP,
      });
    }
  } catch(err){
    console.error('[auth]', err);
    const c = err.code || '';
    if (c.includes('email-already-in-use'))   authError.textContent = 'Email уже занят';
    else if (c.includes('invalid-email'))     authError.textContent = 'Неверный email';
    else if (c.includes('weak-password'))     authError.textContent = 'Слабый пароль';
    else if (c.includes('wrong-password'))    authError.textContent = 'Неверный пароль';
    else if (c.includes('user-not-found'))    authError.textContent = 'Аккаунт не найден';
    else if (c.includes('invalid-credential'))authError.textContent = 'Неверный email или пароль';
    else if (c.includes('operation-not-allowed')) authError.textContent = 'Включи Email/Password в Firebase';
    else if (c.includes('network'))           authError.textContent = 'Нет сети';
    else authError.textContent = err.message || 'Ошибка';
  } finally {
    authSubmit.disabled = false;
    authSubmit.textContent = oldLabel;
  }
}

btnGuest.onclick = async () => {
  authError.textContent = '';
  btnGuest.disabled = true;
  try {
    if (!db) initFirebase();
    await auth.signInAnonymously();
  } catch(err){
    console.error('[guest]', err);
    if ((err.code || '').includes('operation-not-allowed'))
      authError.textContent = 'Включи Anonymous в Firebase Auth';
    else authError.textContent = err.message || 'Ошибка';
  } finally {
    btnGuest.disabled = false;
  }
};

function renderServerList(rooms){
  const now = serverNow();
  const items = [];
  for (const rid in rooms){
    const r = rooms[rid];
    const meta = r && r.meta;
    if (!meta || !meta.startAt) continue;
    if (meta.startAt < now - 40000) continue;
    if (meta.startAt > now + 15 * 60 * 1000) continue;
    const players = r.players ? Object.keys(r.players).length : 0;
    items.push({ rid, meta, players });
  }
  items.sort((a,b) => (b.meta.createdAt || 0) - (a.meta.createdAt || 0));

  if (items.length === 0){
    serverListEl.innerHTML = '<div class="emptyList"><div class="em">🌐</div><div>Пока нет серверов. Создай свой!</div></div>';
    return;
  }
  serverListEl.innerHTML = '';
  for (const it of items){
    const card = document.createElement('div');
    card.className = 'serverCard';
    const started = it.meta.startAt <= now + 500;
    const lock = it.meta.hasPassword ? '<span class="srvLock">🔒</span>' : '';
    const tag = started ? '▶ идёт' : ('старт ' + Math.max(0, Math.ceil((it.meta.startAt - now)/1000)) + 'с');
    card.innerHTML = `
      <div class="srvTop">
        ${lock}
        <div class="srvName">${escapeHtml(it.meta.name || 'Сервер')}</div>
      </div>
      <div class="srvRow">
        <span class="srvPlayers">● ${it.players} игр.</span>
        <span>${tag}</span>
      </div>
      <div class="srvRow">
        <span>${escapeHtml(it.meta.createdByName || '?')}</span>
        <span class="srvCode">${it.rid}</span>
      </div>
    `;
    card.onclick = () => joinServerById(it.rid, it.meta);
    serverListEl.appendChild(card);
  }
}

/* ===== CONNECT ===== */
async function connectToRoom(meta){
  matchStartAt = Number(meta.startAt) || (Date.now() + serverOffset + START_DELAY);
  showScreen('connecting');
  document.getElementById('connectMsg').textContent = 'Синхронизация времени...';

  serverOffset = await new Promise(res => {
    const to = setTimeout(() => res(0), 2500);
    try {
      db.ref('.info/serverTimeOffset').once('value', s => {
        clearTimeout(to); res(s.val() || 0);
      }, () => { clearTimeout(to); res(0); });
    } catch(e){ clearTimeout(to); res(0); }
  });

  document.getElementById('connectMsg').textContent = 'Вход в комнату...';
  try { await joinRoom(); }
  catch(err){
    console.error('[joinRoom]', err);
    showScreen('serverBrowser');
    alert('Ошибка входа: ' + (err.message || err));
    return;
  }

  showScreen('waiting');
  document.getElementById('waitingServerName').textContent = meta.name || 'Сервер';
  document.getElementById('waitingRoom').textContent = roomId;
  document.getElementById('waitingName').textContent = myName;
  document.getElementById('btnWaitingBack').onclick = () => {
    cleanupRoom();
    showScreen('mainMenu');
  };

  if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
  const countdownEl = document.getElementById('countdown');
  const tick = () => {
    const delta = matchStartAt - serverNow();
    const left = Math.max(0, Math.ceil((isFinite(delta) ? delta : 0) / 1000));
    countdownEl.textContent = left;
    if (left <= 0){
      if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
      startOnlineMatch();
    }
  };
  tick();
  countdownTimer = setInterval(tick, 120);
}

/* ===== NETWORK ===== */
async function joinRoom(){
  const sp = spawnPointFor(myUid);
  const me = {
    x: Math.round(sp.x), y: Math.round(sp.y),
    angle: 0, hp: 100, weapon: 'pistol', alive: true, kills: 0,
    name: myName,
  };
  const myRef = db.ref(`rooms/${roomId}/players/${myUid}`);
  await withTimeout(myRef.set(me), 8000, 'set timeout');
  try { myRef.onDisconnect().remove(); } catch(e){}

  const playersRef = db.ref(`rooms/${roomId}/players`);
  const pCb = playersRef.on('value', snap => {
    const data = snap.val() || {};
    const seen = new Set();
    for (const uid in data){
      if (uid === myUid) continue;
      seen.add(uid);
      const p = data[uid];
      if (!p || typeof p.x !== 'number') continue;
      let e = remotePlayers.get(uid);
      if (!e){
        e = makeEntity(p.x, p.y, false, p.name || uid.substring(0,4));
        e.uid = uid;
        e.x = e.targetX = p.x; e.y = e.targetY = p.y;
        e.angle = e.targetAngle = p.angle || 0;
        e.hp = p.hp != null ? p.hp : 100;
        e.lastServerHp = e.hp; e.pendingDamage = 0;
        e.weaponKey = p.weapon || 'pistol';
        e.weapon = WEAPONS[e.weaponKey] || WEAPONS.pistol;
        e.alive = p.alive !== false;
        e.kills = p.kills || 0;
        remotePlayers.set(uid, e);
      } else {
        e.targetX = p.x; e.targetY = p.y;
        e.targetAngle = p.angle || 0;
        const serverHp = (p.hp != null) ? p.hp : e.hp;
        const prevServer = (e.lastServerHp != null) ? e.lastServerHp : serverHp;
        const serverDrop = Math.max(0, prevServer - serverHp);
        if (serverDrop > 0){
          e.pendingDamage = Math.max(0, (e.pendingDamage || 0) - serverDrop);
        } else {
          e.pendingDamage = Math.max(0, (e.pendingDamage || 0) - 2);
        }
        e.lastServerHp = serverHp;
        e.hp = Math.max(0, serverHp - (e.pendingDamage || 0));
        e.weaponKey = p.weapon || e.weaponKey;
        e.weapon = WEAPONS[e.weaponKey] || e.weapon;
        const wasAlive = e.alive;
        e.alive = p.alive !== false;
        if (!e.alive){ e.hp = 0; e.pendingDamage = 0; }
        if (wasAlive && !e.alive && gameState === 'playing'){
          const mine = (p.killedBy && p.killedBy === myUid);
          killFeed.push({ text: mine ? `YOU → ${e.name}` : `${e.name} устранён`, t: 4 });
          if (killFeed.length > 4) killFeed.shift();
        }
        e.name = p.name || e.name;
        e.kills = p.kills != null ? p.kills : e.kills;
      }
    }
    for (const uid of [...remotePlayers.keys()]){
      if (!seen.has(uid)){
        const gone = remotePlayers.get(uid);
        if (gone && gone.alive && gameState === 'playing'){
          killFeed.push({ text: `${gone.name} покинул игру`, t: 4 });
          if (killFeed.length > 4) killFeed.shift();
        }
        remotePlayers.delete(uid);
      }
    }
    updateAlive();
  });
  listeners.push({ ref: playersRef, type: 'value', cb: pCb });

  try {
    const takenSnap = await db.ref(`rooms/${roomId}/taken`).once('value');
    const takenVal = takenSnap.val() || {};
    for (const k in takenVal) takenLoot.add(String(k));
  } catch(e){}
}

function setupGameListeners(){
  const shotsRef = db.ref(`rooms/${roomId}/shots`).limitToLast(50);
  const sCb = shotsRef.on('child_added', snap => {
    const s = snap.val();
    snap.ref.remove().catch(()=>{});
    if (!s || !bullets) return;
    if (s.uid === myUid) return;
    if (serverNow() - (s.t || 0) > SHOT_MAX_AGE) return;
    const w = WEAPONS[s.weaponKey] || WEAPONS.pistol;
    const n = w.pellets || 1;
    for (let i = 0; i < n; i++){
      const a = s.angle + rand(-w.spread, w.spread);
      bullets.push({
        x: s.x, y: s.y,
        vx: Math.cos(a)*w.speed, vy: Math.sin(a)*w.speed,
        dmg: 0, owner: null, life: 1.0, color: w.color, visual: true,
      });
    }
  });
  listeners.push({ ref: shotsRef, type: 'child_added', cb: sCb });

  const dmgRef = db.ref(`rooms/${roomId}/damage/${myUid}`);
  const dCb = dmgRef.on('child_added', snap => {
    const d = snap.val();
    snap.ref.remove().catch(()=>{});
    if (!d || !player || !player.alive || gameState !== 'playing') return;
    player.hp -= d.amount;
    if (player.hp <= 0){
      player.hp = 0;
      killEntity(player, { name: d.byName || 'ENEMY' });
      gameState = 'lost';
      if (d.by){
        db.ref(`rooms/${roomId}/players/${d.by}/kills`)
          .transaction(v => (v||0)+1).catch(()=>{});
        db.ref(`rooms/${roomId}/players/${myUid}/killedBy`)
          .set(d.by).catch(()=>{});
      }
    }
  });
  listeners.push({ ref: dmgRef, type: 'child_added', cb: dCb });

  const myKillsRef = db.ref(`rooms/${roomId}/players/${myUid}/kills`);
  const kCb = myKillsRef.on('value', s => { if (player) player.kills = s.val() || 0; });
  listeners.push({ ref: myKillsRef, type: 'value', cb: kCb });

  const takenRef = db.ref(`rooms/${roomId}/taken`);
  const tCb = takenRef.on('child_added', snap => {
    const id = String(snap.key);
    takenLoot.add(id);
    removeLootById(id);
  });
  listeners.push({ ref: takenRef, type: 'child_added', cb: tCb });
}

/* ===== COMBAT / UPDATE / RENDER ===== */
function tryFire(ent, dt){
  if (ent.fireCd > 0 || ent.reloading > 0) return;
  if (ent.ammo <= 0){ ent.reloading = ent.weapon.reload; return; }
  const w = ent.weapon;
  const p = w.pellets || 1;
  const mul = ent.dmgMul || 1;
  for (let i = 0; i < p; i++){
    const a = ent.angle + rand(-w.spread, w.spread);
    bullets.push({
      x: ent.x + Math.cos(ent.angle)*(ent.r + 6),
      y: ent.y + Math.sin(ent.angle)*(ent.r + 6),
      vx: Math.cos(a)*w.speed, vy: Math.sin(a)*w.speed,
      dmg: w.dmg * mul, owner: ent, life: 1.2, color: w.color,
    });
  }
  ent.ammo--;
  ent.fireCd = w.rate;
  for (let i = 0; i < 3; i++)
    particles.push({
      x: ent.x + Math.cos(ent.angle)*(ent.r+10),
      y: ent.y + Math.sin(ent.angle)*(ent.r+10),
      vx: Math.cos(ent.angle)*rand(50,150) + rand(-40,40),
      vy: Math.sin(ent.angle)*rand(50,150) + rand(-40,40),
      life: 0.15, color: w.color,
    });
  if (netMode === 'online' && ent === player)
    sendShot(ent.x, ent.y, ent.angle, ent.weaponKey);
}

function updatePlayer(dt){
  if (!player.alive) return;
  let dx = 0, dy = 0;
  if (joyL.active){
    const jx = joyL.x - joyL.ox, jy = joyL.y - joyL.oy;
    const d = Math.hypot(jx, jy);
    if (d > 8){
      const k = Math.min(1, d / JOY_R);
      dx = jx/d * k; dy = jy/d * k;
    }
  }
  if (keys['w'] || keys['arrowup'])    dy -= 1;
  if (keys['s'] || keys['arrowdown'])  dy += 1;
  if (keys['a'] || keys['arrowleft'])  dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  const m = Math.hypot(dx, dy);
  if (m > 1){ dx /= m; dy /= m; }
  player.x += dx * player.speed * dt;
  player.y += dy * player.speed * dt;
  player.x = Math.max(player.r, Math.min(WORLD - player.r, player.x));
  player.y = Math.max(player.r, Math.min(WORLD - player.r, player.y));

  let wantFire = false;
  if (joyR.active){
    const jx = joyR.x - joyR.ox, jy = joyR.y - joyR.oy;
    const d = Math.hypot(jx, jy);
    if (d > 15){
      player.angle = Math.atan2(jy, jx);
      wantFire = true;
    }
  }
  if (mouse.down){
    const psx = player.x - cam.x, psy = player.y - cam.y;
    player.angle = Math.atan2(mouse.y - psy, mouse.x - psx);
    wantFire = true;
  }
  if (wantFire) tryFire(player, dt);
  if (player.fireCd > 0) player.fireCd -= dt;
  if (player.reloading > 0){
    player.reloading -= dt;
    if (player.reloading <= 0) player.ammo = player.weapon.ammo;
  }
}

function updateBot(b, dt){
  if (!b.alive) return;
  let target = null, minD = 700;
  if (player.alive){
    const d = Math.hypot(player.x - b.x, player.y - b.y);
    if (d < minD){ minD = d; target = player; }
  }
  for (const o of bots){
    if (o === b || !o.alive) continue;
    const d = Math.hypot(o.x - b.x, o.y - b.y);
    if (d < minD){ minD = d; target = o; }
  }
  const zdx = zone.x - b.x, zdy = zone.y - b.y;
  const zdist = Math.hypot(zdx, zdy);
  const outside = zdist > zone.r - 150;
  let mx = 0, my = 0;
  if (target && minD < 500 && !outside){
    const ang = Math.atan2(target.y - b.y, target.x - b.x);
    b.angle = ang;
    if (minD > 220){ mx = Math.cos(ang); my = Math.sin(ang); }
    else if (minD < 130){ mx = -Math.cos(ang); my = -Math.sin(ang); }
    else {
      const s = Math.sin(time*2 + b.wanderAngle);
      mx = Math.cos(ang + Math.PI/2) * s;
      my = Math.sin(ang + Math.PI/2) * s;
    }
    tryFire(b, dt);
  } else if (outside){
    b.angle = Math.atan2(zdy, zdx);
    mx = zdx/zdist; my = zdy/zdist;
  } else {
    b.wanderTimer -= dt;
    if (b.wanderTimer <= 0){ b.wanderAngle = rand(0, Math.PI*2); b.wanderTimer = rand(1.2, 3.5); }
    b.angle = b.wanderAngle;
    mx = Math.cos(b.wanderAngle) * 0.7;
    my = Math.sin(b.wanderAngle) * 0.7;
  }
  const m = Math.hypot(mx, my);
  if (m > 1){ mx /= m; my /= m; }
  b.x += mx * b.speed * dt;
  b.y += my * b.speed * dt;
  b.x = Math.max(b.r, Math.min(WORLD - b.r, b.x));
  b.y = Math.max(b.r, Math.min(WORLD - b.r, b.y));
  if (b.fireCd > 0) b.fireCd -= dt;
  if (b.reloading > 0){ b.reloading -= dt; if (b.reloading <= 0) b.ammo = b.weapon.ammo; }
}

function updateRemotePlayers(dt){
  if (netMode !== 'online') return;
  const k = 1 - Math.exp(-INTERP_SPEED * dt);
  for (const e of remotePlayers.values()){
    if (!e.alive) continue;
    e.x += (e.targetX - e.x) * k;
    e.y += (e.targetY - e.y) * k;
    let da = e.targetAngle - e.angle;
    while (da >  Math.PI) da -= Math.PI*2;
    while (da < -Math.PI) da += Math.PI*2;
    e.angle += da * k;
  }
}

function updateBullets(dt){
  for (let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.x < 0 || b.x > WORLD || b.y < 0 || b.y > WORLD){
      bullets.splice(i, 1); continue;
    }
    if (b.visual) continue;
    let hit = false;
    const targets = [player];
    if (netMode === 'offline') targets.push(...bots);
    else for (const e of remotePlayers.values()) targets.push(e);
    for (const t of targets){
      if (!t || !t.alive || t === b.owner) continue;
      if (Math.hypot(t.x - b.x, t.y - b.y) < t.r + 4){
        if (netMode === 'online' && t.uid){
          sendDamage(t.uid, b.dmg);
          applyLocalDamage(t, b.dmg);
        } else {
          t.hp -= b.dmg;
          if (t.hp <= 0) killEntity(t, b.owner);
        }
        for (let k = 0; k < 4; k++)
          particles.push({ x: b.x, y: b.y, vx: rand(-100,100), vy: rand(-100,100), life: 0.3, color:'#ffd166' });
        hit = true;
        break;
      }
    }
    if (hit) bullets.splice(i, 1);
  }
}

function updateLoot(){
  if (!player.alive) return;
  for (let i = loot.length - 1; i >= 0; i--){
    const l = loot[i];
    if (Math.hypot(player.x - l.x, player.y - l.y) >= player.r + l.r + 6) continue;
    if (l.type === 'health'){
      if (player.hp >= player.maxHp) continue;
      player.hp = Math.min(player.maxHp, player.hp + 40);
    } else {
      if (player.weaponKey === l.weaponKey) continue;
      player.weapon = WEAPONS[l.weaponKey];
      player.weaponKey = l.weaponKey;
      player.ammo = player.weapon.ammo;
      player.reloading = 0;
    }
    if (netMode === 'online' && l.id != null){
      const id = String(l.id);
      if (!takenLoot.has(id)){
        takenLoot.add(id);
        db.ref(`rooms/${roomId}/taken/${id}`).set(true).catch(()=>{});
      }
    }
    loot.splice(i, 1);
  }
}

function updateZone(dt){
  if (netMode === 'online'){
    const elapsed = Math.max(0, (serverNow() - matchStartAt) / 1000);
    zone.r = Math.max(ZONE_END_R, ZONE_START_R - ZONE_SHRINK * elapsed);
  } else {
    zone.r = Math.max(ZONE_END_R, zone.r - ZONE_SHRINK * dt);
  }
  if (player && player.alive){
    const d = Math.hypot(player.x - zone.x, player.y - zone.y);
    if (d > zone.r){
      player.hp -= ZONE_DPS * dt;
      if (player.hp <= 0){ player.hp = 0; killEntity(player, null); }
    }
  }
  if (netMode === 'offline'){
    for (const b of bots){
      if (!b.alive) continue;
      const d = Math.hypot(b.x - zone.x, b.y - zone.y);
      if (d > zone.r){ b.hp -= ZONE_DPS * dt; if (b.hp <= 0) killEntity(b, null); }
    }
  }
}

function updateParticles(dt){
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.92; p.vy *= 0.92;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = killFeed.length - 1; i >= 0; i--){
    killFeed[i].t -= dt;
    if (killFeed[i].t <= 0) killFeed.splice(i, 1);
  }
}

function updateCamera(){
  const focus = (player && player.alive) ? player : { x: zone.x, y: zone.y };
  cam.x = focus.x - W/2;
  cam.y = focus.y - H/2;
  if (W < WORLD) cam.x = Math.max(0, Math.min(WORLD - W, cam.x));
  if (H < WORLD) cam.y = Math.max(0, Math.min(WORLD - H, cam.y));
}

/* ===== RENDER ===== */
function drawGrid(){
  const step = 100;
  const x0 = Math.floor(cam.x / step) * step;
  const y0 = Math.floor(cam.y / step) * step;
  ctx.strokeStyle = 'rgba(255,255,255,0.045)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = x0; x < cam.x + W + step; x += step){
    ctx.moveTo(x - cam.x, 0); ctx.lineTo(x - cam.x, H);
  }
  for (let y = y0; y < cam.y + H + step; y += step){
    ctx.moveTo(0, y - cam.y); ctx.lineTo(W, y - cam.y);
  }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,80,80,0.5)';
  ctx.lineWidth = 4;
  ctx.strokeRect(-cam.x, -cam.y, WORLD, WORLD);
}
function drawZone(){
  const sx = zone.x - cam.x, sy = zone.y - cam.y;
  ctx.save();
  ctx.beginPath();
  ctx.rect(-100, -100, W + 200, H + 200);
  ctx.arc(sx, sy, zone.r, 0, Math.PI*2, true);
  ctx.fillStyle = 'rgba(120,20,30,0.28)';
  ctx.fill();
  ctx.restore();
  ctx.beginPath();
  ctx.arc(sx, sy, zone.r, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(255,80,120,0.85)';
  ctx.lineWidth = 3;
  ctx.stroke();
}
function drawLoot(){
  for (const l of loot){
    const sx = l.x - cam.x, sy = l.y - cam.y;
    if (sx < -40 || sx > W + 40 || sy < -40 || sy > H + 40) continue;
    ctx.save(); ctx.translate(sx, sy);
    if (l.type === 'health'){
      ctx.fillStyle = '#06d6a0';
      ctx.beginPath(); ctx.arc(0, 0, l.r, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillRect(-6, -2, 12, 4); ctx.fillRect(-2, -6, 4, 12);
    } else {
      ctx.fillStyle = WEAPONS[l.weaponKey].color;
      ctx.fillRect(-12, -6, 24, 12);
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(-4, -6, 8, 12);
    }
    ctx.restore();
  }
}
function drawEntity(ent, color){
  if (!ent.alive) return;
  const sx = ent.x - cam.x, sy = ent.y - cam.y;
  if (sx < -50 || sx > W + 50 || sy < -50 || sy > H + 50) return;
  ctx.save();
  ctx.translate(sx, sy); ctx.rotate(ent.angle);
  ctx.beginPath(); ctx.arc(0, 0, ent.r, 0, Math.PI*2);
  ctx.fillStyle = color; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = '#0a0f14'; ctx.stroke();
  ctx.fillStyle = '#111';
  ctx.fillRect(ent.r - 4, -3, 20, 6);
  ctx.fillStyle = ent.weapon.color;
  ctx.fillRect(ent.r + 10, -2, 4, 4);
  ctx.restore();
  if (ent.hp < ent.maxHp){
    const bw = 34;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(sx - bw/2, sy - ent.r - 13, bw, 5);
    const ratio = Math.max(0, ent.hp / ent.maxHp);
    ctx.fillStyle = ratio > 0.5 ? '#06d6a0' : ratio > 0.25 ? '#ffd166' : '#ef476f';
    ctx.fillRect(sx - bw/2, sy - ent.r - 13, bw * ratio, 5);
  }
  if (ent.name && ent !== player){
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(ent.name, sx, sy - ent.r - 18);
  }
}
function drawBullets(){
  for (const b of bullets){
    const sx = b.x - cam.x, sy = b.y - cam.y;
    if (sx < -10 || sx > W + 10 || sy < -10 || sy > H + 10) continue;
    ctx.beginPath(); ctx.arc(sx, sy, 3, 0, Math.PI*2);
    ctx.fillStyle = b.color; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx - b.vx * 0.012, sy - b.vy * 0.012);
    ctx.strokeStyle = b.color; ctx.lineWidth = 2;
    ctx.globalAlpha = 0.5; ctx.stroke(); ctx.globalAlpha = 1;
  }
}
function drawParticles(){
  for (const p of particles){
    const sx = p.x - cam.x, sy = p.y - cam.y;
    if (sx < -20 || sx > W + 20 || sy < -20 || sy > H + 20) continue;
    ctx.globalAlpha = Math.max(0, p.life * 2);
    ctx.fillStyle = p.color;
    ctx.fillRect(sx - 2, sy - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
}
function drawJoystick(joy){
  if (!joy.active) return;
  ctx.beginPath(); ctx.arc(joy.ox, joy.oy, JOY_R, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fill();
  let dx = joy.x - joy.ox, dy = joy.y - joy.oy;
  const d = Math.hypot(dx, dy);
  if (d > JOY_R){ dx = dx/d*JOY_R; dy = dy/d*JOY_R; }
  ctx.beginPath(); ctx.arc(joy.ox + dx, joy.oy + dy, 30, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fill();
}
function drawHUD(){
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(16, 16, 200, 26);
  const hp = Math.max(0, player.hp) / player.maxHp;
  ctx.fillStyle = hp > 0.5 ? '#06d6a0' : hp > 0.25 ? '#ffd166' : '#ef476f';
  ctx.fillRect(18, 18, 196 * hp, 22);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('HP ' + Math.max(0, Math.round(player.hp)), 24, 34);
  ctx.textAlign = 'center'; ctx.font = 'bold 22px sans-serif'; ctx.fillStyle = '#fff';
  ctx.fillText('ALIVE: ' + aliveCount, W/2, 36);
  ctx.font = '12px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.fillText('KILLS: ' + player.kills, W/2, 54);
  ctx.textAlign = 'right'; ctx.font = 'bold 16px sans-serif';
  ctx.fillStyle = player.weapon.color;
  ctx.fillText(player.weapon.name, W - 20, H - 60);
  ctx.font = 'bold 20px sans-serif'; ctx.fillStyle = '#fff';
  if (player.reloading > 0) ctx.fillText('RELOAD...', W - 20, H - 32);
  else ctx.fillText(player.ammo + ' / ' + player.weapon.ammo, W - 20, H - 32);
  ctx.textAlign = 'right'; ctx.font = '12px sans-serif';
  killFeed.forEach((k, i) => {
    ctx.globalAlpha = Math.min(1, k.t);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillText(k.text, W - 16, 100 + i * 18);
  });
  ctx.globalAlpha = 1;
  const mm = 90, mx = W - mm - 16, my = 16;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(mx, my, mm, mm);
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.strokeRect(mx, my, mm, mm);
  const kx = mm / WORLD;
  ctx.beginPath();
  ctx.arc(mx + zone.x*kx, my + zone.y*kx, zone.r*kx, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(255,80,120,0.8)'; ctx.lineWidth = 1.5; ctx.stroke();
  if (netMode === 'online'){
    for (const e of remotePlayers.values()){
      if (!e.alive) continue;
      ctx.fillStyle = '#e63946';
      ctx.fillRect(mx + e.x*kx - 1, my + e.y*kx - 1, 3, 3);
    }
  } else {
    for (const b of bots){
      if (!b.alive) continue;
      ctx.fillStyle = '#e63946';
      ctx.fillRect(mx + b.x*kx - 1, my + b.y*kx - 1, 3, 3);
    }
  }
  if (player.alive){
    ctx.fillStyle = '#4895ef';
    ctx.fillRect(mx + player.x*kx - 2, my + player.y*kx - 2, 5, 5);
  }
  if (netMode === 'online' && roomId){
    ctx.textAlign = 'left'; ctx.font = 'bold 12px sans-serif';
    ctx.fillStyle = 'rgba(6,214,160,0.9)';
    ctx.fillText('ROOM: ' + roomId, 16, 60);
  }
}
function drawEndScreen(){
  ctx.fillStyle = 'rgba(0,0,0,0.78)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  if (gameState === 'won'){
    ctx.fillStyle = '#06d6a0';
    ctx.font = 'bold 48px sans-serif';
    ctx.fillText('ПОБЕДА!', W/2, H/2 - 30);
  } else {
    ctx.fillStyle = '#ef476f';
    ctx.font = 'bold 48px sans-serif';
    ctx.fillText('ПОРАЖЕНИЕ', W/2, H/2 - 30);
  }
  ctx.fillStyle = '#fff';
  ctx.font = '18px sans-serif';
  ctx.fillText('Убийств: ' + player.kills, W/2, H/2 + 20);
  ctx.fillText('Место: #' + Math.max(1, aliveCount), W/2, H/2 + 46);
  ctx.font = 'bold 16px sans-serif';
  ctx.fillStyle = '#ffa726';
  ctx.fillText('ТАПНИ, ЧТОБЫ ВЕРНУТЬСЯ В МЕНЮ', W/2, H/2 + 100);
}

/* ===== RECORD ===== */
async function recordMatchResult(won, kills){
  if (!currentUser || matchRecorded) return;
  matchRecorded = true;
  if (currentUser.isAnonymous) return;
  try {
    const ref = db.ref('users/' + currentUser.uid);
    await ref.transaction(u => {
      if (!u) return u;
      u.matches = (u.matches || 0) + 1;
      u.kills = (u.kills || 0) + Math.max(0, kills|0);
      if (won) u.wins = (u.wins || 0) + 1;
      return u;
    });
    userProfile.matches = (userProfile.matches || 0) + 1;
    userProfile.kills   = (userProfile.kills   || 0) + Math.max(0, kills|0);
    if (won) userProfile.wins = (userProfile.wins || 0) + 1;
    cacheProfile();
    updateProfileUI();
  } catch(e){ console.warn('record match', e); }
}

/* ===== MAIN LOOP ===== */
let last = performance.now();
let endRecorded = false;

function loop(now){
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;

  if (gameState === 'playing' && player){
    time += dt;
    updatePlayer(dt);
    if (netMode === 'offline') for (const b of bots) updateBot(b, dt);
    else updateRemotePlayers(dt);
    updateBullets(dt);
    updateLoot();
    updateZone(dt);
    updateParticles(dt);
    updateAlive();

    if (netMode === 'offline'){
      if (!player.alive) gameState = 'lost';
      else if (aliveCount === 1) gameState = 'won';
    } else {
      if (aliveCount > 1) sawOthers = true;
      if (!player.alive) gameState = 'lost';
      else if (sawOthers && aliveCount === 1) gameState = 'won';
    }
    if ((gameState === 'won' || gameState === 'lost') && !endRecorded){
      endRecorded = true;
      if (netMode === 'online') recordMatchResult(gameState === 'won', player.kills);
    }
    if (now - lastSync > SYNC_INTERVAL){
      lastSync = now;
      syncMyState();
    }
  } else if (player && (gameState === 'won' || gameState === 'lost')){
    updateParticles(dt);
  }

  if (player && gameState !== 'menu') updateCamera();

  ctx.fillStyle = '#0d141c';
  ctx.fillRect(0, 0, W, H);

  if (player && gameState !== 'menu'){
    drawGrid(); drawZone(); drawLoot();
    if (netMode === 'offline'){
      for (const b of bots) drawEntity(b, '#e63946');
    } else {
      for (const e of remotePlayers.values()) drawEntity(e, '#e63946');
    }
    drawEntity(player, '#4895ef');
    drawBullets(); drawParticles();
    if (gameState === 'playing'){
      drawJoystick(joyL); drawJoystick(joyR);
      drawHUD();
    } else if (gameState === 'won' || gameState === 'lost'){
      drawEndScreen();
    }
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ===== FIREBASE INIT ===== */
function initFirebase(){
  if (!firebase.apps || firebase.apps.length === 0) firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.database();
}

(function tryCachedProfile(){
  const c = loadCachedProfile();
  if (c && c.profile){ userProfile = c.profile; updateProfileUI(); }
})();

function initAuthFlow(){
  initFirebase();
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});

  auth.onAuthStateChanged(async user => {
    if (user){
      currentUser = user;
      myUid = user.uid;
      if (userProfile.name === 'PLAYER' || !userProfile.name){
        const c = loadCachedProfile();
        if (c && c.uid === user.uid && c.profile) userProfile = c.profile;
      }
      updateProfileUI();
      showScreen('mainMenu');
      await loadOrCreateProfile(user);
    } else {
      currentUser = null;
      myUid = null;
      try {
        const lastEmail = localStorage.getItem('br_last_email');
        if (lastEmail) authEmail.value = lastEmail;
      } catch(e){}
      showScreen('authScreen');
    }
  });
}

async function loadOrCreateProfile(user){
  const ref = db.ref('users/' + user.uid);
  let snap;
  try {
    snap = await withTimeout(ref.once('value'), 8000, 'profile timeout');
  } catch(e){ return; }
  const data = snap.val();
  if (data){
    userProfile = {
      name: sanitizeName(data.name || user.displayName || 'PLAYER'),
      kills: data.kills || 0,
      wins: data.wins || 0,
      matches: data.matches || 0,
    };
  } else {
    const fallbackName = sanitizeName(user.displayName || (user.isAnonymous
      ? ('GUEST' + user.uid.substring(0,3).toUpperCase())
      : (user.email || 'PLAYER').split('@')[0]));
    userProfile = { name: fallbackName, kills:0, wins:0, matches:0 };
    try {
      await ref.set({
        name: fallbackName, email: user.email || null,
        kills: 0, wins: 0, matches: 0,
        createdAt: firebase.database.ServerValue.TIMESTAMP,
      });
    } catch(e){}
  }
  myName = userProfile.name;
  if (user.email){
    try { localStorage.setItem('br_last_email', user.email); } catch(e){}
  }
  cacheProfile();
  updateProfileUI();
}

setAuthMode('login');
initAuthFlow();

})();
